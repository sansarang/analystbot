# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v5 §7-2 — 유형마다 명단에서 확인할 기계 조건**
# ══════════════════════════════════════════════════════════════════
#
# > 카드마다 명단에서 확인할 항목을 **1개 이상 기계 조건**으로 적는다
# > (`"player:… in XI"`, `"changes_from_last >= 5"`, `"formation == 5-back"`).
#
# ⚠️ 조건 **꼴**을 코드에 박지 않는다 — 여기서 유형이 가리킨다(#1 사본 금지).
# 🔴 `{…}` 는 **빈 자리**다. 그 값은 그 경기의 자료가 채운다:
#      `{star}`   그 팀 최다 득점자(`analyze._star_of` 가 자료에서 뽑는다)
#      `{n}`      문턱 수(아래 `defaults`)
#      `{shape}`  포메이션 글자
#
# ⚠️ **없는 유형을 가리키지 않는다** — 계약이 §4 유형표와 대조한다(죽은 줄 금지).
# 🔴 조건 꼴은 **파싱되는 것만** 적는다 — 장식 글자를 두면 계약이 빨개진다.

defaults:
  # 🔴 *"changes_from_last >= 5"* 는 지시문이 쓴 보기 그대로의 수다.
  #    ⚠️ 측정한 수가 아니다 — 그 사실을 적어 둔다(§5-6 은 **방향을 정하는**
  #       상수를 금지하고, 이것은 *무엇을 확인하라*는 말이라 방향이 아니다).
  changes_n: 5

checks:
  # ── 로테이션: 선발이 몇 명 바뀌었나
  #    ⚠️ 지시문은 `lineup_rotation` 이라 적었다 — **§4 에 그 이름이 없다.**
  #       우리 유형은 `squad_rotation` 이다(아래 `v5_names` 가 그 대응을 적는다).
  squad_rotation: "changes_from_last >= {n}"
  # ── 결장: 그 선수가 명단에 **있나**(있으면 결장 변수가 깨진다)
  absence: "player:{star} in XI"
  def_absence: "player:{star} in XI"
  individual: "player:{star} in XI"
  # ── 전술 의도: 포메이션으로 확인한다
  lineup_intent: "formation == {shape}"

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **지시문 이름 → 우리 §4 이름** (실측 2026-10-04)
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ v5 지시문이 §4 에 **없는 이름**을 쓴다. 그 대응을 **여기 적고** 코드는
#    우리 이름만 쓴다 — 적지 않으면 그 줄이 **조용히 죽는다**(#3).
v5_names:
  lineup_rotation: squad_rotation   # §6-2 ⑥ · §7-2 가 쓴 이름
  coach_crisis: coach_conflict      # §6-2 ⑥ (v4 §4 의 "스타와 감독의 갈등")

# 🔴 **대응되는 우리 유형이 없는** 지시문 이름 — 이름으로 남긴다.
#    ⚠️ 적어 두지 않으면 그 규칙이 *"있는데 안 걸린다"* 로 영영 숨는다.
unmapped:
  tactical_matchup: |
    §7-2 가 보기로 든 `formation == 5-back` 이 가리키는 유형. 🔴 §4 에 전술
    매치업 유형이 **없다**(`output_spec` 결정 A 가 *"넣는다"* 라고 적었지만 §4
    표에 안 들어왔다). ⚠️ 지금은 `lineup_intent` 가 포메이션을 본다.
  regression: |
    §6-2 ③ *"회귀 반전형 — `regression` 변수가 있을 때"* 가 쓴 이름. 🔴 §4 에
    **없다.** ⚠️ 그래서 §6-2 ③ 은 **한 번도 발동하지 않는다** — 그 사실을
    여기 적는다(지어내 만들면 방향 규칙·검색 템플릿까지 지어내야 한다).

source: v5 지시문 §7-2 (사용자 문서 2026-10-04 · PDF 12쪽)
