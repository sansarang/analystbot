# 리그 규정 — **자료가 주지 않는 사실** (사용자 지시 2026-10-02)
#
# 🔴 두 가지가 들어 있다: **플레이오프 경계**(§4 `stakes`)와 **무승부 가능 여부**
#    (§5-a C 시나리오). 둘 다 리그 **규정**이고 우리가 긁는 자료에는 없다.
#
# ══════════════════════════════════════════════════════════════════
# 🔴 왜 이 파일이 있나 — **자료가 주지 않는 것이 하나 있다**
# ══════════════════════════════════════════════════════════════════
#
# §4 `stakes`(셈법)는 *"그 팀이 경계에 걸려 있나"* 를 묻는다. 그러려면 **몇 위까지
# 진출인가**를 알아야 한다.
#
#   축구 fotmob   `legend[].indices` 로 **자료가 알려 준다**(MLS → 9위)
#                 ⚠️ USL 은 `legend: null` 이라 **모른다**
#   NHL api-web   `divisionSequence`·`wildcardSequence` 는 주는데
#                 **"3"·"2" 라는 수는 안 준다** — 그것은 리그 규정이다
#
# 🔴 **라이브 실측 2026-10-02 가 이것을 드러냈다**: NHL 경기에서 `stakes` 가
#    *"경계를 모른다"* 로 미결정이 되고, 변수가 2개뿐이라 §7 R5 에 걸렸다.
#
# ⚠️ **사본 금지와 충돌하지 않는다.** 사본 금지는 *시스템에 이미 있는 사실*을 손으로
#    옮겨 적지 말라는 것이다. 리그 규정은 **우리 자료 어디에도 없다** — 그래서 선언이
#    맞고, 선언에는 **출처와 확인 날짜**가 붙는다.
# 🔴 자료가 알려 주는 리그는 **여기 적지 않는다** — 적으면 그 순간 사본이 된다.
#    (축구 fotmob 의 `legend` 가 있는 리그가 그 경우다)

leagues:
  # 🔴 **중립 구장 대회** — `home_field` 가 거짓 변수가 되는 자리다.
  #
  #  ⚠️ 라이브 실측 2026-10-02(아시안게임 한국 vs 중국, 시즈오카): 양 팀 다 홈이
  #     아니다. 그런데 §4 `home_field` 는 *"홈 팀 쪽"* 으로 방향을 민다 — 순위표가
  #     있었다면 **거짓 변수를 세웠을 것**이다. 지금은 순위표가 없어 우연히 안 섰다.
  #  🔴 우연에 기대지 않는다. 대회가 중립이면 선언하고, `home_field` 는 발동하지 않는다.
  Asian Games:
    neutral_venue: true
    neutral_source: https://www.aichi-nagoya2026.org/
    neutral_note: 개최지 단일 — 양 팀 모두 홈이 아니다(여자축구 결정전 시즈오카)
    draw_possible: false
    draw_source: https://www.fifa.com/
    draw_note: 녹아웃이라 연장·승부차기로 승자를 가린다 — 최종 결과에 무승부가 없다
  # ══════════════════════════════════════════════════════════════
  # 🔴🔴 **KBO** — v5 §6-4 가 이름 댔는데 **선언에 없었다**(2026-10-04)
  # ══════════════════════════════════════════════════════════════
  #
  # v5 §6-4: *"야구 무승부는 **KBO·NPB 만**(연장 상한 리그), MLB 는 무승부
  # 시나리오 없음."*
  #
  # ⚠️ 실측 2026-10-04: `rules.draw_possible("KBO")` 가 **`None`**(*"선언되지
  #    않았다"*)이었다. 🔴 `None` 이면 호출부가 **무승부를 만들지 않는다** —
  #    그것이 안전한 처분이지만, KBO 는 실제로 무승부가 **있다.**
  KBO:
    draw_possible: true
    draw_source: https://www.koreabaseball.com/Reference/Rules/Regulation.aspx
    draw_note: |
      연장 12회(포스트시즌 15회) 뒤 무승부 — 순위표에 무승부 열이 있다.
      🔴 v5 §6-4 가 *"KBO·NPB 만"* 이라고 이름 댔다.
  NHL:
    # 🔴 디비전 상위 3팀 + 콘퍼런스별 와일드카드 2팀 = 콘퍼런스당 8팀
    rule: division_plus_wildcard
    division_top: 3
    wildcard_slots: 2
    # 🔴 응답의 어느 칸으로 판정하나 — **주소를 코드에 박지 않게** 여기 적는다
    division_field: divisionSequence
    wildcard_field: wildcardSequence
    source: https://www.nhl.com/info/standings-and-playoff-format
    verified: 2026-10-02
    # ⚠️ **시즌 초에는 뜻이 약하다** — 전 팀이 0~2경기다. 그래도 미결정보다 낫다:
    #    순위가 경계 안인지 밖인지는 어떤 시점에도 참·거짓이 정해진다.
    note: 개막 직후에는 표본이 작아 순위 자체가 흔들린다 — 판정은 되지만 무게는 soft 다
    # 🔴 **무승부가 최종 결과로 날 수 있나** (§5-a C 시나리오가 이것을 묻는다)
    #
    #  ⚠️ 라이브 실측 2026-10-02 가 이것을 드러냈다: 격자에서 하키 템플릿을 뽑으니
    #     무승부 `3-3`·`2-2` 가 나왔다 — **NHL 은 연장·슛아웃으로 반드시 승자를
    #     가린다.** 그 시나리오를 내면 카드가 **일어날 수 없는 결과**를 적는다.
    #  🔴 60분 마켓(정규시간)은 다른 이야기다 — 우리 `games` 표는 **최종 점수**를
    #     들고 있으므로 최종 결과를 기준으로 적는다.
    draw_possible: false
    draw_source: https://www.nhl.com/info/rules
    draw_note: 2005-06 시즌부터 슛아웃 — 최종 결과에 무승부가 없다

# ⚠️ **없는 리그는 없다고 적는다**(조용한 0 금지). 아래는 *확인했고 못 정한* 목록이다.
  # ⚠️ 다른 리그는 **경계는 몰라도 무승부 여부는 안다** — 둘을 따로 적는다.
  USL Championship:
    draw_possible: true
    draw_source: https://www.uslchampionship.com/
    draw_note: 정규시즌 무승부 있음(순위표에 D 열이 있다)
  MLS:
    draw_possible: true
    draw_source: https://www.mlssoccer.com/
    draw_note: 정규시즌 무승부 있음
  NPB:
    # 🔴 **전 판에 "한 수로 안 떨어진다"고 적었는데 틀렸다**(사용자 지시 2026-10-02:
    #    *"변수 0건은 말이 안된다"*). 클라이맥스 시리즈는 **리그 상위 3팀**이 나간다 —
    #    1위가 파이널 스테이지에 직행하고 2·3위가 퍼스트 스테이지를 치른다.
    #    경계는 **3위**이고 그것은 한 수다. 그래서 `stakes` 가 설 수 있다.
    rule: climax_series_top3
    division_top: 3
    wildcard_slots: 0
    division_field: rank
    wildcard_field: null
    source: https://npb.jp/climax/2026/
    verified: 2026-10-02
    draw_possible: true
    draw_source: https://npb.jp/
    draw_note: 연장 12회 뒤 무승부(순위표에 무승부 열이 있다)
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **장소별 득점을 어디서 구하나** (실측 2026-10-02)
    # ══════════════════════════════════════════════════════════════
    #
    #  야구 순위표(`std_p.html`)에는 **ホーム/ロード 승패만** 있고 득점이 없다.
    #  팀 성적표(`tmb_p.html`·`tmp_p.html`)에는 得点·失点이 있으나 **시즌 합계**라
    #  장소로 안 갈린다. 🔴 포아송은 *"장소를 섞지 말라"*가 조건이다.
    #
    #  ✅ **월간 일정 페이지에 모든 경기의 스코어가 있다**(실측: `score1`/`score2`).
    #     그것을 팀별 홈/원정으로 모으면 **지어내지 않고** 장소별 득점이 나온다.
    #
    #  ⚠️ 몇 달을 읽나 — 열기 예산과 바꾸는 값이다. 시즌 전체(3~10월, 8장)는
    #     한 경기 분석에 너무 많다. 🔴 숫자는 **실제 테스트로 정한다**(사용자 지시).
    #     3으로 시작한다 — 한 달이 리그 전체 ~100경기이므로 3달이면 ~300경기다.
    runs_window_months: 3
  MLB:
    draw_possible: false
    draw_source: https://www.mlb.com/glossary/rules
    draw_note: 연장 무제한 — 최종 결과에 무승부가 없다

# 🔴 **경계를 모르는 리그.** 무승부 여부는 위 `leagues` 에 적혀 있을 수 있다 —
#    두 사실은 따로다(하나를 모른다고 다른 하나를 모르는 것이 아니다).
unknown_cut:
  USL Championship: "fotmob 의 legend 가 null 이고 리그 공시도 못 찾았다 — 미결정으로 둔다"
