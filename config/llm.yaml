# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **Solar(Upstage) 사양과 예산 한도** — v5 §2
# ══════════════════════════════════════════════════════════════════
#
# 원본 지시문: `docs/fable/inbox/2026-10-04_v5_solar.md`(옆의 PDF 가 정본).
# 🔴 §0 규칙 변경: *"「유료 API·MCP·커넥터 0건」은 **Upstage Solar API 하나만**
#    예외로 바꾼다. 다른 유료 서비스는 여전히 0건이다."*
# 🔴 §2: *"값은 `config/llm.yaml` 에 두고 **사용자만** 바꾼다(§13-7)."*
#
# ⚠️ 사용자 지시 2026-10-04: 지시문 제목·§0 의 `DeepSeek` 는 **Solar** 로 읽는다.

model:
  # 🔴 **실측으로 확인했다**(2026-10-04 · `GET /v1/models`):
  #      solar-pro4         created=20260806   ← 쓴다
  #      solar-pro4-260806  created=20260806   (호출하면 이 이름으로 응답한다)
  #      solar-pro3         created=20260126   ← §2 의 대체
  #    ⚠️ 목록에 `solar-decide`·`solar-jev`·`syn-pro` 도 있지만 §2 가 지목한
  #       모델이 아니다 — 쓰지 않는다.
  name: solar-pro4
  fallback: solar-pro3        # §2 — 불가하면 내려가되 §10 재현율을 따로 잰다
  base_url: https://api.upstage.ai/v1
  # 🔴 §2 *"추론 강도 옵션이 있으면 low 로 시작한다."*
  #
  #  ⚠️ **실측 2026-10-04 — 그 손잡이가 비용을 단조롭게 줄이지 않는다.**
  #     같은 질문(`2+2 는? 숫자만.`)에 추론 토큰이:
  #         low 219 · medium 178 · high 159
  #     🔴 `low` 가 `high` 보다 **더 썼다.** 표본이 1회씩이라 결론은 아니지만,
  #        *"low 가 싸다"* 를 전제로 예산을 짜면 안 된다는 것은 분명하다.
  #     ⚠️ 그래서 아래 출력 상한은 **실측으로** 잡았다(`reasoning_tokens` 기준).
  reasoning_effort: low
  reasoning_effort_measured_2026_10_04: {low: 219, medium: 178, high: 159}
  timeout_sec: 120           # §2
  retries: 2                 # §2 — 지수 대기. 그래도 실패면 `llm_unavailable`

# ══════════════════════════════════════════════════════════════════
# 🔴 단가 — ⚠️ **공식 콘솔 페이지를 기계로 못 읽었다**(2026-10-04)
# ══════════════════════════════════════════════════════════════════
#
# §2: *"**공식 콘솔 pricing 페이지를 읽어** `config/llm.yaml` 에 날짜와 함께
#      적고, **매체·중개 사이트 수치는 쓰지 않는다**."*
#
# 🔴 시도한 주소 셋 — 전부 단가를 안 줬다(JS 또는 로그인 뒤인 것으로 보인다):
#      developers.upstage.ai/docs/getting-started/pricing  → 308 → console…
#      console.upstage.ai/docs/getting-started/pricing     → 값 없음
#      console.upstage.ai/docs/models/solar-pro4           → 값 없음
#
# ⚠️ 그래서 아래 수치는 **사용자 지시문 §2 가 적은 값**이다 — 매체가 아니라
#    사용자 문서이므로 §2 의 금지에 걸리지 않지만, **콘솔로 확인한 값은 아니다.**
# 🔴 사용자가 콘솔에서 확인해 주면 `verified_by_user` 를 `true` 로 바꾼다.
#    그때까지 비용 계산은 **이 수치로 돌되 카드에 미확인임을 적는다.**
price_usd_per_1m:
  input: 0.30
  cached_input: 0.06
  output: 1.20              # 🔴 추론 토큰이 여기 포함된다(아래 실측)
  source: v5 지시문 §2 (사용자 문서 2026-10-04) — 2026-08 출시 공지 기준
  as_of: 2026-10-04
  verified_by_user: false
  note: |
    ⚠️ 9월 10일까지의 90% 프로모는 끝났다(§2).
    🔴 **추론 토큰은 출력으로 과금된다** — 실측 2026-10-04:
       한국어 결장 추출 1회에 completion 1014 중 **reasoning 1001**.
       즉 짧은 답에도 출력 토큰이 1000 단위로 나간다. 그것이 §2 가 출력
       상한을 올린 까닭이다.

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **예산 가드** — §2. *"코드가 센다, 에이전트는 모른다."*
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ 초과 시 동작은 §2 표 그대로다 — **그 문장을 사유 코드로** 적는다(§8-6).
budget:
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **실측 2026-10-04 — 도구 루프가 입력을 어떻게 쓰나**(§5-6 근거)
  # ══════════════════════════════════════════════════════════════════
  basis: |
    🔴 **실측 2026-10-04** — 게이트 2(§3 도구 루프)를 처음 켜고 한 경기를
    돌렸다(원장 20줄 · 밀워키 브루어스 vs 샌디에이고 파드리스):

        입력 합  179,344 토큰
        캐시 합  120,768 토큰   🔴 **67%가 캐시다**
        비용 합  $0.0448         ⚠️ 하루 상한 $3 의 **1.5%**

    🔴 도구 루프는 턴마다 대화를 **다시 보낸다** — 그 앞부분은 §2 가 노린
    **캐시**다(`cached_input` 0.06 vs `input` 0.30 · 다섯 배 싸다).
    ⚠️ 그래서 `input_tokens` 는 **새로 보낸 입력**만 센다(`prompt_tokens -
    cached_tokens`) — 그러면 위 실측이 **58,576** 이고 150,000 안이다.
    🔴 **하루 $3 · 월 $40 은 건드리지 않았다** — 그것은 사용자가 정한 돈 상한
    이고, 막은 것은 *세는 방법*이었다.

  per_match:
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **사용자 결정 2026-10-04** — 올렸다(돈 상한은 그대로)
    # ══════════════════════════════════════════════════════════════
    #
    # > 경기당 **입력 300k·출력 40k**로 올린다. 하루 $3·월 $40은 그대로.
    # > MLB 실측이 경기당 $0.09이니 **하루 30경기도 $3 안**이다. 출력 20k를
    # > 넘은 건 **Solar의 추론 토큰** 때문이고, 그건 결함이 아니라 **모델
    # > 특성**이다. 대신 두 가지를 같이 건다. **추론 강도가 low인지 확인**하고,
    # > 한 팀 에이전트가 예산을 다 써서 다른 팀이 0개가 되는 일이 없도록
    # > **팀별로 예산을 반씩 나눈다**(밀워키 0개·파드리스 6개 사례).
    #
    # ✅ 추론 강도는 **이미 `low`** 다(이 파일 `solar.reasoning_effort`) —
    #    실측 `{low: 219, medium: 178, high: 159}` · 2026-10-04. 바꿀 것이 없다.
    # 🔴 몫 나누기는 `app/solar.MatchBudget.share` 다 — 쪽마다 **반**을 준다.
    input_tokens: 300_000     # 초과 → 에이전트 중단, 모은 변수로 §5 · `budget_cut`
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **40k → 64k** — 사용자 지시 2026-10-06 ③
    # ══════════════════════════════════════════════════════════════
    #
    # > 하위 출력 상한: 하위당 **8,000**, 경기당 **64,000** 으로 올린다
    # > (비용 상한 $0.5 안인지 실측).
    #
    # 근거(실측 2026-10-06 북아일랜드–조지아 · 원장 95줄):
    #   · 한 콜 **최대 출력 6,356 토큰** → 하위 상한 4,000 을 넘겨 `budget_cut`
    #   · 그 실행 출력 합 **105,808** · 비용 **$0.2266**(§8 상한 $0.5 안)
    #   · `reasoning_effort` 는 **95/95 줄 전부 `low`** 였다 — 설정이 실제
    #     요청에 실린다(사용자 ③ 의 확인 항목)
    # 🔴 8 하위 × 8,000 = 64,000 — 수가 서로 맞는다.
    # 🔴🔴 **64k → 40k 로 되돌렸다** — 지시서 2026-10-06 §1.
    #    > 하위 출력 상한 8,000 → 4,000(추출 한 번이면 충분), 경기 출력
    #    > 64,000 → 40,000(원래 값으로 복귀).
    #    ⚠️ §8 금지 목록 첫 줄이 *"상한을 올려서 budget_cut 해결"* 이다 —
    #       내가 올린 것이 그 금지에 걸렸다. 🔴 하위가 **에이전트 루프**가 아니라
    #       **추출 1회**가 되면 4,000 으로 충분하다(루프가 턴마다 추론 토큰을
    #       쓰던 것이 원인이었다).
    # 🔴🔴 **40,000 → 48,000** — 하위 F(새 사실 72시간)를 더했다(§3-1).
    #    하위 4,000 × **10** = 40,000 · 2차 예비 8,000 → 합 48,000.
    #    ⚠️ 돈 상한은 그대로다(아래 `per_day_usd` $5 · `per_month_usd` $40).
    output_tokens: 48_000     # 🔴 추론 포함(Solar 특성 · 결함이 아니다)
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **팀별 25k · 합계 40k** — 지시서(오픈월드) §1-4 (2026-10-05)
    # ══════════════════════════════════════════════════════════════
    #
    # > 경기당 출력 **40k 유지**, **팀별 상한 25k**, 합계 40k 초과 금지. 한 팀이
    # > 예산을 다 써서 다른 팀이 0개가 되는 일(밀워키 0·파드리스 6, 포르투갈
    # > budget_cut)을 막는다.
    #
    # ⚠️ `25k × 2 = 50k > 40k` 다 — **일부러 그렇다.** 한 팀이 25k 를 다 쓰면
    #    다른 팀에 **15k** 가 남고, 둘이 균등히 쓰면 각 20k 다.
    # 🔴 **합계 40k 가 벽**이다 — `solar.MatchPot` 이 그 벽을 든다.
    #    ⚠️ 종전 `share=0.5`(= 20k 고정)는 한 쪽이 20k 를 못 넘겨, 상대가 쉬어도
    #       그 몫을 못 썼다. 25k 는 그 여유다.
    # 🔴 **경기당을 1.6배 올렸으니 쪽도 같은 비율**이다(25k × 1.6 = 40k) —
    #    한 쪽의 하위 4개가 8,000 씩이면 32,000 이고, 그보다 위여야 쪽 벽이
    #    하위 상한을 **먼저 막지 않는다.** ⚠️ 합계(64k)가 그대로 벽이다.
    # 🔴 경기 합계를 되돌렸으니 쪽도 같은 비율로(25,000) — 종전 값이다
    per_side_output_tokens: 25_000
    per_side_input_tokens: 200_000
    tool_calls:
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **24 → 30** — 하위 과제 F(새 사실 72시간)를 더했다
      # ══════════════════════════════════════════════════════════════
      #
      #  사용자 지시 2026-10-10(재작성) §3-1 이 하위 **F** 를 신설했다
      #  (유형군 5 × 홈/원정 = **10개**). 하위당 3회 × 10 = **30회**.
      #
      #  🔴 **왜 하위 몫을 줄이지 않았나**: 그러면 A~D 가 각각 적게 받아 기존
      #     품질이 내려간다. ⚠️ 그래서 **경기 합계를 F 몫만큼 올렸다**(+25%).
      #  🔴 돈 상한(`per_day_usd` $5 · `per_month_usd` $40)은 **건드리지
      #     않았다** — 그것은 사용자가 정한 값이다. 올린 것은 **도구 호출 수**다.
      #  ⚠️ 실측 비용은 경기당 $0.002~$0.005 였다(2026-10-10 여섯 경기) —
      #     25% 가 늘어도 하루 상한의 1% 안이다.
      search: 30
      # 🔴 **16 → 24 → 30** — 하위당 상위 3건 fetch × 하위 10 = 30.
      #    ⚠️ 받는 문서가 늘면 날짜·인용 대조가 늘어난다.
      fetch: 30
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **하위 과제 예산** — 딥서치 재구축 §2 (지시서 2026-10-05)
  # ══════════════════════════════════════════════════════════════════
  #
  #  🔴🔴 **하위는 이제 10개다**(유형군 5 × 홈/원정) — 사용자 지시 2026-10-10
  #     (재작성) §3-1 이 **F(새 사실 72시간)** 를 더했다. ⚠️ 아래 인용은 그 전
  #     지시서의 표다(8개) — 수는 `config/subtask_groups.yaml` 이 든다.
  #
  #  > 경기 하나 = 하위 과제 8개(유형군 4 × 홈/원정)
  #  > | 항목 | 하위 1개 | 8개 합 | 2차 예비(리드) |
  #  > | search | 3회 | 24회 | 미사용분 |
  #  > | fetch | 2회 | 16회 | 미사용분 |
  #  > | 출력 토큰 | 4,000 | 32,000 | 8,000 |
  #  > | 턴 | 8 | — | 하위당 6 |
  #
  #  🔴 **합계는 기존 상한 그대로다**(위 `tool_calls`·`output_tokens`) —
  #     분할이 상한을 늘리지 않는다.
  #  ⚠️ 예산 카운터는 **하위마다 독립 객체**다(M59) — 공유 카운터 금지.
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **LLM 서치 수확** — 사용자 지시 2026-10-17 *"둘다 해라"*
  # ══════════════════════════════════════════════════════════════════
  #
  #  🔴 **왜 이 칸이 생겼나 — 실측 2026-10-17(울산 HD vs 부천 · 4차)**
  #     한국어 질의가 드디어 나갔는데(`울산 HD 최근 5경기 홈` 13건 ·
  #     `부천 FC 1995 Patrick 부상` 9건) 문서가 **0건**이었다. 깔때기:
  #
  #         질의 3 · 결과 49 · 날짜 통과 **42** · 열어 본 것 **4건** · 문서 0
  #
  #     🔴 날짜를 통과한 42건 중 **4건만** 열었다. 까닭은 받기 상한을
  #        *"질의 1개당 받기 1건"* 으로 맞춰 둔 것이고(옛 딥서치의 비율),
  #        LLM 서치는 질의가 3~6개라 받기도 3~6건이 된다.
  #     ⚠️ 옛 딥서치는 하위 **여덟**이라 질의 24 · 받기 24 였다.
  #  🔴 그래서 **그 총량을 그대로** 옮긴다 — 지어낸 수가 아니다:
  #       질의 24 ÷ 쪽 둘 = `queries: 12`
  #       받기 24 ÷ 쪽 둘 = `fetch_per_side: 12`
  #  ⚠️ 바꾸고 싶으면 **이 파일만** 고친다(코드에 수를 박지 않는다 · §13-7).
  harvest:
    queries: 12
    fetch_per_side: 12
  per_subtask:
    search: 3
    # 🔴 **문서 받기는 3건**(지시서 §1-3) — `fetch_top` 이 그 수다.
    #    ⚠️ 이 칸은 **도구 호출 상한**이고 루프가 없으니 같은 수로 둔다.
    fetch: 3
    # 🔴🔴 **4,000 → 8,000** — 사용자 지시 2026-10-06 ③.
    #    ⚠️ 실측 2026-10-06: 한 콜 출력이 **6,356** 이었다(추론 포함) — 4,000
    #       으로는 거의 모든 하위가 `budget_cut` 이고, 조지아 쪽은 그래서
    #       판정층 변수 **0개**였다(그 때문에 §7 R5 가 방향 1종으로 끊겼다).
    # 🔴🔴 **8,000 → 4,000** — 지시서 2026-10-06 §1(추출 한 번이면 충분).
    output_tokens: 4_000
    # ⚠️ `turns` 는 **오픈월드 ⑥단**(경기 찾기)의 에이전트 루프만 쓴다 —
    #    하위 과제 경로는 이제 루프를 돌지 않는다(M128).
    turns: 8
    #: 🔴 하위당 fetch 상한 — 지시서 §1-3: 상위 **3건**(기존 2)
    fetch_top: 3
    #: 🔴 본문 문단 — 지시서 §1-4: BM25 상위 20 → 재정렬 상위 6 → 최대 18문단
    paras_max: 18
    #: 🔴 추출 호출 — 지시서 §1-5
    extract_max_tokens: 4_000
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **추출은 추론을 쓰지 않는다** — 실측 2026-10-06
    # ══════════════════════════════════════════════════════════════
    #
    # 같은 입력(문단 4,510자)으로 돌려 본 수:
    #
    #   reasoning_effort  finish   out    reasoning  content
    #   low               length   4000   3999       🔴 **0**
    #   minimal           stop     1068   0          3519
    #   none              stop     1105   0          3175
    #   (칸 없음)          stop     2258   0          7125
    #
    # 🔴 `low` 는 상한 4,000 을 **전부 추론에 쓰고** JSON 을 한 글자도 안 냈다 —
    #    그래서 하위 8개 중 7개가 `추출 JSON 을 못 읽었다 — 빈 글이다` 였다.
    # ⚠️ 지시서 §1-5 는 `reasoning_effort=low` 라고 적었지만, 그 값으로는 추출이
    #    **구조적으로 0건**이다. §8 금지 목록이 *"상한을 올려서 budget_cut
    #    해결"* 을 막았으므로 고칠 곳은 **추론을 끄는 것**이다.
    # 🔴 `minimal` 을 쓴다 — `none` 보다 출력이 길고(3519 vs 3175) 한국어가
    #    덜 섞였다(`none` 은 머리표 자리에 한국어를 넣었다).
    extract_reasoning_effort: minimal
    extract_timeout_sec: 120
    extract_retries: 1
    #: 🔴 2차 보충(리드)이 쓰는 몫 — 하위 턴은 6 으로 줄인다(지시서 표)
    second_turns: 6
    second_output_tokens: 8_000
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **동시성 가드** — 딥서치 재구축 §2 (M66)
  # ══════════════════════════════════════════════════════════════════
  #
  #  > SearXNG 호출 세마포어 **3**, fetch 세마포어 **4**, GDELT 는 기존 전역
  #  > 6초 직렬화 유지, Solar API 동시 호출 세마포어 **4**(429 받으면 **2** 로
  #  > 줄이고 지수 대기). 전부 `config/llm.yaml` 에 상수로.
  concurrency:
    searx: 3
    fetch: 4
    solar: 4
    solar_after_429: 2
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **하루 상한 $3 → $5** — 사용자 결정 2026-10-05
  # ══════════════════════════════════════════════════════════════════
  #
  #  근거(실측):
  #    · 한 경기 **한 번**의 비용 = **$0.1459**(프랑스–벨기에 · Solar 20회 +
  #      DeepSeek 6회). 지시서 §8 의 경기당 상한은 $0.5 다.
  #    · 오늘 $3.0074 를 쓴 것은 **한 경기를 여덟 번 재실행**한 값이다
  #      (pn10~pn17·rb1·rb2) — 포르투갈–노르웨이 $1.52 + 열쇠 없던 행 $1.07.
  #    · 🔴 **월 $40 이 실제 벽이다** — 지금 $4.36 만 썼고, 남은 26일에 하루
  #      $3 씩이면 $78 로 월 상한을 넘는다. 하루를 $5 로 올려도 월이 그대로
  #      벽으로 남는다.
  #  ⚠️ **재구축 후 경기당 비용은 아직 안 쟀다** — 하위 8개가 Solar 호출 수를
  #     늘린다(종전 ≈20회 → ≈48~64회). 출력 합계는 32,000 으로 종전 40,000
  #     보다 낮지만 프롬프트 꼬리가 하위마다 달라 **입력 캐시 히트가 줄 수
  #     있다.** 🔴 §8 1차에서 재고 그 수로 상한을 다시 정한다.
  per_day_usd: 5.0            # 초과 → 그날 나머지 경기 자료 부족 + 사용자 알림
  per_month_usd: 40.0         # 🔴 초과 → **봇 정지.** 사용자 승인 전 재개 금지
  # 🔴 §2: *"콘솔에 월 지출 한도가 있으면 §2 월 상한과 같은 값으로 건다."*
  #    ⚠️ 콘솔 설정은 **사용자 몫**이다 — 봇은 결제 코드를 갖지 않는다.
  console_monthly_cap_usd: 40.0
  console_cap_set_by_user: false   # 사용자가 콘솔에 걸었다고 알려 주면 true
  # 🔴 매 호출의 usage × 단가를 한 줄씩 적는다(§2)
  ledger_path: ledger/cost_{YYYYMM}.jsonl

# ══════════════════════════════════════════════════════════════════
# 🔴 실측으로 확인한 능력 (2026-10-04 · 실제 호출)
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ 상태값(200 OK)은 의도한 것이 동작한다는 증거가 아니다(CLAUDE.md #4) —
#    그래서 **무엇이 돌아왔는지**를 적는다.
verified_2026_10_04:
  models_endpoint: "GET /v1/models → solar-pro4 포함 15개"
  structured_output: |
    response_format=json_schema(strict) 가 듣는다.
    한국어 기사 → {"absent": ["오지환"]} (정확)
  tool_calls: |
    🔴 **병렬 도구 호출이 듣는다** — 한 번에 `search` 두 개를 냈고
    하나는 **스스로 한국어로** 던졌다:
      {"query": "North Macedonia vs Scotland lineup", "lang": "en"}
      {"query": "북마케도니아 vs 스코틀랜드 라인업", "lang": "ko"}
    ⚠️ §4-1 사다리(영어 → 현지어)를 모델이 이미 그 꼴로 한다.
  usage_fields: |
    prompt_tokens · completion_tokens ·
    prompt_tokens_details.cached_tokens ·
    completion_tokens_details.reasoning_tokens
    → §2 의 "입력·캐시 적중·출력" 세 칸이 전부 온다(원장에 적을 수 있다)
  latency_sec: "2.2 ~ 2.9 (짧은 호출)"

# 🔴 §2 — 보내지 않는 것. ⚠️ 절대규칙 6(배당 접근 0건)과 같은 결이다.
never_send:
  - 사용자 식별 정보
  - 보드 숫자(배당)

# 🔴 §2 — `qwen3:8b` 는 유지하되 역할이 바뀐다
qwen_role: §5-1 인용 검증 보조(문단 안에 인용이 의미상 있는지 2차 확인)뿐. 판정 필드에 닿지 않는다

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v5-A §2 — DeepSeek**(가설·시나리오 생성 + 반증). 🔴 **꺼짐이다.**
# ══════════════════════════════════════════════════════════════════
#
# 부록 v5-A §2 원문:
#
# > 모델 — 추론 모드가 있는 모델을 쓴다. 2026-09 개편 이후 모델 ID와 가격이
# > 자주 바뀌었으니 Claude Code가 **공식 api-docs·pricing 페이지를 직접 읽어**
# > `config/llm.yaml` 의 `deepseek:` 칸에 모델 ID·입력/캐시/출력 단가·확인
# > 날짜를 적는다. **매체 수치는 쓰지 않는다.** 시작은 저가 모델(Flash 계열,
# > 추론 켬).
#
# 🔴 **읽은 곳**: https://api-docs.deepseek.com/quick_start/pricing
#    (2026-10-04 · 봇이 직접 받아 글자를 뽑았다 · UA 는 봇이라고 밝혔다)
# ⚠️ 그 표가 그대로 적은 것:
#
#      MODEL            deepseek-flash        deepseek-v4-pro
#      MODEL VERSION    DeepSeek-V4.1-Flash   DeepSeek-V4-Pro-0813
#      BASE URL         https://api.deepseek.com
#      THINKING MODE    둘 다 지원(기본이 thinking)
#      CONTEXT          1M · MAX OUTPUT 384K
#      1M 입력(캐시 적중)  OFF $0.003 / PEAK $0.006
#      1M 입력(캐시 미스)  OFF $0.15  / PEAK $0.3
#      1M 출력            OFF $0.6   / PEAK $1.2
#
# 🔴 **피크가 두 배다**(문서: *"Off-peak rates are half of the peak rates.
#    Peak hours are 01:00 - 04:00 and 06:00 - 10:00 UTC, Mon–Fri"*).
#    ⚠️ 그래서 단가를 **하나로 적지 않는다** — 두 칸을 적고 코드가 시각으로
#       고른다. 하나만 적으면 그 수가 절반 틀린다.
deepseek:
  # 🔴 **꺼짐.** 켜는 것은 §5 측정 뒤 **사용자 승인**이다(작업지시 §4 금지 사항:
  #    *"`enabled` 기본값을 true로 커밋 금지"*).
  # ══════════════════════════════════════════════════════════════
  # 🔴🔴 **켠다** — 사용자 지시 2026-10-05 (*"딥시크 켜라"*)
  # ══════════════════════════════════════════════════════════════
  #
  # > **DeepSeek(v5-A): 측정 비교 없이 켠다.** 단계 3(가설·시나리오)과 단계
  # > 4(반증)를 enabled 로. M41~M46 계약과 **코드 필수형 보강·생존율 상승
  # > 금지**는 그대로 지킨다. 장애 시 **Solar 경로로 끝까지 도는 것(M45)** 확인.
  #
  # ⚠️ v5-A §6 은 *"켜기 전·후를 나란히 재서 판단한다"* 였고 작업지시 §6 은
  #    *"정답지 재현 계약이 빨간 채로 켜지 않는다"* 였다. 🔴 **그 둘이 범위에서
  #    빠졌다**(사용자 지시 2026-10-05: 정답지·metrics·게이트 4·5 제외).
  #    → 측정 비교 없이 켠다. **직접 지시가 이긴다.**
  # 🔴 그래도 **지키는 것**: M41(형식·범위·금지 필드) · M42(도구 안 준다) ·
  #    M43(점수 범위) · M44(생존율 **상승 금지**) · M45(장애 시 Solar 로 끝까지)
  #    · M46(필수형이 걸리면 overrule).
  enabled: stage3+4
  model:
    name: deepseek-flash
    version: DeepSeek-V4.1-Flash
    base_url: https://api.deepseek.com
    # 🔴 추론 켬(문서: 기본이 thinking 이다) — 이 단계는 **추론**이다(v5-A §0)
    thinking: true
    timeout_sec: 120
    retries: 2
  price_usd_per_1m:
    off_peak: {input: 0.15, cached_input: 0.003, output: 0.6}
    peak:     {input: 0.30, cached_input: 0.006, output: 1.2}
    # 🔴 피크 시각(UTC · 월~금). ⚠️ 중국 공휴일은 **모른다** — 그 사실을 적어
    #    두고 **피크로 본다**(fail-closed: 비싸게 세는 쪽이 안전하다).
    peak_hours_utc: [[1, 4], [6, 10]]
    peak_weekdays: [0, 1, 2, 3, 4]
    source: https://api-docs.deepseek.com/quick_start/pricing
    as_of: 2026-10-04
    # 🔴 **봇이 직접 읽었다**(매체 수치가 아니다). ⚠️ 그래도 사용자가 콘솔로
    #    확인하지 않았다 — 그 사실을 숨기지 않는다(§2 와 같은 규칙).
    read_by_bot: true
    verified_by_user: false
  budget:
    # 🔴 v5-A §2 표 그대로. ⚠️ 초과 시 **단계 3만 돌리고 단계 4 생략**하고
    #    카드에 `redteam_skipped` 를 적는다.
    per_match: {input_tokens: 30_000, output_tokens: 15_000}
    # 🔴 하루·월은 **Solar 와 합산**이다(v5-A §2: *"v5 §2의 하루 $3·월 $40에
    #    Solar와 합산"*) — 그래서 여기 다시 적지 않는다(사본 금지).
    shared_with_solar: true

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v6** — 지시서 2026-10-06(`docs/fable/inbox/2026-10-06_v6_rebuild.md`)
# ══════════════════════════════════════════════════════════════════
#
# §0 원칙 5: *"숫자는 실측만 — 상한·추론 강도·문턱은 녹화본이나 실측으로 정한다.
# 이 문서의 숫자 중 실측이 아닌 것은 **초기값**으로 표시돼 있고 §8 의 실측으로
# 덮어쓴다."*
v6:
  #: 🔴 그 경기 하나에 쓸 수 있는 돈. ⚠️ **초기값** — §8 3단계 실측으로 덮는다.
  #   근거: 10-06 실측 경기당 $0.06~0.24(라이브 7회) → 그 최대의 2배를 벽으로.
  per_match_usd: 0.5

  providers:
    solar:
      model: solar-pro4
      base_url: https://api.upstage.ai/v1
      timeout_sec: 120
      # 🔴 **실측 2026-10-04**: `response_format=json_schema(strict)` 가 듣는다
      #    (한국어 기사 → `{"absent": ["오지환"]}` 정확).
      structured: json_schema
      # 🔴 단가는 공식 콘솔에서 온 수다(§2) — `solar.price()` 와 같은 값이어야
      #    한다. ⚠️ 두 곳에 적힌 것은 사본이다 → §8 5단계에서 한쪽을 지운다.
      price_usd_per_1m: {input: 0.30, cached_input: 0.06, output: 1.20}
    deepseek:
      model: deepseek-flash
      base_url: https://api.deepseek.com
      timeout_sec: 120
      # ⚠️ **실측 2026-10-04 기준 `json_object` 만 확인됐다**(`app/deepseek.py`
      #    가 그 모드를 쓴다). 🔴 JSON 스키마 강제를 확인하면 `json_schema` 로
      #    바꾸고 그 날짜를 여기 적는다 — 그때까지는 스키마를 프롬프트에 붙이고
      #    `model_validate_json` 이 검증한다(§4 가 허용한 길이다).
      structured: json_object
      price_usd_per_1m: {input: 0.028, cached_input: 0.0028, output: 0.042}

  #: 🔴 **용도별 수** — 표에 없는 용도는 터진다(수를 같이 적게 만든다 · §9).
  purposes:
    extract:
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **추출은 `minimal`** — 실측 2026-10-06
      # ══════════════════════════════════════════════════════════════
      #
      # 같은 입력(문단 4,510자)으로 돌려 본 수:
      #
      #   reasoning_effort  finish   out    reasoning  content
      #   low               length   4000   3999       🔴 **0**
      #   minimal           stop     1068   0          3519
      #   none              stop     1105   0          3175
      #
      # 🔴 `low` 는 상한을 **전부 추론에 쓰고** JSON 을 한 글자도 안 냈다.
      # ⚠️ 상한을 올려서 해결하는 것은 §9 금지다 — 추론 강도가 고칠 곳이다.
      reasoning_effort: minimal
      #: ⚠️ **초기값** — 실측 최대(1,068) × 1.5 를 넘겨 잡았다. §8 3단계에서 덮는다.
      max_tokens: 4000
      retries: 1
      # 🔴🔴 **온도 0**(사용자 지시 2026-10-06 ⑤) — 같은 입력이면 같은 출력이어야
      #    재현이 뜻을 갖는다. ⚠️ 실측 2026-10-06: 같은 경기 여섯 회차에서 변수가
      #    14·5·18·19·15·19 로 갈렸다.
      temperature: 0
    spell:
      #: 🔴 오픈월드 ⑥-1 철자 후보 — 짧은 답이다
      reasoning_effort: minimal
      max_tokens: 500
      retries: 1
    hypo:
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **DeepSeek 은 `reasoning_effort` 를 무시한다** — 실측 2026-10-06
      # ══════════════════════════════════════════════════════════════
      #
      #   effort    보낸 상한  출력    추론   결과
      #   ''        600       600     600    length
      #   minimal   600       600     600    length
      #   low       600       600     600    length
      #
      # ⚠️ *"이름 표기를 낸다 / South Korea"* 라는 **사소한 질문**에서도 추론으로
      #    상한을 다 썼다. 🔴 그러니 이 공급자에서 잘림을 고치는 지렛대는 **입력
      #    크기**뿐이다(상한 올리기는 §9 금지) — `s6._payload` 가 폼·맞대결을
      #    추려 보내는 까닭이다.
      reasoning_effort: ""
      max_tokens: 8000
      retries: 1
    redteam:
      reasoning_effort: ""
      max_tokens: 4000
      retries: 1
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **회상**(사용자 지시 2026-10-14) — *"딥서치에서 못찾으면 llm 이
    #    찾게 한다 … 그래서 llm 을 전략예측 및 서치로 쓰는거다"*
    # ══════════════════════════════════════════════════════════════
    #
    #  감독 이름 · 부임 후 성적 · 팀내 불화 — **문서 없이 모델 기억**을 받는다.
    #  🔴 경기당 **1회**(두 팀을 한 요청에). 출력이 짧다(여섯 칸 × 2줄).
    #  🔴🔴 원천은 `🔴 LLM 기억` 으로 박히고 **확률·등급에 못 닿는다**
    #     (`app/core/stages/s4b_recall.py` 머리말 · 계약 v29-2).
    #  ⚠️ `retries: 1` 은 스키마 실패용이다 — *"모른다"*(빈 글자)는 **실패가
    #     아니다**. 빈 칸을 받으면 그대로 둔다(지어내게 몰지 않는다).
    recall:
      reasoning_effort: ""
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **deepseek 가 여기서 잘렸다** — 사용자 지시 2026-10-15
      # ══════════════════════════════════════════════════════════════
      #
      #  ⚠️ 실측 2026-10-15(노리치·강원·타이포 셋): ⑤-b2 전략 전문가가
      #     **세 경기 연속 `LLM_TRUNCATED`** 로 끊겼고 solar 퇴로가 받았다.
      #     그래서 지시한 *"deepseek 우선"* 이 그 자리에서만 안 지켜졌다.
      #  🔴 까닭은 **deepseek 이 `reasoning_effort` 를 무시하고** 추론으로
      #     상한을 쓰기 때문이다(이 파일 `hypo` 칸에 그 실측이 적혀 있다).
      #     부등호 넷에 근거 문장을 붙이니 2,000 으로는 모자랐다.
      #  🔴 그래서 **4,000 으로 올린다**(⑤-c 리그 분석도 같은 용도를 쓴다).
      #     ⚠️ 비용은 deepseek 가 1M 출력 $0.042 라 한 경기에 무시할 만하다.
      max_tokens: 4000
      retries: 1
      #: 🔴 **온도 0** — 같은 경기면 같은 회상이어야 재현이 뜻을 갖는다
      temperature: 0
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **종합 논평**(사용자 지시 2026-10-07 ③) — 경기당 **1회**
    # ══════════════════════════════════════════════════════════════
    #
    # 🔴 입력은 **이미 센 수**다(양상·근거 변수 상위 4개·시나리오 상위 3개·보드 판정·
    #    방향). ⚠️ 그래서 짧다 — 잘림의 지렛대는 입력 크기뿐이다(위 `hypo` 주석).
    # ⚠️ `retries: 1` 은 **스키마 실패**용이고, 코드 검사 실패의 재요청은 `s8` 이 한다
    #    (1회 · 그다음은 코드 템플릿).
    commentary:
      reasoning_effort: ""
      max_tokens: 6000
      retries: 1
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **1겹 이유 문단**(사용자 지시 2026-10-09(3차) §3) — 경기당 **1회**
    # ══════════════════════════════════════════════════════════════
    #
    # > 작성자 DeepSeek **1회**, 구조화 출력 ·
    # > 출력: `{sentences: 3~5개, 각 문장 fact_refs(사실 id 1개 이상)}`
    #
    # 🔴 총평(`commentary`)과 **다른 호출**이다 — 총평은 깊은 카드의 글이고 이것은
    #    1겹의 첫 세 줄에서 읽히는 글이다. ⚠️ 그래서 경기당 LLM 호출이 **한 번 는다**.
    # 🔴 상한이 총평보다 좁다 — 문단이 **400자 안**이어야 한다(§5).
    reason:
      reasoning_effort: ""
      max_tokens: 4000
      retries: 1
    # ══════════════════════════════════════════════════════════════════
    # 🔴🔴 **확정 라인업 전략 판정**(사용자 지시 2026-10-10(둘째) §2-2)
    # ══════════════════════════════════════════════════════════════════
    #
    # > 전략 판정(LLM **1회**, 구조화 출력) … 팀마다 strategy + 근거 사실 id
    # > 2개 이상 + 한 줄 이유.
    #
    # 🔴 **한 번뿐이다** — 코드 검사에서 어긋나면 **버린다**(다시 묻지 않는다).
    #    ⚠️ 재작성 고리를 두면 모델이 검사를 통과할 말을 찾게 된다(그것은 판정이
    #       아니다). 전략이 없으면 확률은 **잠정 그대로**다.
    # ⚠️ 출력이 짧다(두 줄 + 근거 id) — 상한을 작게 둔다.
    # 🔴🔴 **전술 전문가 예측**(사용자 지시 2026-10-10(셋째) §6)
    #
    #  다섯 칸(운영 2 · 흐름 2 · 승부처 1) + 문장마다 근거 id.
    #  🔴 상한은 `strategy` 와 같은 4000 이다 — 추론이 작은 상한을 전부 먹는
    #     일을 이미 겪었다(같은 파일 `strategy` 칸의 실측 2026-10-10).
    #  🔴 검열에 걸리면 **한 번만** 재작성한다(`s2f_tactic`).
    tactic:
      reasoning_effort: ""
      max_tokens: 4000
      retries: 1
      temperature: 0
    # ══════════════════════════════════════════════════════════════════
    # 🔴🔴 **최종 평**(사용자 지시 2026-10-10(넷째) §2) — 카드의 마지막 단계
    # ══════════════════════════════════════════════════════════════════
    #
    #  칸 일곱(판정·한 줄·주장 3~5개·흐름 둘·승부처·뒤집히는 조건) +
    #  주장마다 근거 id 2개 이상.
    #
    #  🔴 입력이 **이 파이프라인에서 가장 길다** — 사실 묶음이 라인업 자리 22개·
    #     골 유형·시간대·전략 사실·발동 규칙·확률을 다 든다(실측 2026-10-10:
    #     김천–안양에서 **60항목**). ⚠️ 그래서 상한은 `strategy` 와 같은 **8000**
    #     이다(`strategy` 칸의 실측: 사실이 많으면 추론이 상한을 다 먹는다).
    #  🔴 검열(§3 (q)~(v))에 걸리면 **한 번만** 재작성하고, 또 걸리면 **코드
    #     템플릿 평**으로 내린다(`s9_say.template`).
    # ══════════════════════════════════════════════════════════════════
    # 🔴🔴 **질의 쓰기**(사용자 지시 2026-10-11 ②③) — 글자만 내는 가장 싼 호출
    # ══════════════════════════════════════════════════════════════════
    #
    #  🔴 출력은 **질의 목록 + 도메인 목록**뿐이다(`querywriter.QueryPlan`) —
    #     사실·숫자·판정이 없다. 그래서 상한이 작다.
    #  ⚠️ 경기당 **1회**다(하위마다 부르지 않는다) — 질의는 두 팀 것이 같다.
    query:
      reasoning_effort: ""
      max_tokens: 2000
      retries: 1
      #: 🔴 같은 경기면 같은 질의여야 한다 — 온도 0(재현)
      temperature: 0
    say:
      reasoning_effort: ""
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **8000 → 16000** — 실측 2026-10-11(LAFC–밴쿠버)
      # ══════════════════════════════════════════════════════════════
      #
      #  재현 두 번에서 `say` 가 모두 끊겼다:
      #      [s9say] 🔴 LLM 실패 — llm_truncated   (출력 8000 · 추론 7822)
      #  🔴 이 칸의 위 주석이 적은 그 병이다 — *"사실이 많은 경기일수록 추론이
      #     길어진다"*. 상한을 올려 고치는 것이 §9 금지인 쪽은 **추론 강도로
      #     고칠 수 있을 때**이고, DeepSeek 는 추론 강도를 **무시한다**
      #     (같은 파일 `hypo`·`strategy` 칸의 실측).
      #  ⚠️ 그래도 잘릴 수 있다 — 그때는 `_ask_core` 가 **한 줄·이유 문단만**
      #     짧게 다시 받는다(코드 템플릿으로 떨어지지 않는다).
      max_tokens: 16000
      retries: 1
      #: 🔴 같은 사실 묶음이면 같은 평이어야 한다 — 온도 0
      temperature: 0
    strategy:
      reasoning_effort: ""
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **1200 → 4000** — 실측 2026-10-10(세레소–마리노스)
      # ══════════════════════════════════════════════════════════════
      #
      # 1200 으로 뒀더니 **추론이 1200 을 전부 먹고** JSON 을 한 글자도 안 냈다:
      #
      #     [s2d] 🔴 LLM 실패 — llm_truncated · 출력이 잘렸다
      #           — out 1200(추론 1200) · 추론 강도 없음
      #
      # ⚠️ 이 파일의 `extract` 칸에 **같은 실측이 이미 적혀 있었다**(*"`low` 는
      #    상한을 전부 추론에 쓰고 JSON 을 한 글자도 안 냈다"*) — 나는 그것을
      #    읽고도 작은 수를 넣었다. 🔴 상한을 올려 해결하는 것이 §9 금지인 쪽은
      #    **추론 강도로 고칠 수 있을 때**이고, DeepSeek 는 추론 강도를
      #    **무시한다**(같은 파일 `hypo` 칸의 실측). 그래서 상한을 올린다.
      # 🔴 같은 실행에서 1200 → 실패, 4000 → 성공(`로테이션·체력 관리` ·
      #    `수비 위주` 판정이 나왔다).
      # 🔴🔴 **4000 → 8000** — 실측 2026-10-10(아비스파–파지아노): 사실이 19건
      #    (홈 9 · 원정 10)인 경기에서 **4000 도 추론이 전부 먹었다**
      #    (`llm_truncated · out 4000(추론 4000)`). ⚠️ 사실이 많은 경기일수록
      #    추론이 길어진다 — 상한을 사실 수에 맞춰 넉넉히 둔다.
      max_tokens: 8000
      retries: 1
      #: 🔴 같은 명단이면 같은 판정이어야 한다 — 온도 0(§5 재현)
      temperature: 0
    # ══════════════════════════════════════════════════════════════════
    # 🔴🔴 **총평 검열**(사용자 지시 2026-10-07 §4-2) — 검열자는 **Solar** 다
    # ══════════════════════════════════════════════════════════════════
    #
    # > 모델 검열 (Solar 1회, 구조화 출력 — **작성자 DeepSeek와 다른 모델**)
    # > 비용: 검열 모델 호출 경기당 **최대 2회**(재작성 포함), 출력 상한 **600토큰**.
    #
    # ⚠️ 판정만 한다 — *"새 사실·새 예측을 만들지 마라"*. 그래서 추론을 쓰지 않는다
    #    (`minimal` — 추출에서 실측한 그 값이고, `low` 는 상한을 추론에 다 쓴다).
    audit:
      reasoning_effort: minimal
      max_tokens: 600
      retries: 1
      temperature: 0
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **갈래 판정**(사용자 지시 2026-10-16) — *"각 LLM 이 낸 내용을
    #    **다른 LLM 이 서치해서 검증**하는 걸로 옳다 그르다를 판단"*
    # ══════════════════════════════════════════════════════════════
    #
    #  🔴 부르는 곳은 `app/core/branchjudge.py` 하나다(2단 교차 검증).
    #  🔴 출력이 **아주 짧다** — 판정 글자 하나 + 인용 한 문장 + 주소.
    #     ⚠️ 그런데 입력은 **본문 3건**(각 1,800자)이라 deepseek 가 추론으로
    #        상한을 먹을 수 있다(같은 파일 `hypo`·`recall` 칸의 실측).
    #        그래서 상한을 `recall` 과 같은 4,000 으로 둔다 — 출력이 짧아
    #        비용은 거의 안 든다(deepseek 1M 출력 $0.042).
    #  🔴 **온도 0** — 같은 본문이면 같은 판정이어야 재현이 뜻을 갖는다.
    judge:
      reasoning_effort: ""
      max_tokens: 4000
      retries: 1
      temperature: 0
