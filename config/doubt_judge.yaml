# 🔴🔴 **운영 상태 — 기록용**(후속 지시 2026-10-14 4번)
# ══════════════════════════════════════════════════════════════════
#
#  > 확신 문턱 … 로 **기록만**(var/picks · score_cards) · 실전 표시 "기록용".
#
#  🔴 `기록용` 이면 칠 표가 머리에 **🔴 기록용 — 실전 금지**를 찍는다.
#  ⚠️ 이것을 `실전` 으로 바꾸는 것은 **사용자 지시**로만 한다(이 파일을 봇이
#     스스로 바꾸지 않는다). ⚠️ 발송 스위치(`SEND_ENABLED`)와는 **다른 칸**이다.
운영: 기록용
운영_까닭: >
  지시 4번 — 1번(누설 점검) 통과 뒤 문턱을 0.63/0.75 로 올렸다. 실전 전환은
  별도 지시로만 한다. ⚠️ 확신 픽 평균 보드 배당은 **1.53**(개시 · 중앙값 1.48 ·
  배당 있는 줄 175개)이고 적중은 69.5%(문턱 0.58 때) 였다 — 지시 2번이 든
  1.85 근처는 아니지만, 실전은 지시로만 켠다.

# 🔴 시즌 교차 — 역배는 **다른 시즌에서도 유지**돼야 한다(§4)
#    ⚠️ 그 확인은 보정표를 시즌별로 다시 세야 한다 → `core/doubt` 는 판의
#       `시즌교차` 칸을 읽고, 그 칸이 없으면 **역배를 내지 않는다**(추측 금지).
역배_시즌교차_필수: true
