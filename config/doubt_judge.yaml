# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **§4 판정 문턱**(의심 검증 통합본 v2 · 2026-10-14i §4)
# ══════════════════════════════════════════════════════════════════
#
#  > 확신: 1단 정상 + **의심 후 확률 ≥ 확신 문턱** + 구간 하한도 문턱 근처 → 봇 쪽
#  > 역배: 1단 정상 + **반대쪽 의심 후 확률 구간 하한 > 50%** + 다른 시즌에서도 유지
#  > 보류: 나머지(기계 보류 포함). *"봇이 이상해 보인다"* 만으로 역배 금지.
#
# 🔴 읽는 곳은 `app/core/doubt.py` **하나**다(코드에 값을 적지 않는다).
# 🔴🔴 **문턱은 백필 곡선으로만 고른다** — `tools/cut_curve.py --after`.
#    ⚠️ 그 곡선은 **의심 후 확률** 자 위에 있다. 봇 원확률 자(0.88 · `core/picks`)
#       를 그대로 쓰면 **아무것도 통과하지 못한다** — 보정표에서 가장 높은 칸이
#       **67.1%**(승무패 50%+ · 1,470경기)다. 섞어 쓰면 "문턱이 높아 보류"가
#       아니라 **"기계가 멈춘 것"** 이 된다.
cuts:
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **0.58** — 곡선의 평평한 구간 **가운데**다(표본 밖 · 2026-10-14)
  # ══════════════════════════════════════════════════════════════════
  #
  #  `tools/cut_curve.py --after --board-only` · `var/accept/cut_after.log`
  #  🔴 **홀드아웃 2025/2026 만**(2,865경기 · 174일) — 보정표가 그 시즌을 빼고
  #     적합했으므로 이 곡선은 **표본 밖**이다. 묶음(의심 개수)은 **깃발로**
  #     정한다(H1 을 누설 없이 센다 · `fit_doubt.wide_rows`).
  #      0.50~0.55 → 단폴 1,011건 **61.7%** · 하루 5.81
  #      **0.58~0.60 →   564건 69.5% · 하루 3.24**   ← 여기서 꺾인다
  #      0.63~0.70 →   251건 76.9% · 하루 1.44
  #      0.75~0.80 →   104건 83.7% · 하루 0.60
  #  🔴 0.58~0.60 이 **같은 564건**이다(칸 값이 이산이다) → **가운데(0.58)**.
  #     끝에 붙이면 칸 값이 조금만 움직여도 판정이 통째로 바뀐다.
  #  ⚠️ 더 올리면 적중은 오르지만 **하루 수가 1 아래**로 떨어진다 — 슬레이트가
  #     하루 10~20경기인데 표가 사실상 비는 자리다. 올릴지는 사용자가 정한다.
  #  ⚠️ 봇 **원확률 자**(단폴 0.88 · `core/picks`)와 **다른 자**다 — 섞지 않는다.
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **0.63 으로 올렸다**(후속 지시 2026-10-14 4번 · 1번 통과 뒤)
  # ══════════════════════════════════════════════════════════════════
  #
  #  지시 4번 — *"1번 통과 후: 단폴 0.63 · 다폴 다리 0.75 로 전환(곡선 재확인 후)"*.
  #  🔴 1번(누설 점검)은 **통과했다**(`var/accept/j1_leak.log`) — J1 은 개시
  #     배당에서도 유효하고(−20.7%p) 확신 69.5% 는 **J1 을 아예 쓰지 않는다**.
  #  🔴 곡선 재확인(`var/accept/cut_after.log` · 홀드아웃 2025/2026 · 2,865경기 ·
  #     174일 · 보드 줄만 · 의심 후 자):
  #      0.50~0.55 → 단폴 1,011건 61.7% · 하루 5.81
  #      0.58~0.60 →   564건 69.5% · 하루 3.24
  #      **0.63~0.70 →  251건 76.9% · 하루 1.44**   ← 채택
  #      0.75~0.80 →   104건 83.7% · 하루 0.60
  #     다리: 0.58 → 2폴 54.8%(104묶음) · 0.63 → **65.2%**(66) ·
  #           **0.75 → 87.0%(23) · 3폴 70.0%(10)**  ← 채택
  #  ⚠️ 0.63 위는 0.70 까지 **평평하다**(같은 251건) → 가운데가 아니라 **아래 끝**
  #     을 쓴다(지시가 그 수를 지목했다). 다리 0.75 도 같다(0.80 까지 평평).
  #  ⚠️ 하루 1.44개다 — 표가 비는 날이 생긴다. 그것이 지시가 고른 자리다.
  확신: 0.63
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **다폴 다리 0.63 기본**(후속 지시 2026-10-14 2번)
  # ══════════════════════════════════════════════════════════════════
  #
  #  지시 — *"다폴 다리 0.63 기본 · 0.75 는 표본 100 쌓일 때까지 참고"*.
  #  🔴 곡선(홀드아웃 2,865경기 · 174일): 0.63 → 2폴 **65.2%**(66묶음) ·
  #     3폴 47.2%(36) / 0.75 → 2폴 87.0%(**23묶음**) · 3폴 70.0%(**10**).
  #  ⚠️ 0.75 의 **묶음이 23·10 개**다 — 그 수로 문턱을 정할 수 없다(지시가
  #     "표본 100" 을 든 까닭이다). 그래서 **0.63 을 쓰고 0.75 는 적어만 둔다**.
  다리: 0.63
  #: 🔴 **참고값** — 쓰지 않는다. `다리_참고_표본` 묶음이 쌓이면 다시 본다.
  다리_참고: 0.75
  다리_참고_표본: 100
  확신_하한_여유: 0.03   # 🔴 "구간 하한도 문턱 근처" — 하한 ≥ 문턱 − 이 값
  # 🔴 §4 그대로 — 반대쪽 구간 **하한**이 50% 를 넘어야
  #  ⚠️ 실측(`var/accept/fade_grade.log` · 홀드아웃 2,865경기): 하한을
  #     0.50 → 0.55 → 0.60 으로 올려도 **역배 수가 310 에서 안 변한다**(지금
  #     역배를 내는 칸이 **하나**뿐이고 그 반대쪽 하한이 60.3% 다). 🔴 즉 지금
  #     묶는 것은 문턱이 아니라 **시즌 교차 조건**이다(하한만 넘은 줄 145개가
  #     교차 없음으로 막혔다).
  역배_하한: 0.50
  at: "2026-10-14"
  근거: "tools/cut_curve.py --after --board-only(홀드아웃 2025/2026 · 2,865경기) · var/accept/cut_after.log"

