# 증거 키워드 사전 — 기사 고르기·추출 보조 [EXT-2 2026-09-20]
#
# 🔴 **키워드를 코드에 박지 않는다.** 이 파일이 원본이고, v2 STEP 7-4(기사
#    수집)가 쓸 **바로 그 파일**이다 — 나중에 새로 만들지 않는다.
# 🔴 쓰임은 둘이다:
#      (1) 기사 상한(depth)을 넘길 때 **무엇을 남길지** 고른다(적중 우선).
#      (2) STEP 7-4 에서 **LLM 없이** 1차 추출을 시도한다(사전 우선).
# ⚠️ 목록을 늘릴 때는 **오탐**을 재라. 아무 기사나 걸리면 상한 2건이
#    쓸모없는 기사로 채워지고, 그게 추출 실패보다 나쁘다.
# ⚠️ 값은 **부분 문자열**로 맞춘다(형태소 분석 없음). 짧은 낱말은 넣지 마라.

