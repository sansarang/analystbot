# 🔴 [NWS-D 2026-09-23 사용자 지시] **호재·악재 방향.**
#    "기사가 악재인가 호재인가를 판단해서 부상이나 다른 문제가 있으면
#     예측에 무조건 좌우되어야 한다"
#
#  ⚠️ 위 `lexicon:` 과 **용도가 다르다.** 그쪽은 "이 기사를 읽을까"(고르기)이고
#     여기는 "이 기사가 그 팀에 유리한가"(방향)다. 그래서 섞지 않는다.
#  ⚠️ **같은 낱말을 양쪽에 넣지 마라.** 둘 다 걸리면 판정이 None 이 되어
#     그 기사는 영영 안 쓰인다. 계약이 교집합 0 을 잠근다.
#  ⚠️ 부분 문자열로 맞춘다(형태소 분석 없음). 짧은 낱말은 넣지 마라 —
#     `등록` 만 넣으면 `등록말소` 가 호재로 읽힌다.
direction:
  bad:
    # ⚠️ [실측 2026-09-23] 라이브 RSS 14건을 눈으로 보고 보강했다. `2군행` 이
    #    없어서 "1군 복귀 이틀 만에 **2군행**" 이 호재로 읽혔다 — 정반대다.
    ko: [부상, 결장, 말소, 이탈, 수술, 엔트리 제외, 선발 제외, 교체 아웃,
         2군행, 2군 강등, 재활, 전력 이탈, 등판 불가, 출전 불가]
    ja: [故障, 欠場, 抹消, 離脱, 登録抹消, 出場回避, 二軍調整, 戦線離脱]
    en: [injury, injured, scratched, placed on, out today, day-to-day, sidelined]
  good:
    ko: [복귀, 1군 등록, 엔트리 등록, 복귀전, 복귀 예고]
    ja: [復帰, 出場選手登録, 一軍登録, 復帰登録]
    en: [activated, returns from, return from, back in the lineup, cleared to play]
