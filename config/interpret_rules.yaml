# 해석 규칙 — **사실(Facts) → 변수(Variable)**. 사용자 지시 2026-10-06 ⑥
#
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **원본 문서가 이 기계에 없다**(실측 2026-10-06)
# ══════════════════════════════════════════════════════════════════
#
# 지시는 *"페이블 해석 접목 지시서 §2 표를 여기로 옮기고 `s5._from_facts` 를
# 채운다"* 였다. ⚠️ 그 문서를 **찾지 못했다**:
#   · `~/Downloads/*.pdf` — v6 재구축 · 북아일랜드–조지아 · v3(페이블 **분석법 이식**)뿐
#   · `docs/` 전체 — `IR01`~`IR12` 가 나오는 곳은 v6 지시서 본문과 `schema.py` 주석뿐
#   · 저장소 v3 문서 §2 는 *"STEP 0 슬레이트 확정"* 이고 해석 표가 아니다
#
# 🔴 그래서 이 파일은 **이 저장소에 이미 있는 규칙만** 옮겨 적는다. 규칙을 지어내지
#    않는다(#4 추측 금지). ⚠️ 접목 문서를 받으면 **이 파일을 그 표로 덮는다** —
#    `s5._from_facts` 는 파일을 읽을 뿐이므로 코드는 그대로다.
#
# 각 줄의 `source` 가 **그 규칙이 어디서 왔는지**다. 수를 여기 베끼지 않는다 —
# `thresholds`·`league.h2h_weight` 를 이름으로 가리킨다(사본 금지 · #1).

#: 🔴 사실에서 만든 변수의 번호 앞머리 — 카드가 `IR08` 처럼 되짚을 수 있게
prefix: IR

rules:
  # ══════════════════════════════════════════════════════════════════
  # IR01 최근 폼 — `recent_pattern`
  # ══════════════════════════════════════════════════════════════════
  - id: IR01
    type: recent_pattern
    when: facts.recent 에 그 팀 칸이 있고 경기 수가 recent_min_games 이상
    #: 🔴 표본이 적으면 **근거로 쓰지 않는다**(§7 R7) — 수는 thresholds 가 든다
    min_games: recent_min_games
    #: 🔴 어느 쪽인가 — 득점 평균이 더 큰 팀 쪽(표의 `favors: subject`)
    claim: "{team} 최근 {n}경기 {last5} · 득점 평균 {avg}(보정 {trimmed})"
    source: config/variable_types.yaml 의 recent_pattern + app/thresholds.yaml

  # ══════════════════════════════════════════════════════════════════
  # IR02 맞대결 — `h2h_pattern`
  # ══════════════════════════════════════════════════════════════════
  - id: IR02
    type: h2h_pattern
    when: facts.h2h 에 표본이 있을 때
    #: 🔴 표본 무게는 `league.h2h_weight(n)` 하나가 든다 — 1.0 미만이면 **표본 부족**
    sample_weight_from: app/league.py:h2h_weight
    claim: "맞대결 {n}경기 {w}승 {d}무 {l}패 · 평균 {goals}골"
    source: app/league.py:h2h_weight + config/variable_types.yaml 의 h2h_pattern

  # ══════════════════════════════════════════════════════════════════
  # IR03 홈 이점 — `home_field`
  # ══════════════════════════════════════════════════════════════════
  - id: IR03
    type: home_field
    when: 중립 구장이 아니고 홈 팀을 알 때
    #: ⚠️ 장소별 표본이 min_venue_games 미만이면 **표본 부족**으로 적는다
    min_games: min_venue_games
    claim: "{team} 홈 경기 — 홈 이점"
    source: config/variable_types.yaml 의 home_field(사용자 지시 2026-10-02) + thresholds

  # ══════════════════════════════════════════════════════════════════
  # IR04 휴식 차 — `travel_schedule`
  # ══════════════════════════════════════════════════════════════════
  - id: IR04
    type: travel_schedule
    when: 양 팀 rest_days 를 둘 다 알고 차이가 rest_gap_days 이상
    #: ⚠️ 이 수는 **선언이 없다** — 그래서 이 규칙은 **돌지 않는다**(아래 `off`).
    #   🔴 문턱을 지어내지 않는다(#4). 접목 문서나 사용자 지시가 오면 켠다.
    off: 휴식 차 문턱이 어느 표에도 없다 — 지어내지 않는다
    claim: "{team} 휴식 {days}일 (상대 {other}일)"
    source: 없음 — 문턱 미정
