# 해석 규칙 — **사실(Facts) → 변수(Variable)**. 사용자 지시 2026-10-06 ⑥
#
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **원본 문서가 이 기계에 없다**(실측 2026-10-06)
# ══════════════════════════════════════════════════════════════════
#
# 지시는 *"페이블 해석 접목 지시서 §2 표를 여기로 옮기고 `s5._from_facts` 를
# 채운다"* 였다. ⚠️ 그 문서를 **찾지 못했다**:
#   · `~/Downloads/*.pdf` — v6 재구축 · 북아일랜드–조지아 · v3(페이블 **분석법 이식**)뿐
#   · `docs/` 전체 — `IR01`~`IR12` 가 나오는 곳은 v6 지시서 본문과 `schema.py` 주석뿐
#   · 저장소 v3 문서 §2 는 *"STEP 0 슬레이트 확정"* 이고 해석 표가 아니다
#
# 🔴 그래서 이 파일은 **이 저장소에 이미 있는 규칙만** 옮겨 적는다. 규칙을 지어내지
#    않는다(#4 추측 금지). ⚠️ 접목 문서를 받으면 **이 파일을 그 표로 덮는다** —
#    `s5._from_facts` 는 파일을 읽을 뿐이므로 코드는 그대로다.
#
# 각 줄의 `source` 가 **그 규칙이 어디서 왔는지**다. 수를 여기 베끼지 않는다 —
# `thresholds`·`league.h2h_weight` 를 이름으로 가리킨다(사본 금지 · #1).

#: 🔴🔴 **번호 앞머리** — 사용자 지시 2026-10-06(2차) ④
#
#  > 지금 만든 폼·맞대결·홈 규칙은 **S01·S02·S03** 으로 번호를 바꾸고, 아래
#  > IR01~IR12 표를 `config/interpret_rules.yaml` 에 그대로 넣는다.
#
#  🔴 `S` 는 **구조 사실(Structure)** 에서 바로 나오는 규칙이다 — 이 저장소가 이미
#     들고 있던 것. `IR` 은 접목 지시서의 해석 규칙 자리이고 **아직 비어 있다**
#     (⚠️ 그 표가 이 기계에 없다 — 아래 `ir_table` 참고).
prefix: S

rules:
  # ══════════════════════════════════════════════════════════════════
  # S01 최근 폼 — `recent_pattern`
  # ══════════════════════════════════════════════════════════════════
  - id: S01
    type: recent_pattern
    when: facts.recent 에 그 팀 칸이 있고 경기 수가 recent_min_games 이상
    #: 🔴 표본이 적으면 **근거로 쓰지 않는다**(§7 R7) — 수는 thresholds 가 든다
    min_games: recent_min_games
    #: 🔴 어느 쪽인가 — 득점 평균이 더 큰 팀 쪽(표의 `favors: subject`)
    claim: "{team} 최근 {n}경기 {last5} · 득점 평균 {avg}(보정 {trimmed})"
    source: config/variable_types.yaml 의 recent_pattern + app/thresholds.yaml

  # ══════════════════════════════════════════════════════════════════
  # S02 맞대결 — `h2h_pattern`
  # ══════════════════════════════════════════════════════════════════
  - id: S02
    type: h2h_pattern
    when: facts.h2h 에 표본이 있을 때
    #: 🔴 표본 무게는 `league.h2h_weight(n)` 하나가 든다 — 1.0 미만이면 **표본 부족**
    sample_weight_from: app/league.py:h2h_weight
    claim: "맞대결 {n}경기 {w}승 {d}무 {l}패 · 평균 {goals}골"
    source: app/league.py:h2h_weight + config/variable_types.yaml 의 h2h_pattern

  # ══════════════════════════════════════════════════════════════════
  # S03 홈 이점 — `home_field`
  # ══════════════════════════════════════════════════════════════════
  - id: S03
    type: home_field
    when: 중립 구장이 아니고 홈 팀을 알 때
    #: ⚠️ 장소별 표본이 min_venue_games 미만이면 **표본 부족**으로 적는다
    min_games: min_venue_games
    claim: "{team} 홈 경기 — 홈 이점"
    # ══════════════════════════════════════════════════════════════════
    # 🔴🔴 **표본이 없으면 버리지 않는다 — 기본값으로 soft**(사용자 지시 ①)
    # ══════════════════════════════════════════════════════════════════
    #
    # > 홈 이점: 표본이 없으면 버리지 말고 **기본값(국가대표/리그 홈 승률)** 으로 soft
    # > 변수. `home_field` 가 근거 불가로 빠지면 **E2E 실패**.
    #
    # 🔴 수의 근거는 `app/classify.py:_dir_home_field` 의 실측 주석이다:
    #    *"실측: MLS 홈 승률 **+16.8%p**·득점 +0.46골"*(사용자 지시 2026-10-02).
    # ⚠️ 대표팀 경기는 그 표가 없다 — 그래서 **같은 수를 쓰고 그 사실을 claim 에 적는다**
    #    (`기본값` 이라고 쓴다). 🔴 쪼갠 표가 생기면 그 수가 이것을 **덮는다**.
    # ══════════════════════════════════════════════════════════════════
    # 🔴🔴 **같은 대회 유형의 표에서만**(사용자 지시 2026-10-06(4차) ③)
    # ══════════════════════════════════════════════════════════════════
    #
    # > 홈 이점 기본값: **같은 대회 유형의 표에서만** 가져온다(국가대표 친선 / 국가대표
    # > 공식전 / 각 리그). 그 유형의 표가 없으면 숫자 없이 *"홈 이점 — 수치 없음"* soft
    # > 변수로 두고, **다른 대회 숫자를 빌려 쓰지 않는다.** 카드에 기본값의 **출처 대회**를 적는다.
    #
    # ⚠️ 실측 2026-10-06: 대표팀 친선 카드에 **MLS 숫자(+16.8%p)** 가 들어갔다 —
    #    리그 홈 이점을 대표팀 경기에 빌려 쓴 것이고, 그것은 근거가 아니다.
    # 🔴 그래서 **대표팀 표는 비어 있다** — 재지 않았으니 숫자를 적지 않는다.
    defaults:
      league:MLS:
        win_pct_delta: 16.8
        basis: MLS 실측(사용자 지시 2026-10-02 · app/classify.py:_dir_home_field 주석)
      national_friendly: {}      # 🔴 **안 쟀다** — 숫자 없이 soft 변수로 둔다
      national_official: {}      # 🔴 **안 쟀다**
      league: {}                 # 🔴 리그 일반값도 안 쟀다(리그별로 다르다)
    source: config/variable_types.yaml 의 home_field + 위 default

  # ══════════════════════════════════════════════════════════════════
  # S05 휴식 차 — `travel_schedule`
  # ══════════════════════════════════════════════════════════════════
  - id: S05
    type: travel_schedule
    when: 양 팀 rest_days 를 둘 다 알고 차이가 rest_gap_days 이상
    #: ⚠️ 이 수는 **선언이 없다** — 그래서 이 규칙은 **돌지 않는다**(아래 `off`).
    #   🔴 문턱을 지어내지 않는다(#4). 접목 문서나 사용자 지시가 오면 켠다.
    # ⚠️ 열쇠 이름이 `off` 가 아니라 `disabled` 다 — 🔴 **YAML 1.1 이 `off` 를
    #    불리언 `False` 로 읽는다**(실측 2026-10-06: 열쇠가 `False` 가 돼 규칙이
    #    꺼지지 않았다). 그 함정은 이름을 바꾸는 것으로만 막는다.
    disabled: 휴식 차 문턱이 어느 표에도 없다 — 지어내지 않는다
    claim: "{team} 휴식 {days}일 (상대 {other}일)"
    source: 없음 — 문턱 미정

  # ══════════════════════════════════════════════════════════════════
  # S04 친선 경기 — `match_type`(사용자 지시 2026-10-06(2차) ③)
  # ══════════════════════════════════════════════════════════════════
  - id: S04
    type: match_type
    when: match_format 이 friendly 일 때
    #: 🔴 글자를 코드에 박지 않는다 — 카드에 그대로 나간다
    claim: 친선 — 실험 라인업·교체 다수 가능
    favors: both
    goals: none
    hardness: soft
    source: 사용자 지시 2026-10-06(2차) ③ · docs/fable/decisions/2026-10-06_user_decisions.md

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **IR01~IR12 — 아직 비어 있다**(2026-10-06(2차) ④)
# ══════════════════════════════════════════════════════════════════
#
# 지시는 *"아래 IR01~IR12 표를 그대로 넣는다"* 였는데 **그 자리에 표가 오지 않았다** —
# 받은 글자는 `[표는 위 원본 그대로]` 이고, 그 "위 원본"(페이블 해석 접목 지시서 §2)은
# 이 기계에 없다(실측: `~/Downloads`·`docs/` 전부 확인 · 결정 문서에 적었다).
#
# 🔴 그래서 **지어내지 않는다**(#4). 표를 받으면 아래 `ir_table` 에 그대로 넣으면
#    `s5._from_facts` 가 읽는다 — 코드는 그대로다(`type`·`when`·`claim`·`favors`·
#    `goals`·`min_games` 칸을 S 규칙과 **같은 꼴**로 읽는다).
# 🔴 축구 완성 지시서 §3 이 **이름과 방아쇠로** 열두 줄을 적었다 — 그것을 옮긴다:
#
#   > 축구에서 켜는 해석 규칙 — IR01(5백), IR02(주전 이탈), IR03(복귀), IR04(이상치
#   > 보정), IR05(확정 비대칭), IR06(로테이션 패배 할인), IR07(단판·1차전), IR11(8일
#   > 3경기·시차), IR12(연승·연패). 각 규칙은 **§2 의 사실 칸이 있을 때만** 돈다.
#   > IR08~IR10 은 축구 경로에서 끈다.
#
# ⚠️ 각 줄의 `needs` 가 그 **사실 칸**이다 — 비면 `s5._from_facts` 가 건너뛰고 사유를
#    남긴다(#3 조용한 0 금지). 🔴 `sports` 가 종목을 가른다(축구만 켠다).
ir_table:
  - id: IR01
    type: lineup_intent
    sports: [soccer]
    when: 포메이션이 5백(5-3-2·5-4-1·3-5-2 의 수비 5)일 때
    needs: [xi.formation]
    claim: "{team} {formation} — 5백으로 내려앉는 운영"
    favors: subject
    goals: down

  - id: IR02
    type: def_absence
    sports: [soccer]
    when: 직전 경기 선발이 오늘 XI·명단에 없을 때(주전 이탈)
    needs: [last_xi, xi]
    claim: "{team} 직전 선발 {who} 가 오늘 명단에 없다"
    favors: opponent
    goals: none

  - id: IR03
    type: returning
    sports: [soccer]
    when: 결장이던 선수가 오늘 XI·명단에 있을 때(복귀)
    needs: [last_xi, xi]
    claim: "{team} {who} 복귀"
    favors: subject
    goals: none

  - id: IR04
    type: regression
    sports: [soccer]
    # ══════════════════════════════════════════════════════════════════
    # 🔴🔴 **상대가 하위권일 때만**(사용자 지시 2026-10-06(3차) ②)
    # ══════════════════════════════════════════════════════════════════
    #
    # > IR04 조건에 *"그 이상치 경기 **상대가 하위권**(랭킹·순위 하위 25%)"* 을 추가.
    # > **상대 정보가 없으면 발동하지 않는다.**
    #
    # ⚠️ 그래서 `needs` 에 상대 순위가 들어간다 — 그 칸이 없으면 규칙이 **건너뛴다**
    #    (사유가 남는다). 🔴 그 전에는 친선 경기에서도 늘 발동해 **모든 이상치**를
    #    회귀로 적었다(상대가 강팀이어서 많이 먹힌 경기까지).
    when: 보정 평균이 원 평균과 다르고 **그 이상치 경기 상대가 하위 25%** 일 때
    needs: [recent.recent_trimmed_avg, recent.sequence_rank]
    #: 🔴 하위권 문턱 — 랭킹·순위의 **하위 25%**
    bottom_pct: 25
    claim: "{team} 득점 평균 {avg} → 보정 {trimmed}(이상치 한 경기를 뺐다)"
    favors: both
    goals: none

  - id: IR05
    type: stakes
    sports: [soccer]
    when: 순위·잔여에서 진출·탈락이 확정됐거나 경우의 수가 갈릴 때(동기 비대칭)
    needs: [standings]
    claim: "{team} 동기 — {why}"
    favors: subject
    goals: none

  - id: IR06
    type: squad_rotation
    sports: [soccer]
    when: 직전 경기가 로테이션 선발이었으면 그 패배를 할인한다
    needs: [last_xi, recent]
    claim: "{team} 직전 패배는 로테이션 선발이었다 — 그 표본을 할인한다"
    favors: both
    goals: none

  - id: IR07
    type: match_type
    sports: [soccer]
    when: 형식이 단판·1차전일 때(90분 무승부가 갈래다)
    needs: [match_format]
    claim: "{team} 형식 {format} — 90분 무승부가 갈래다"
    favors: both
    goals: none

  # 🔴 IR08~IR10 은 **축구에서 끈다**(§3 마지막 줄) — 야구 규칙이다
  - id: IR08
    sports: [baseball]
    disabled: 축구 경로에서 끈다(§3) — 선발 상대전 규칙은 야구다
    type: pitcher_state
    needs: []
  - id: IR09
    sports: [baseball]
    disabled: 축구 경로에서 끈다(§3) — 불펜 규칙은 야구다
    type: pitcher_state
    needs: []
  - id: IR10
    sports: [baseball]
    disabled: 축구 경로에서 끈다(§3)
    type: pitcher_state
    needs: []

  - id: IR11
    type: fatigue
    sports: [soccer]
    when: 8일에 3경기 또는 시차 이동이 있을 때
    needs: [schedule]
    claim: "{team} 일정 과부하 — {why}"
    favors: opponent
    goals: none

  - id: IR12
    type: team_stats
    sports: [soccer]
    when: 연승·연패가 이어질 때
    needs: [recent.streak_unbeaten, recent.streak_winless]
    claim: "{team} {streak}"
    favors: subject
    goals: none

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **③ 우리 확률의 이동량**(사용자 지시 2026-10-06(6차) ①)
# ══════════════════════════════════════════════════════════════════
#
# > OurProb = ①②의 `AdjProb` 를 **출발점**으로, ③ 변수 중 ① 이 이미 반영하지 않는
# > 종류만 **로그 오즈**를 움직인다. 이동량 = **변수 무게 × k**, k 는 config(초기 0.15),
# > 한 결과의 총 이동은 **±0.5 로그 오즈** 상한.
# > `strength_gap`·`recent_pattern`·`home_field`·`h2h`·결장 계열(② 가 있을 때)은 이동에
# > 쓰지 않는다.
#
# 🔴 왜 이렇게 바뀌었나 — 종전 우리 열은 **시나리오 무게 비율**이었다. 그 수는 모델이
#    몇 갈래를 썼는지에 흔들렸고(실측: 크로아티아 홈승 26% vs 기준 5% · 시장 10%),
#    ① 이 아는 전력 차를 **아예 버리고** 있었다.
# ⚠️ `k` 는 **우리가 고른 수**다(실측이 아니다) — 초기 0.15 이고, 원장이 쌓이면
#    사용자가 정한다. 🔴 우리가 원장으로 고치지 않는다(CLAUDE.md 의 금지).
our_prob:
  k: 0.15
  cap_logodds: 0.5
  #: 🔴🔴 **이동에 쓰는 유형 — 사용자가 적은 아홉뿐이다**(지시서 ① 원문 그대로)
  #
  #  > ③ 변수 중 ① 이 이미 반영하지 않는 종류(stakes·coach_intent·coach_conflict·
  #  > match_type·fatigue·match_format·individual_title·streak_psych·venue_weather)
  #  > **만** 로그 오즈를 움직인다.
  #
  #  ⚠️ 목록에 **없는 유형은 안 움직인다** — `team_stats`·`regression` 처럼 "① 이
  #     모르는 것 같은데?" 싶은 것도 여기 넣지 않는다(사용자가 안 적었다). 🔴 그
  #     판단은 사용자가 한다(CLAUDE.md: 묻는 곳은 하나다).
  movers: [stakes, coach_intent, coach_conflict, match_type, fatigue,
           match_format, individual_title, streak_psych, venue_weather]
  #: 🔴 **이동에 안 쓰는 유형** — ① 이 이미 머금은 것
  skip: [strength_gap, recent_pattern, home_field, h2h_pattern, h2h]
  #: 🔴 ② 가 **확률을 움직였을 때만** 결장 계열을 뺀다(그때는 ② 가 이미 셌다)
  skip_when_adjusted: [absence, def_absence, absence_att, suspension]
