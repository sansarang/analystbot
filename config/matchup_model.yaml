# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **상성 모형 계수** — 상성 중심 확률 엔진 지시서(2026-10-10 여섯째)
# ══════════════════════════════════════════════════════════════════
#
# > 3-6 **임시 모드**: λ = 리그 평균 × 홈 이점 × exp(**임시 계수** × 표준화된 축 차).
# > 임시 계수는 **config 한 곳**·근거 주석·카드에 🔴 임시.
# > P4 상성 → 확률의 크기는 **과거 경기로 적합**한다. 적합 전에는 "🔴 임시".
#
# 🔴🔴 **지금은 전부 임시값이다 — 적합한 적이 없다**(`fit.provisional: true`).
#    적합하는 길은 `tools/fit_matchup_model.py` 다(지시서 3-5).
# ⚠️ 그래서 카드가 숫자 옆에 **🔴 임시**를 적는다(C10 이 센다).

source: "사용자 지시 2026-10-10(여섯째) S2·S3 — 크기는 적합 전 임시값"
checked_at: "2026-10-10"
fitted_by: "tools/fit_matchup_model.py"

fit: {n: 0, provisional: true,
      why: "적합 못 했다 — 백필(K리그1·J1 두 시즌)이 아직 없다"}

# ══════════════════════════════════════════════════════════════════
# 🔴 축 종합 비중 — 축별 표준화 차를 얼마로 합치나
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ **감으로 정한 수다.** 근거: 네 축이 서로 다른 것을 보고 있으므로 비슷하게
#    두되, **오늘 XI 전력(축0)과 보정 폼(축1)** 이 더 직접적인 재료라 조금 높였다.
#    🔴 적합이 들어오면 이 네 수가 먼저 바뀐다.
weights:
  axis0: 0.30
  axis1: 0.30
  axis2: 0.20
  axis3: 0.20

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **xG 판의 계수** — 사용자 지시 2026-10-12 ③
# ══════════════════════════════════════════════════════════════════
#
# > 계수: β·축 비중은 xG 판·득실 판을 **따로 적합한다. 섞지 않는다.** 적합 전 🔴.
#
# 🔴 그래서 이 블록은 **위 `weights`·`lambda_model` 의 쌍둥이**다. 지금은 두 판이
#    같은 수를 들고 있다 — **그 사실이 임시라는 뜻**이고, 적합이 들어오면 갈린다.
# ⚠️ 값을 여기서 **감으로 다르게 적지 않는다**(#4 추측 금지) — 다르게 적으면
#    "적합했다"는 거짓말이 된다. 갈리는 것은 `tools/fit_matchup_model.py` 가 한다.
xg:
  fit: {n: 0, provisional: true,
        why: "적합 못 했다 — 백필이 없다(xG 판도 같은 백필을 쓴다 · 지시서 2번)"}
  weights:
    axis0: 0.30
    axis1: 0.30
    axis2: 0.20
    axis3: 0.20
  lambda_model:
    beta: 0.25

# ══════════════════════════════════════════════════════════════════
# 🔴 강도 문턱 — 표준화 차의 절댓값
# ══════════════════════════════════════════════════════════════════
strength:
  weak: 0.10
  mid: 0.30
  strong: 0.80

# ══════════════════════════════════════════════════════════════════
# 🔴 축0 — 전력·호흡
# ══════════════════════════════════════════════════════════════════
axis0:
  #: 🔴 가치 로그합의 차를 이 수로 나눠 표준화한다(리그 가치 분포의 대략적 폭)
  scale: 1.0
  #: 🔴 호흡(함께 선발 경기 평균) 한 경기당 더하는 값 — ⚠️ 임시값
  together_weight: 0.05

# ══════════════════════════════════════════════════════════════════
# 🔴 축1 — 보정 폼
# ══════════════════════════════════════════════════════════════════
axis1:
  #: 🔴 득실차/경기 차를 이 수로 나눠 표준화한다(리그 폼 분포 폭 · 임시값)
  scale: 1.5
  #: 🔴🔴 C8 — **선수단 교체 팀의 과거 가중 r**(1.0 이면 안 깎는다 · 임시값)
  turnover_r: 0.5

# ══════════════════════════════════════════════════════════════════
# 🔴 축2 — 전술 상성
# ══════════════════════════════════════════════════════════════════
axis2:
  #: 🔴 발동 규칙 한 건을 표준화 차로 얼마로 보나(임시값)
  per_rule: 0.15
  #: 🔴 꺼진 무기 하나당(임시값)
  per_off_weapon: 0.10

# ══════════════════════════════════════════════════════════════════
# 🔴 축3 — 골 내용
# ══════════════════════════════════════════════════════════════════
axis3:
  per_rule: 0.15

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 S3 — 상성 → λ (임시 모드)
# ══════════════════════════════════════════════════════════════════
#
# > λ = 리그 평균 × 홈 이점 × exp(**임시 계수** × 표준화된 축 차)
#
# ⚠️ `beta` 는 **적합 대상**이다(지시서 3-5 의 β). 지금은 하나의 임시 계수다.
lambda_model:
  #: 🔴 축 종합 차 1.0 이 λ 를 몇 배로 바꾸나 — `exp(beta × gap)`(임시값)
  beta: 0.25
  #: 🔴 홈 이점 — **리그 실측이 없으면 1.0**(다른 대회 숫자를 빌리지 않는다)
  home_mul_default: 1.0
  #: 🔴 한 경기 총 이동 상한(λ 배율) — 상성이 λ 를 이보다 더 못 바꾼다
  cap_pct: 35
