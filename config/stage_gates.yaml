# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v5 §10-4 — 단계 게이트와 배포.** 일곱 칸이고 **사용자가 서명**한다.
# ══════════════════════════════════════════════════════════════════
#
# 지시문 §10-4 가 적은 일곱 단계를 그대로 칸으로 둔다.
#
# ⚠️ `state` 는 네 값뿐이다:
#      `보류`      아직 안 했다 — **하면 된다**
#      `통과`      🔴 **사용자 서명이 있어야** 적을 수 있다(`signed`)
#      `실패`      기준에 대고 재 봤고 못 넘었다
#      `기준상실`  🔴 **견줄 기준이 없다** — 사용자가 새 기준을 주어야 풀린다
#
# 🔴 **내가 통과를 선언하지 않는다**(사용자 지시 2026-09-30:
#    *"이제부터 페이블이 결정할 거는 없다"*). 서명은 사용자다.

gates:
  1:
    what: §8 데이터 모델 · §9-3 계약 커버리지
    criterion: 전 테스트 통과 · 돌연변이 전부 빨강
    # 🔴 이 칸만 **기계가 답한다** — 스위트와 돌연변이가 그 기준이다.
    machine: true
    state: 보류
    why: |
      🔴 스위트는 통과한다(2026-10-04: 1381 통과 · 16 skip · ruff 통과) 그리고
      돌연변이도 이 세션에서 던진 것은 전부 빨개진다. ⚠️ 그런데 **§9-3 커버리지가
      아직 열려 있다**: 조항 27개·M·R 42개가 계약 없이 남았다. 🔴 그래서
      `통과` 가 아니다 — 그 수가 0 이 되거나 사용자가 *"이 정도면 됐다"* 고
      서명할 때 바뀐다.

  2:
    what: §2~§4 에이전트 + 도구
    criterion: 정답지 5경기에서 깔때기 `verified_vars` ≥ 6
    state: 기준상실
    why: |
      🔴🔴 **정답지가 없다** — 사용자 지시 2026-10-02(*"정답지는 지운다"*)와
      결정 C(2026-10-04: `golden_v5.yaml` 은 **방법 예시**다).
      ⚠️ *"정답지 5경기"* 라는 표본이 없으므로 이 게이트는 견줄 것이 없다.
      ✅ 참고로 실측 2026-10-04(밀워키 vs 샌디에이고)에서 `verified_vars` 가
      **6** 이었다 — 🔴 그러나 그것은 **정답지 경기가 아니다.** 한 경기로
      *"통과"* 를 선언하지 않는다.
      🔴 그리고 **§3 도구가 아직 실제 통로에 안 꽂혔다**(카드가 *"도구 미배선"*
      을 적는다) — 그 사실만으로도 이 칸은 통과가 아니다.

  3:
    what: §5 검증층
    criterion: 지어낸 변수 주입 테스트(가짜 quote 10건)가 전부 폐기됨
    state: 보류
    why: |
      ⚠️ 이 게이트는 **정답지가 필요 없다** — 가짜 변수를 우리가 만들어 넣는
      시험이다. 🔴 지금 계약은 **한 건씩** 본다
      (`tests/contracts/test_v5_5_verify.py`) — *"10건 전부"* 를 한 번에 넣는
      주입 시험은 아직 없다. 그것을 만들면 기계가 답할 수 있다.

  4:
    what: 측정 1 — 변수 재현율
    criterion: 유형별 70% / 경기외 유형 50%
    state: 기준상실
    why: |
      🔴🔴 **정답지 변수 목록이 기준이다** — 그것이 없다(결정 C).
      ⚠️ CLAUDE.md 가 이미 적어 둔 충돌이다: *"그 게이트는 기준을 잃었다."*
      🔴 사용자가 *"무엇과 견주나"* 를 새로 정해야 풀린다.

  5:
    what: §6~§7 판정층 · T-60
    criterion: 측정 2 통과(페이블 결론과 나란히)
    state: 기준상실
    why: |
      🔴🔴 같은 까닭이다(**결정 C** · 정답지가 없다) — **페이블 결론이 기준이
      아니다**(사용자 지시
      2026-10-03: *"나는 예시를 준거다 … 0.85는 누가 맞는지는 모른다"*).
      ⚠️ 그 수와 우리 수가 다르면 *"우리가 틀렸다"* 가 아니라 **"둘 다 아직
      모른다"** 다. 맞았는지는 **경기 결과**만 말한다(`ledger`).

  6:
    what: 실전 슬레이트 배포(발송 off)
    criterion: 7일간 카드 생성·채점만 · 계약 위반 0 · 자료 부족 30% 이하 · 비용 하루 $3 이하
    state: 보류
    # 🔴 **수를 글자로만 적지 않는다** — 적으면 아무도 재지 못한다.
    numbers:
      days: 7
      violations_max: 0
      insufficient_max_pct: 30
      # 🔴 사용자 결정 2026-10-05: 하루 상한 **$3 → $5**(월 $40 은 그대로).
      #    ⚠️ 이 칸은 `config/llm.yaml` 의 `per_day_usd` 와 **같은 수**여야
      #       한다 — 계약(M110)이 둘을 대조한다. 사본이 드러난 자리다.
      usd_per_day_max: 5
    why: |
      🔴 아직 **배포하지 않았다**(사용자 지시 없이 배포하지 않는다 ·
      CLAUDE.md). ⚠️ 그리고 `SEND_ENABLED` 는 꺼짐이다(§11-11).
      🔴 `usd_per_day_max` 는 `config/llm.yaml` 의 `per_day_usd` 와 **같은 수**
      여야 한다 — 계약이 그 둘을 대조한다(두 곳이 갈리면 하나가 거짓이다).

  7:
    what: 발송 on — 사용자 승인
    criterion: 사용자가 `.env` 의 `SEND_ENABLED` 를 켠다
    state: 보류
    why: |
      🔴 **사용자만** 켠다(§11-11 · 절대규칙). ⚠️ 계약이 *"발송이 켜져 있는데
      이 칸이 통과가 아니면 실패"* 를 검사한다.

  8:
    what: 원장 30건 → 등급 경계값 재보정 · 카탈로그 `other` 승격 검토
    criterion: 원장 30건이 쌓인 뒤
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **이 칸은 사용자 지시와 정면으로 충돌한다**
    # ══════════════════════════════════════════════════════════════
    state: 기준상실
    why: |
      🔴🔴 사용자 지시 2026-10-02: *"쌓이는거는 우리 로직이 맞냐 틀렸냐만
      **검증하는 방법으로만** 사용한다."* — **원장으로 규칙을 고치지 않는다.**
      ⚠️ 그런데 이 칸은 *"등급 경계값 **재보정**"* 이라고 적혀 있다. 🔴 그
      재보정은 **하지 않는다**(계수를 맞추지도, 문턱을 조정하지도 않는다).
      🔴 **직접 지시가 문서를 이긴다**(CLAUDE.md 첫 줄의 우선순위는 *문서 대
      문서*이고, 사용자 지시는 그보다 위다).
      ✅ 30건이 쌓이면 **검증**을 한다 — *"0.85 라고 한 것이 그 말대로 났나"*.
      그 수로 0.85 를 **옮기지 않는다**. `config/thresholds.yaml` 의
      `verdict_small_at.basis` 에 같은 말이 적혀 있다.
      ⚠️ `카탈로그 other 승격` 은 다른 일이다(새 유형을 세우는 것) — 그것은
      **사용자가 정한다**(규칙 해석도 사용자다 · 지시 2026-09-30).

source: v5 지시문 §10-4 (사용자 문서 2026-10-04 · PDF 15~16쪽)
