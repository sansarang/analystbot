# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v5 §6-2 — 시나리오 세트 자동 보강표**
# ══════════════════════════════════════════════════════════════════
#
# 지시문 §6-2 원문:
#
# > 에이전트 초안(§3-5)을 받아 **코드가 다음을 강제한다.** 하나라도 못 만들면
# > 그 경기는 `scenario_incomplete` 로 **카드 금지.** 시나리오는 **최소 4개**,
# > 각각 `driver_vars`·`mechanism`·`outcomes` 가 비면 무효.
#
# ══════════════════════════════════════════════════════════════════
# 🔴 **왜** — 거짓 1.0 의 뿌리다
# ══════════════════════════════════════════════════════════════════
#
# §6-7: *"생존 1.0 은 **시나리오를 다 만든 뒤**에만 성립한다."*
# ⚠️ 시나리오를 적게 만들면 생존이 **공짜로** 1.0 이 된다 — 죽을 자리가 없으니까.
#    실측 2026-10-02: `2-0` 하나만 있는 경기에서 `언더 2.5` 가 1.0 을 받았다.
#    `2-1` 이 세트에 있으면 그 마켓은 **죽는다.**
# 🔴 그래서 §6-2 는 **반대 시나리오를 코드가 강제로 넣는다.**
#
# ⚠️ `on_missing` 은 두 값뿐이다:
#      `추가` — 코드가 템플릿으로 만들어 넣는다(`added_by: code`)
#      `실패` — 만들 수 없다. 그 경기는 `scenario_incomplete` 다.

#: 🔴 *"시나리오는 최소 4개"*(§6-2 원문). ⚠️ 코드에 박지 않는다.
min_scenarios: 4

#: 🔴 비면 무효인 칸 — §6-2 가 `driver_vars`·`mechanism`·`outcomes` 라 불렀다.
#   ⚠️ 우리 `Draft` 의 칸 이름이 다르다. 그 **대응을 여기 한 번** 적는다(§8-3).
required_fields:
  driver_vars: variables     # 어느 변수가 이 시나리오를 미나
  mechanism: why             # 어떻게 그렇게 되나(한 문장)
  outcomes: scores           # 그래서 어떤 스코어가 나나

forms:
  # ══════════════════════════════════════════════════════════════
  # 🔴 ① 우세팀 실점 동반형 (X-1)
  # ══════════════════════════════════════════════════════════════
  우세팀_실점_동반형:
    when: 우세팀 승 시나리오가 있을 때
    on_missing: 추가
    # 🔴 **항상** 넣는다 — §6-2 가 *"항상 코드가 템플릿으로 추가"* 라고 적었다.
    always: true
    why: |
      🔴 `2-0` 만 있으면 `언더 2.5`·`클린시트` 가 **공짜로** 1.0 을 받는다.
      우세팀이 이기면서 한 점을 주는 꼴을 넣으면 그 마켓이 **죽는다.**
      ⚠️ 실측 2026-10-02 가 이 자리에서 거짓 1.0 을 냈다.
    # 🔴 스코어를 **지어내지 않는다** — 이긴 쪽 점수를 그대로 쓰고 실점 1 을 붙인다
    #    (`2-0` → `2-1`). 그 산수는 코드가 하고 여기는 **모양**만 적는다.
    shape: 이긴_쪽_점수_유지_실점_1

  # ══════════════════════════════════════════════════════════════
  # 🔴 ② 대량득점형
  # ══════════════════════════════════════════════════════════════
  대량득점형:
    when: |
      약팀 수비 결장 2명+ 또는 랭킹 차 50+ 또는 직전 대패(0-3 이상) 또는
      양 팀 연속 득점 폼
    on_missing: 추가
    # 🔴 종목마다 **몇 골부터 대량인가**. §6-2 가 이름으로 댔다.
    thresholds:
      soccer: 4
      baseball: 10
    # ⚠️ 하키는 §6-2 가 말하지 않았다 — **지어내지 않는다**(그 종목은 안 건다).
    triggers:
      absence_count: 2        # 약팀 수비 결장 2명+
      rank_gap: 50            # 랭킹 차 50+
      last_loss_margin: 3     # 직전 대패(0-3 이상)
      both_scoring_streak: true
    why: |
      🔴 §6-7 이 *"대량득점형 부재"* 를 거짓 1.0 의 조건으로 **이름으로 댔다** —
      오버 쪽이 죽을 자리가 없으면 언더가 공짜로 산다.

  # ══════════════════════════════════════════════════════════════
  # 🔴 ③ 회귀 반전형 — **둘 다** 넣는다
  # ══════════════════════════════════════════════════════════════
  회귀_반전형:
    when: regression 변수가 있을 때
    on_missing: 추가
    # 🔴 §6-2 원문 *"지속형·반전형 둘 다 추가"*. ⚠️ 하나만 넣으면 그 방향이
    #    **공짜로** 살아남는다.
    both: [지속형, 반전형]
    # 🔴🔴 **`regression` 은 §4 에 없다**(실측 2026-10-04) — 그래서 이 줄은
    #    **한 번도 발동하지 않는다.** ⚠️ 그 사실을 `trigger_conditions.yaml` 의
    #    `unmapped` 에 이름으로 적었다. 🔴 지어내 만들지 않는다(방향 규칙·검색
    #    템플릿까지 지어내야 한다 · #4 추측 금지).
    types: [regression]
    why: |
      회귀는 *"지금 흐름이 평균으로 돌아온다"* 는 말이고, 그 자체로 **어느
      방향인지 말하지 않는다.** 🔴 한쪽만 그리면 우리가 방향을 고른 것이 된다.

  # ══════════════════════════════════════════════════════════════
  # 🔴 ④ 핸디 ±N.5 대응형
  # ══════════════════════════════════════════════════════════════
  핸디_대응형:
    when: 후보 핸디가 ±N.5 면 상대가 N+1 차로 이기는 시나리오
    on_missing: 추가
    why: |
      🔴 `±1.5` 의 반대는 *"상대가 **2점 차**로 이긴다"* 다 — 1점 차가 아니다.
      ⚠️ 그 시나리오가 없으면 `+1.5` 가 죽을 자리가 없어 1.0 을 받는다.

  # ══════════════════════════════════════════════════════════════
  # 🔴 ⑤ 반대 방향 — **실패**다(추가가 아니다)
  # ══════════════════════════════════════════════════════════════
  반대_방향:
    when: 전부 같은 방향이면
    on_missing: 실패
    why: |
      🔴 반대 방향 시나리오는 **지어낼 수 없다** — 근거가 되는 변수가 없으면
      그것은 우리가 만든 이야기다. ⚠️ 그래서 §5-c-6 이 *"STEP 3 으로 되돌려
      반대 변수를 다시 찾는다"* 라고 적었다. 그 경기는 자료 부족이다.

  # ══════════════════════════════════════════════════════════════
  # 🔴 ⑥ 양방향 변수 — **두 시나리오에 모두** 부착
  # ══════════════════════════════════════════════════════════════
  양방향_변수:
    when: coach_crisis·event_match·lineup_rotation 은 두 시나리오에 모두 부착
    on_missing: 실패
    # 🔴 **우리 §4 이름**으로 적는다(실측 2026-10-04):
    #      지시문 `coach_crisis`    → `coach_conflict`
    #      지시문 `lineup_rotation` → `squad_rotation`
    #      지시문 `event_match`     → 같다
    #    ⚠️ 지시문 이름을 그대로 두면 **세 줄 중 둘이 조용히 죽는다**(#3).
    #       그 대응은 `config/trigger_conditions.yaml` 의 `v5_names` 가 들고 있다.
    types: [coach_conflict, event_match, squad_rotation]
    why: |
      ⚠️ 한쪽에만 붙이면 그 변수가 **한 방향 근거**가 된다. 양방향 변수는 어느
      쪽으로 갈지 **모르는** 변수이고(`variable_types.yaml` 이 *"양방향 — 코드가
      한쪽으로 정하지 못하면 미결정"* 이라 적었다), 그래서 양쪽 시나리오를
      다 흔들어야 한다.
      🔴 못 붙이면 **실패**다 — 억지로 한쪽에 붙이면 거짓 근거가 된다.

  # ══════════════════════════════════════════════════════════════
  # 🔴 ⑦ 90분 무승부형 — **경기 형식이 단판일 때만**
  # ══════════════════════════════════════════════════════════════
  #
  # 인도네시아–태국 지시서 §3-3 (2026-10-05):
  #
  # > `final_single`·`knockout_single`·`knockout_two_leg_1st` 이면 **90분
  # > 무승부(0-0·1-1) 시나리오 필수.** … 🔴 이 필수형은 v5 §6-2 **자동 보강
  # > 목록에 추가**하고, DeepSeek 단계 3 의 `required_types` 입력에도 넣는다.
  #
  # ⚠️ 이 줄은 **조건부**다 — 그래서 `when_formats` 가 있다. 리그 경기에
  #    *"90분 무승부를 반드시 넣어라"* 를 DeepSeek 에 내리면 거짓 필수형이 된다.
  # 🔴 형식 목록·스코어를 **여기 베끼지 않는다** — `config/scenario_rules.yaml`
  #    의 `draw_90` 하나가 원본이고 `scenarios.draw_formats()` 가 읽는다(#1).
  90분_무승부형:
    when: match_format 이 draw_90.formats 에 있을 때(단판 결승·단판 토너먼트·1차전)
    on_missing: 추가
    when_formats: draw_90        # 🔴 가리킨다 — 목록은 `scenario_rules.draw_90`
    why: |
      🔴 단판은 90분 무승부가 **갈래**다 — 연장·승부차기로 간다. 그 갈래가
      없으면 `언더`·`무승부` 마켓이 **공짜로** 산다(난타전 §6-7 과 같은 결의
      구멍이다).
      ⚠️ 실사고 it7(인도네시아–태국 결승): 경기 페이지가 `roundName: final` 을
      명시했는데 수집기가 그 칸에 `None` 을 박아 둬서 형식이 `unknown` 이었고,
      이 필수형이 **한 번도 발동하지 못했다.**
      🔴 마켓 대입은 **90분 기준**이다 — 연장 득점은 그 마켓에 들어가지 않는다.

source: v5 지시문 §6-2 표 (사용자 문서 2026-10-04 · PDF 11쪽)
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **축구 필수형**(축구 완성 지시서 §3) — 조건이 맞으면 반드시 있다
# ══════════════════════════════════════════════════════════════════
#
# > 우세 쪽 실점 동반(우세 방향이 있을 때) · 대량득점(양 팀 보정 평균 합 3+ 또는
# > 한쪽 결장 hard 3+) · 저득점·0-0(IR01·IR04·IR07 발동 또는 친선 아님 & 한쪽이
# > 비기면 충분한 동기) · 90분 무승부(IR07) · 회귀반전(IR06·IR12) · 난타전(보정 평균 합 4+)
#
# ⚠️ 위 `forms` 와 **겹치는 줄**(우세 실점·대량득점·90분 무승부)은 거기 조건을 쓰고,
#    여기서는 **축구에서 달라지는 문턱**만 적는다(사본 금지 · 한 곳만 고치면 되게).
soccer_forms:
  대량득점형:
    trimmed_sum_at: 3.0        # 🔴 양 팀 보정 평균 합
    absence_hard_at: 3         # 🔴 한쪽 결장 `hard` 변수 개수
  난타전:
    trimmed_sum_at: 4.0
    scores: ["3-2", "2-3"]
  저득점:
    #: 🔴 IR01(5백)·IR04(이상치)·IR07(단판) 중 하나가 발동하면 저득점 갈래를 넣는다
    when_rules: [IR01, IR04, IR07]
    scores: ["0-0", "1-0", "0-1"]
  회귀반전:
    when_rules: [IR06, IR12]
    #: ⚠️ 스코어는 **방향을 고르지 않는다** — 양쪽을 넣는다(§6-2 ③ 과 같은 까닭)
    scores: ["2-1", "1-2"]
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **무승부 필수**(사용자 지시 2026-10-06(5차) ① · v4 `soccer_lock` 의 일)
  # ══════════════════════════════════════════════════════════════════
  #
  # > 축구 시나리오 세트에 **무승부(0-0 또는 1-1) 갈래가 하나도 없으면** 코드가
  # > 보강한다. 무게는 `[보강]` 기본값, **근거 변수가 있으면 그 무게.**
  #
  # 🔴 왜 — 무승부 갈래가 없으면 `무`·`더블찬스`·`언더` 가 **공짜로** 생존 0 또는 1 을
  #    받는다. ⚠️ 실측 2026-10-06 온두라스–자메이카: 우리 열 무승부가 **0%** 였다.
  # ⚠️ 축구만이다(야구·농구는 무승부가 없다 · §0 범위).
  무승부:
    scores: ["1-1", "0-0"]
    #: 🔴 근거 변수가 있으면 그 무게를 쓴다 — **그 유형들**이 무승부를 가리킨다
    basis_types: [match_type, h2h_pattern, def_absence, absence_att, fatigue]
