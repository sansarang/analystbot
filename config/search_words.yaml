# 현지 낱말표 — **사다리의 `{local_word_*}` 자리**(사용자 기술 지시 2026-10-03)
#
# ══════════════════════════════════════════════════════════════════
# 🔴 왜 이 파일이 생겼나
# ══════════════════════════════════════════════════════════════════
#
# 사용자가 준 검색 사다리:
#
# ```
# LADDER = ["{team} vs {opp} preview team news",        # ① 일반
#           "{alias_local} {opp} {local_word_xi}",      # ② 현지어+별칭
#           "{coach} {opp} {local_word_presser}",       # ③ 감독 회견
#           "{alias} {local_word_injury} site:{outlet}"]# ④ 현지 매체 지정
# ```
#
# ⚠️ 별칭만 넣어서는 안 된다 — 실측 2026-10-03: 파라과이 별칭 `Albirroja` 를 `es` 로
#    선언했는데 **`es` 템플릿이 하나도 없어** 그 별칭이 한 번도 안 던져졌다.
# 🔴 유형마다 언어마다 템플릿을 적으면 **곱셈으로 늘어난다**(유형 19 × 언어 4). 그래서
#    *개념*(결장·선발·회견 …)을 한 번 적고, 유형이 그 개념을 **가리킨다**
#    (`variable_types.yaml` 의 `word:`). 사본이 안 생긴다.
#
# ══════════════════════════════════════════════════════════════════
# 🔴 여기 적는 것은 **낱말 번역**이다 — 사실이 아니다
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ 팀 별칭·감독 이름은 **사실**이라 지어내면 안 되지만(그래서 `entities.yaml` 은
#    사용자가 준 것만 담는다), *"결장"* 의 스페인어가 `lesión` 인 것은 **사전**이다.
# 🔴 그래도 **검색으로 듣는지는 실측으로 고친다** — 여기 적은 것이 0건을 내면 그
#    낱말을 바꾼다. 그 사실이 사유에 남는다(각도마다 결과 수를 적는다).

words:
  # 선발 라인업 — ② `{local_word_xi}`
  xi:
    en: [starting lineup, team news, predicted lineup]
    es: [alineación, once inicial, alineaciones probables]
    ja: [スタメン, 先発メンバー, 予想スタメン]
    ko: [선발 라인업, 선발 명단, 예상 라인업]
    zh: [首发阵容, 先發名單]

  # 감독 회견 — ③ `{local_word_presser}`
  presser:
    en: [press conference, said, pre-match]
    es: [rueda de prensa, conferencia de prensa, declaraciones]
    ja: [会見, 監督 コメント, 試合前 会見]
    ko: [기자회견, 감독 인터뷰, 경기 전 발언]
    zh: [新闻发布会, 赛前 发布会]

  # 결장·부상 — ④ `{local_word_injury}`
  injury:
    en: [injury news, out injured, unavailable]
    es: [lesión, baja, lesionado, bajas confirmadas]
    ja: [欠場, 故障者, 離脱, 登録抹消]
    ko: [결장, 부상, 명단 제외]
    zh: [缺陣, 傷兵, 傷停]

  # 로테이션·교체
  rotation:
    en: [rotation, squad rotation, changes to lineup]
    es: [rotación, rotaciones, cambios en el once]
    ja: [ローテーション, スタメン 変更, 休養]
    ko: [로테이션, 선발 변경, 휴식]
    zh: [輪換, 陣容 調整]

  # 은퇴·행사 경기
  farewell:
    en: [retirement ceremony, farewell match, testimonial]
    es: [despedida, retiro, partido homenaje]
    ja: [引退試合, 引退登板, 引退セレモニー]
    ko: [은퇴 경기, 은퇴식]
    zh: [引退 比賽, 退役 儀式]

  # 대표팀 차출·복귀
  national:
    en: [called up, national team return, international duty]
    es: [convocatoria, convocado, regreso a la selección]
    ja: [代表 招集, 代表 復帰, 日本代表 合流]
    ko: [대표팀 차출, 대표팀 복귀, 소집]
    zh: [國家隊 徵召, 歸隊]

  # 갈등·이탈
  conflict:
    en: [leaves camp, row with coach, dropped]
    es: [abandona la concentración, enfrentamiento con el técnico]
    ja: [退団, 不仲, 離脱]
    ko: [갈등, 캠프 이탈, 결별]
    zh: [矛盾, 離隊]

  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **라운드 이름** — 사용자 결정 ⑤ (2026-10-04)
  # ══════════════════════════════════════════════════════════════════
  #
  # > 라운드 이름(`NLDS`·`ALDS`·`Wild Card`·`CS`·`日本シリーズ`·`準決勝`·
  # > `결승`·`Final`)을 **대회 별칭 표에 데이터로** 넣는다. **코드 분기가
  # > 아니라 설정 한 칸이다.** — 사용자 결정 ⑤
  #
  # ⚠️ 왜 — 게이트2 2판에서 거부된 질의 셋이 **전부 `NLDS` 를 들고 있었다**:
  #
  #     🔴 2 ['team','when']  Brewers NLDS Game 1 win Oct 3 2026 …
  #     🔴 2 ['team','when']  Milwaukee Brewers NLDS Game 2 2026 preview …
  #     🔴 2 ['team','when']  Milwaukee Brewers Game 2 NLDS starting pitcher …
  #
  #   §4-1 의 **대회 축**이 `game["league"]`(= `MLB`) **한 글자**만 비교해서
  #   `NLDS` 를 못 셌다. 🔴 라운드는 대회를 **좁히는** 말이므로 대회로 센다.
  #
  # 🔴 **사용자가 이름을 댄 것만** 적는다(내가 고른 것이 아니다 · 지시 2026-09-30).
  #    ⚠️ 여기 없는 라운드(`ALCS`·`한국시리즈`…)는 **안 센다** — 늘릴 때도
  #       사용자가 정한다. 그것이 *"설정 한 칸"* 의 뜻이다.
  round:
    en: [NLDS, ALDS, Wild Card, CS, Final]
    ja: [日本シリーズ, 準決勝]
    ko: [결승]

  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **종목 낱말** — 사용자 수정 ① (2026-10-04)
  # ══════════════════════════════════════════════════════════════════
  #
  # > 검색어 구성 규칙: `{팀} {상대} {대회명} {종목 낱말} {날짜}` — **나라 이름
  # > 하나짜리 검색어는 계약으로 금지.** 종목 낱말은 어댑터 `SPORT` 에서.
  #
  # ⚠️ 왜 필요한가 — 클럽은 이름 자체가 종목을 뜻하지만(`Kashiwa Reysol`)
  #    **대표팀은 나라 이름**이다. 실측 2026-10-04:
  #
  #      `Scotland lineup Oct 3`  → rottentomatoes **드라마 출연진** · rugby.com.au
  #      `North Macedonia lineup` → 위키 경제·국기·SMS 판매·법률 사무소
  #
  # 🔴 실측으로 고른 낱말이다(2026-10-04 · 영어 48~53건 중 스포츠 매체 비율):
  #
  #      팀+what+날짜              ✅ 20/48
  #      +상대                     ✅ 25/51   (+25%)
  #      +상대+종목 `football`      ✅ 31/52   🔴 **가장 좋다**
  #      +상대+종목+대회+날짜(9낱말) ✅ 19/51   ⚠️ **나빠진다**(§12-b 6낱말 상한이 맞다)
  #
  # ⚠️ `soccer` 가 아니라 `football` 이다 — 영국·유럽 매체가 그 글자를 쓴다.
  #    🔴 미국 매체는 `soccer` 를 쓰므로 **둘 다 적는다**(호출부가 첫 것을 쓴다).
  # ══════════════════════════════════════════════════════════════
  # 🔴 **사용자 지시 2026-10-06 ③** — 새 유형 셋이 쓸 개념 낱말
  #    (`docs/fable/decisions/2026-10-06_user_decisions.md`)
  # ══════════════════════════════════════════════════════════════
  #: `individual_title` — 개인 기록·타이틀 경쟁
  title:
    en: [record, milestone, golden boot]
    es: [récord, pichichi]
    ja: [記録, タイトル]
    ko: [기록, 타이틀]
    zh: [纪录]
  #: `team_stats`·`regression` — 팀 수치·흐름
  stats:
    en: [form, stats, run]
    es: [racha, estadísticas]
    ja: [成績, 連勝]
    ko: [성적, 연승]
    zh: [战绩]
  #: `fatigue` — 피로·체력(축구는 `pitcher_state` 가 없다)
  fatigue:
    en: [fatigue, tired, workload]
    es: [fatiga, cansancio]
    ja: [疲労]
    ko: [피로, 체력]
    zh: [疲劳]
  # ══════════════════════════════════════════════════════════════
  # 🔴🔴 **팀 등급 낱말**(사용자 지시 2026-10-06(4차) ①-a)
  # ══════════════════════════════════════════════════════════════
  #
  # > 축구 대표팀이면 **A대표/U-23/아시안게임/올림픽/여자/청소년**을 구분하는 낱말을
  # > `search_words` 에 두고, 경기 팀과 **다른 등급 낱말이 주어로 쓰인 문단은 버린다**
  # > (사유 `team_tier_mismatch`).
  #
  # ⚠️ 실측 2026-10-06: A대표 친선 카드에 *"한국 남자축구 4연속 금메달"*(아시안게임)
  #    기사가 변수로 들어왔다 — 같은 나라지만 **다른 팀**이다.
  # 🔴 `senior` 는 **기본값**이다 — 다른 등급 낱말이 없으면 A대표로 본다.
  team_tier:
    senior:
      en: [senior, "a-team", "full international"]
      ko: [A대표, 성인대표, 국가대표팀]
      es: ["selección absoluta"]
    u23:
      en: [u23, "u-23", under-23, olympic team]
      ko: [U-23, U23, 23세, 올림픽대표]
      es: [sub-23]
    asiad:
      en: [asian games, asiad]
      ko: [아시안게임, 아시아경기]
      ja: [アジア大会]
    olympic:
      en: [olympic, olympics]
      ko: [올림픽]
    women:
      en: [women, women's, female]
      ko: [여자, 여성]
      es: [femenina, femenino]
    youth:
      en: [u20, "u-20", u17, "u-17", youth, junior]
      ko: [U-20, U20, U-17, U17, 청소년, 유소년]
      es: [sub-20, sub-17, juvenil]

  sport:
    soccer:
      en: [football, soccer]
      es: [fútbol]
      ja: [サッカー]
      ko: [축구]
      zh: [足球]
      mk: [фудбал]
      hr: [nogomet]
      sr: [фудбал]
    baseball:
      en: [baseball]
      ja: [野球]
      ko: [야구]
      zh: [棒球]
    hockey:
      en: [hockey, NHL]
      ko: [아이스하키]

  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **새 사실(72시간) 개념 낱말** — 사용자 지시 2026-10-10(재작성) §3-1
  # ══════════════════════════════════════════════════════════════════
  #
  # > 개념 낱말(search_words.yaml): 복귀·합류·전역·부상·결장·출전 정지·경고
  # > 누적·대표팀 차출·로테이션·기자회견·감독 발언·징크스·원정 강세·직전 대회
  # > 일정(컵·대륙 대회) / 復帰・合流・離脱・欠場・出場停止・会見・スタメン /
  # > return·injured·suspended·ruled out·press conference / กลับมา·บาดเจ็บ·แบน /
  # > 复出·伤停·停赛·首发 / regresa·lesionado·suspendido.
  #
  # ⚠️ **지시서가 준 낱말을 그대로** 적었다 — 늘리는 것은 실측으로 한다.
  # 🔴 유형은 `variable_types.yaml` 의 `word:` 로 이 개념을 **가리킨다**(사본 금지).

  # 복귀·합류·전역 — `returning`
  returning:
    ko: [복귀, 합류, 전역, 제대, 복귀 선발]
    en: [return, returns, back from injury, available again]
    ja: [復帰, 合流]
    th: [กลับมา]
    zh: [复出, 回归]
    es: [regresa, regreso, vuelve]

  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **선수단 교체(전역·이적·방출)** — 사용자 지시 2026-10-10(지적 ③)
  # ══════════════════════════════════════════════════════════════════
  #
  # > 어느 팀이든 평소 XI 대비 7자리 이상 바뀌고 빠진 선수가 명단에도 없으면
  # > `squad_turnover` 의심으로 **새 사실 검색(이적·전역·징계)**.
  #
  # 🔴 `returning` 과 **방향이 반대**다 — 그쪽은 *"돌아왔다"*, 이쪽은 *"떠났다"*.
  #    ⚠️ 김천상무처럼 **전역으로 빠진** 선수는 `returning` 질의로는 안 걸린다
  #       (그 기사는 **상대 팀**의 복귀 기사다 · 실측 2026-10-10).
  squad_turnover:
    ko: [전역, 입대, 소집 해제, 이적, 방출, 임대 복귀]
    en: [discharged, military service, transfer, released, loan ended]
    ja: [兵役, 移籍, 退団, 満了]
    th: [ย้ายทีม, ปลดประจำการ]
    zh: [退役, 转会, 解约]
    es: [traspaso, cedido, baja]

  # 출전 정지·경고 누적 — `suspension`
  suspension:
    ko: [출전 정지, 경고 누적, 퇴장, 징계]
    en: [suspended, suspension, booking ban, red card ban]
    ja: [出場停止, 警告累積]
    th: [แบน, ใบแดง]
    zh: [停赛, 累计黄牌]
    es: [suspendido, sancionado]

  # 결장·이탈 — `absence` (위 `injury` 와 **다른 개념이 아니다**: 72시간 창의
  # ⚠️ 같은 낱말을 또 적지 않고, 지시서가 새로 준 언어만 더한다)
  absence72:
    ko: [결장, 이탈, 부상]
    en: [ruled out, injured, out injured, doubt]
    ja: [離脱, 欠場]
    th: [บาดเจ็บ]
    zh: [伤停]
    es: [lesionado, baja]

  # 직전 대회 일정(컵·대륙 대회) — `schedule_load`
  schedule_load:
    ko: [컵대회, 대륙 대회, 원정 일정, 휴식일]
    en: [cup tie, continental, midweek, days rest, travel]
    ja: [カップ戦, 連戦, 中3日]
    th: [ถ้วย]
    zh: [杯赛, 连续作战]
    es: [copa, calendario]

  # 징크스·원정 강세(특정 구장·원정 기록) — `venue_record`
  venue_record:
    ko: [원정 강세, 원정 징크스, 홈 강세, 상대 전적 구장]
    en: [away record, home record, at this stadium, unbeaten at]
    ja: [アウェー成績, ホーム成績]
    th: [สถิติเยือน]
    zh: [客场战绩, 主场战绩]
    es: [como visitante, racha fuera]

