# 검색 라우팅 — **어느 엔진에 묻고, 어느 페이지를 먼저 여나**
#
# ══════════════════════════════════════════════════════════════════
# 🔴 왜 이 파일이 생겼나 — 라이브가 요구했다 (실측 2026-10-02)
# ══════════════════════════════════════════════════════════════════
#
# 소프트뱅크–치바롯데를 돌렸더니 봇이 **본문으로 연 페이지**가 이것이었다:
#
#     15회  marines.co.jp/              구단 홈 첫 화면
#      6회  npb.jp/bis/teams/index_h.html
#      4회  viagogo 티켓 판매
#      3회  npb.jp/junior/2020/roster_h.html   ← 2020년 주니어 명단
#      3회  keisei.co.jp/…/aimVbKAC.pdf        ← 케이세이 전철 PDF
#      1회씩 temu · trulia(부동산) · monster(이력서) · pixiv · youtube
#
#   🔴 **기사 0건.** LLM 을 17번 불러 채택 0건이었다 — 전철 시간표에 타순은 없다.
#
# 원인 둘을 실측으로 갈랐다:
#
#   ① 🔴 **엔진을 지정하지 않았다.** `engines=google news` 로 지정하니 사람이 읽은
#      기사가 그대로 나왔다(4개 질의 4/4):
#        `ソフトバンク 小久保 ベストメンバー` → hochi·nishispo·news.yahoo
#        `角中勝也 引退試合 ロッテ`          → news.yahoo·nikkansports·daily·DAZN
#        `唐川侑己 引退登板`                → news.yahoo·sponichi·daily·jiji
#        `ロッテ ソフトバンク スタメン`       → nikkansports …202610020000866(당일)
#   ② 🔴 **`yahoo` 엔진이 질의를 무시한다**(bing 과 같은 병). 재현 둘:
#        `ロッテ スタメン 発表`           → whatdistrictamiin·ballotpedia(미 선거구)
#        `Chiba Lotte Marines lineup`  → economyoutlet.com 쇼핑몰 5연속
#      살아 있는 엔진 중 결과를 가장 많이 내던 것이 이것이다 — 쓰레기의 출처였다.
#      → `config/searxng/settings.yml` 에서 끈다(bing 과 같은 처분).
#
# ⚠️ `time_range: day` 는 **쓰지 않는다** — 실측 0건이다(google news 가 그 칸을
#    안 받는다). 날짜는 질의 낱말(`10月2日`)과 §12-c 검증기가 본다.
# ══════════════════════════════════════════════════════════════════

# 🔴 **산문(기사) 질문은 뉴스 엔진으로 먼저 쏜다.**
#    ⚠️ 0건이면 코드가 **엔진 지정 없이 한 번 더** 던진다(대체, 우회가 아니다).
#       그래서 이 목록이 좁아도 검색 경로가 죽지 않는다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 실측 갱신 2026-10-05 — `google news` 가 **죽었다**
# ══════════════════════════════════════════════════════════════════
#
#  질의 `ロッテ 西武 スタメン 2026`(ja) 를 엔진별로 던져 세었다:
#
#    google news   🔴 **0건**        (종전 표가 1순위로 적던 엔진)
#    duckduckgo    🔴 0건
#    bing          ⚠️ 10건 → 두 번째 호출에서 0건(불안정)
#    startpage     ✅ 30건
#    mojeek        ✅ 30건
#    지정 없이     ✅ 40건
#
#  ⚠️ **날짜 있는 결과는 전부 0건이었다** — `startpage`·`mojeek` 은 발행 시각을
#     주지 않는다. 🔴 `google news` 가 날짜를 주던 **유일한** 엔진이고, 그것이
#     죽은 동안 당일성은 **Bing 뉴스 RSS · GDELT** 두 통로에만 의존한다.
#  🔴 그래도 `google news` 를 **지우지 않는다** — 이 저장소의 실측은 엔진이
#     *"하루 만에 뒤집힌다"* 고 적는다(2026-10-01 ↔ 10-02). 살아 있는 것을
#     **함께** 적어 0건일 때 바로 다음으로 가게 한다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 `time_range` 지원 — **실측 2026-10-05** (사용자 지시 ①층)
# ══════════════════════════════════════════════════════════════════
#
# | 엔진 | `time_range` 없음 | `week` | 판정 |
# |---|---|---|---|
# | `google news` | 0건 | 0건 | 🔴 **dead** — 창과 무관하게 안 낸다 |
# | `startpage` | 30건 | ✅ **3건** | 창을 **받는다**(좁힌다) |
# | `mojeek` | 30건 | ✅ **3건** | 창을 **받는다** |
# | `bing` | 10→0건 | 0건 | ⚠️ 불안정 |
# | `duckduckgo` | 0건 | 0건 | 🔴 dead |
# | 지정 없이 | 30건 | ✅ 3건 | 창을 받는다 |
#
# 영어 질의(같은 날): `week` 가 45→10건 · 35→15건 — **쓸 만하다.**
# ⚠️ **모든 조합에서 `publishedDate` 0건** — 창은 좁히지만 날짜를 주지 않는다.
#    🔴 그래서 날짜는 ②층(fetch 전 거름)·③층(`htmldate`)이 만든다.
# ⚠️ `time_range: day` 는 여전히 **쓰지 않는다**(실측 0건).
#
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **2026-10-10 재측정 — 위 표가 뒤집혔다**
# ══════════════════════════════════════════════════════════════════
#
# 같은 SearXNG(127.0.0.1:8888)에 같은 질의를 던져 쟀다:
#
# | 질의 | `week` | `month` | 창 없음 |
# |---|---|---|---|
# | `Gimcheon Sangmu FC Anyang rotation`(영어) | 🔴 **0건** | 1건 | ✅ **15건** |
# | `김천 안양 결장`(한국어) | ✅ 15건 | — | ✅ 15건 |
#
# 🔴 즉 **영어 질의에서 `week` 가 질의를 통째로 죽인다**(10-05 에는 3건이었다).
#    ⚠️ 봇은 퇴로(창 벗기고 재던지기)로 복구하지만 **검색 호출을 두 배로** 쓴다 —
#       하위당 상한이 3회이므로 그 낭비가 문서 수를 그대로 깎는다.
#    🔴 그래서 **기본을 끈다**(`time_range_default: ""`). 신선도는 이미
#       `datehint.too_old`(②층)와 하위별 창(F 72시간 · 나머지 7일)이 지킨다.
#    ⚠️ 코드 상수가 아니라 **이 칸**이 그 값을 든다 — 다음에 또 뒤집히면 여기만
#       고친다(#1 사본 금지).
time_range_default: ""
#: 🔴 창을 걸었을 때 **이보다 적으면 얄팍하다**(퇴로가 돈다)
time_range_thin_at: 2

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **2026-10-10 엔진 재측정 — `naver` 를 넣는다**
# ══════════════════════════════════════════════════════════════════
#
# 같은 질의(`Gimcheon Sangmu FC Anyang`)를 엔진마다 하나씩 던져 쟀다:
#
# | 엔진 | 결과 | 판정 |
# |---|---|---|
# | `startpage` | **35건** | ✅ 가장 좋다 |
# | `mojeek` | 15건 | ✅ |
# | **`naver`** | **15건** | 🔴🔴 **한국 경기에 결정적** — 아래를 보라 |
# | `yahoo` | 10건 | 🔴 **질의를 무시한다**(우버이츠·인스타카트가 왔다 — 10-02 와 같은 병) |
# | `google news` | 0건 | 🔴 `Suspended: access denied` |
# | `bing` | 0건 | 🔴 `HTTP connection error` |
# | `duckduckgo`·`brave` | 0건 | 🔴 정지 |
#
# 🔴 **`naver` 를 왜 넣나** — `김천 안양 선발` 로 던졌더니 **그 경기 기사**를 줬다:
#     · `김천상무, '이상헌 선발 복귀'로 안양전 승점 3점 쟁취한다!`(**구단 공식**
#       `gimcheonfc.com`)
#     · `'라인업 변화 꾀했다' 안양, … 선발 명단 발표`(**구단 공식** `fc-anyang.com`)
#     · `[GOAL LIVE] 조나탄 vs 조규성, 안양-김천 선발 라인업 발표`(goal.com)
#    ⚠️ 즉 **라인업 사다리의 `article` 칸이 기다렸던 출처**다(K리그 공식 XHR 은
#       경기 전 선발을 안 준다 — `config/lineup_sources.yaml` 실측).
# ⚠️ `yahoo` 는 **넣지 않는다** — 10-02 에 껐던 그 병이 그대로다(질의 무시).
# 🔴 죽은 셋(`google news`·`bing`·`duckduckgo`)은 **지우지 않는다** — 이 저장소의
#    실측이 *"엔진은 하루 만에 뒤집힌다"* 고 적는다. 살아 있는 것을 **앞에** 둔다.
news_engines: [startpage, mojeek, naver, google news]

