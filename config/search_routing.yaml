# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **스포츠가 아닌 호스트** — 사용자 수정 ③ (2026-10-04)
# ══════════════════════════════════════════════════════════════════
#
# > 도메인 등급표: 스포츠 매체·협회·구단 공식만 본문을 받는다. rottentomatoes·
# > tripadvisor·법률·SMS 류는 **거부 목록**.
#
# ⚠️ `late_hosts`(뒤로 미룸)로는 못 막는다 — 열기 예산이 20이면 **결국 연다.**
#    실측 2026-10-04(북마케도니아 vs 스코틀랜드): 이 호스트들을 **76건** 열었고
#    그것이 LLM 60초 예산을 다 먹어 진짜 프리뷰에 **0초**가 남았다.
#
# 🔴 **실제로 열린 것만 적는다**(그 로그가 근거다 · 추측으로 늘리지 않는다).
not_sport_hosts:
  - rottentomatoes.com   # 🔴 질의 `Scotland lineup` → 드라마 **출연진**(8건)
  - imdb.com             #    같은 꼴 — `lineup`·`cast` 가 겹친다
  - tripadvisor.com      # 스코페 호스텔 후기
  - booking.com
  - expedia.
  - 5sim.net             # SMS 번호 판매 — `countries/northmacedonia`
  - smsfast.com
  - telfa.law            # 법률 사무소 — `juridictions/north-macedonia`
  - aljazeera.com        # ⚠️ 뉴스지만 **나라 기사**다(스포츠 섹션이 아니다)
  - reuters.com/world    # 나이트클럽 화재 기사가 왔다
  - nytimes.com/travel

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **타종목 낱말** — 같은 나라가 여러 종목을 한다
# ══════════════════════════════════════════════════════════════════
#
# > 스포츠 도메인이라도 종목이 다르면(rugby.com.au) 제목에 football/soccer 가
# > 없으면 버린다.
#
# ⚠️ 실측: `Scotland lineup` 이 럭비를 **15건** 끌어왔다 —
#      rugby.com.au/wallabies · florugby.com/…scotland-vs-england-lineups ·
#      skysports.com/rugby-league/australia-vs-scotland ·
#      bbc.com/sport/rugby-union/… · scottishrugby.org ·
#      en.wikipedia.org/wiki/Scotland_national_rugby_union_team
#
# 🔴 **그 경기 종목이 아닌 낱말이 주소·제목에 있으면 버린다.** ⚠️ 그 경기 종목의
#    낱말이 **함께** 있으면 버리지 않는다(`football` 과 `rugby` 를 같이 적은
#    종합 매체 기사가 있다).
# ⚠️ 종목을 **모르면 막지 않는다** — `queries.asks` 와 같은 처분이다.
other_sport_words:
  soccer:   [rugby, cricket, netball, "basketball", "ice-hockey", "/tv/", formula-1]
  baseball: [rugby, cricket, soccer-, football/, basketball]
  hockey:   [rugby, cricket, soccer-, baseball/]
