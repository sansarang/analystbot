# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **출처 등급표** — 호스트로 층을 매긴다 (사용자 기술 지시 2026-10-03 · 기술 5)
# ══════════════════════════════════════════════════════════════════
#
# > 출처 등급도 매긴다. **협회·구단 공식 > 전국지 > 현지지 > 통신 재전재 > 베팅 팁
# > 사이트.** 오늘 엘살바도르 경기에서 인도네시아 예측 사이트가 "후안 페레스 5골"
# > 같은 **존재하지 않는 선수**를 썼다. 나는 그걸 버렸다. 봇은 팁 사이트를 최하
# > 등급으로 두고 **단독으로는 사실로 안 쓴다**.
#
# ⚠️ 층 상수(`verify.TIER_*`)는 **전부터 있었다** — 그런데 **소스가 선언한 층**을
#    그대로 썼다. 즉 검색으로 나온 기사는 **전부 같은 층**이었고, 인도네시아 팁
#    사이트와 전국지가 **구분되지 않았다**(실측 2026-10-03).
# 🔴 그래서 **호스트로** 매긴다. 여기 없는 호스트는 **그 소스가 선언한 층**으로 간다
#    (모르는 것을 최하로 떨어뜨리지 않는다 — 그러면 멀쩡한 현지지가 죽는다).
#
# 층 번호는 `app/verify.py` 가 원본이다(여기 숫자를 적지 않는다):
#   1 OFFICIAL  협회·리그·구단 공식
#   2 PRIMARY   1차 매체(전국지·통신·현지 스포츠지)
#   3 PREVIEW   프리뷰·집계 사이트 — 라인업 확인용만
#   4 FORECAST  예측·팁 사이트 — 🔴 **판정 입력 금지**
