# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **리그별 현지 매체 표** — 사용자 지시 2026-10-17
# ══════════════════════════════════════════════════════════════════
#
# > 매체 표 구현하고 … **우선 일본 매체표만** 해봐라
#
# 🔴 **왜 생겼나 — 실측 2026-10-17(세 경기)**
#    질의 68개로 검색 결과 **1,913건**을 긁어 **기사 변수 2개**를 얻었다.
#    가장 큰 손실은 ④ **신원**이다 — 가시마 **749건** · 세레소 283건이
#    *"이 경기 글이 아니다"* 로 떨어졌다(날짜에서 193~211건 더).
#    즉 검문이 센 것이 아니라 **엔진이 그 경기 글을 못 찾는다**.
#    ⚠️ 그 와중에 `site:soccer-king.jp セレッソ大阪 日程` 은 **28건**을 줬다
#       (⑤-b3 2단이 던진 질의 · 같은 실행에서 나온 수다).
# 🔴 그래서 **그 나라 매체로 먼저 좁힌다** — 질의 글자는 그대로 두고 `site:`
#    만 붙인다(새 엔진·새 fetch 경로를 만들지 않는다).
#
# ══════════════════════════════════════════════════════════════════
# ⚠️ **이 표는 사람이 고친다**(§13-7)
# ══════════════════════════════════════════════════════════════════
#
# 🔴 코드에 매체를 박지 않는다 — CLAUDE.md 가 *"엔진 품질을 코드에 박지
#    않는다"* 고 적은 그 결이다(엔진이 하루 만에 뒤집힌 실측이 있다).
# 🔴 **호스트만** 적는다(`https://`·경로 금지) — `querywriter.hosts` 가 꼴을
#    검사하고 `check_hosts` 가 **robots 를 받아 실재를 확인**한 뒤에만 쓴다(#4).
# ⚠️ 못 적은 리그는 **빈 목록**이다 — 그러면 `site:` 를 안 붙이고 종전처럼
#    돈다(없는 매체로 좁혀 0건을 만들지 않는다 · #3 사유를 카드에 적는다).
#
#: 🔴 한 경기에서 `site:` 로 쓸 **매체 수 상한** — robots 를 그만큼만 받는다
max_hosts: 4

