# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **전술 상성 규칙** — 사용자 지시 2026-10-10(셋째)
# ══════════════════════════════════════════════════════════════════
#
# > 상대성 매칭 규칙 — 내 골 프로필을 상대의 같은 축 약점에 맞춘다
# > (`config/tactical_rules.yaml` 에 **근거와 함께**)
#
# 🔴 **근거 없는 규칙 금지**(금지 첫 줄) — 규칙마다 `why`(왜 그런가)와 `fit`
#    (표본·효과·신뢰구간·로그손실 개선)을 둔다. `fit` 칸이 없으면 **쓰지 않는다**.
# 🔴 **적합 없는 계수는 임시값 표시 필수** — `fit.provisional: true` 이면 카드가
#    `🔴 임시값(적합 전)` 을 적는다.
# ⚠️ 적합 도구는 `tools/fit_tactical_rules.py` 다 — 표본이 모자라면 **적지 않고
#    멈춘다**(지어낸 수 금지).

source: "규칙과 방향은 사용자 지시 2026-10-10(셋째) §3-3 · 크기는 적합 전 임시값"
checked_at: "2026-10-10"
fitted_by: "tools/fit_tactical_rules.py"

# ══════════════════════════════════════════════════════════════════
# 🔴 **골 유형 어휘** — fotmob 이 실제로 주는 값(실측 2026-10-10 · 43골)
# ══════════════════════════════════════════════════════════════════
#
# 🔴 **지어내지 않았다** — 네 팀(강원·부천·가시마·FC도쿄)의 최근 끝난 경기에서
#    골 43개를 받아 값을 셌다:
#      `situation`: RegularPlay 14 · None 18 · FastBreak 5 · Penalty 2 ·
#                   ThrowInSetPiece 2 · FromCorner 1 · SetPiece 1
#      `shotType` : RightFoot 13 · None 18 · LeftFoot 7 · Header 5
# ⚠️ **`None` 이 42%** 다 — 그 골들은 `shotmapEvent` 가 아예 없다(하위 리그·오래된
#    경기). 🔴 그때는 `goalDescription`(`Penalty`·`Own goal`)만 보고 나머지는
#    **`미상`** 으로 둔다(0 으로 메우지 않는다 · #3).
kinds:
  open:      [RegularPlay]
  counter:   [FastBreak]
  setpiece:  [FromCorner, SetPiece, ThrowInSetPiece, SetPieceOther]
  penalty:   [Penalty]
  # 🔴 자책골은 `situation` 이 아니라 `ownGoal`·`isOwnGoal` 칸이 말한다
  own_goal_fields: [ownGoal, isOwnGoal]
  header_shot: [Header]

# 🔴 §3-1 — *"운 섞인 골"* 의 기준(지시서가 적은 수)
luck:
  #: 🔴 지시서 원문 — *"낮은 xG 슈팅(예: 0.05 미만)"*
  low_xg: 0.05
  #: 🔴 자책골·PK 는 xG 와 무관하게 운 요소다
  kinds: [penalty, own_goal]

# 🔴 §3-2 — 시간대 구간(지시서가 준 셋)
buckets:
  - {key: "0-30", from: 0, to: 30}
  - {key: "31-60", from: 31, to: 60}
  - {key: "61-90+", from: 61, to: 200}

# 🔴 §3-4 — 표본 처리
sample:
  #: 🔴 *"기준(예: 해당 유형 골 5개) 미만이면 '관찰만'(확률 미반영)"*
  min_goals: 5
  #: 🔴 *"최근 10경기와 시즌 전체를 최근 가중으로 섞고"* — 최근 쪽 무게
  recent_weight: 0.6
  recent_matches: 10
  #: 🔴 *"리그 평균으로 수축"* — 수축 강도(가짜 표본 수)
  shrink_k: 10

# ══════════════════════════════════════════════════════════════════
# 🔴 T9~T13 — §3-3 이 글자로 준 규칙들
# ══════════════════════════════════════════════════════════════════
#
# 칸 뜻: `when` 은 사람이 읽는 발동 조건(코드가 그 수를 센다) ·
#        `effect` 는 이동량 · `fit` 은 표본·검증·임시값 여부.
rules:
  T9:
    name: "세트피스 의존 ↔ 상대 세트피스 실점"
    when: "내 득점 중 세트피스 비중이 리그 평균보다 높고, 상대 실점 중 세트피스 비중도 높다"
    why: |
      세트피스는 상대의 조직 수비를 우회한다 — 그래서 '세트피스로 넣는 팀'과
      '세트피스로 먹는 팀'이 만나면 그 경로가 그대로 열린다. 🔴 지시서 §3-3 T9.
    effect: {lambda_own: 0.08}
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 리그 전체 골 타임라인을 쌓아 둔 자리가 없다"}

  T10:
    name: "후반 득점 ↔ 상대 후반 실점·일정 피로"
    when: "내 득점의 61분 이후 비중이 높고, 상대의 61분 이후 실점 비중이 높거나 상대가 7일 3경기·이틀 휴식이다"
    why: |
      후반 득점은 체력·교체 우위의 결과다(지시서 §3-2). 상대의 후반 실점이 많거나
      일정이 빽빽하면 그 구간이 더 열린다. 🔴 지시서 §3-3 T10.
    effect: {lambda_own_late: 0.12}
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 구간별 득점률을 적합할 표본이 없다"}

  T11:
    name: "리드 유지력 낮음 ↔ 상대 추격력 높음"
    when: "내가 선제골 후 역전패한 비율이 높고, 상대가 선실점 후 역전승·무승부 비율이 높다"
    why: |
      '선취 후 역전패'는 리드 상황의 운영 실패다 — 추격력 높은 상대와 만나면
      무승부·역전 쪽으로 분포가 퍼진다. 🔴 지시서 §3-3 T11.
    effect: {draw_logodds: 0.12, own_win_logodds: -0.08}
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 경기 흐름(선제골 후 결과) 표본이 없다"}

  T12:
    name: "운 요소 골 할인"
    when: "내 득점 중 자책골·PK·낮은 xG(0.05 미만) 비중이 크다 / 실점 쪽도 같다"
    why: |
      운 섞인 골은 되풀이되지 않는다 — 그 비중이 크면 공격 폼이 **실제보다 좋게**
      보였다. 실점 쪽이면 수비가 **실제보다 나쁘게** 보였다. 🔴 지시서 §3-3 T12
      이고 §1(축1)이 그 할인을 폼에 반영한다.
    effect: {form_attack_discount: 0.5, form_defense_credit: 0.5}
    fit: {n: 0, provisional: true,
          why: "할인 비율(0.5)이 임시값이다 — xG 대비 득점 회귀로 적합해야 한다"}

  T13:
    name: "헤더·크로스 의존 ↔ 상대 공중볼 약점"
    when: "내 득점 중 헤더 비중이 높고, 상대 오늘 XI 센터백의 공중볼 승률이 하위다"
    why: |
      제공권은 센터백 개인 능력에 크게 달렸다 — 오늘 XI 가 바뀌면 그 약점이
      생기거나 사라진다. 🔴 지시서 §3-3 T13.
    effect: {lambda_own: 0.07}
    #: 🔴 **자료가 없으면 아예 안 돈다**(지시서 원문: *"자료 있는 리그만"*)
    needs: [aerial_duel_win_pct]
    fit: {n: 0, provisional: true,
          why: "🔴 공중볼 승률을 받는 통로가 없다 — 이 규칙은 **안 돈다**"}

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **축2 — 스타일 프로필 6축**(사용자 지시 2026-10-10(셋째) §2)
# ══════════════════════════════════════════════════════════════════
#
# > 스타일 프로필(6축) + 오늘 XI 변화로 "A의 무기 → B의 약점", "B의 무기 → A의
# > 약점" 두 방향을 각각 판정(규칙 T1~T8).
#
# 🔴 **재료는 경기 페이지 통계다**(robots 허용 HTML) — 실측 2026-10-10
#    (강원–부천): `content.stats.Periods.All.stats` 에 **28칸**이 있었다.
#    ⚠️ `key` 를 코드에 박지 않는다 — 받은 글자를 **여기** 적는다(실측 목록):
#      blocked_shots · clearances · corners · dribbles_succeeded · duel_won ·
#      expected_goals · expected_goals_non_penalty · expected_goals_on_target ·
#      expected_goals_open_play · expected_goals_set_play · fouls ·
#      ground_duels_won · interceptions · keeper_saves · long_balls_accurate ·
#      matchstats.headers.tackles · opposition_half_passes · own_half_passes ·
#      passes · player_throws · red_cards · shot_blocks · shots_inside_box ·
#      shots_outside_box · shots_woodwork · total_shots · touches_opp_box ·
#      yellow_cards
#    🔴 `BallPossesion` 은 이 경기에서 안 왔다 — `opposition_half_passes ÷
#       passes` 로 **전진성**을 대신 센다(점유율을 지어내지 않는다).
#    🔴 **`aerials_won` 이 있다** — T13(공중볼 약점)이 그것을 기다렸다.
#      ⚠️ 이 경기 표에는 안 보였다(그룹에는 있었다) — 받는 경기마다 다르므로
#         **없으면 그 축을 비운다**(0 으로 메우지 않는다).

style:
  #: 🔴 6축 — 각 축은 `{키: 무게}` 의 합을 `per`(분모 키)로 나눈 비율이다.
  #  ⚠️ 축 이름은 사람이 읽을 말이고, 수는 **받은 칸**에서만 나온다.
  axes:
    # ① 전진성 — 상대 진영에서 공을 얼마나 돌리나
    forward:
      num: {opposition_half_passes: 1.0}
      per: passes
      why: "상대 진영 패스 비중 — 점유율이 안 오는 경기가 있어 이것으로 센다"
    # ② 박스 침투 — 상대 박스 안 터치
    box_entry:
      num: {touches_opp_box: 1.0}
      per: total_shots
      why: "슈팅 하나당 박스 터치 — 높으면 박스 안에서 만들어 쏜다"
    # ③ 롱볼·크로스 — 직선적인가
    direct:
      num: {long_balls_accurate: 1.0, accurate_crosses: 1.0}
      per: passes
      why: "정확한 롱볼·크로스 비중 — 높으면 직선적이고 제공권 싸움이 많다"
    # ④ 압박 — 🔴🔴 **PPDA 대리 지표**(사용자 결정 2026-10-12 ②)
    #    ⚠️ PPDA 자체는 **어디서도 못 받는다** — fotmob 168항목에 없고
    #       Understat 은 `robots: Disallow: /`(전면 금지 · 실측 2026-10-12)다.
    #    🔴 그래서 *"상대 패스 몇 개마다 한 번 끊나"* 를 그대로 흉내 낸다 —
    #       분자는 **우리** 태클+인터셉트, 분모는 **상대** 정확 패스다.
    #    ⚠️ 종전엔 분모가 **우리** 패스였다(`per: passes`) — 그러면 우리가 공을
    #       덜 돌린 경기에서 압박이 올라가는 거짓 수가 된다.
    press:
      num: {"matchstats.headers.tackles": 1.0, interceptions: 1.0}
      per: accurate_passes
      per_side: opponent
      why: "(태클+인터셉트) ÷ **상대** 정확 패스 — PPDA 대리 지표(값이 클수록 압박)"
    # ⑤ 블록 깊이 — 🔴🔴 **허용 슈팅의 위치**(지시서 2026-10-12 ②)
    #    🔴 깊게 선 팀은 상대를 **박스 밖에서** 쏘게 만든다. 그래서 상대가 쏜
    #       슈팅 중 **박스 밖 비중**이 깊이의 증거다(걷어내기 수는 점유율에 흔들렸다).
    low_block:
      num: {shots_outside_box: 1.0}
      num_side: opponent
      per: total_shots
      per_side: opponent
      why: "상대 슈팅 중 **박스 밖** 비중 — 높으면 박스를 닫고 밖에서 쏘게 했다"
    # ⑥ 세트피스 비중 — xG 중 세트플레이 몫
    setpiece:
      num: {expected_goals_set_play: 1.0}
      per: expected_goals
      why: "세트플레이 xG 비중 — 축3 의 세트피스 득점 비중과 짝이다"

  #: 🔴 공중볼 — T13 이 쓴다(없으면 그 규칙은 **안 돈다**)
  aerial_key: aerials_won
  #: 🔴 §2 — 몇 경기를 섞나(축1·축3 과 같은 10경기)
  back: 10

# ══════════════════════════════════════════════════════════════════
# 🔴 T1~T8 — §2 가 *"규칙 T1~T8"* 이라고만 적었다
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ **지시서가 T1~T8 의 내용을 주지 않았다** — T9~T13 은 글자로 줬다.
# 🔴 그래서 **지어내지 않고**, §2 가 말한 꼴(*"A의 무기 → B의 약점"*)을 위 6축으로
#    짝지은 **대칭 규칙 여섯**만 둔다. 이름은 T1~T6 으로 붙이고, 빈 T7·T8 은
#    **비워 둔다**(사용자가 그 둘을 주면 여기 적는다).
# 🔴 방향은 *"내 축이 높고 상대의 **짝 축**이 낮으면 내 무기가 열린다"* 하나다.
#    ⚠️ 크기는 전부 **임시값**이다.
matchups:
  T1: {mine: forward,   theirs: press,     effect: {lambda_own: 0.06},
       why: "상대 진영에서 돌리는 팀 ↔ 끊지 못하는 상대 → 공격이 자리를 잡는다"}
  T2: {mine: direct,    theirs: aerial,    effect: {lambda_own: 0.07},
       why: "롱볼·크로스 팀 ↔ 공중볼 약한 상대 → 그 경로가 그대로 열린다"}
  T3: {mine: box_entry, theirs: low_block, effect: {lambda_own: 0.05},
       why: "박스 안에서 만드는 팀 ↔ 깊게 서지 못하는 상대"}
  T4: {mine: press,     theirs: forward,   effect: {lambda_own: 0.05},
       why: "많이 끊는 팀 ↔ 상대 진영에서 돌리려는 상대 → 역습 기회가 늘어난다"}
  T5: {mine: setpiece,  theirs: aerial,    effect: {lambda_own: 0.06},
       why: "세트플레이 xG 가 큰 팀 ↔ 공중볼 약한 상대(축3 T9 와 짝이다)"}
  T6: {mine: low_block, theirs: box_entry, effect: {lambda_opp: -0.06},
       why: "깊게 서는 팀 ↔ 박스 안에서 만들어야 하는 상대 → 상대 λ 를 깎는다"}
  # T7·T8 — 🔴 **비워 둔다**(지시서가 내용을 주지 않았다 · 지어내지 않는다)

matchup_fit: {n: 0, provisional: true,
              why: "적합 못 했다 — 리그 전체 경기 통계를 쌓아 둔 자리가 없다"}
#: 🔴 발동 문턱 — 내 축이 상대 짝 축보다 이 비율 이상 높아야 한다(임시값)
matchup_gap: 0.25
