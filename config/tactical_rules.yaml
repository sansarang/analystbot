# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **전술 상성 규칙** — 사용자 지시 2026-10-10(셋째)
# ══════════════════════════════════════════════════════════════════
#
# > 상대성 매칭 규칙 — 내 골 프로필을 상대의 같은 축 약점에 맞춘다
# > (`config/tactical_rules.yaml` 에 **근거와 함께**)
#
# 🔴 **근거 없는 규칙 금지**(금지 첫 줄) — 규칙마다 `why`(왜 그런가)와 `fit`
#    (표본·효과·신뢰구간·로그손실 개선)을 둔다. `fit` 칸이 없으면 **쓰지 않는다**.
# 🔴 **적합 없는 계수는 임시값 표시 필수** — `fit.provisional: true` 이면 카드가
#    `🔴 임시값(적합 전)` 을 적는다.
# ⚠️ 적합 도구는 `tools/fit_tactical_rules.py` 다 — 표본이 모자라면 **적지 않고
#    멈춘다**(지어낸 수 금지).

source: "규칙과 방향은 사용자 지시 2026-10-10(셋째) §3-3 · 크기는 적합 전 임시값"
checked_at: "2026-10-10"
fitted_by: "tools/fit_tactical_rules.py"

# ══════════════════════════════════════════════════════════════════
# 🔴 **골 유형 어휘** — fotmob 이 실제로 주는 값(실측 2026-10-10 · 43골)
# ══════════════════════════════════════════════════════════════════
#
# 🔴 **지어내지 않았다** — 네 팀(강원·부천·가시마·FC도쿄)의 최근 끝난 경기에서
#    골 43개를 받아 값을 셌다:
#      `situation`: RegularPlay 14 · None 18 · FastBreak 5 · Penalty 2 ·
#                   ThrowInSetPiece 2 · FromCorner 1 · SetPiece 1
#      `shotType` : RightFoot 13 · None 18 · LeftFoot 7 · Header 5
# ⚠️ **`None` 이 42%** 다 — 그 골들은 `shotmapEvent` 가 아예 없다(하위 리그·오래된
#    경기). 🔴 그때는 `goalDescription`(`Penalty`·`Own goal`)만 보고 나머지는
#    **`미상`** 으로 둔다(0 으로 메우지 않는다 · #3).
kinds:
  open:      [RegularPlay]
  counter:   [FastBreak]
  setpiece:  [FromCorner, SetPiece, ThrowInSetPiece, SetPieceOther]
  penalty:   [Penalty]
  # 🔴 자책골은 `situation` 이 아니라 `ownGoal`·`isOwnGoal` 칸이 말한다
  own_goal_fields: [ownGoal, isOwnGoal]
  header_shot: [Header]

# 🔴 §3-1 — *"운 섞인 골"* 의 기준(지시서가 적은 수)
luck:
  #: 🔴 지시서 원문 — *"낮은 xG 슈팅(예: 0.05 미만)"*
  low_xg: 0.05
  #: 🔴 자책골·PK 는 xG 와 무관하게 운 요소다
  kinds: [penalty, own_goal]

# 🔴 §3-2 — 시간대 구간(지시서가 준 셋)
buckets:
  - {key: "0-30", from: 0, to: 30}
  - {key: "31-60", from: 31, to: 60}
  - {key: "61-90+", from: 61, to: 200}

# 🔴 §3-4 — 표본 처리
sample:
  #: 🔴 *"기준(예: 해당 유형 골 5개) 미만이면 '관찰만'(확률 미반영)"*
  min_goals: 5
  #: 🔴 *"최근 10경기와 시즌 전체를 최근 가중으로 섞고"* — 최근 쪽 무게
  recent_weight: 0.6
  recent_matches: 10
  #: 🔴 *"리그 평균으로 수축"* — 수축 강도(가짜 표본 수)
  shrink_k: 10

# ══════════════════════════════════════════════════════════════════
# 🔴 T9~T13 — §3-3 이 글자로 준 규칙들
# ══════════════════════════════════════════════════════════════════
#
# 칸 뜻: `when` 은 사람이 읽는 발동 조건(코드가 그 수를 센다) ·
#        `effect` 는 이동량 · `fit` 은 표본·검증·임시값 여부.
rules:
  T9:
    name: "세트피스 의존 ↔ 상대 세트피스 실점"
    when: "내 득점 중 세트피스 비중이 리그 평균보다 높고, 상대 실점 중 세트피스 비중도 높다"
    why: |
      세트피스는 상대의 조직 수비를 우회한다 — 그래서 '세트피스로 넣는 팀'과
      '세트피스로 먹는 팀'이 만나면 그 경로가 그대로 열린다. 🔴 지시서 §3-3 T9.
    effect: {lambda_own: 0.08}
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 리그 전체 골 타임라인을 쌓아 둔 자리가 없다"}

  T10:
    name: "후반 득점 ↔ 상대 후반 실점·일정 피로"
    when: "내 득점의 61분 이후 비중이 높고, 상대의 61분 이후 실점 비중이 높거나 상대가 7일 3경기·이틀 휴식이다"
    why: |
      후반 득점은 체력·교체 우위의 결과다(지시서 §3-2). 상대의 후반 실점이 많거나
      일정이 빽빽하면 그 구간이 더 열린다. 🔴 지시서 §3-3 T10.
    effect: {lambda_own_late: 0.12}
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 구간별 득점률을 적합할 표본이 없다"}

  T11:
    name: "리드 유지력 낮음 ↔ 상대 추격력 높음"
    when: "내가 선제골 후 역전패한 비율이 높고, 상대가 선실점 후 역전승·무승부 비율이 높다"
    why: |
      '선취 후 역전패'는 리드 상황의 운영 실패다 — 추격력 높은 상대와 만나면
      무승부·역전 쪽으로 분포가 퍼진다. 🔴 지시서 §3-3 T11.
    effect: {draw_logodds: 0.12, own_win_logodds: -0.08}
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 경기 흐름(선제골 후 결과) 표본이 없다"}

  T12:
    name: "운 요소 골 할인"
    when: "내 득점 중 자책골·PK·낮은 xG(0.05 미만) 비중이 크다 / 실점 쪽도 같다"
    why: |
      운 섞인 골은 되풀이되지 않는다 — 그 비중이 크면 공격 폼이 **실제보다 좋게**
      보였다. 실점 쪽이면 수비가 **실제보다 나쁘게** 보였다. 🔴 지시서 §3-3 T12
      이고 §1(축1)이 그 할인을 폼에 반영한다.
    effect: {form_attack_discount: 0.5, form_defense_credit: 0.5}
    fit: {n: 0, provisional: true,
          why: "할인 비율(0.5)이 임시값이다 — xG 대비 득점 회귀로 적합해야 한다"}

  T13:
    name: "헤더·크로스 의존 ↔ 상대 공중볼 약점"
    when: "내 득점 중 헤더 비중이 높고, 상대 오늘 XI 센터백의 공중볼 승률이 하위다"
    why: |
      제공권은 센터백 개인 능력에 크게 달렸다 — 오늘 XI 가 바뀌면 그 약점이
      생기거나 사라진다. 🔴 지시서 §3-3 T13.
    effect: {lambda_own: 0.07}
    #: 🔴 **자료가 없으면 아예 안 돈다**(지시서 원문: *"자료 있는 리그만"*)
    needs: [aerial_duel_win_pct]
    fit: {n: 0, provisional: true,
          why: "🔴 공중볼 승률을 받는 통로가 없다 — 이 규칙은 **안 돈다**"}
