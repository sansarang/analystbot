# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **네 리그 54팀 이름표** — 명단 API 가 열에서 자르는 자리(사용자 지시 2026-10-04)
# ══════════════════════════════════════════════════════════════════
#
# > ② "잘린 명단"은 fotmob 에 기대지 마라. 문제의 리그가 J1 20·K리그1 12·NPB 12·
# > KBO 10 — 합쳐 **54개 팀**이다. 한국어·현지어·영어 세 줄짜리 YAML 을 손으로
# > 쓰면 한 시간이고, **시즌 중엔 안 바뀐다.** 명단 API 를 고치려고 호스트를 더
# > 붙이는 것보다 이게 **더 정확하고 더 빠르다.**
#
# ⚠️ 왜 필요한가 — 실측 2026-10-03: `search_all_teams.php?l=…` 가 **열 팀에서
#    자른다**(J1 은 20팀). 그래서 `비셀 고베`·`대구`·`마치다` 가 안 풀렸다.
#
# ══════════════════════════════════════════════════════════════════
# 🔴 어디서 받았나 — **지어낸 이름이 없다**
# ══════════════════════════════════════════════════════════════════
#
#   ja / en (J리그)  : www.jleague.jp/club/ · /en/club/ 의 `aria-label` (실조회 2026-10-04)
#   ja     (NPB)    : npb.jp/bis/2026/stats/std_{p,c}.html 의 `alt` (실조회 2026-10-04)
#   en     (NPB)    : app/bot/aliases.py 의 표기 사전(Odds API 표기 · 실조회 2026-08-26)
#   en/ko  (KBO)    : app/collect/kbo.py `TEAM_IDS` + aliases.py 표기 사전
#   ko             : 🔴 **손으로 적었다**(사용자 승인 2026-10-04). 음차 표기다.
#   en     (K리그1)  : TheSportsDB 명단 + 손 보완 — ⚠️ 아래 `k1_note` 를 보라
#
# 🔴 **시즌이 바뀌면 여기를 고친다.** 승강이 있는 리그(J1·K리그1)는 해마다 바뀐다.
#    ⚠️ 그 사실을 적어 두는 것이 이 파일의 절반이다 — 안 적으면 다음 시즌에
#       **조용히 틀린 명단**으로 돈다.
