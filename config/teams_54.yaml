# ══════════════════════════════════════════════════════════════════
# 🔴 K리그1 — **공식에서 다시 받았다**(사용자 지적 2026-10-04)
# ══════════════════════════════════════════════════════════════════
#
# > `kleague.com` 은 *"못 읽었다"* 가 아니라 **"따라가지 않았다"** 다. 301 이면
# > 리다이렉트 **끝 호스트**의 robots.txt 를 읽어야 한다. 404 면 `npb.jp` 에
# > 적용한 규칙(robots 없음 → 허용)을 **똑같이** 적용해야 한다. 한 호스트는 404 를
# > 허용으로, 다른 호스트는 못 읽음으로 두면 **규칙이 둘이다.**
#
# 🔴 따라갔다: `kleague.com/robots.txt` → **301** → `www.kleague.com/robots.txt`
#    → **404**. `npb.jp/robots.txt` 도 **404** 다 — **같은 판정(허용)** 이다.
#
# 🔴 그래서 공식에서 받았고, **손으로 적은 것이 틀렸다**:
#      손으로:  수원FC · 전남 드래곤즈 · 대구 FC   ← 🔴 2026 K리그1 에 없다
#      공식:    인천 유나이티드 · 부천 FC 1995 · FC 안양
#    ⚠️ 이것이 *"받아서 확인하지 않으면 조용히 틀린다"* 의 실례다.
k1_note: kleague.com 공식 순위표에서 받음(2026-10-04) — 믿음 꼬리표 **뗐다**

# ══════════════════════════════════════════════════════════════════
# 🔴 네 리그의 robots 판정 (실조회 2026-10-04 · 원문)
# ══════════════════════════════════════════════════════════════════
#
#   www.jleague.jp        http 200  Disallow: /en/photo/ · /jtk/ …  ✅ 클럽 목록 허용
#   npb.jp                robots **404**(없음)              ✅ 허용으로 본다
#   www.koreabaseball.com http 200  🔴 머리글에 **"사전 승인 없이 자동 수집·
