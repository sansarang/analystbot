# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **리그별 자체 Elo 설정** — 사용자 승인 2026-10-06(5차) ③
# ══════════════════════════════════════════════════════════════════
#
# > football-data.org 과거 결과로 리그별 **자체 Elo** 를 계산해 저장(하루 1회 갱신),
# > 같은 순서형 로짓을 리그 경기로 적합. **clubelo 칸은 dead 로 둔다.**
#
# 🔴 손으로 고른 수는 **둘뿐**이다(`k`·`start`). 그 둘은 축구 Elo 의 통용값이고,
#    차이만 뜻을 가지므로 시작값은 모든 팀이 같다.
# ⚠️ **홈 보정은 여기 없다** — ① 의 로짓이 홈 개최 경기로만 적합돼 절단점이 그것을
#    머금고 있다. 두 번 세면 홈 쪽으로 기운다.

k: 20
start: 1500

#: 🔴 받을 시즌 — 많을수록 등급이 안정되지만 요청이 는다(무료 티어 분당 10회)
#   ⚠️ football-data 무료 티어는 **그 시즌 전체**를 한 번에 준다(실측: 380경기).
seasons: ["2024", "2025", "2026"]

#: 🔴 대회 코드 — `config/leagues.yaml` 의 `teams_from: fdorg:*` 와 같은 코드다
competitions: [PL, PD, SA, BL1, FL1, DED, PPL, ELC, BSA]

#: 🔴 **대회명 → 코드**(`comp_kind` 가 읽는다 · 승인 ③). ⚠️ 출처마다 이름이 다르다
names:
  PL: ["premier league", "epl", "프리미어"]
  PD: ["la liga", "laliga", "primera división", "라리가"]
  SA: ["serie a", "세리에"]
  BL1: ["bundesliga", "분데스리가"]
  FL1: ["ligue 1", "리그앙", "리그 1"]
  DED: ["eredivisie", "에레디비시"]
  PPL: ["primeira liga", "프리메이라"]
  ELC: ["championship", "챔피언십"]
  BSA: ["série a - brazil", "brasileir", "브라질"]
  CL: ["champions league", "챔피언스리그"]
  # ⚠️ 아래는 **football-data 가 안 주는 리그**다(자체 Elo 를 못 만든다) — 그래도
  #    `comp_kind` 가 **대회 유형 열쇠**를 짧게 만들 수 있게 이름만 적는다.
  #    🔴 그 열쇠로 홈 이점 표(`S03.defaults`)를 찾는다 — MLS 실측값이 거기 있다.
  MLS: ["major league soccer", "mls"]
  # 🔴🔴 **fotmob 결과로 Elo 를 굴리는 리그**(사용자 지시 2026-10-09 ③).
  #    ⚠️ football-data 는 이 둘을 **안 준다**(실측 404) — 아래 `fotmob:` 표가
  #       대신 받는다. 코드는 그 표의 열쇠와 **같아야 한다**.
  KL1: ["k league 1", "k-league 1", "k리그1", "k리그 1"]
  # 🔴 `jpn.1` 은 **ESPN 의 대회 슬러그**다 — 받아서 확인했다(2026-10-09:
  #    `espn.com/soccer/match/_/gameId/401877610` 본문이 `J1 League` 라고 적는다).
  #    ⚠️ 실사고: 이 별칭이 없어 카시마–감바 카드가 `league:jpn.1` 로 떨어졌고
  #       **방금 만든 J1 자체 Elo 가 쓰이지 않았다**(기준 없음으로 나갔다).
  J1: ["j. league", "j1 league", "j1리그", "j리그1", "jpn.1"]

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **fotmob 결과로 굴리는 리그** — 사용자 지시 2026-10-09 ③
# ══════════════════════════════════════════════════════════════════
#
# > K리그1·J1 자체 Elo: football-data 에 **없는 리그**는 fotmob 경기 결과로
# > 자체 Elo 를 굴린다.
#
# 🔴 왜 — football-data 무료 티어는 유럽·브라질만 준다(실측: K리그·J리그 404).
#    그런데 fotmob 리그 페이지는 `fixtures.allMatches` 로 **그 시즌 전체**를
#    스코어와 함께 준다(실측 2026-10-09: K리그1 2026 198경기·끝난 180 ·
#    2025 228경기 전부). 결과가 있으면 Elo 는 **계산할 수 있다**.
# ⚠️ `k`·`start` 는 위 football-data 리그와 **같은 값**을 쓴다 — 리그마다 다른
#    수를 고르면 그 수를 우리가 재지 않은 것이 된다.
# 🔴 `id`·`slug` 는 fotmob 주소의 조각이고 **받아서 확인한 값**이다(2026-10-09):
#    K리그1 `9080/k-league-1` → `leagueName: "K League 1"` ·
#    J1    `223/j-league`    → `leagueName: "J. League"`.
# ⚠️ 실사고: 처음에 J1 을 `9134` 로 **추측해** 적었는데 그 번호는 **NWSL** 이었다.
#    🔴 번호는 경기 페이지의 `content.table.parentLeagueId` 에서 읽는다(CLAUDE.md #4).
fotmob:
  seasons: ["2024", "2025", "2026"]
  competitions:
    KL1:
      id: 9080
      slug: k-league-1
      name: K League 1
    J1:
      id: 223
      slug: j-league
      name: J. League
