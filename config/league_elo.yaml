# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **리그별 자체 Elo 설정** — 사용자 승인 2026-10-06(5차) ③
# ══════════════════════════════════════════════════════════════════
#
# > football-data.org 과거 결과로 리그별 **자체 Elo** 를 계산해 저장(하루 1회 갱신),
# > 같은 순서형 로짓을 리그 경기로 적합. **clubelo 칸은 dead 로 둔다.**
#
# 🔴 손으로 고른 수는 **둘뿐**이다(`k`·`start`). 그 둘은 축구 Elo 의 통용값이고,
#    차이만 뜻을 가지므로 시작값은 모든 팀이 같다.
# ⚠️ **홈 보정은 여기 없다** — ① 의 로짓이 홈 개최 경기로만 적합돼 절단점이 그것을
#    머금고 있다. 두 번 세면 홈 쪽으로 기운다.

k: 20
start: 1500

#: 🔴 받을 시즌 — 많을수록 등급이 안정되지만 요청이 는다(무료 티어 분당 10회)
#   ⚠️ football-data 무료 티어는 **그 시즌 전체**를 한 번에 준다(실측: 380경기).
seasons: ["2024", "2025", "2026"]

#: 🔴 대회 코드 — `config/leagues.yaml` 의 `teams_from: fdorg:*` 와 같은 코드다
competitions: [PL, PD, SA, BL1, FL1, DED, PPL, ELC, BSA]

#: 🔴 **대회명 → 코드**(`comp_kind` 가 읽는다 · 승인 ③). ⚠️ 출처마다 이름이 다르다
names:
  PL: ["premier league", "epl", "프리미어"]
  PD: ["la liga", "laliga", "primera división", "라리가"]
  SA: ["serie a", "세리에"]
  BL1: ["bundesliga", "분데스리가"]
  FL1: ["ligue 1", "리그앙", "리그 1"]
  DED: ["eredivisie", "에레디비시"]
  PPL: ["primeira liga", "프리메이라"]
  ELC: ["championship", "챔피언십"]
  BSA: ["série a - brazil", "brasileir", "브라질"]
  CL: ["champions league", "챔피언스리그"]
