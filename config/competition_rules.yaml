# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **대회별 순위 결정 순서와 구역의 뜻** — 사용자 지시 2026-10-06(7차) §1
# ══════════════════════════════════════════════════════════════════
#
# > 동률 규칙: 대회별(UEFA NL·CONCACAF NL·각 리그) 순위 결정 순서와 구역 의미
# > (강등/승격/플레이오프)를 **공식 규정 문서에서 확인해** 적는다.
# > 모르면 *"승점→득실→다득점"* 가정 + **카드에 가정 표시.**
#
# 🔴 `verified: true` 는 **공식 문서를 열어 조문을 읽었다**는 뜻이고 `source` 가 그
#    주소다. ⚠️ `verified: false` 는 **가정**이고, 그 경기 카드에 *"동률 규칙 가정"*
#    이 찍힌다(`rules.tiebreak()` 가 그 표시를 함께 돌려준다).
# 🔴 구역 **글자**는 우리가 짓지 않는다 — fotmob `legend` 의 글자를 그대로 쓰고
#    (`zone`), 이 표는 그 글자가 **무슨 뜻인지**(승격/강등/플레이오프)만 잇는다.

#: 🔴 표에 없는 대회의 **가정** — 승점 → 득실 → 다득점
default:
  order: [points, goal_diff, goals_for]
  verified: false
  why: 표에 없는 대회다 — 가장 흔한 순서를 가정한다(카드에 가정 표시)

competitions:
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **K리그1 — 분할(스플릿) 규칙** · 사용자 지시 2026-10-09 ①
  # ══════════════════════════════════════════════════════════════════
  #
  # > 리그 분할(K리그1 파이널A=6위 컷)이 있는 리그는 *"이번 경기 직후 순위"* 가
  # > 아니라 **"컷 안/밖"** 으로 상태를 판정하고, 남은 라운드에서 **도달 가능한
  # > 최대 승점**으로 확정 여부를 따진다. `competition_rules` 에 적는다.
  #
  # 🔴 구역 **글자는 우리가 짓지 않는다** — fotmob `legend` 가 주는 그대로
  #    `Championship playoff`(1~6위) · `Relegation qualification`(7~12위)이다
  #    (실측 2026-10-09 표 페이지: `l_champ_playoff="1,2,3,4,5,6"`).
  #    ⚠️ 이 표는 그 글자가 **분할 컷**이라는 뜻만 잇는다.
  # 🔴 `verified: false` — 연맹 공식 규정 PDF 를 **열지 않았다.** 컷 순위는
  #    fotmob legend 실측이고, 동률 순서는 가정이다. 카드가 가정 표시를 찍는다.
  #    ⚠️ 규정을 확인하면 `verified: true` 와 `source` 를 적는다(사본 금지 — 여기
  #       숫자를 늘리지 말고 원본 주소를 적는다).
  - match: ["k league 1", "k-league 1", "k리그1", "k리그 1"]
    name: K League 1
    verified: false
    why: 분할 컷은 fotmob legend 실측(1~6위) · 동률 순서는 가정이다
    order: [points, wins, goal_diff, goals_for]
    # 🔴 **분할** — 정규 라운드가 끝나면 상·하위로 쪼갠다. 그 컷이 상태 판정의 기준
    split:
      # 🔴 컷으로 쓸 **구역 글자**(fotmob legend 그대로) — 여러 개면 먼저 맞는 것
      cut_zones: ["Championship playoff"]
      cut_rank_fallback: 6
      why: 파이널A(1~6위) · 파이널B(7~12위) — 정규 33라운드 뒤 분할
    zones:
      Championship playoff: 파이널A(상위 분할) — 우승·ACL 경쟁
      Relegation qualification: 파이널B(하위 분할) — 강등 경쟁

  - match: ["uefa nations league", "네이션스리그"]
    name: UEFA Nations League
    verified: true
    source: https://documents.uefa.com/r/Regulations-of-the-UEFA-Nations-League-2026/27/Article-15-Equality-of-points-league-phase-Online
    checked_at: 2026-10-06
    # 🔴 제15조 — **조 내 맞대결이 먼저다**(득실보다 앞선다). 조문 순서 그대로:
    order: [points, h2h_points, h2h_goal_diff, h2h_goals_for,
            goal_diff, goals_for, away_goals_for, wins, away_wins,
            disciplinary, access_list]
    order_quote: |
      a) Higher number of points obtained in the group matches played among the
      teams in question · b) Superior goal difference from the group matches played
      among the teams in question · c) Higher number of goals scored in the group
      matches played among the teams in question · d) (a~c 재적용) ·
      e) Superior goal difference in all group matches · f) Higher number of goals
      scored in all group matches · g) away goals · h) wins · i) away wins ·
      j) disciplinary points · k) access list 순위
    # 🔴 구역 뜻 — 2026/27 은 **세 리그로 가는 과도기**다(공식 PDF 확인):
    #    "The four group winners of League C are promoted to League B" ·
    #    "The League B/C play-offs are contested by … the four runners-up from
    #     League C" · "Since there will be no more League D, all league D teams
    #     are promoted to League C"(= **League C 에 강등이 없다**).
    zones_source: https://editorial.uefa.com/resources/02a9-21985b7e3370-3f0fda209606-1000/promotion_and_relegation_unl_website.pdf
    zones:
      Promotion: 승격 — 조 1위는 한 단계 위 리그로
      "Promotion qualification": 승격 플레이오프 — 조 2위는 상위 리그 4위와 맞붙는다
      Relegation: 강등
      "Relegation round": 강등 플레이오프
    note_2026_27: |
      🔴 **League C 는 강등이 없다**(League D 가 없어진다 · 위 PDF). 그래서 C조
      3·4위는 *"구역 없음"* 이고, 그것이 fotmob 표에 **구역 표시가 없는** 까닭이다
      (실측 2026-10-06 C 3조: 1위 Promotion · 2위 Promotion qualification · 3·4위 없음).

  - match: ["concacaf nations league"]
    name: CONCACAF Nations League
    verified: false
    why: |
      ⚠️ 공식 규정(Competition Regulations)을 **열어 확인하지 못했다** — 그래서
      가정이다. 🔴 확인 전에는 카드가 *"동률 규칙 가정"* 을 찍는다(지시 금지 조항:
      *"대회 규정을 확인 없이 단정"* 금지).
    order: [points, goal_diff, goals_for]
    zones: {}

  - match: ["premier league", "epl", "프리미어"]
    name: Premier League
    verified: false
    why: ⚠️ 규정 문서를 아직 안 열었다 — 득실 우선이라고 **널리 알려져** 있지만 확인 전이다
    order: [points, goal_diff, goals_for]
    zones:
      "Champions League": UEFA 챔피언스리그 진출
      Relegation: 강등
