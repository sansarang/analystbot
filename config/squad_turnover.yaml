# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **선수단 대거 변동** — 사용자 지시 2026-10-10(다섯 지적 ③)
# ══════════════════════════════════════════════════════════════════
#
# > 김천상무 같은 **군 팀**은 config에 "전역 주기 팀"으로 표시하고, 전역일(기사·
# > 구단 발표)을 **새 사실 B** 로 받는다.
# > 전역 뒤 첫 경기들은 "평소 XI"를 **전역 이후 경기로만** 만들고(없으면 "평소 XI
# > 없음 — 선수단 교체"), 전략 판정을 **로테이션으로 하지 않는다**(새 판정값:
# > `squad_turnover`).
# > 기준(Elo)·폼·골 내용은 전역 이전 기록이므로 **"선수단 교체 — 기준 약함"** 표시,
# > 가중을 낮춘다(적합 전 임시값 표시).
# > 일반화: 어느 팀이든 평소 XI 대비 **7자리 이상** 바뀌고 **빠진 선수가 명단에도
# > 없으면** `squad_turnover` 의심으로 새 사실 검색(이적·전역·징계).
#
# 🔴 왜 이 파일이 필요한가 — 실사고 2026-10-10(김천–안양): 봇이 김천의 6자리 변경을
#    **"로테이션·체력 관리"** 로 읽었다. 🔴 김천상무는 **군 팀**이라 전역 때마다
#    선수단이 통째로 바뀐다 — 그 주에 강원 황문기·김이석이 *"병역을 마치고 복귀"*
#    했다. 즉 **김천에서 전역해 원 소속팀으로 돌아간 것**이고, 바뀐 자리는 체력
#    관리가 아니라 **그 선수들이 이제 김천에 없어서**다(사용자가 잡았다).
# ⚠️ 그래서 더 큰 거짓이 따라온다: 김천의 **평소 XI·Elo·폼·골 내용**이 모두
#    *"이미 없는 선수단"* 이 만든 기록이다 → 기준 확률이 과대평가된다.

source: "사용자 지시 2026-10-10(다섯 지적 ③)"
checked_at: "2026-10-10"

# ══════════════════════════════════════════════════════════════════
# 🔴 **전역 주기 팀** — 선수단이 주기적으로 통째로 바뀌는 팀
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ 이름은 **별칭표(`config/entities.yaml`)가 아는 꼴**로 적는다 — 봇은
#    `discover.same_team` 으로 맞춘다(글자 그대로 비교하지 않는다).
# 🔴 **추측해 늘리지 않는다** — 군 팀임을 아는 팀만 적는다.
cycle_teams:
  - name: "Gimcheon Sangmu"
    aliases: ["김천상무", "김천 상무", "Gimcheon Sangmu FC", "상무"]
    why: "대한민국 국군체육부대 — 선수가 입대·전역으로 들고 난다"
  - name: "Sangju Sangmu"
    aliases: ["상주상무", "상주 상무"]
    why: "같은 팀의 옛 연고(2020년까지) — 과거 기록에 남아 있다"

# ══════════════════════════════════════════════════════════════════
# 🔴 **일반 의심 문턱** — 어느 팀이든
# ══════════════════════════════════════════════════════════════════
#
# > 평소 XI 대비 **7자리 이상** 바뀌고 **빠진 선수가 명단에도 없으면**
# > `squad_turnover` 의심으로 새 사실 검색(이적·전역·징계).
suspect:
  #: 🔴 바뀐 자리 수 문턱
  changed: 7
  #: 🔴 그중 **명단(18~23명)에도 없는** 선수가 이만큼이면 교체로 본다
  off_squad: 2

# ══════════════════════════════════════════════════════════════════
# 🔴 **기준 약화** — 전역 이전 기록의 가중을 낮춘다
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ 🔴 **임시값이다**(적합 전) — 전역 전후 성적 변화를 재려면 전역일이 붙은 경기
#    이력이 필요하고, 그 통로는 아직 없다(실측 2026-10-10). 카드가 임시값이라고
#    적는다.
weaken:
  #: 🔴 ① 기준(Elo)에서 **홈 이점·등급 차의 몫**을 이 비율로 줄인다
  elo: 0.5
  #: 🔴 폼·골 내용 규칙의 λ 이동을 이 비율로 줄인다
  rules: 0.5
  fit: {n: 0, provisional: true,
        why: "적합 못 했다 — 전역일이 붙은 경기 이력을 받는 통로가 없다"}
