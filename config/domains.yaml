  # 🔴🔴 **광범위 검색이 긁어 온 비(非)기사** — 사용자 지시 2026-10-17
  # ══════════════════════════════════════════════════════════════════
  #
  #  > 포털사이트들을 다 검색해야 한다 … 그래야 **변수에 정확도가 높아진다**
  #
  #  🔴 엔진·언어를 넓히자 결과가 76 → 287건이 됐고 **쓰레기도 같이** 늘었다.
  #     아래는 2026-10-17 울산 HD vs 부천 실행에서 **실제로 본문까지 받은** 것들
  #     이다(지어내지 않았다 — 받은 주소를 그대로 적는다).
  #  ⚠️ 전부 당일 날짜라 **날짜 검문을 통과**하고 팀 이름이 있어 **신원도
  #     통과**한 뒤, 추출에서 *"건진 것이 없다"* 가 됐다.
