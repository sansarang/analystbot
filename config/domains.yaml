  - wikimedia.org

# ══════════════════════════════════════════════════════════════════
# 🔴 등급 → 처리
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ `national` 의 hardness 는 **2매체 일치면 2, 단일이면 1** 이다(§4-3 표).
#    🔴 그 판단은 **몇 매체가 같은 말을 하나**이고 등급 하나로는 못 정한다 —
#       그래서 여기 적는 것은 **단일 기준**이고 §5-5 가 2매체를 올린다.
handling:
  official:   {fetch: true,  hardness: 2}
  national:   {fetch: true,  hardness: 1}
  local:      {fetch: true,  hardness: 1}
  aggregator: {fetch: true,  hardness: 1}
  # 🔴🔴 **v5 §4-5 가 이 수를 바꿨다**(2026-10-04): *"본문 50,000자 초과 → 앞
  #    50,000자만. **위키·순위표는 25,000자.**"*
  #    ⚠️ 종전은 50000 이었다(v4 의 *"5만 자 절단"*). v5 가 위키를 따로 떼어
  #       절반으로 줄였다 — 위키는 **배경**이고 그 긴 글이 LLM 입력을 채운다.
  wiki:       {fetch: true,  hardness: 0, max_chars: 25000}
  tip:        {fetch: false, hardness: 0}
  deny:       {fetch: false, hardness: 0}

# 🔴 §4-3 — *"**미등록 도메인은 `local` 취급**하되 종목 낱말이 제목에 없으면 버린다."*
unknown_tier: local
unknown_note: |
  ⚠️ 미등록을 `deny` 로 두면 **새 매체를 영영 못 읽는다**(현지 지역지가 늘 새롭다).
  🔴 그래서 `local` 로 받되 **종목 낱말 검사**가 럭비·드라마를 막는다
  (`rules.other_sport` · `rules.not_sport_host`).
