# 🔴🔴 **도메인 등급표** — v5 §4-3 [#4]
# ══════════════════════════════════════════════════════════════════
#
# > 등급표는 `config/domains.yaml`, 미등록 도메인은 **`local` 취급**하되 종목
# > 낱말이 제목에 없으면 버린다(럭비·드라마 차단).
#
# | 등급 | 예 | 처리 |
# |---|---|---|
# | official   | 협회·구단·리그 공식, statsapi, jleague.jp, npb.jp | 본문 받음 · hardness 2 |
# | national   | BBC·Guardian·Athletic·스포니치·닛칸·스포티비·연합·AS·Marca | 받음 · 2매체 일치면 2, 단일 1 |
# | local      | 현지 지역지(Gleaner, 데일리 포스트) | 받음 · hardness 1 |
# | aggregator | goal·sportsmole·fotmob HTML·flashscore | 받음 · 1 · 결장 명단은 2매체 필요 |
# | tip        | 베팅 팁·예측 사이트 | 🔴 **본문 안 받음** · 변수 근거 금지 |
# | deny       | rottentomatoes·tripadvisor·법률·SMS·전자상거래·위키 Economy_of 등 | 검색 결과에서 **제거** |
# | wiki       | /wiki/<team>·<coach>·<competition> | 받되 5만 자 절단 · hardness 0(배경) |
#
# 🔴 **실측으로 적은 것만**이다(2026-10-04 로그에 **실제로 나온** 호스트).
# ⚠️ 추측으로 늘리지 않는다 — 늘리려면 그 호스트가 로그에 나와야 한다.

