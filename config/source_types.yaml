  # ── 모음(aggregator) ─────────────────────────────────────────
  news.yahoo.co.jp:
    type: aggregator
    evidence_url: "https://news.yahoo.co.jp/"
    note: |
      ⚠️ 소개 페이지를 못 찾았다 — `/info/` 가 404 였다(실측 2026-09-21).
         루트로 대체한다.
  v.daum.net:             {type: aggregator, evidence_url: "https://news.daum.net/"}
  news.google.com:        {type: aggregator, evidence_url: "https://news.google.com/about/"}
  www.msn.com:
    type: aggregator
    evidence_url: "https://www.msn.com/"
    note: |
      🔴 본문이 **3자**로 온다(D43 · 24건 중 6건). JS 렌더라 정적 HTML 에
         값이 없다. 유형과 별개로 **쓸모가 없다.**
