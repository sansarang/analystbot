    note: |
      ⚠️ 유형이 딱 맞지 않는다 — 기사 매체가 아니라 **이적·부상 데이터베이스**다.
         다섯 유형에 그 칸이 없어 `beat` 로 뒀다. 억지로 맞춘 것을 숨기지 않는다.

  # ── 종합·경제지 ───────────────────────────────────────────────
  www.mt.co.kr:           {type: general, evidence_url: "https://www.mt.co.kr/"}
  www.fnnews.com:         {type: general, evidence_url: "https://www.fnnews.com/"}
  www.newspim.com:        {type: general, evidence_url: "https://www.newspim.com/"}
