  www.osen.co.kr:         {type: beat, evidence_url: "https://www.osen.co.kr/"}
  osen.mt.co.kr:          {type: beat, evidence_url: "https://www.osen.co.kr/"}
  sports.chosun.com:      {type: beat, evidence_url: "https://sports.chosun.com/"}
  www.spotvnews.co.kr:    {type: beat, evidence_url: "https://www.spotvnews.co.kr/"}
  www.starnewskorea.com:  {type: beat, evidence_url: "https://www.starnewskorea.com/"}
