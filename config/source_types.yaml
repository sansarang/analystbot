    evidence_url: "https://www.yna.co.kr/"
    note: |
      ⚠️ 소개 페이지를 못 찾았다 — `/about/index` 가 400, `/company/intro` 도
         400 이었다(실측 2026-09-21). 루트로 대체한다. 없는 URL 을 근거로
         적으면 그게 거짓이다.

  # ── 스포츠 전문(beat) ────────────────────────────────────────
  www.nikkansports.com:   {type: beat, evidence_url: "https://www.nikkansports.com/"}
  www.sponichi.co.jp:     {type: beat, evidence_url: "https://www.sponichi.co.jp/"}
  www.sanspo.com:         {type: beat, evidence_url: "https://www.sanspo.com/"}
