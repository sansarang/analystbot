# 매체 **유형** — [DEC-4 / 사용자 결정 2026-09-21]
#
# 🔴 **유형은 사실이고, 등급은 의견이다.** 종전 `config/sources.yaml` 의
#    tier0~3 은 "얼마나 믿나"인데, KBO 는 tier1 에 한 곳뿐이고 tier2 는 빈
#    목록이라 실제 매체가 전부 `RANK_UNKNOWN` 이었다(D41).
#    등급을 내가 채우면 취향이다. **"구단 공식인가"는 근거 URL 로 확인된다.**
#
# 🔴 **등급은 `official` 만 상위(primary)** 다. 나머지는 전부 `unrated`(soft).
#    승격은 `공식·라인업과의 일치율` 실측이 **n≥20** 일 때 **후보**가 되고,
#    올리는 것은 **사용자**다. 코드가 스스로 올리지 않는다.
#
# ⚠️ **여기 있는 도메인은 전부 운영에서 실제로 본 것**이다(Redis 캐시 13종 +
#    Bing 검색 결과 + 본문 열기 실측 + kbo_news 설정 피드 + source_map 공시면).
#    지어낸 도메인은 없다.
# ⚠️ `evidence_url` 은 **실제로 열어 확인했다**(2026-09-21). 24건 중 2건이
#    실패해 루트로 대체하고 `note` 에 그 사실을 적었다.
# ⚠️ `config/sources.yaml` 은 **건드리지 않았다.** 별개 축이다.

types: ["official", "wire", "beat", "general", "aggregator"]

#: 상위로 올리는 유형. 🔴 **하나뿐이다.**
primary_types: ["official"]

promotion:
  # 승격 **후보** 조건 — 그 뒤에도 사용자 승인이 필요하다.
  metric: "공식·라인업과의 일치율"
  min_samples: 20
  note: |
    🔴 코드가 스스로 승격하지 않는다. `source_scorecard` 가 n≥20 을 채우면
       **후보 목록**에 오를 뿐이다. 올리는 것은 사용자다.

sources:
  # ── 구단·리그 공식 ────────────────────────────────────────────
  sp.baystars.co.jp:      {type: official, evidence_url: "https://www.baystars.co.jp/"}
  www.marines.co.jp:      {type: official, evidence_url: "https://www.marines.co.jp/"}
  www.rakuteneagles.jp:   {type: official, evidence_url: "https://www.rakuteneagles.jp/"}
  npb.jp:                 {type: official, evidence_url: "https://npb.jp/"}
  www.jleague.jp:         {type: official, evidence_url: "https://www.jleague.jp/"}
  api.premierleague.com:
    type: official
    evidence_url: "https://www.premierleague.com/"
    note: "EPL 공식 API. robots.txt 는 404 라 access_basis 는 판단불가다(1b-2)."
  www.laliga.com:         {type: official, evidence_url: "https://www.laliga.com/"}

  # ── 통신사 ───────────────────────────────────────────────────
