# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **후보 판 플래그**(수정·검증 지시 2026-10-14e) — 기본은 **전부 꺼짐**
# ══════════════════════════════════════════════════════════════════
#
#  > 운영 판(M1 · K0 고정)은 판정 통과 전까지 그대로다. 고친 것은 전부 후보
#  > 판(설정 플래그)으로 만들고, 운영 카드에는 그림자 열로만 붙인다.
#
# 🔴 여기 값을 켜는 것은 **백필 판정 v2+(d) 통과 뒤**다(§0 · §4).
# ⚠️ 켠 날짜를 `switched_at` 에 적는다 — 카드 축3·Σ 값이 그날부터 바뀐다.
flags:
  # ① 축3 부호 — 규칙 효과 부호로 ±(유리 +0.15 · 불리 −0.15)
  axis3_sign: true     # ✅ 판정 통과(342경기 · 상위20% +5.2%p) + 버그 수정
  # ①b 축3 끄기(가중 0)
  axis3_off: false
  # ② 결측 축 가중 재배분(한 축만 ⬜ 일 때)
  weight_renorm: true  # ✅ 중립(a·b·c 통과 · d 미달) → **버그 수정으로 채택**
  # ③ 팀별 홈 배율 후보 — "" (지금) · a(끄기) · b(대칭식) · c(수축 강화) · d(이월)
  home_mul: "a"        # ✅ 끄기 — `③now` 가 백필에서 유의하게 해롭다
  # ④ 축0 척도 정규화(리그 표준편차로 나눈다)
  axis0_scale: false

switched_at: "2026-10-14"   # 🔴 전환일(카드 축3·Σ·홈 배율이 이날부터 바뀐다)

# 🔴 ③c 의 값들 — **백필로만 고른다**(§0)
home_mul_c:
  k: 16
  cap: 1.30

# 🔴 ②a — ⬜ 축이 **둘 이상**이면 재배분하지 않는다(축 하나를 과대 반영 방지)
renorm_max_missing: 1
