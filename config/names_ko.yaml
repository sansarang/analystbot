# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **한글 이름 보탬** — 사용자 지시 2026-10-11 ② (이름 대조)
# ══════════════════════════════════════════════════════════════════
#
# > 이름 대조에 config/names_ko.yaml(팀·선수 한글명·약칭)을 쓴다 —
# > **영어 표기만으로 identity 판정 금지.**
#
# 🔴🔴 **이 파일은 사본이 아니다.** 팀 한글명의 원본은 둘이고 그대로 둔다:
#     · `config/teams_54.yaml` — 54팀의 `ko`·`ko_short`
#     · `config/entities.yaml` — 사용자 별칭
#   🔴 그 둘이 **말하지 않는 것만** 여기 적는다(CLAUDE.md #1 사본 금지).
#
# ⚠️ 왜 필요한가 — 실측 2026-10-11(광주–울산): 신원 선필터가 쓸 이름이
#    `Gwangju FC` 계열 + `Ulsan HD FC` 뿐이어서 **한글 기사가 통과할 길이
#    없었다**(`identity_mismatch` 7건 · 문서 0건). 열쇠 갈림은 `teamref` 에서
#    고쳤고(이름 없는 임시 열쇠 합치기), 이 파일은 **선수 한글명**과 표에 없는
#    약칭을 더한다.
# 🔴 **추측해 늘리지 않는다**(#4) — 기사·구단 표기에서 **본 것만** 적는다.

source: "사용자 지시 2026-10-11(앞에서부터 고친다) ②"
checked_at: "2026-10-11"

# ══════════════════════════════════════════════════════════════════
# 🔴 팀 — 표에 없는 **약칭**만(정식 한글명은 `teams_54.yaml` 이 든다)
# ══════════════════════════════════════════════════════════════════
#
# 열쇠는 **영어 정식명**이고 값은 그 팀을 가리키는 한글 표기들이다.
teams:
  "Ulsan HD":
    - "울산"
    - "울산HD"
    - "울산 현대"          # ⚠️ 2024 이전 이름 — 기사가 아직 쓴다(실측 2026-10-11)
  "Gwangju FC":
    - "광주"
    - "광주FC"

# ══════════════════════════════════════════════════════════════════
# 🔴 선수 — 한글명 ↔ 영문 표기(결장 기사가 한글로만 쓴다)
