#
# 🔴 **한국어 별칭표(`satellite_soccer.SOCCER_ALIAS`)와 용도가 다르다.**
#    저쪽은 한국어 매체 검색·카드 표시용(코모·파르마)이고, 이 표는
#    **현지어 검색 질의용**(Como·Parma)이다. 둘을 섞지 않는다.
#
# 🔴 왜 필요한가 — 실측 2026-09-14:
#      q="Como 1907 infortunati oggi"        → 0건
#      q="Parma Calcio 1913 infortunati oggi" → 0건
#    현지 매체는 `Como`·`Parma` 로 쓴다. 법인격(FC·AC·US·SSC)과 창단연도
#    (1907·1913)는 이름이 아니라 형식이다.
#
# ⚠️ 세리에A 12건은 **사용자가 준 값** 그대로다. 나머지는 같은 규칙
