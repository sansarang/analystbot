# 검색 언어 — **무엇으로 찾나** (사용자 지시 2026-10-02)
#
# ══════════════════════════════════════════════════════════════════
# 🔴 왜 이 파일이 생겼나 — 라이브가 내 결정을 깨뜨렸다
# ══════════════════════════════════════════════════════════════════
#
# 실측 2026-10-01(USL): 기본이 `("ko","en")` 이라 미국 2부 축구팀을 **한국어로**
#   검색했다 → zhihu 홍수 · 사실 0건. 그래서 기본을 **영어**로 바꿨다.
# 🔴 실측 2026-10-02(아시안게임 한국 vs 중국): 그 영어 기본이 **한국 대표팀을
#   깨뜨렸다.** 세포가 검색 3/3 · 열기 20/20 을 쓰고 **사실 0건**이었는데,
#   맞대결(43전 4승)·휴식(준결승 0-2 패)·감독 발언이 **한국어 매체에 다 있었다.**
#
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **영어가 먼저, 그다음 그 나라 현지어** (사용자 지시 2026-10-02)
# ══════════════════════════════════════════════════════════════════
#
# > 한국어로 찾지 말고 영어로 찾으면 되잖아...공통으로 영어 그다음은 그나라 현지어..
#
# 🔴 그래서 이 파일은 **현지어만** 적는다. `en` 은 코드가 **늘 맨 앞에** 붙인다
#    (`queries.langs_for`). ⚠️ 여기 `en` 을 적지 않는다 — 적으면 순서가 갈린다.
#
# 왜 영어가 먼저인가: 영어가 **공통**이다. 현지어는 그 나라 경기에만 듣고, 영어는
# 거의 모든 경기에 듣는다. 예산(검색 3회)을 쓰는 순서가 그 순서여야 한다.
#
# ══════════════════════════════════════════════════════════════════
# 🔴 그래서 **리그가 아니라 팀**에 맞춘다
#
# 리그로는 못 담는다: 대표팀 경기는 **상대에 따라** 언어가 달라진다. 한국 vs 중국은
# 한국어·중국어고, 한국 vs 일본은 한국어·일본어다. 리그 칸 하나로는 둘을 못 적는다.
#
# ⚠️ **선언한 것만 쓴다.** 없는 팀은 리그 기본(`queries.LANGS`)으로 가고, 그 사실이
#    사유로 남는다 — 나라를 전수로 적지 않는다(적으면 그 순간 유지 못 하는 사본이다).
# 🔴 여기 적는 기준: **그 팀 기사가 실제로 그 언어로 나오는가.** 추측으로 넣지 않는다.

# 🔴 **현지어만** — `en` 은 코드가 맨 앞에 붙인다
teams:
  # 🔴 아래는 **이 저장소가 실제로 다룬 팀**이다(DB `games` 에 들어온 이름).
  South Korea:   [ko]      # 라이브 2026-10-02 — 한국어 매체에 변수가 있었다
  Korea Republic: [ko]     # 같은 팀의 다른 표기(대회마다 갈린다)
  한국:           [ko]
  China:         [zh]      # 같은 경기의 상대
  China PR:      [zh]
  중국:           [zh]
  Japan:         [ja]
  일본:           [ja]
  # 🔴 **여자팀은 이름이 다르다** — fotmob 은 ` W` 를 붙인다. 실측 2026-10-02:
  #    선언이 `South Korea` 뿐이라 `South Korea W` 가 기본(영어)으로 떨어졌다.
  #    ⚠️ 접미사를 코드로 떼지 않는다 — 떼면 남녀가 **합쳐지고** 그것이 더 위험하다.
  South Korea W: [ko]
  China W:       [zh]
  Japan W:       [ja]

# ⚠️ **모르는 팀은 여기 없다** — 그것이 맞다. 리그 기본으로 가고 사유가 남는다.
#    🔴 `queries.LANGS`(리그별)은 그대로 원본이다. 이 파일은 **팀이 있을 때만** 이긴다.
