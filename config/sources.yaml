# 딥서치 소스 화이트리스트. 지시문 Part 2 / 4-2.
#
# 우선순위 tier1 → tier2 → tier3. 검색 결과에서 tier 순으로 **최대 3개** fetch.
# `blocked`·`js_only` 는 정렬 전에 제거한다.
#
# ⚠️ 리그 키는 `app/leagues.py` 기준이다(지시문의 laliga → la_liga 등).
# ⚠️ 지시문에 **"구단 공식 도메인 목록"** 이라고만 적힌 자리는 비워 둔다 —
#    Claude Code 가 도메인을 추측해 채우지 않는다(티어 표와 같은 규칙).
# ⚠️ 우리 시스템에 없는 리그(ligue1·eredivisie·championship)의 도메인은
#    넣지 않았다. 리그가 생기면 그때 지시문 목록을 옮긴다.

# 🔴 [U6 2026-09-15] tier0 — **구단 공식 채널과 담당 기자 RSS.**
#    기자회견 원문·공식 결장 발표가 여기서 가장 먼저 나온다. tier1(지역지)보다
#    앞선다.
# 🔴 **값은 사용자가 채운다.** Claude Code 는 구단 공식 도메인을 추측해서
#    넣지 않는다(티어 표와 같은 규칙). 골격만 두고 대기한다.
# ⚠️ 비어 있어도 수집은 돈다 — tier1 부터 순서대로 내려간다.
tier0_primary:
  epl:        []
  la_liga:    []
  serie_a:    []
  bundesliga: []
  ligue1:     []
  eredivisie: []
  j1:         []
  kleague1:   []
  denmark:    []
  acl:        []

tier1_club_local:            # 구단 공식·지역지·팬 매체 — 기자회견 원문에서 결장이 나온다
  # 🔴 [ACL-1 2026-09-15] ACL 은 **비워 둔다.** 구단 공식 도메인을 추측해
  #    채우지 않는다(티어 표와 같은 규칙). 등록 안 된 도메인은 폐기가 아니라
  #    **tier 4 로 통과**하므로(SCT-9) 비어 있어도 기사는 열린다.
  acl:        []
  serie_a:    [calciolecce.it, monza-news.it, monzaindiretta.it, forzamonza.it,
               calcionapoli24.it, areanapoli.it, noibianconeri24.it,
               # [SCT-9 2026-09-14 사용자 지시] 오늘 실제로 프리뷰를 낸 지역·팬 매체
               romatoday.it, teleradiostereo.it, sportparma.com, dallaplatea.it,
               # [SCT-10 2026-09-14 사용자 지시] 이탈리아 3대 매체 — 판타지
               # 결장표를 함께 싣는다
               gazzetta.it, corrieredellosport.it, sport.sky.it]
  bundesliga: [fcbinside.de, footy.de, baykusen.de]
  epl:        [sussexexpress.co.uk, 3addedminutes.com]
  la_liga:    [101tv.es, elespanol.com, riazor.org]
  j1:         [jleague.jp]
  kleague1:   [gwangjufc.com]          # + 구단 공식 도메인 — 사용자가 채운다
  npb:        [baseball.yahoo.co.jp]
  kbo:        [gukjenews.com]          # + 구단 공식 도메인 — 사용자가 채운다
  denmark:    []                       # 사용자가 채운다
  mlb:        []                       # 사용자가 채운다

tier2_aggregator:            # 판타지·집계 — 결장 표를 가장 빨리 정리한다
  epl:        [sportsmole.co.uk, whoscored.com, thefootballfaithful.com, sports.yahoo.com]
  serie_a:    [fantacalcio.it, fantamaster.it, spaziocalcio.it, goal.com,
               # [SCT-9 2026-09-14 사용자 지시] 집계·전국지
               eurosport.it, ilmessaggero.it, lapresse.it, calciomercato.com,
               diretta.it, calcio.com,
               # [SCT-10 2026-09-14 사용자 지시]
               ilriformista.it, dazn.com]
  bundesliga: [ligainsider.de, magazin.comunio.de, eurosport.de]
  la_liga:    [jornadaperfecta.com, eldesmarque.com, sportsmole.co.uk, whoscored.com]
  j1:         [matchcalendar.football]
  npb:        [nikkansports.com]
  denmark:    [fotmob.com]
  kleague1:   []
  kbo:        []
  mlb:        []

tier3_wire:                  # 통신사 — 라인업 확정 속보
  common:     [infobae.com, efe.com, ansa.it]

blocked:                     # 절대 열지 않는다
  - oddschecker.com
  - tipico.de
  # [SCT-10 2026-09-14 사용자 지시] 베팅 사이트 · 판정 근거 없는 픽 사이트
  - sportnews.snai.it
  - sudefuturi.it
  - reddit.com
  - wikipedia.org

# 도메인에 이 조각이 들어가면 차단(베팅 제휴).
# 🔴 [PA-20 2026-09-16] 실측으로 늘렸다. 2026-09-16 18:08 ACLE 위성 사이클이
#   **coinbase.com(암호화폐)를 본문 fetch** 했고, 후보 11건이
#   freetips·footballpredictions·livetipsportal·sportsgambler 로 채워졌다.
#   종전 목록(bet·odds·tipster)이 그것들을 못 걸렀다.
# ⚠️ **반대 위험을 먼저 쟀다** — 등록된 정상 소스 53개와 충돌 **0건**이다.
#   (지시문 "하지 말 것": 팬 포럼·예측 채널·전문가 픽 사이트 수집)
blocked_fragments:
  - bet
  - odds
  - tipster
  - tips
  - predict
  - gambl
  - wett
  - forecast
  - crypto
  - coinbase
  - casino
  - parlay
  - sportskeeda

js_only:                     # 열어도 표가 없다 — fetch 금지. 기존 피드로만 본다
  - flashscore.com
  - flashscore.co.kr
  - sports.daum.net
  # 🔴 [PA-21 2026-09-16] v.daum.net 은 JS 셸이라 본문 대신 **사이트 안내문**이
  #   긁힌다. 실측 g8360: 15건이 전부 "가장 빠른 뉴스가 있고 다양한 정보,
  #   쌍방향 소통이 숨쉬는 다음뉴스를 만나보세요…" 1,200자였다.
  #   길이 검사(§7: 본문 < 500자)를 통과해서 여태 안 걸렸다.
  - v.daum.net
  - sports.news.naver.com
