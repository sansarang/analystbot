# ⚠️ 29구장이다. 2026 시즌 임시 구장(예: 탬파베이)은 표본이 없어 빠질 수 있고,
#    없으면 **지어내지 않고 null 로 둔다**.
#
# 받은 날: 2026-09-19  ·  3년 롤링(2024~2026)

