source: 사용자 지시 2026-10-10(여섯째) V-3 배치표
checked_at: '2026-10-10'
places:
  axis:
  - axis0
  - axis1
  - axis2
  - axis3
  const:
  - lambda_const
  verify:
  - V1
  - V2
  - V3
  - V4
  - V5
  - V6
  hypo:
  - hypo
types:
  absence:
    places:
    - axis0
    - axis2
    - hypo
    why: '축0(오늘 XI 전력: 빠진 선수 가치) · 축2(그 선수가 쥔 무기 꺼짐)'
  def_absence:
    places:
    - axis0
    - axis2
    - hypo
    why: 축0(빠진 수비 자원 가치) · 축2(수비 무기 꺼짐)
  absence_att:
    places:
    - axis0
    - axis2
    - hypo
    why: 축0(빠진 공격 자원 가치) · 축2(공격 무기 꺼짐)
  suspension:
    places:
    - axis0
    - axis2
    - hypo
    why: 축0·축2 — 결장과 같다(사유만 다르다)
  returning:
    places:
    - axis0
    - axis2
    - hypo
    why: 축0(들어온 선수 가치) · 축2(무기 켜짐)
  national_duty_return:
    places:
    - axis0
    - axis2
    - hypo
    why: 복귀와 같다 — 대표팀에서 돌아온 선수
  lineup_value:
    places:
    - axis0
    - hypo
    why: 축0 — 오늘 XI 선수 가치 합이 그 변수의 내용이다
  squad_rotation:
    places:
    - axis0
    - axis1
    - axis3
    - V1
    - hypo
    why: 축0 호흡 · 축1·축3 r 가중 · V1 기준 낡음(선수단 교체·로테이션)
  lineup_intent:
    places:
    - axis2
    - hypo
    why: 축2 — 스타일 조정·전략 판정 입력
  recent_pattern:
    places:
    - axis1
    - hypo
    why: 축1 — 보정 폼
  team_stats:
    places:
    - axis1
    - axis2
    - hypo
    why: 축1 또는 축2 — 내용에 따라(둘 다 열어 두고 축이 쓸 것을 고른다)
  regression:
    places:
    - axis1
    - hypo
    why: 축1 — 운 요소·xG 대비 성과 보정
  strength_gap:
    places:
    - axis0
    - hypo
    why: 축0 — 전력 차
  home_field:
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **홈 이점을 확률에서 뺀다** — 사용자 지시 2026-10-18(M26)
    # ══════════════════════════════════════════════════════════════
    #
    #  > **홈이점 뺀다** … 카드에는 **맥락으로 남긴다**
    #
    #  ⚠️ 까닭(M26): 홈 이점은 **구조 상수**인데 오늘 오전에 λ 보정표에 넣으면서
    #     `오늘` 층(×1.03)의 한 표가 됐다 — 라인업·피로도와 같은 무게로 섰다.
    #  🔴 그래서 자리를 `hypo` 로 내린다(확률 통로 없음). 카드의 S03 줄과 ⑯ 이
    #     읽는 맥락은 **그대로 남는다** — 조용히 지우지 않는다(#3).
    places:
    - hypo
    why: 🔴 홈 이점은 **맥락 전용**(2026-10-18 M26) — 확률 통로 없음 · 카드·⑯ 은 읽는다
  match_type:
    places:
    - lambda_const
    - hypo
    why: 대회 유형 상수(λ·무승부)
  stakes:
    places:
    - V2
    - hypo
    - axis1
    why: 상성 밖 — V2 동기 · 🔴 axis1 를 더했다(2026-10-18 — 동기 비대칭이 V2 라 버려졌다)
  fatigue:
    places:
    - axis2
    - V3
    - hypo
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **적합 문지기를 걷었다** — 사용자 지시 2026-10-18
    # ══════════════════════════════════════════════════════════════
    #
    #  > 오늘 경기력의 변수는 오늘 라인업·날씨·**피로도** 등이다
    #  > → **피로도만 해라**
    #
    #  ⚠️ 실측 2026-10-18(휴스턴 vs 댈러스): `IR11` 이 **두 팀 다 발동**했는데
    #     (8일 3경기) 확률 표에 없었다. 🔴 `axis_needs_fit: true` 가 *"적합이
    #     있을 때만 축"* 이라 자리가 `V3`·`hypo` 로 떨어졌다(λ 표에 넣어도
    #     소용없다 — **자리와 λ 표가 둘 다** 있어야 센다).
    #  🔴 사용자가 피로도를 **오늘 변수**로 이름 댔으므로 문지기를 걷는다.
    why: 축2 압박 감쇠(T2) · V3 일정·피로 — 🔴 적합 없이도 축으로 간다(2026-10-18)
  travel_schedule:
    places:
    - axis2
    - V3
    - hypo
    why: 일정 부담 — 축2 는 적합된 경우만 · V3
    axis_needs_fit: true
  coach_intent:
    places:
    - axis2
    - V4
    - hypo
    why: 축2 전략 판정 입력(**확정 XI 와 일치할 때**) · 아니면 V4
    axis_needs_xi_match: true
  coach_conflict:
    places:
    - axis2
    - V4
    - hypo
    why: 같은 칸 — 발언과 명단이 어긋나면 V4 로만
    axis_needs_xi_match: true
  coach_change:
    places:
    - V1
    - V4
    - hypo
    why: 감독 교체 직후 → V1 기준 낡음 · V4
  coach_quote:
    places:
    - V4
    - hypo
    why: V4 — 감독 발언(상성 밖)
  h2h_pattern:
    places:
    - V5
    - hypo
    - axis1
    why: 상성 밖 — V5 맞대결 · 🔴 axis1 를 더했다(2026-10-18 — 맞대결이 확률에 못 닿아 버려졌다)
  venue_weather:
    places:
    - V4
    - hypo
    why: V4 기타 — 날씨·구장 상태
  individual_title:
    places:
    - V4
    - hypo
    why: V4 기타
  individual:
    places:
    - V4
    - hypo
    why: V4 기타 — 개인 기록
  emotion:
    places:
    - V4
    - hypo
    why: V4 기타 — 정서·분위기(확률에 닿지 않는다)
  event_match:
    places:
    - V4
    - hypo
    why: V4 기타 — 은퇴 경기 등
  pitcher_state:
    places:
    - hypo
    why: 야구 선발 상태 — 축구 상성 축에 자리가 없다(가설 근거로만)
  # 🔴🔴 **받은 자료 유형 다섯**(사용자 지시 2026-10-18 *"가나다 전부 변수에
  #    닿게"*) — ⚠️ 자리를 **축**으로 둔다. 그래야 확률에 닿는다(`flat_prob` 이
  #    `AXES`·`CONST` 자리만 센다). 🔴 이것은 **확률 경로 변경**이다.
  squad_ability:
    places:
    - axis0
    - hypo
    why: ① 전력 — 선발 능력치는 그 팀의 전력이다
  absence_quality:
    places:
    - axis0
    - hypo
    why: ① 전력 — 결장 품질 손실(`absence` 계열과 같은 자리)
  branch_numbers:
    places:
    - axis2
    - hypo
    why: ③ 전술 — 갈래는 전술 비교다
  squad_value:
    places:
    - axis0
    - hypo
    why: ① 전력 — 가치는 전력의 어림이다
  state_rate:
    places:
    - axis1
    - hypo
    why: ② 흐름 — 뒤졌을 때 되돌리는 힘이다
  form_streak:
    places:
    - axis1
    - axis2
    - hypo
    why: 🔴 쪼갠 유형(2026-10-15) — 플래그 꺼짐이면 `team_stats` 와 같다
  standing_motive:
    places:
    - V2
    - hypo
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **축을 다시 걷었다** — 사용자 지시 2026-10-18(*"m17 수정"*)
    # ══════════════════════════════════════════════════════════════
    #
    #  ⚠️ 오늘 낮에 *"버려지던 센 사실"* 로 `axis1` 을 더했다. 그런데 같은 날
    #     전력차(`TB1`)를 지으니 **둘이 정면으로 반대**였다:
    #       `IR14` 는 *"급한 팀이 유리"* → **낮은 순위 쪽**
    #       `TB1`  은 경기당 승점 차   → **높은 순위 쪽**
    #     실측(오스틴 vs 밴쿠버): `[IR14-home] home` ↔ `[TB1] away` 로 **서로
    #     지웠다**.
    #  🔴 순위표가 말하는 **전력**은 `TB1`·`TB2` 가 센다. 순위표가 말하는
    #     **동기**는 수로 가릴 수 없다(급해서 이기는지 급해서 무너지는지 우리
    #     원장에 없다). 그래서 `IR14` 는 **맥락 전용**으로 되돌린다 — ⑯ 이
    #     읽고 사람도 카드에서 본다.
    why: 🔴 쪼갠 유형(2026-10-15) — 플래그 꺼짐이면 `stakes` 와 같다 · 🔴 axis1 를 더했다(2026-10-18 — 순위 동기가 V2 라 버려졌다)
  mood:
    places:
    - V2
    - hypo
    why: 🔴 쪼갠 유형(2026-10-15) — 플래그 꺼짐이면 `stakes` 와 같다
  goal_profile:
    places:
    - axis1
    - axis2
    - hypo
    why: 🔴 쪼갠 유형(2026-10-15) — 플래그 꺼짐이면 `team_stats` 와 같다
fail:
  to: context_only
  note: 🔴 배치표에 없는 유형 — 근거 불가로 내렸다(지어서 배치하지 않는다)
lambda_rules:
  travel_away:
    rule: IR13
    mul: 0.95
    why: 이동이 멀면 원정이 불리하다(사용자 지시 2026-10-14 · 상식)
  fatigue:
    rule: IR11
    mul: 0.95
    why: 피로도는 일정과 관련있다(사용자 지시 2026-10-14)
  stakes_urgent:
    rule: IR14
    mul: 0.95
    side: opponent
    why: 순위 동기 — 급한 팀이 유리하다(사용자 지시 2026-10-14 · 승점·라운드 기준)
  floor_mul: 0.8
  source: 사용자 지시 2026-10-14 · 🔴 적합 아님
  by_var:
    why: 🔴🔴 **폼·결장·전략 변수를 λ 에 잇는다**(사용자 지시 2026-10-15). 상성을 삭제해 축 통로가 사라진 뒤, 변수가 확률에
      닿는 길은 여기뿐이다. 🔴 크기는 **새 수가 아니다** — 이동·피로·순위 동기에 사용자가 정한 **±5%** 를 그대로 쓴다. ⚠️
      겹치면 곱하고 `floor_mul`·`cap_mul` 로 막는다.
    goals:
      up: 1.05
      down: 0.95
      types:
      - recent_pattern
      - form_streak
      - lineup_intent
      - goal_profile
      - regression
      why: ② 흐름 · ③ 전술 — 변수의 `goals` 칸이 그 팀 득점 방향이다
    favors:
      mul: 1.05
      types:
      - def_absence
      - absence
      - absence_att
      - suspension
      - returning
      - national_duty_return
      - squad_rotation
      - lineup_value
      - strength_gap
      - lineup_intent
      - form_streak
      - team_stats
      # 🔴 **받은 자료 유형 다섯**(지시 2026-10-18) — 크기는 **새 수가 아니다**
      #    (위 `mul: 1.05` 를 그대로 쓴다)
      - squad_ability
      - absence_quality
      - branch_numbers
      - squad_value
      - state_rate
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **피로도만 확률에 닿게 한다** — 사용자 지시 2026-10-18
      # ══════════════════════════════════════════════════════════════
      #
      #  > **오늘 경기력의 변수는 오늘 라인업·날씨·피로도** 등이다
      #  > → **피로도만 해라 .. 날씨 삭제 .. 이동 삭제**
      #
      #  ⚠️ `fatigue`(IR11 — 8일 3경기·시차)는 자리가 `axis2` 인데 **이 표에
      #     없어** 확률을 못 밀었다(자리와 이 표가 **둘 다** 있어야 센다).
      #  🔴 `travel_schedule`(이동)·`venue_weather`(날씨)는 **넣지 않는다** —
      #     사용자가 그 둘을 삭제하라고 했다(규칙도 지웠다).
      - fatigue
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **버려지던 센 사실 넷을 넣는다** — 사용자 지시 2026-10-18
      # ══════════════════════════════════════════════════════════════
      #
      #  > 지금 수정해야할거 하나도 빠지지 말고말해 → **전부다 수정해**
      #
      #  ⚠️ 실측(캔자스): 변수 11개 중 **3개**만 확률을 밀었다. 맞대결 6승 ·
      #     홈 이점 +16.8%p · 순위 동기가 **자리나 이 표가 없어** 버려졌다.
      - h2h_pattern
      # 🔴 `home_field` 도 뺐다 — **홈 이점은 확률에서 뺀다**(사용자 지시
      #    2026-10-18 M26 · 구조 상수가 `오늘` 층 한 표로 서던 자리다).
      #    자리도 `hypo` 로 내렸다(둘 중 하나만 걷으면 다시 샌다).
      # 🔴 `standing_motive` 는 뺐다 — 전력차(`TB1`)와 반대 방향이라
      #    서로 지웠다(사용자 지시 2026-10-18 *"m17 수정"*)
      - stakes
      why: ① 전력 · ② 흐름 · ③ 전술 — `favors` 가 가리키는 쪽 λ 를 올린다(`goals` 가 이미 말한 변수는 **중복으로
        안 센다**)
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **두 층의 크기** — 사용자 지시 2026-10-18
  # ══════════════════════════════════════════════════════════════════
  #
  #  > **지난경기를 가지고 오늘를 예측해서 확률를 내는거다** .. 지난경기의
  #  > 자료를 가지고 **오늘 경기에 대입하는거다** .. **경기력**이고 ..
  #  > **오늘 경기력의 변수는 오늘 라인업·날씨·피로도 등**이다
  #
  #  🔴 과거는 **바탕**이고 오늘은 **조정**이다. 종전엔 둘이 똑같은 ±5% 였다
  #     (과거 폼 한 표 = 오늘 결장 한 표).
  #  ⚠️ 두 수는 **사용자가 고치는 자리**다(§13-7) — 측정으로 얻은 수가 아니다.
  #     🔴 그래서 `past` 는 종전 값(1.05)을 그대로 두고 `today` 만 작게 둔다
  #        (조정은 바탕보다 작아야 한다는 그 뜻만 담는다).
  by_layer:
    past: 1.05
    today: 1.03
    #: 🔴 어느 유형이 **과거(경기력)** 인가 — 나머지는 전부 `today` 로 센다
    past_types:
    - recent_pattern
    - form_streak
    - regression
    - squad_rotation
    - h2h_pattern
    - state_rate
    # 🔴 순위표가 말하는 전력차도 **과거**다(시즌 누적 성적이다)
    - strength_gap
    why: 🔴 과거 = 바탕(5경기 경기력) · 오늘 = 조정(라인업·피로도 …)
  cap_mul: 1.25
