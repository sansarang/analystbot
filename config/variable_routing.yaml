source: 사용자 지시 2026-10-10(여섯째) V-3 배치표
checked_at: '2026-10-10'
places:
  axis:
  - axis0
  - axis1
  - axis2
  - axis3
  const:
  - lambda_const
  verify:
  - V1
  - V2
  - V3
  - V4
  - V5
  - V6
  hypo:
  - hypo
types:
  absence:
    places:
    - axis0
    - axis2
    - hypo
    why: '축0(오늘 XI 전력: 빠진 선수 가치) · 축2(그 선수가 쥔 무기 꺼짐)'
  def_absence:
    places:
    - axis0
    - axis2
    - hypo
    why: 축0(빠진 수비 자원 가치) · 축2(수비 무기 꺼짐)
  absence_att:
    places:
    - axis0
    - axis2
    - hypo
    why: 축0(빠진 공격 자원 가치) · 축2(공격 무기 꺼짐)
  suspension:
    places:
    - axis0
    - axis2
    - hypo
    why: 축0·축2 — 결장과 같다(사유만 다르다)
  returning:
    places:
    - axis0
    - axis2
    - hypo
    why: 축0(들어온 선수 가치) · 축2(무기 켜짐)
  national_duty_return:
    places:
    - axis0
    - axis2
    - hypo
    why: 복귀와 같다 — 대표팀에서 돌아온 선수
  lineup_value:
    places:
    - axis0
    - hypo
    why: 축0 — 오늘 XI 선수 가치 합이 그 변수의 내용이다
  squad_rotation:
    places:
    - axis0
    - axis1
    - axis3
    - V1
    - hypo
    why: 축0 호흡 · 축1·축3 r 가중 · V1 기준 낡음(선수단 교체·로테이션)
  lineup_intent:
    places:
    - axis2
    - hypo
    why: 축2 — 스타일 조정·전략 판정 입력
  recent_pattern:
    places:
    - axis1
    - hypo
    why: 축1 — 보정 폼
  team_stats:
    places:
    - axis1
    - axis2
    - hypo
    why: 축1 또는 축2 — 내용에 따라(둘 다 열어 두고 축이 쓸 것을 고른다)
  regression:
    places:
    - axis1
    - hypo
    why: 축1 — 운 요소·xG 대비 성과 보정
  strength_gap:
    places:
    - axis0
    - hypo
    why: 축0 — 전력 차
  home_field:
    places:
    - lambda_const
    why: 리그 홈 이점(λ 상수) — 가설 근거로도 쓰지 않는다(지시서 표의 `—`)
  match_type:
    places:
    - lambda_const
    - hypo
    why: 대회 유형 상수(λ·무승부)
  stakes:
    places:
    - V2
    - hypo
    why: 상성 밖 — V2 동기
  fatigue:
    places:
    - axis2
    - V3
    - hypo
    why: 축2 압박 감쇠(T2)만 — **적합된 경우** · V3 일정·피로
    axis_needs_fit: true
  travel_schedule:
    places:
    - axis2
    - V3
    - hypo
    why: 일정 부담 — 축2 는 적합된 경우만 · V3
    axis_needs_fit: true
  coach_intent:
    places:
    - axis2
    - V4
    - hypo
    why: 축2 전략 판정 입력(**확정 XI 와 일치할 때**) · 아니면 V4
    axis_needs_xi_match: true
  coach_conflict:
    places:
    - axis2
    - V4
    - hypo
    why: 같은 칸 — 발언과 명단이 어긋나면 V4 로만
    axis_needs_xi_match: true
  coach_change:
    places:
    - V1
    - V4
    - hypo
    why: 감독 교체 직후 → V1 기준 낡음 · V4
  coach_quote:
    places:
    - V4
    - hypo
    why: V4 — 감독 발언(상성 밖)
  h2h_pattern:
    places:
    - V5
    - hypo
    why: 상성 밖 — V5 맞대결
  venue_weather:
    places:
    - V4
    - hypo
    why: V4 기타 — 날씨·구장 상태
  individual_title:
    places:
    - V4
    - hypo
    why: V4 기타
  individual:
    places:
    - V4
    - hypo
    why: V4 기타 — 개인 기록
  emotion:
    places:
    - V4
    - hypo
    why: V4 기타 — 정서·분위기(확률에 닿지 않는다)
  event_match:
    places:
    - V4
    - hypo
    why: V4 기타 — 은퇴 경기 등
  pitcher_state:
    places:
    - hypo
    why: 야구 선발 상태 — 축구 상성 축에 자리가 없다(가설 근거로만)
  form_streak:
    places:
    - axis1
    - axis2
    - hypo
    why: 🔴 쪼갠 유형(2026-10-15) — 플래그 꺼짐이면 `team_stats` 와 같다
  standing_motive:
    places:
    - V2
    - hypo
    why: 🔴 쪼갠 유형(2026-10-15) — 플래그 꺼짐이면 `stakes` 와 같다
  mood:
    places:
    - V2
    - hypo
    why: 🔴 쪼갠 유형(2026-10-15) — 플래그 꺼짐이면 `stakes` 와 같다
  goal_profile:
    places:
    - axis1
    - axis2
    - hypo
    why: 🔴 쪼갠 유형(2026-10-15) — 플래그 꺼짐이면 `team_stats` 와 같다
fail:
  to: context_only
  note: 🔴 배치표에 없는 유형 — 근거 불가로 내렸다(지어서 배치하지 않는다)
lambda_rules:
  travel_away:
    rule: IR13
    mul: 0.95
    why: 이동이 멀면 원정이 불리하다(사용자 지시 2026-10-14 · 상식)
  fatigue:
    rule: IR11
    mul: 0.95
    why: 피로도는 일정과 관련있다(사용자 지시 2026-10-14)
  stakes_urgent:
    rule: IR14
    mul: 0.95
    side: opponent
    why: 순위 동기 — 급한 팀이 유리하다(사용자 지시 2026-10-14 · 승점·라운드 기준)
  floor_mul: 0.8
  source: 사용자 지시 2026-10-14 · 🔴 적합 아님
