# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **선수 능력치 — 강점·약점 문턱** (사용자 지시 2026-10-17)
# ══════════════════════════════════════════════════════════════════
#
# > 핵심선수 결장 · 후보선수로 대체했을때 가설제공(**숫자가 아닌 능력치**)
#
# 🔴 재료는 fotmob 선수 페이지의 `traits` 다(실측 2026-10-17 · `fotmob.traits_of`).
#    그 값은 **백분위(0~1)** 이고, **비교 묶음을 출처가 고른다**:
#
#      Duk(공격형 MF/윙)  "Stats compared to other attacking midfielders/wingers"
#         찬스 창출 0.36 · 공중볼 0.80 · 수비 행동 0.68 · 득점 0.34 · 슈팅 0.32
#      Nagai(골키퍼)      골키퍼는 **지표가 다르다**
#         선방률 0.88 · 실점 0.24 · 스위퍼 0.56 · 하이볼 0.01 · 클린시트 0.10
#
# 🔴 그래서 우리가 정하는 수는 **이 둘뿐**이다 — *"어느 백분위부터 강점이라고
#    부를까"*. ⚠️ 지표 목록·비교 묶음은 **출처가 준다**(여기 적지 않는다 · #1).
#
# ══════════════════════════════════════════════════════════════════
# ⚠️ 이 수는 **확률 계수가 아니다**
# ══════════════════════════════════════════════════════════════════
#
# 🔴 이 문턱이 하는 일은 **모델에게 줄 글자**를 고르는 것뿐이다
#    (`강점` / `보통` / `약점`). 확률·가중에 닿지 않는다 — 모델이 그 글자를
#    읽고 **부등호**를 내고, 방향은 부등호 표가, 가중은 코드가 넣는다.
# 🔴 그래서 이 수를 **원장으로 맞추지 않는다**(CLAUDE.md: 원장은 검증에만).
#
# 🔴 지금 값의 까닭 — 백분위는 **같은 자리 선수들 사이의 순위**다. 그래서
#    상위 30%(0.70↑)를 `강점`, 하위 30%(0.30↓)를 `약점`, 가운데 40%를 `보통`
#    으로 둔다. ⚠️ 이것은 **분포를 셋으로 가르는 자리**이고 적합한 값이 아니다 —
#    바꾸려면 **사용자가** 이 파일을 고친다(§13-7).
strong: 0.70
weak: 0.30

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **전술 갈래를 능력치로 가른다** — 사용자 지시 2026-10-17
# ══════════════════════════════════════════════════════════════════
#
# > 선발 명단·후보명단이 들어오면 **그 선수들의 능력치로 변수를 결정**하게
# > 한다 … 전술에 관련해서는 … **변수에 그렇게 들어가야 한다**
#
# 🔴 **왜 바꿨나 — 실측 2026-10-17(가시와 vs 나고야)**
#    ⑤-b3 1단이 `중원 수싸움` 을 **머릿수**로 갈랐다:
#        mid_line("3-4-2-1") = 4  ↔  mid_line("4-3-3") = 3  → 홈
#    ⚠️ 선수가 누구든 수만 같으면 같은 답이 나온다 — 그건 중원 싸움의 답이
#       아니다. 🔴 **누가 서 있느냐**가 답이어야 한다.
#
# 🔴 재료는 fotmob `traits` 의 **백분위**(0~1)다. ⚠️ 그 값은 **그 선수의
#    포지션군 대비**다(출처가 묶음을 고른다: "attacking midfielders/wingers"·
#    "center-backs" …). 그래서 **같은 자리끼리** 견준다.
#
# ⚠️ 지표 이름(`touches` …)은 **출처가 준다** — 여기서 짓지 않는다(#1).
#    우리가 고르는 것은 *"어느 갈래에 어느 지표를 쓸까"* 와 **문턱**뿐이다.
branches:
  중원 수싸움:
    pos: [MF]
    flank: [중앙]
    traits: [touches, defensive_actions]
    why: "공을 누가 잡고 누가 끊나"
  측면 집중:
    pos: [MF, FW]
    flank: [왼, 오른]
    traits: [chances_created, touches]
    why: "측면에서 만들어 내나"
  수비 라인:
    pos: [DF]
    flank: []                      # 🔴 빈 목록 = 자리를 안 가린다
    traits: [defensive_actions, aerials_won]
    why: "뒤에서 버티나"
  빌드업:
    pos: [DF, MF]
    flank: []
    traits: [touches, chances_created]
    why: "뒤에서 앞으로 잇나"
  압박 높이:
    pos: [MF, FW]
    flank: []
    traits: [defensive_actions]
    why: "앞에서 끊나"
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **교체 운용** — 사용자 지시 2026-10-17
  # ══════════════════════════════════════════════════════════════════
  #
  #  > 왜 **벤치 자원 활용에서 전략분석가들이 예측이 안 나오냐**?
  #
  #  ⚠️ **1단이 이 갈래를 못 가린다** — 벤치는 `XI.bench` 가 **이름 글자
  #     목록**이라 선수 번호가 없고, 번호가 없으면 능력치를 못 받는다
  #     (카드 InfoQ 의 *"벤치 id 확정"* 칸이 그것을 세고 있다).
  #  🔴 그래서 여기서는 **선발의 지친 자리**를 잰다 — 늦게 교체가 필요한 쪽이
  #     어디냐는 물음이다. 그 수가 곧 *"벤치를 언제 써야 하나"* 다.
  #     ⚠️ 이것은 **벤치 능력치가 아니다** — 그 사실이 사유에 글자로 나간다.
  #  🔴 벤치 번호가 들어오면 그때 `pos`/`flank` 를 벤치 쪽으로 바꾼다.
  교체 운용:
    pos: [MF, FW]
    flank: []
    traits: [touches, defensive_actions]
    why: "선발 앞선이 얼마나 버티나(벤치는 이름만 와서 능력치를 못 받는다)"

# 🔴 **문턱** — 두 팀 평균 백분위 차가 이보다 작으면 **안 가린다**(`=` 를
#    채택하지 않는다 · 방향 없는 채택은 변수 구실을 못 한다).
#    ⚠️ 백분위는 0~1 이다. 0.10 은 *"열 명 중 한 명만큼 앞선다"* 는 뜻이다.
#  🔴🔴 **0.10 → 0.08**(사용자 지시 2026-10-18 · M6) — 네 경기 연속 0.08~0.09 로
#     아깝게 미달했다(오스틴·댈러스·캔자스). 그 차도 방향으로 센다.
branch_gap: 0.08

# 🔴 **최소 인원** — 한쪽이 이보다 적으면 평균이 한 사람에 휘둘린다 → 못 잰다.
branch_min: 2

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **양쪽 인원 차 허용값** — 사용자 결정 2026-10-19(ㄴ)
# ══════════════════════════════════════════════════════════════════
#
#  ⚠️ 실측 — 표본 수가 다른 두 평균을 견주면 비교의 전제가 깨진다(르아브르
#     1-3: 0.50(**8명**) ↔ 0.37(10명) → 홈이라 적었고 원정이 이겼다).
#  🔴 그런데 **완전 일치**(0)로 막으니 쓸 만한 신호도 같이 버려졌다 —
#     즈볼러 4-1: `BR0`(가려진 갈래 홈 4 ↔ 원정 1 · 방향이 맞았다)가
#     **10명 ↔ 11명**이라 날아갔다.
#  🔴 그래서 **차 1명까지 허용**한다. ⚠️ 이 수는 측정이 아니라 **사용자가
#     정한 손값**이다(§13-7) — 0 으로 바꾸면 완전 일치, 크게 하면 느슨해진다.
#  🔴 읽는 곳은 `ability.count_slack()` 하나다(사본 금지) —
#     `AB1`·`AB3`·갈래(`judge_branch`)·`DV3` 가 그 하나를 쓴다.
count_slack: 1

# 🔴 **받을 선수 수 상한** — 선발 11 + 벤치다. 한 명이 ~2초(실측 2026-10-17)
#    라 팀당 18명이면 두 팀 ~72초다. ⚠️ 카드 상한(`state.clock`)이 먼저다.
squad_cap_per_side: 18

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **안전장치 — 선발 능력치 최소 인원** (사용자 지시 2026-10-19)
# ══════════════════════════════════════════════════════════════════
#
#  > **선발 11명 능력치를 받지 못하면 분석은 무의미하다**
#
#  🔴 양 팀 **각각** 이만큼 받아야 확률로 간다. 못 받으면 카드는 확률 칸을
#     **비운 채** "선발 능력치 미확보 — 누구" 로 나간다(숫자를 낸 채 🔴만 다는
#     것 금지 · 라인업 신원 검문과 같은 규율).
#
#  ⚠️ 이 검문이 막으려는 판 — 실측 2026-10-19(하르키우 2-1 리비 베레흐):
#     fotmob 이 선발 22명 중 **20명의 `traits` 를 `null`** 로 줘서 원정이
#     **0명**이었다. 그런데도 카드는 확률(홈 32.9 · 무 32.2 · 원정 34.9)을
#     냈다 — 양쪽 비교가 통째로 빈 수였고, 결과는 홈 승이었다.
#
#  ⚠️ **XI 가 아예 없는 판**(T−24h 기본 카드)은 이 검문을 건너뛴다 — 없는 것은
#     모순이 아니다(`pipeline` 이 라인업 신원 검문과 같은 자리에서 적는다).
#  🔴 이 수는 **사용자가 정한다**(§13-7). 0 으로 두면 검문을 끈다.
#  🔴 읽는 곳은 `ability.xi_min()` 하나다(사본 금지).
xi_ability_min_per_side: 11
