# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **상수는 근거와 함께** — v5 §5-6 [#23]
# ══════════════════════════════════════════════════════════════════
#
# > **ERA 차 0.75 같은 임의 상수로 방향을 정하지 않는다** … 상수가 필요한 자리는
# > `config/thresholds.yaml` 에 **근거(원장 통계)와 함께** 적고, **근거 없는
# > 상수는 계약 실패.**
#
# 🔴 왜 — 실측 2026-10-04(밀워키 vs 샌디에이고):
#
#     §4 pitcher_state — 선발 방어율 2.47 vs 3.21 (차이 **0.74** < 문턱 **0.75**)
#                        · 비슷하다고 본다
#
# ⚠️ **0.01** 차로 선발이 배경으로 떨어졌고 M18 이 총점·핸디를 거뒀다.
# 🔴 그 `0.75` 는 **내가 고른 수**다 — 어디서도 재지 않았다. 그래서 걷었다.
#
# ⚠️ 여기 적는 모든 줄은 `basis` 를 들어야 한다. 🔴 *"아직 안 쟀다"* 를 근거로
#    적는 것은 **허용한다** — 그 사실이 글자로 남아야 다음 사람이 측정한다(#3).
#    ⚠️ 그러나 **방향을 정하는 데는 쓰지 않는다**(그것이 §5-6 의 금지다).

thresholds:
  # ══════════════════════════════════════════════════════════════
  # 🔴🔴 **§6-8 — 등급 경계값**. 다섯 어휘가 여기서 갈린다.
  # ══════════════════════════════════════════════════════════════
  #
  # > 등급은 **1.0 낸다 / 0.85·0.9 소액 / 0.8 소액 하단 / 그 아래 없음 /
  # > 자료 부족.** 등급 경계값(0.85·0.8 의 무게 기준)은 원장 30건 뒤 재보정하고
  # > 그 전엔 초기값을 `config/thresholds.yaml` 에 근거와 함께 적는다.
  #
  # ⚠️ 종전에 `app/types.py` 가 `NAME_AT = 1.0` · `SMALL_AT = 0.8` 을 **코드에
  #    박고** 있었고, 0.85 라는 중간 칸은 **아예 없었다** — 상한에 걸려 0.85 로
  #    내려온 마켓과 바닥에서 간신히 선 0.8 마켓이 카드에서 **같은 글자**를 받았다.
  verdict_name_at:
    value: 1.0
    basis: |
      🔴 v5 §6-8 원문 *"1.0 낸다"* — 지시문이 정한 수다. v4 §6-b 도 같다
      (*"모든 시나리오에서 살아남는 마켓만 낸다"* — 하나라도 죽으면 1.0 이 아니다).
      ⚠️ 측정으로 고칠 값이 아니다 — **정의**다.
  verdict_small_at:
    value: 0.85
    basis: |
      🔴 v5 §6-8 원문 *"0.85·0.9 소액"*. ⚠️ 종전에 이 칸이 **없었다**(0.8 과
      0.9 가 같은 글자였다). §6-5 상한표가 `0.85`·`0.9` 를 쓰므로 그 두 수가
      내려오는 자리를 `소액` 으로 묶는 것이 §6-8 의 뜻이다.
      🔴 **원장 30건 뒤 재보정**이라고 지시문이 적었다. ⚠️ 그런데 사용자 지시
      2026-10-02 는 *"쌓이는거는 우리 로직이 맞냐 틀렸냐만 **검증하는 방법으로만**
      사용한다"* 다 — 원장으로 **계수를 맞추지 않는다.** 그 충돌을 여기 남긴다:
      30건이 쌓이면 **재보정이 아니라 검증**을 한다(이 경계가 말한 대로 났나).
  verdict_small_low_at:
    value: 0.8
    basis: |
      🔴 v5 §6-8 원문 *"0.8 소액 하단 / 그 아래 없음"*. v4 §6-b 의 `SMALL_AT`
      과 같은 수이고 §6-5 상한표의 바닥(`없음 0.8`)과도 같다 — 상한이 가장 센
      칸에서 내려온 마켓이 서는 자리다.
      🔴 **원장 30건 뒤 검증**(위와 같다 — 재보정이 아니다).
  # ══════════════════════════════════════════════════════════════
  # 🔴 §5-5 — 표본
  # ══════════════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════════════
  # 🔴🔴 **§7-5 — 자료 부족을 선언할 자격**
  # ══════════════════════════════════════════════════════════════
  #
  # > **사다리 2단계 이상 · 도구 호출 6회 이상**을 실제로 돈 **로그가 있을 때만**
  # > R5 자료 부족을 선언한다. 그 전에 선언하면 `premature_insufficient` 실패.
  r5_min_ladder_steps:
    value: 2
    basis: |
      🔴 v5 §7-5 원문이 정한 수다(내가 고른 것이 아니다).
      ⚠️ 왜 **각도**를 세나 — 같은 각도로 열 번 던진 것과 두 각도로 두 번 던진
      것은 다르다. 실측 2026-10-04: §4-1 문지기가 `query_too_bare` 로 26건을
      막았는데, 그 26건은 **각도 하나**(팀 이름)였다.
  r5_min_tool_calls:
    value: 6
    basis: |
      🔴 v5 §7-5 원문. ⚠️ 실측 2026-10-02(중국 vs 팔레스타인 친선): 사실 6건 ·
      변수 0건으로 *"자료 부족"* 을 적었다. 🔴 그런데 그 경기의 자료 주소는
      `ext_id` 에 적혀 있었다(`fotmob-6280453`) — 깊이 라우팅이 안 돌아
      **아예 안 찾은** 것이다. 그것을 자료 탓으로 적으면 우리 결함이 숨는다.
  recent_min_games:
    value: 3
    basis: |
      v4 §7 R7 원문 — *"표본 3경기 미만은 패턴이 아니다"*. 🔴 지시문이 정한 수이고
      내가 고른 것이 아니다. §5-5 가 *"recent_pattern 은 표본 3경기 미만 0.4"* 로
      다시 못 박았다.
  stale_days:
    value: 7
    basis: |
      🔴 **사용자 지시 2026-10-04** — *"마지막 경기가 7일 이상 전이면 weight 0.4"*.
      실측 근거: 밀워키가 바이로 7일 쉰 뒤 "최근 3경기 3승"이 변수로 섰다.
  h2h_min_games:
    value: 8
    basis: |
      실측 2026-10-02 — 같은 맞대결 30경기를 창만 바꿔 재니 3경기 창이 상대
      승률을 **0%** 로 말했다(실제 36.7%) · 경기당 총골도 4.67↔2.73 으로
      1.93골 흔들렸다. 🔴 2026-10-01 에 그 함정으로 낙첨했다.
  min_venue_games:
    value: 8
    basis: |
      실측 2026-10-02(NHL 개막 직후) — 리그 전체 홈 12경기 · 디트로이트 홈
      **0경기** · 레인저스 원정 **1경기**. 그 표로 공격비를 계산하면 한 경기가
      전부다. 🔴 `h2h_min_games` 와 **같은 8** 을 쓴다(같은 까닭이다).

  # ══════════════════════════════════════════════════════════════
  # 🔴 §6 — 등급·거짓 1.0
  # ══════════════════════════════════════════════════════════════
  name_at:
    value: 1.0
    basis: v4 §6-b 원문. 🔴 *"죽는 시나리오가 0건"* 은 무게와 무관한 논리적 사실이다.
  small_at:
    value: 0.8
    basis: |
      v4 §6-b 원문. ⚠️ §6-8 이 *"등급 경계값은 **원장 30건 뒤 재보정**하고 그
      전엔 초기값을 `config/thresholds.yaml` 에 근거와 함께 적는다"* 고 했다 —
      🔴 **지금은 초기값이고 아직 재보정 전이다**(원장 30건이 안 쌓였다).
  break_even:
    value: 0.5
    basis: |
      🔴 두 쪽 마켓의 **손익분기점**이다 — 지어낸 값이 아니다(산수). 맞을 확률이
      틀릴 확률보다 작은 자리에 이름을 적는 것은 §0 과 정면으로 어긋난다.
  thin_set_vars:
    value: 5
    basis: |
      🔴 **사용자 지시 2026-10-04** — *"변수가 **5개 미만**인 경기에서 어떤
      마켓이든 생존 1.0 이 나오면 … 시나리오 세트 불완전으로 실패"*.
      실측 근거: 북마케도니아 vs 스코틀랜드가 변수 3개로 `언더 3.5 1.0` 을 냈고
      그 1.0 은 **4골 이상을 아무도 안 그린** 결과였다.

  # ══════════════════════════════════════════════════════════════
  # ⚠️ **걷은 상수** — 되돌리지 않게 여기 남긴다
  # ══════════════════════════════════════════════════════════════
  era_gap_min:
    value: null
    basis: |
      🔴🔴 **§5-6 이 걷었다**(2026-10-04). 종전 `0.75` 였고 **근거가 없었다** —
      내가 고른 수다. 실측에서 ERA 2.47 vs 3.21 이 **0.01** 차로 문턱에 못 미쳐
      선발이 배경으로 떨어졌고 M18 이 총점·핸디를 거뒀다.
      ⚠️ §5-6: *"`pitcher_state` 는 두 투수의 **사실을 변수로 보존**하고, 방향은
      **시나리오 단계에서 변수 조합으로** 나타난다."*
      🔴 그래서 이 값은 `null` 이고 **쓰지 않는다.** 원장이 쌓이면 그때 재다.
