# ══════════════════════════════════════════════════════════════════
# 🔴 별칭을 **어디에 쓰나** (세 자리 · `app/entities.py` 가 읽는다)
# ══════════════════════════════════════════════════════════════════
#
#  ① **검색어** — 공식명 대신(또는 더해) 별칭으로 던진다(기술 1·2)
#  ② **귀속 검사** — 기사가 우리 팀을 말하나(`verify.mentions_team`)를 별칭으로도 본다
#  ③ **열기 순서** — 그 팀의 현지 매체를 먼저 연다(`rules.host_rank` 보다 앞)
#
# ⚠️ ①에서 별칭을 **공식명과 함께** 쓰지 않는다 — `Colombia Tricolor` 는 아무 데도
#    없는 문자열이다. **한 질의에 하나**다(별칭 질의와 공식명 질의를 따로 던진다).

