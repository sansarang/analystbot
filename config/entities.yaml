# 별칭 사전 — **현지 매체가 부르는 이름 · 감독 · 핵심 선수 · 현지 매체**
#
# ══════════════════════════════════════════════════════════════════
# 🔴 왜 이 파일이 생겼나 — 사용자 기술 지시 2026-10-03 (기술 1)
# ══════════════════════════════════════════════════════════════════
#
# > 내가 잘 찾는 이유의 절반은 팀을 **공식명이 아니라 현지 매체가 부르는 이름**으로
# > 치기 때문이다. 엘살바도르는 `Selecta`, 자메이카는 `Reggae Boyz`, 파라과이는
# > `Albirroja`, 소프트뱅크는 `ホークス` 로 쳐야 현지 기사가 나온다. **감독·주장·핵심
# > 선수 이름도 검색어가 된다.** 오늘 자메이카 이탈자 5명은 `Speid` 로 찾았다.
#
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **지어내지 않는다** — 이 파일에 적을 수 있는 것은 둘뿐이다
# ══════════════════════════════════════════════════════════════════
#
#   ① 사용자가 **직접 준** 이름 (출처: 사용자 지시 2026-10-03)
#   ② 이 저장소가 **실측으로 확인한** 것 (출처: 그 실측 날짜)
#
# ⚠️ 내가 "아는 것 같은" 별칭·감독은 적지 않는다. 감독은 바뀌고 별칭은 틀리면 검색이
#    통째로 엉뚱한 데로 간다 — 그것이 0건보다 나쁘다(거짓 변수를 만든다).
# 🔴 **선언한 팀만** 이긴다. 없는 팀은 종전 경로(공식명 + `search_langs.yaml` 언어)로
#    가고, 그 사실이 사유로 남는다.
#
# ⚠️ 감독 이름은 **자료가 이기게** 두었다 — fotmob 라인업이 `coach` 를 주면 그것을
#    먼저 쓰고(더 신선하다), 없을 때만 이 파일을 본다(`app/entities.py`).

