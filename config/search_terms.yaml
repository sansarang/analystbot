# 딥서치(층2) 검색어 — 리그별 현지어, **2단계**. 지시문 Part 2 / 4-1.
#
#   pre    : T-3h. 예상 라인업·결장 — 게이트 대상 경기만
#   lineup : T-60m. 공식 확정 — Flashscore 가 official 을 주면 생략
#
# 🔴 층1 위성(다음 뉴스검색)의 `_SOCCER_TERMS = ""` 를 대체하지 않는다.
#    거기 검색어를 붙였더니 맥도날드·프로야구·연예 기사가 왔다(실측 2026-09-12).
#
# ⚠️ `{team}` 에는 **현지 표기**가 들어간다(`sc Heerenveen`·`Lecce`·`ソフトバンク`).
# ⚠️ 한국어 검색어는 토르로 못 나간다(`is_tor_safe_query` 거부). 다음·그라운딩으로.
#
# ⚠️ 지시문에 있으나 우리 시스템에 **리그가 없어** 넣지 않은 것:
#      ligue1 · eredivisie · championship · j2 · kleague2
#    (`app/leagues.py` 가 원본 — EPL·라리가·세리에A·분데스·J1·덴마크·K리그1)
# ⚠️ 우리에만 있고 지시문에 **없는** 리그: denmark. 덴마크어를 지어내지 않고
#    영어로 둔다. 사용자가 정해 주면 바꾼다.

terms:
  # 🔴 [SCT-8 2026-09-14 사용자 지시] **두 벌이다.**
  #    첫 줄 = 대진 질의(오늘 경기 기사) · 둘째 줄 = 팀 질의(결장 뉴스).
  #    팀 질의에는 **신선도 토큰**(오늘/oggi/hoy/heute/today…)을 반드시 붙인다 —
  #    실측 2026-09-14: 토큰이 없으면 구글이 과거 전체를 매칭해 80건 중
  #    48시간 안이 **0건**이었다(434h·3386h·5881h…). 대진 질의는 같은 통로에서
  #    1.6~5.1h 짜리가 열 건 넘게 나왔다.
  #    ⚠️ 대진 질의가 10건 이상이면 팀 질의는 생략한다(`PAIR_HITS_ENOUGH`).
  epl:
    pre:    ["{home} v {away} team news", "{team} injury news today"]
    lineup: ["{home} v {away} confirmed lineups"]
  la_liga:
    pre:    ["{home} {away} alineaciones probables", "{team} bajas hoy"]
    lineup: ["{home} {away} alineación oficial"]
  serie_a:
    pre:    ["{home} {away} probabili formazioni", "{team} infortunati oggi"]
    lineup: ["{home} {away} formazioni ufficiali"]
  bundesliga:
    pre:    ["{home} {away} Aufstellung", "{team} Ausfälle heute"]
    lineup: ["{home} {away} Aufstellung offiziell"]
  # 🔴 [ACL-1 2026-09-15] ACL 엘리트. 영어로 던진다 — 참가국이 섞여
  #    한 언어로 못 모은다(한국·일본·중국·베트남·호주).
  #    ⚠️ 현지어가 더 나은 건 분명하지만, 그건 팀별 로케일이 필요하고
  #       지금 구조는 **리그별**이다. 한계를 알고 영어로 둔다.
  # 🔴 [PA-20 2026-09-16] **현지어를 더한다.** 지시문 §2 "하지 말 것":
  #   *영어 검색어로 비영어권 리그 검색(지역지가 안 잡힌다)*.
  #   ACL 엘리트 동부는 J리그·K리그 팀이 대부분인데 검색어가 영어뿐이었고,
  #   그 결과 후보가 베팅·예측 사이트로 채워졌다(실측 2026-09-16 18:08).
  #   ⚠️ 영어 질의도 **남긴다** — 태국·호주·중국 팀은 그쪽이 낫다.
  #      대회 이름을 각 언어로 쓰는 것이 핵심이다(AFC 챔피언스리그 엘리트).
  acl:
    pre:
      - "{home} vs {away} AFC Champions League preview"
      - "{team} team news AFC Champions League"
      - "{team} 予想スタメン 負傷 欠場 ACL"
      - "{team} 프리뷰 부상 결장 ACL"
    lineup:
      - "{home} vs {away} confirmed lineup AFC Champions League"
      - "{team} スタメン発表 ACL"
      - "{team} 선발 라인업 ACL"
  # ⚠️ 아래 둘은 **우리 시스템에 리그가 없다**(app/leagues.py 가 원본).
  #    사용자가 모양을 지정했으므로 적어 두되, 리그가 생기기 전에는 안 쓰인다.
  ligue1:
    pre:    ["{home} {away} compos probables", "{team} blessés aujourd'hui"]
    lineup: ["{home} {away} compos officielles"]
  eredivisie:
    pre:    ["{home} {away} opstelling", "{team} blessures vandaag"]
    lineup: ["{home} {away} opstelling bekend"]
  # ⚠️ 아래는 **팀 질의 유지**(사용자 지시) — 현지 매체가 팀 단위로 쓴다.
  j1:
    pre:    ["{team} 予想スタメン 負傷 欠場"]
    lineup: ["{team} スタメン発表"]
  kleague1:
    pre:    ["{team} 프리뷰 부상 결장"]
    lineup: ["{team} 선발 라인업"]
  denmark:
    pre:    ["{team} forventet startopstilling skader"]   # 임시 — 사용자 확인 필요
    lineup: ["{team} startopstilling officiel"]
  npb:
    pre:    ["{team} 予告先発"]
    lineup: ["{team} スタメン"]
  kbo:
    pre:    ["{team} 내일의 선발투수", "{team} 엔트리 말소"]
    lineup: ["{team} 선발 라인업 타순"]
  mlb:
    pre:    ["{team} probable pitcher injury report"]
    lineup: ["{team} lineup today"]

# `lineup` 단계에서 제목에 이 말이 있으면 tier 무관 최우선(지시문 4-3 ④).
confirm_keywords:
  - 확정
  - oficial
  - oficiales
  - ufficiali
  - offiziell
  - bekend
  - confirmed
  - 発表
  - officiel

# 날짜 문(4-3 ②) — 제목·스니펫에 이 중 하나가 있어야 통과.
today_words:
  - 오늘
  - hoy
  - oggi
  - heute
  - vandaag
  - today
  - 本日
  - i dag

# ── [SCT-7 2026-09-14 사용자 지시] Google News RSS 로케일.
#
# 🔴 새로 정하는 값이 아니다 — 위 `terms` 가 **이미 그 언어로** 쓰여 있고,
#    여기는 같은 사실을 RSS 파라미터 모양으로 적을 뿐이다(세리에A = it/IT).
# 🔴 `ceid` 는 적지 않는다 — `{gl}:{hl 앞 2자}` 로 코드가 만든다(사본 금지).
# ⚠️ 덴마크는 `terms` 가 영어다(덴마크어를 지어내지 않았다). 로케일도 그에
#    맞춰 en/DK 다. 사용자가 덴마크어 검색어를 주면 둘을 함께 바꾼다.
locales:
  epl:        {hl: en, gl: GB}
  acl:        {hl: en, gl: SG}   # [ACL-1] 참가국이 섞인다 — 영어·싱가포르
  la_liga:    {hl: es, gl: ES}
  serie_a:    {hl: it, gl: IT}
  bundesliga: {hl: de, gl: DE}
  j1:         {hl: ja, gl: JP}
  kleague1:   {hl: ko, gl: KR}
  denmark:    {hl: en, gl: DK}
  mlb:        {hl: en, gl: US}
  kbo:        {hl: ko, gl: KR}
  npb:        {hl: ja, gl: JP}
