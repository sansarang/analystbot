# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **전략 → 확률 이동량** — 사용자 지시 2026-10-10(둘째) §3-2
# ══════════════════════════════════════════════════════════════════
#
# > 이동량: 과거 자료로 **적합**한다 — *"그 리그에서 평소 대비 ΔA가 −10% 이상인
# > 명단을 낸 경기의 득점·결과 변화"*, *"3백 전환 원정 경기의 실점·무승부율"* 등.
# > 유형별 **표본·계수·검증 수치**를 `config/strategy_effects.yaml` 에. **적합 못
# > 한 유형은 임시값 + 카드 표시.** 경기당 총 이동 상한은 기존 **±0.5 로그 오즈 ·
# > λ ±15%**.
#
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **지금은 전부 임시값이다 — 적합한 적이 없다**
# ══════════════════════════════════════════════════════════════════
#
# 🔴 적합에 필요한 것은 *"경기마다 **확정 XI** + 평소 XI + 결과"* 다. 실측
#    2026-10-10 — 우리가 들고 있는 것:
#      · 확정 XI: 경기 페이지에서 **그 경기 한 건**씩만 받는다(과거 경기는
#        `facts.past_xi` 로 최대 5경기)
#      · 과거 경기의 **포메이션**은 그 5경기에만 있다
#      · 리그 전체의 경기별 XI 이력은 **받는 통로가 없다**
#    🔴 그래서 *"그 리그에서 ΔA −10% 명단을 낸 경기"* 를 셀 표본이 **0건**이다.
#
# ⚠️ 그래서 아래 `effects` 의 수는 **감으로 정한 임시값**이고, 그 사실이
#    `fit.provisional: true` 로 적혀 있다. 🔴 카드는 그 유형이 쓰일 때마다
#    **"임시값"** 을 적는다(`app/core/strategy.py: move_of`).
# 🔴 적합하는 길은 `tools/fit_strategy_effects.py` 다 — 지금 돌리면 *"표본이
#    없다"* 고 **적지 않고 멈춘다**(실행 중 적합 금지 · 지어낸 수 금지).
#
# ⚠️ **방향은 지어낸 것이 아니다** — 지시서 §3-2 가 글자로 줬다:
#    *"잠그기 → 그 팀 패 확률↓·무승부↑ / 공격 위주 → 그 팀 승·패 둘 다↑
#    (무승부↓) / 로테이션 → 그 팀 승↓ / 실험 → 무승부·변동성↑."*
#    🔴 **크기만** 임시값이다.

source: "방향은 사용자 지시 2026-10-10(둘째) §3-2 · 크기는 적합 전 임시값"
checked_at: "2026-10-10"
fitted_by: "tools/fit_strategy_effects.py"

# 🔴 경기당 **총 이동 상한** — 지시서가 준 수(기존 상한과 같다)
caps:
  #: 🔴 한 결과의 총 이동(로그 오즈) — `config/interpret_rules.yaml` 의 ③ 상한과 같다
  logodds: 0.5
  #: 🔴 λ(팀당 기대 득점) 배율 상한 — ±15%
  lambda_pct: 15

# ══════════════════════════════════════════════════════════════════
# 🔴 유형별 이동량
# ══════════════════════════════════════════════════════════════════
#
# 칸 뜻:
#   `own_win_logodds`  그 팀 **승** 쪽 로그 오즈 이동
#   `own_loss_logodds` 그 팀 **패** 쪽 로그 오즈 이동
#   `draw_logodds`     **무승부** 쪽 로그 오즈 이동
#   `lambda_own`       그 팀 λ 배율(비율 · `-0.08` = −8%)
#   `lambda_opp`       **상대** λ 배율
#   `fit`              표본·검증·임시값 여부 — 🔴 **이 칸이 없으면 쓰지 않는다**

effects:
  수비 위주:
    # > 잠그기 → 그 팀 **패 확률↓ · 무승부↑**
    own_win_logodds: 0.0
    own_loss_logodds: -0.15
    draw_logodds: 0.20
    lambda_own: -0.08
    lambda_opp: -0.10
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 리그 경기별 확정 XI 이력을 받는 통로가 없다"}

  공격 위주:
    # > 공격 위주 → 그 팀 **승·패 둘 다↑**(무승부↓)
    own_win_logodds: 0.15
    own_loss_logodds: 0.10
    draw_logodds: -0.20
    lambda_own: 0.10
    lambda_opp: 0.05
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 리그 경기별 확정 XI 이력을 받는 통로가 없다"}

  역습:
    # ⚠️ 지시서가 역습의 **방향을 따로 주지 않았다**. 🔴 그래서 **확률을 움직이지
    #    않는다**(지어내지 않는다) — 카드에 전략만 적고 λ 만 살짝 내린다(양 팀이
    #    뒤로 서면 총골이 내려간다는 것은 `수비 위주` 와 같은 방향이다).
    own_win_logodds: 0.0
    own_loss_logodds: 0.0
    draw_logodds: 0.0
    lambda_own: -0.05
    lambda_opp: -0.05
    fit: {n: 0, provisional: true,
          why: "지시서가 승무패 방향을 안 줬다 — 승무패는 **안 움직인다**"}

  로테이션·체력 관리:
    # > 로테이션 → 그 팀 **승↓**
    own_win_logodds: -0.18
    own_loss_logodds: 0.10
    draw_logodds: 0.05
    lambda_own: -0.07
    lambda_opp: 0.03
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 리그 경기별 확정 XI 이력을 받는 통로가 없다"}

  실험:
    # > 실험 → **무승부·변동성↑**
    own_win_logodds: -0.05
    own_loss_logodds: 0.0
    draw_logodds: 0.15
    lambda_own: 0.0
    lambda_opp: 0.05
    fit: {n: 0, provisional: true,
          why: "적합 못 했다 — 변동성을 재는 칸이 우리 모형에 없다(무승부만 올린다)"}

  평소 그대로:
    # 🔴 **아무것도 움직이지 않는다** — 그것이 이 판정의 뜻이다
    own_win_logodds: 0.0
    own_loss_logodds: 0.0
    draw_logodds: 0.0
    lambda_own: 0.0
    lambda_opp: 0.0
    fit: {n: 0, provisional: false,
          why: "움직일 것이 없다 — 임시값 표시도 필요 없다"}

# ══════════════════════════════════════════════════════════════════
# 🔴 §3-2 — **ΔA·ΔD 가 λ 를 움직인다**(전략과 따로 더해진다)
# ══════════════════════════════════════════════════════════════════
#
# > 총골: **ΔA·ΔD와 2-3 조합으로 두 팀 λ를 움직인다**(총골 모델 지시서의 λ 배율).
#
# ⚠️ 이 둘도 **임시값**이다. 🔴 뜻: ΔA 가 −10% 면 그 팀 λ 가 `0.10 × 0.4 = 4%`
#    내려간다(계수 0.4). 상한은 위 `caps.lambda_pct` 가 전체를 묶는다.
contrib:
  #: 🔴 공격 기여 변화율(%) → 그 팀 λ 배율
  da_to_lambda_own: 0.4
  #: 🔴 수비 자리 가치 변화율(%) → **상대** λ 배율(수비가 약해지면 상대 λ↑)
  dd_to_lambda_opp: -0.3
  fit: {n: 0, provisional: true,
        why: "적합 못 했다 — ΔA 는 핵심 선수 2명 기준이고 ΔD 는 가치 합이다"}

# ══════════════════════════════════════════════════════════════════
# 🔴 §3-3 — **감독 패턴**은 표본 5경기 미만이면 확률을 안 움직인다
# ══════════════════════════════════════════════════════════════════
coach_pattern:
  min_sample: 5
  note: "표본 5경기 미만이면 **표시만** 한다(지시서 §3-3)"
