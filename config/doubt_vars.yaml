    judge: false
    우선: 2
  I1:
    name: 기온·습도·바람·강수
    grade: 관찰
    judge: false
    우선: 2
    재료: 좌표 + 킥오프 시각(축구 날씨 통로는 ⬜)
    fit:
      at: '2026-10-14'
      promote: false
      why: 축구 날씨 통로 없음
  I2:
    name: 혹서·혹한·우천 취소
    grade: 가설
    judge: false
    우선: 3
  J1:
