# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **의심 변수 등록표**(의심 검증 통합본 v2 · 2026-10-14i §3)
# ══════════════════════════════════════════════════════════════════
#
#  > 변수는 **"의심 변수"로만** 쓴다 — 봇 확률이 **그 상황에서 맞는지** 재는
#  > 조건이다. 깨짐·반격·살아남은 결론 같은 **공격 계층은 폐기**했다.
#  > (가) 걸리면 봇 실측 낮아짐 → 유효 · (나) 차이 없음 → 제거 ·
#  > (다) 봇이 더 맞음 → 제거 + "봇 확신" 근거로 기록.
#
# 🔴 등급·시험 결과는 **측정 도구가 적는다**(`tools/fit_doubt.py`) — 손으로 안 올린다.
grades:
- 확정
- 관찰
- 가설
vars:
  A1:
    name: Elo 차
    grade: 확정
    judge: true
    재료: 국내 Elo(football-data·fotmob) · 대륙은 리그 오프셋
    공격: 오프셋 ⬜ 이면 체급 근거 0
  A2:
    name: 축0 선수 가치
    grade: 확정
    judge: true
    재료: fotmob 선수 가치 로그합 + 호흡 + 빠진 주전
    공격: 강등·승격팀 착시(지난 시즌 리그) · 확정 XI 기준 · 가치 메운 수 · 리그 표준화 값으로 재계산
  A3:
    name: 스쿼드 깊이
    grade: 관찰
    judge: false
    재료: 벤치 가치 합
  A4:
    name: 이적·임대 직후
    grade: 가설
    judge: false
    재료: ⬜ 이적 창 날짜 통로 없음
  B1:
    name: 축1 폼
    grade: 확정
    judge: true
    재료: 최근 5·10경기 득실(쪽 폼 수축)
    공격: 표본 경기 수 · 시즌 초 수축
  B2:
    name: xG 차이(득점−xG · 실점−xGA)
    grade: 관찰
    judge: false
    우선: 1
    재료: 경기 페이지 팀 xG(extra.xg)
    공격: 최근 10경기 xG 대비 +1.5골 이상 과대면 깨짐 후보 · 10경기 미만 표본은 안 쓴다
    cut:
      games: 10
      over: 1.5
    fit:
      n_on: 360
      n_off: 647
      hit_on: 0.5444
      hit_off: 0.493
      diff: 0.0514
      lo: -0.0129
      hi: 0.1157
      promote: false
      at: '2026-10-14'
      표본: 1470경기
    시험: (다) 봇이 더 맞음 — +5.1%p [−1.3, +11.6] → 제거
  B3:
    name: 운 요소 골
    grade: 확정
    judge: true
    재료: T12(자책·굴절·xG<0.05)
    공격: 운 요소 골 제거 후 폼 재계산
  B4:
    name: 골키퍼 선방 과대(PSxG−실점)
    grade: 관찰
    judge: false
    우선: 1
    재료: ⬜ PSxG 통로 없음 — 상대 xG 대 실점으로 대용
    fit:
      n_on: 377
      n_off: 630
      hit_on: 0.5093
      hit_off: 0.5127
      diff: -0.0034
      lo: -0.0672
      hi: 0.0604
      promote: false
      at: '2026-10-14'
      표본: 1470경기
    시험: (나) 차이 없음 — −0.3%p → 제거
  B5:
    name: 연승·연패
    grade: 관찰
    judge: false
    재료: 연속 기록
    공격: 연승 자체를 근거로 쓰지 않는다(평균 회귀)
  C1:
    name: 리그 홈 이점
    grade: 확정
    judge: true
    재료: 리그·시즌 실측
    공격: 실측(1.20~1.24)과 대조
  C2:
    name: 팀별 홈 효과
    grade: 확정
    judge: true
    재료: 그 팀 홈/원정 득실(③ 반영판 — 지금은 끔)
    공격: 분위 보정표의 그 분위 실측이 기준(43.4%) 이하면 깨짐
  C3:
    name: 이동 거리
    grade: 관찰
    judge: false
    우선: 1
    재료: 경기장 좌표(extra.venue.lat/lon) · 원정 팀 직전 경기장
    공격: 100km 문턱 · 원정 쪽 · 대륙은 시차 포함
    cut:
      km: 100
    fit:
      at: '2026-10-14'
      diff: 0.006
      lo: -0.054
      hi: 0.066
      promote: false
      why: 4분위로 바꾸니 체급별로 **부호가 뒤집힌다**(중 −11.7%p · 강 +14.6%p) — 단일 공격 불가
    시험: (나) 차이 없음(체급별로 부호가 뒤집힌다) → 제거
  C4:
    name: 중립 경기
    grade: 확정
    judge: true
    재료: 대회 형식 표(CC3)
    공격: 홈 이점 0
  C5:
    name: 관중 규모·무관중
    grade: 관찰
    judge: false
    우선: 2
    재료: extra.attendance · venue.capacity
    fit:
      at: '2026-10-14'
      diff: 0.007
      promote: false
    시험: (나) 차이 없음 — +0.7%p → 제거
  C6:
    name: 인조잔디·고지대·구장 크기
    grade: 가설
    judge: false
    우선: 3
    재료: ⬜ 표면·고도 통로 없음
  D1:
    name: 휴식일
    grade: 관찰
    judge: false
    우선: 1
    재료: 그 팀 직전 경기 날짜(덤프 순서로 계산)
    공격: 3일 미만 쪽 · 체급별(상위/하위)로 따로 측정
    cut:
      days: 3
    fit:
      at: '2026-10-14'
      promote: false
      why: 컵·대륙 포함해도 3일 미만이 338건 중 **1건**
    시험: 측정 불가 — 컵 포함해도 3일 미만이 338건 중 1건
  D2:
    name: 14일 내 경기 수
    grade: 관찰
    judge: false
    우선: 2
    재료: 덤프 날짜
    cut:
      games: 3
  D3:
    name: 대륙 대회 전후
    grade: 관찰
    judge: false
    우선: 2
    재료: ⬜ 국내 백필엔 대륙 일정이 없다
  D4:
    name: 로테이션
    grade: 관찰
    judge: false
    우선: 1
    재료: extra.starters(직전 경기 선발과 겹침)
    공격: 직전 대비 바뀐 선발 수
    cut:
      changed: 4
    fit:
      n_on: 496
      n_off: 927
      hit_on: 0.502
      hit_off: 0.4865
      diff: 0.0155
      lo: -0.039
      hi: 0.07
      promote: false
      at: '2026-10-14'
      표본: 1470경기
    시험: (나) 차이 없음 — +1.6%p [−3.9, +7.0] → 제거
  D5:
    name: A매치 복귀
    grade: 가설
    judge: false
    우선: 3
  D6:
    name: 킥오프 시간 · 시즌 초/말
    grade: 가설
    judge: false
    우선: 3
    재료: extra.kickoff(시각은 있다 · 효과 미측정)
  E1:
    name: 확정 XI 핵심 빠짐
    grade: 확정
    judge: true
    재료: 축0 상위 3 · 결장 사다리
    공격: 빠짐이 결론 반대 방향이면 깨짐
  E2:
    name: 결장 사다리 원천 등급
    grade: 확정
    judge: true
    재료: 사다리 칸(S/A/B/C)
    공격: S·A 확인만 판정 · B·C 단독은 표시
  E3:
    name: 포지션 구멍
    grade: 관찰
    judge: false
    재료: 포지션별 대체 가치
  E4:
    name: 예상 XI 판
    grade: 확정
    judge: true
    공격: 확정 XI 전이면 E1~E3 판정 보류
  F1:
    name: 리드 유지력
    grade: 관찰
    judge: false
    우선: 1
    재료: extra.goals(before/after 스코어로 리드 뒤 실점)
    공격: 결론이 "지킨다"(승·−0.5·−1.5)에 걸렸고 리드 후 막판 실점 ≥2 면 그 줄 깨짐
    cut:
      late_min: 75
      times: 2
    fit:
      at: '2026-10-14'
      diff: -0.016
      lo: -0.076
      hi: 0.044
      promote: false
      why: 재정의(날린 비율)로도 구간이 0 을 품는다
    시험: (다) 봇이 더 맞음 — +6.3%p [+0.6, +12.0] → 제거
  F2:
    name: 추격력
    grade: 관찰
    judge: false
    우선: 1
    재료: 같은 재료(뒤진 뒤 득점)
    공격: 결론이 "따라잡는다"면 역으로 확인
    fit:
      n_on: 367
      n_off: 1103
      hit_on: 0.4659
      hit_off: 0.4968
      diff: -0.0309
      lo: -0.0898
      hi: 0.0281
      promote: false
      at: '2026-10-14'
      표본: 1470경기
  F3:
    name: 막판 득실 시간대
    grade: 관찰
    judge: false
    우선: 2
  F4:
    name: 교체 영향
    grade: 관찰
    judge: false
    우선: 2
    재료: ⬜ 교체 투입 득점 통로 없음
  F5:
    name: 세트피스 의존도
    grade: 관찰
    judge: false
    우선: 2
    재료: 골 유형(kind)
    fit:
      at: '2026-10-14'
      promote: false
      why: 골 유형(`situation`)이 이번 덤프에 없다 — 추출기는 고쳤다
  G1:
    name: 퇴장 빈도
    grade: 관찰
    judge: false
    우선: 2
    재료: ⬜ 퇴장 통로 미확인
    fit:
      at: '2026-10-14'
      promote: false
      why: 퇴장 통로 미확인
  G2:
    name: 심판 성향
    grade: 관찰
    judge: false
    우선: 2
    재료: extra.referee(이름은 있다 · 카드 수는 ⬜)
    fit:
      at: '2026-10-14'
      diff: -0.006
      promote: false
    시험: (나) 차이 없음 — −0.6%p → 제거
  G3:
    name: 출장정지 누적 경고
    grade: 확정
    judge: true
    재료: 연맹 공시(config/league_discipline.yaml) · 챔피언십은 ⬜
  H1:
    name: 순위 동기
    grade: 확정
    judge: true
    우선: 2
    재료: 그 시즌 누적 승점/경기(덤프 순서로 계산 · 누설 금지)
    공격: 결론이 **승점/경기 표와 반대쪽**이면 깨짐(체급 통제 뒤에도 남는다)
    fit:
      at: '2026-10-14'
      표본: 1470경기
      n_on: 291
      hit_on: 0.402
      hit_off: 0.531
      diff: -0.129
      lo: -0.195
      hi: -0.062
      promote: true
      체급:
        약: -0.045
        중: -0.137
        강: 표본 부족
      why: 구간이 0 을 품지 않고 중 체급에서도 남는다
    시험: (가) 유효 — 걸린 경기 적중 40.2% ↔ 53.1%(−12.9%p · [−19.5, −6.2])
  H2:
