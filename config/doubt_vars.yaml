    grade: 확정
    judge: true
    재료: 보드·피드 마진 제거(Shin)
    공격: 봇과 ≥10%p 반대 + 결론 쪽 ⬜ 있으면 깨짐
  J2:
    name: 배당 움직임
    grade: 가설
    judge: false
    우선: 3
    재료: ⬜ 캡처 시각별 기록 없음
  K1:
    name: 무 과소 구간
    grade: 관찰
    judge: false
    우선: 1
    재료: 무 구간 백필 편차(data/draw_bands)
    공격: 결론이 "무가 아니다"에 걸린 줄은 편차만큼 감점 후 재판정
    fit:
      at: '2026-10-14'
      표본: 1470경기
      bands:
        20~25%: -0.0408
        25~30%: 0.0052
      demote: true
      why: 무 구간 편차 부호가 표본 사이에서 뒤집힌다
    시험: 강등 — 무 편차 부호가 표본 사이에서 뒤집힌다
  K2:
    name: 저득점 두 팀
    grade: 관찰
    judge: false
    우선: 2
의심:
  상태:
  - 불리
