# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v5 §4-2 — 다국어 나라만** 여기 적는다
# ══════════════════════════════════════════════════════════════════
#
# > `langs = ['en'] + babel_likely(team.country)`. Babel 의 **likely-subtag**
# > (`Locale.parse('und_HR')` → `hr`)로 나라→언어를 **자동으로** 얻는다.
# > 다국어 나라(CH·BE·CA 등)만 `config/langs_override.yaml`.
#
# 🔴 **이 파일이 작아야 한다.** 커지면 Babel 을 안 쓰고 손으로 적는 것이다 —
#    계약이 스물 미만을 요구한다(`test_v5_4_2_다국어_나라만_선언으로_덮는다`).
# ⚠️ Babel 은 나라마다 **한 언어**를 준다(likely-subtag 의 정의다). 그래서
#    여러 언어를 쓰는 나라만 여기서 덧붙인다.
# 🔴 `en` 은 적지 않는다 — 코드가 **늘 맨 앞에** 붙인다(§4-2 원문).

countries:
  # 🔴 §4-2 가 **이름으로 댄** 셋
  CH: [de, fr, it]        # 스위스 — Babel 은 `de` 만 준다
  BE: [nl, fr]            # 벨기에 — Babel 은 `nl` 만 준다
  CA: [en, fr]            # 캐나다 — 퀘벡 매체가 프랑스어다
  # ⚠️ 아래는 **실측으로 필요했던 것만** 더한다(지어내 늘리지 않는다).
  #    🔴 비어 있어도 된다 — Babel 이 그 나라를 이미 맞히면 적을 일이 없다.
  ES: [es, ca]            # 스페인 — 카탈루냐 매체(ca)가 바르사 소식을 먼저 낸다
  IN: [hi, en]            # 인도 — Babel 은 `hi` 만 준다

source: v5 지시문 §4-2 (사용자 문서 2026-10-04 · PDF 6쪽)
