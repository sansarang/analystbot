# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **배당 피드 표** — 네 층 지시서 §2-1 · 단계 1
# ══════════════════════════════════════════════════════════════════
#
# > 피드별 허용 여부·키 필요·월 한도·대회 범위·마켓·확인일.
# > 카드 등록이 필요한 피드는 **등록하지 않는다**(Brave 때와 같은 기준).
#
# 🔴 **여기 적힌 것은 전부 2026-10-06 에 받아 본 것**이다. ⚠️ 받아 보지 못한
#    칸은 `미확인` 이라고 적는다 — 추측으로 채우지 않는다(#4).
# 🔴 키는 `.env` 에 이름으로만 둔다(`.env.example` 에 이름). **가입은 사용자가**
#    한다(지시서 §10-1: *"키 발급이 필요하면 사용자에게 키 발급만 요청"*).
# ⚠️ 코드는 이 파일을 `rules.odds_sources()` 로 읽는다 — 피드 이름을 코드에
#    박지 않는다.

#: 🔴 분석 1회당 피드 요청 상한 · 재분석 상한 · 이벤트 목록 캐시(§2-2)
budget:
  per_analyze: 2            # 이벤트 목록 1 + 그 경기 배당 1
  per_reanalyze: 1
  events_cache_hours: 6
  warn_at_pct: 80           # 월 한도의 80% → 카드에 경고
  stop_at_pct: 100          # 100% → 피드 호출 중단, §2-6 보조 입력으로

#: 🔴 경기 매칭 창(§2-3) — 킥오프 ±8시간
#  ⚠️ 열쇠 이름이 `window` 가 **아니다** — 그 낱말은 어댑터 고유 칸(§8-3) 이름과
#     겹쳐 계약이 *"어댑터 칸이 밖으로 나왔다"* 로 읽는다(실측 2026-10-06).
match_window:
  same_match_hours: 8

#: 🔴 기준 업체(§2-4) — 이 이름이 오면 그것을 기준으로 쓴다
reference_bookmaker: pinnacle

feeds:
  - name: the_odds_api
    base_url: https://api.the-odds-api.com
    key_env: ODDS_API_KEY
    allowed: true            # 🔴 쓸 수 있다 — ⚠️ **키가 있을 때만** 돈다
    needs_key: true
    card_required: false     # 🔴 **실측** — 사용자가 카드 없이 발급했다(2026-10-06)
    monthly_limit: 500       # 실측 2026-10-06: 요금 페이지 "500 credits per month"
    quota_header: x-requests-remaining   # 실측: 응답 헤더로 남은 수를 준다
    quota_used_header: x-requests-used
    endpoints:
      sports: /v4/sports/
      events: /v4/sports/{sport}/events/
      event_odds: /v4/sports/{sport}/events/{event_id}/odds/
    key_in: query            # `?apiKey=…`
    markets: [h2h, spreads, totals]
    # ══════════════════════════════════════════════════════════════════
    # 🔴🔴 **대회 범위 실측**(2026-10-06 · 키를 받은 뒤 바로 쟀다)
    # ══════════════════════════════════════════════════════════════════
    #
    #  축구 종목 **49개**(전부 `active: true`). 우리가 찾던 다섯:
    scope:
      epl: soccer_epl                      # ✅ 이벤트 20건
      kleague1: soccer_korea_kleague1      # ✅ 이벤트 6건
      jleague: soccer_japan_j_league       # ✅ 이벤트 10건
      uefa_nations: soccer_uefa_nations_league   # ✅ 이벤트 9건
      national_friendly: null   # 🔴 **없다** — 친선 키가 목록에 **아예 없다**
      concacaf: null            # 🔴 **없다** — CONCACAF 대회가 목록에 없다
      afc: null                 # 🔴 **없다** — 아시아 대표팀 대회가 목록에 없다
    scope_note: |
      🔴 그래서 **대표팀 친선·CONCACAF·AFC 경기는 이 피드로 못 받는다** — 한국–우즈벡 ·
      온두라스–자메이카 · 중국–타지키스탄이 전부 거기 걸린다. 그 경기들의 시장 열은
      **사용자 보드**(§2-6)뿐이다. ⚠️ 카드가 그 사실을 사유로 적는다.
      ⚠️ 목록에서 `friend`·`concacaf`·`afc`·`asia` 를 훑어 걸린 것은 **크리켓
         International T20 하나**였다(축구 아님).
    # 🔴 **대회명 → 피드 종목 열쇠**(코드에 박지 않는다). ⚠️ 낱말이 대회명에 들어
    #    있으면 그 열쇠를 쓴다. 🔴 걸리는 것이 없으면 **피드를 부르지 않는다** —
    #    없는 대회를 물어 크레딧을 쓰는 것이 가장 아까운 호출이다.
    sport_words:
      soccer_epl: ["premier league", "epl", "프리미어"]
      soccer_korea_kleague1: ["k league", "k리그", "kleague"]
      soccer_japan_j_league: ["j1 league", "j league", "j리그"]
      soccer_uefa_nations_league: ["uefa nations", "네이션스리그"]
      # 🔴 `primera` 두 꼴 — 실측 2026-10-11(엘체–셀타 재현): 이름 없는 열쇠를
      #    합치자 대회명이 `LaLiga` → **`Primera Division`** 으로 바뀌어 종목
      #    열쇠가 0건이 되고 **시장 열이 통째로 비었다**(앞 실행은 받았다).
      #    ⚠️ football-data 표기다 — `config/competitions.yaml` 의
      #    `football_data_names` 가 같은 두 꼴을 적고 있다.
      soccer_spain_la_liga: ["la liga", "라리가", "laliga",
                             "primera division", "primera división"]
      soccer_italy_serie_a: ["serie a", "세리에"]
      soccer_germany_bundesliga: ["bundesliga", "분데스리가"]
      soccer_france_ligue_one: ["ligue 1", "리그앙"]
      soccer_uefa_champs_league: ["champions league", "챔피언스리그"]
      soccer_usa_mls: ["mls", "major league soccer"]
      soccer_china_superleague: ["super league - china", "중국 슈퍼리그"]
      soccer_saudi_arabia_pro_league: ["saudi pro", "사우디"]
    credit_cost:
      events: 0        # 🔴 **실측** — `x-requests-last: 0`(남은 수가 안 줄었다)
      event_odds: 1    # 🔴 **실측** — 지역 1(eu) · 마켓 h2h 에서 1
    bookmakers_seen: 22      # 🔴 실측(EPL 한 경기 · eu 지역) — **피나클 포함**
    devig_example: |
      실측 2026-10-06 Arsenal vs Leeds(EPL · 피나클 기준):
      홈 0.6975 · 무 0.1858 · 원정 0.1167 · 업체 몫 3.89%
    cost_note: |
      실측 2026-10-06: 요청 1건당 크레딧 = (지역 수 × 마켓 수). 과거 배당은 10배.
      🔴 그래서 **지역 1개·마켓 1묶음**으로만 부른다.
    checked_at: 2026-10-06
    probe: |
      실측 — `GET /v4/sports/?apiKey=` → 401 `{"error_code":"MISSING_KEY"}`.
      즉 **피드는 살아 있고 키만 없다.**

  - name: odds_api_io
    base_url: https://api.odds-api.io/v3
    key_env: ODDS_API_IO_KEY
    allowed: true
    needs_key: true
    # ⚠️ 🔴 **실측 2026-10-06**(문서 색인 `llms.txt`):
    #    *"New free API keys are paused; existing free keys keep working at
    #    100 requests/hour (500/day)."* → **새 무료 키 발급이 멈춰 있다.**
    #    사용자가 발급을 받으면 그때 범위를 잰다(§5 측정 도구: `tools/odds_scope.py`).
    card_required: 미확인
    monthly_limit: null          # 시간당 100 · 하루 500(무료 등급 선언)
    daily_limit: 500
    hourly_limit: 100
    quota_header: ""
    shape: odds_api_io           # 🔴 응답 꼴이 the-odds-api 와 다르다(아래)
    endpoints:
      sports: /sports
      markets: /markets
      leagues: /leagues
      events: /events
      event_odds: /odds
      bookmakers: /bookmakers
    key_in: query
    markets: [ML, Spread, Totals, "Both Teams To Score", "Double Chance"]
    # 🔴 실측(키 없이 받은 것): `/sports` 200(축구 slug `football`) ·
    #    `/markets?sport=football` 200 — `ML`·`Spread`·`Totals`·`Both Teams To
    #    Score`·`Double Chance` 가 있다. `/leagues` 는 **401**(키 필요).
    scope: 미확인 — 키 발급 뒤 `tools/odds_scope.py` 로 잰다
    probe: |
      실측 2026-10-06 — `/v3/sports` **200**(키 없이도 열린다) ·
      `/v3/markets?sport=football` **200** · `/v3/leagues?sport=football` **401**
      (`{"error":"You need to provide a valid apiKey"}`).
      robots: `Allow: /`(AI 크롤러까지 명시 허용).
    why_second: |
      🔴 **두 번째 피드로 두는 까닭** — the-odds-api 에 **대표팀 친선·CONCACAF·AFC 가
      없다**(실측). 이 피드가 그것을 덮으면 그 경기들의 시장 열이 생긴다.
    checked_at: 2026-10-06

  - name: oddspapi
    base_url: https://api.oddspapi.io
    key_env: ODDSPAPI_KEY
    allowed: true
    needs_key: true
    card_required: 선언상 불필요   # ⚠️ **그들의 블로그 선언**이다(자기 피드 홍보 글)
    monthly_limit: 250            # 같은 출처(선언)
    quota_header: ""              # 실측 문서: 헤더 없음 — `/v4/account` 를 불러 센다
    quota_endpoint: /v4/account
    endpoints:
      tournaments: /v4/tournaments
      odds_by_tournament: /v4/odds-by-tournaments
      historical: /v4/historical-odds       # 문서: 과금 안 됨
    key_in: query
    markets: [1x2, asian_handicap, totals, btts]   # 선언 — 마켓 번호표는 미확인
    scope: 미확인
    checked_at: 2026-10-06
    probe: |
      실측 — `GET /v4/tournaments?sportId=1` → 401 `MISSING_API_KEY`.
      robots: `api.oddspapi.io/robots.txt` 200 이지만 **규칙 줄이 하나도 없다**
      (content-signal 설명 주석뿐) → 금지 없음.
    warn: |
      ⚠️ 한도·카드 여부가 **그들 자신의 글**에서 왔다 — 사용자가 가입 화면에서
      확인하면 이 칸을 실측으로 바꾼다.

  - name: odds_api_net
    base_url: https://api.odds-api.net
    # ⚠️ `key_env` 를 **적지 않는다** — 금지된 피드의 키 이름을 표에 두면 계약이
    #    *"코드가 읽는 키"* 로 세고 `.env.example` 을 요구한다(실측 2026-10-06).
    allowed: false
    why: |
      🔴 `.env` 주석(2026-09-17)에 *"sandbox 월 1,000"* 로 적혀 있었지만 키가 없고,
      축구 대회 범위를 확인한 적이 없다. ⚠️ **확인 전에는 안 쓴다.**
    checked_at: 2026-10-06

  - name: pinnacle_direct
    allowed: false
    why: |
      🔴 피나클은 공개 API 를 닫았다(지시서 §2-1). 제3자 피드로만 받는다 —
      그래서 `reference_bookmaker` 로만 쓰고 직접 부르지 않는다.
    checked_at: 2026-10-06

#: 🔴 사용자에게 부탁할 것(가입은 사용자가 · §10-1)
asks:
  - "the_odds_api — 가입에 카드가 필요한지 보고, 필요 없으면 키를 `.env` 의 ODDS_API_KEY 에"
  - "oddspapi — 같은 확인 후 `.env` 의 ODDSPAPI_KEY 에"
  - "둘 다 카드가 필요하면 그 피드는 등록하지 않는다 — 그때는 사용자 보드(§2-6)만으로 간다"
