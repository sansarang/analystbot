# 딥서치 값의 원본 — [DS-1 / deepsearch_parallel_0921 + addendum_0921]
#
# 🔴 **여기가 원본이다.** 코드에 숫자를 박지 않는다(사본 금지).
#    계약 `test_값은_config_에서_온다` 가 이 방향을 잠근다.
# ⚠️ 지시문이 밝힌 대로 **이 숫자들은 미검증 사전값**이다. 실측이 나오면
#    여기를 고치고, 고친 근거를 커밋에 적는다.

runtime:
  # 예절 — 지시문 DS-2a 5 "도메인당 동시 1·최소 간격 2초·도메인 일일 상한"
  per_domain_concurrency: 1
  min_interval_sec: 2.0
  daily_cap_per_domain: 500
  timeout_sec: 20.0

  # 🔴 식별 가능한 UA. "봇 크롤러는 식별 가능한 User-Agent 를 쓴다"(지시문 규율).
  #    ⚠️ 기존 수집기의 `Mozilla/5.0` 은 **건드리지 않는다**
  #       (사용자 지시 2026-09-21 "위장 거부 끄지 마라"). 이것은 이 런타임이
  #       **자기 요청에** 쓰는 UA 다.
  user_agent: "AnalystBot/1.0 (+research; respects robots)"

  circuit:
    fail_threshold: 5      # 연속 실패가 이만큼이면 그 도메인을 멈춘다
    open_sec: 300          # 그 뒤 다시 열어본다

  robots:
    cache_ttl_sec: 86400
    # ⚠️ robots.txt 가 404 면 **판단 불가**다. 막지는 않되 `unknown` 으로
    #    기록한다 — "파일 없음"을 "허용"이라고 적으면 그게 거짓이다.
    on_missing: allow

# 검색 공급자 — 지시문 DS-3a
# 🔴 [F-18 · 사용자 결정 2026-09-21 "체인은 bing으로"]
#    지시문 본문은 "마지막은 rss_google" 이었으나, `news.google.com/rss/search`
#    는 robots 거부다(실측: `*` 블록이 Disallow:/ 이고 `/rss/` 를 여는 Allow 줄이
#    없다. 게다가 `ClaudeBot`·`anthropic-ai` 를 **이름으로 지목해** 거부한다).
#    최후 폴백이 거부 경로면 체인이 성립하지 않으므로 사용자가 bing 으로 정했다.
#    근거 → docs/SEARCH_PATH_2026-09-21.md · docs/FORKS.md F-18
search:
  chain: ["bing_news_rss", "media_rss"]

  providers:
    bing_news_rss:
      # robots: bing.com 은 `/search`·`/Search` 를 막지만 `/news/…` 를 막는 줄이
      # 없다(실측 2026-09-21 14:18). 런타임의 robots 검사가 매 요청 다시 확인한다.
      base: "https://www.bing.com/news/search"
      daily_query_cap: 400
      monthly_budget_usd: 0        # 0 = 과금 가능한 호출 금지
      # 🔴 **질의를 자르는 규칙을 넣지 않았다 — 실측이 그 규칙을 뒤집었다.**
      #    처음엔 "짧을수록 좋다"로 봤다(2026-09-21 2×2 절제):
      #      한/일 긴→짧  한화 선발 1→8 · 中日 予告先発 2→5
      #      영/스 긴→짧  EPL 확정XI 9→2  ← 긴 쪽 압승 (반대다)
      #    한 번 더 좁혀 재자 더 뒤집혔다:
      #      川崎フロンターレ        11항목/8최근 → 최신 「감독 교체책 반성」(쓸모없음)
      #      川崎フロンターレ スタメン  5항목/2최근 → 최신 「スタメン発表」(찾던 것)
      #    🔴 좁히면 **수는 줄고 정확도는 오른다.** "당일 기사 회수 수"는
      #       잘못된 지표다 — 그것만 보면 쓸모없는 기사를 많이 받는 쪽이 이긴다.
      #    → 규칙을 짓지 않고 **오디션(DS-3a 3)** 이 정한다. 그때 1순위 지표는
      #      회수 수가 아니라 **검증 통과 사실 수**여야 한다.
      #    질의의 원본은 `config/search_terms.yaml` 하나다.
      markets: {kbo: "ko-KR", npb: "ja-JP", mlb: "en-US"}
    media_rss:
      daily_query_cap: 200
      monthly_budget_usd: 0

  # 유료 공급자는 **키가 있을 때만** 살아난다. 채택은 사용자 승인 사항이다.
  # (지시문 DS-3a 1: brave · firecrawl · parallel · tavily)
  optional_providers: ["brave", "firecrawl", "parallel", "tavily"]

# 변경 감지 — 지시문 DS-2a
# 🔴 09-21 에 우리가 늦게 안 셋이 전부 **타이밍 실패**였다:
#    중지 08:30 · 등록 공시 11:06 · 우천 중지 12:40경. 페이지는 그 자리에
#    있었고 그 순간에 안 봤을 뿐이다. 검색 API 를 사도 이건 안 고쳐진다.
watch:
  noise_strikes: 5      # 잡음 제거 후에도 연속 이만큼 바뀌면 watch 에서 뺀다
  status_stale_min: 30  # 상태 사실(개최·중지·지연)이 낡는 시간

  intervals:
    notice_min: 10      # 공시·중지 공지 (06:00~경기 시작)
    default_min: 60
    # 경기 페이지 — 킥오프까지 남은 분(gt_min)보다 크면 그 주기.
    # ⚠️ 위에서 아래로 처음 맞는 것을 쓴다.
    game_phases:
      - {gt_min: 180, every_min: 30}   # T-180 이전
      - {gt_min: 65,  every_min: 10}   # T-180 ~ T-65
      - {gt_min: 20,  every_min: 5}    # T-65 ~ T-20
      - {gt_min: 0,   every_min: 3}    # T-20 ~ 시작

# 재순위 — 지시문 DS-5a
# 🔴 실측 2026-09-21 (운영 game=Valencia CF): 기사 14건 · 본문 9,177자 →
#    창 6,000자(**상한에 딱 걸림**) → 프롬프트 7,101자. 그 6,000자 안에
#    피카츄 기사 1,200자 · 이강인 악플 기사 1,200자가 들어 있었다.
#    발렌시아-레알소시에다드 경기 입력의 40%다. 추출 0건이 이상하지 않다.
rerank:
  # 🔴 [DS-5 2026-09-21] 추출 경로에 **이었다.** 끄면 종전 `_windows` 경로로
  #    돌아간다 — **배포 없이 config 한 줄**이다(`source_gate` 와 같은 방식).
  #    LLM 입력을 6,000자 → 400~2,100자로 줄이는 변경이라 되돌릴 수단이 필요하다.
  wire_extract: true
  # 🔴 [DEC-3 2026-09-21 사용자 결정 · **규칙 개정**]
  #    "관련 문단 ≥1 일 때만 추출한다. 0 이면 `no_relevant_paragraph` 로 미상."
  #    종전 규칙은 "기사가 1건이라도 있으면 추출한다"였고, 계약 17건이 그 위에
  #    서 있었다. 사용자가 규칙을 바꿨으므로 그 17건을 새 규칙에 맞췄다
  #    (목록·이전/새 의미 → docs/DEC3_CONTRACT_CHANGE_2026-09-21.md).
  #    실측: 운영 11경기 · LLM 호출 11 → 9 (18% 절약)
  #    ⚠️ 이 한 줄을 false 로 하면 종전 규칙이다. 배포 필요 없다.
  require_relevant: true
  k: 6                  # 질문당 LLM 에 넣을 문단 수
  min_para_chars: 40    # 이보다 짧은 조각은 문단으로 세지 않는다
  model:
    # ⚠️ 지시문 DS-5a 2: "(a)(b)만으로도 동작해야 한다 · 외부 API 금지 ·
    #    crawler 메모리 실측 후 **사용자 승인**". 그래서 스위치만 둔다.
    #    🔴 **구현하지 않았다** — 안 쓸 수도 있는 것을 미리 만드는 것이
    #       이 저장소가 반복해 온 실수다.
    enabled: false
    name: ""

# 🔴 [DEC-2 2026-09-21 사용자 결정] **접근 근거.**
#    robots 가 거부해도 **그 API 자신의 약관**이 프로그램 접근을 정하고 있으면
#    그 약관이 governing 이다. 여기 적힌 호스트만 robots 검사를 통과한다.
#    ⚠️ **근거 URL 없이 적으면 그게 거짓이다** — 계약이 잠근다.
#    ⚠️ 전역 스위치가 아니다. 호스트 하나씩, 근거 하나씩이다.
access_basis:
  api.open-meteo.com:
    basis: api_terms
    evidence_url: "https://open-meteo.com/en/terms"
    daily_cap: 10000          # 5,000/시간 · 600/분
    license: "CC-BY 4.0"
    note: |
      🔴 무료 티어는 **비상업 전용**이다 — 약관 원문은 "private websites
         without ads/subscriptions · personal home automation · public
         research · educational content" 를 예로 든다.
      ⚠️ **이 봇이 거기 해당하는지는 사용자 판단**이다. 내가 정하지 않았다.
      ⚠️ CC-BY 4.0 이라 **출처 표시가 필요하다** — 카드에 날씨를 쓰면 그렇다.
         그 자리는 이 단위 밖이라 손대지 않았다.
