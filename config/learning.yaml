# 🔴 [learning_engine_0922] 학습 엔진 상수 — **전부 미검증 사전값이다.**
#
#   지시문 §1: "모든 숫자(문턱·계수·창 크기)는 config/learning.yaml 에 두고
#   **미검증 사전값** 주석. 30건 미만 표본에서는 어떤 문턱도 확정하지 않는다."
#
# ⚠️ 여기 있는 값을 근거로 "이 문턱이 맞다"고 말하지 마라. 아직 아무것도
#    검증되지 않았다. 검증은 LE-6 의 walk-forward 가 한다.

learning:
  # 🔴 표본 하한. 이보다 적은 셀은 리포트에 **"표본 부족"** 으로만 찍고
  #    숫자를 내지 않는다(지시문 §1 · LE-1-3).
  min_samples: 30            # 미검증 — 지시문 원문 값

  # 보정 곡선 분위 수. 10분위는 지시문 LE-1-3 원문.
  calibration_deciles: 10    # 미검증 — 지시문 원문 값

  # 지표 계산에 쓸 확률 칸. 🔴 `p_home` 은 **은퇴한 옛 Claude Judge**(=p_claude)
  #    다 — 실측 2026-09-22 AUC 0.5007. `p_code` 는 0.6220 [0.553,0.691].
  #    `calibration.py` 가 아직 p_home 을 읽는다(D55) — 이 모듈은 그러지 않는다.
  prob_field: p_code

  slow_book:
    # 🔴 사용자 사이트 도메인 — **기본값을 두지 않는다.**
    #    사용자가 도메인을 주고 접속을 지시할 때만 채운다(사용자 답 2026-09-22:
    #    "봇이 그 사이트에 접속하는 것은 사용자가 robots·약관·합법성을 확인한 뒤
    #    따로 지시할 때만"). 채워져도 자동 접속 코드는 만들지 않는다.
    user_site_domain: null
    # 원장에 남길 북 이름. 지시문 LE-1-1 원문 `book="user_site"`.
    user_site_book: user_site
    min_edge: 0.03           # 미검증 — 지시문 원문 사전값
    min_books: 3             # 미검증 — 지시문 원문 사전값
    withdraw_at: 0.5         # min_edge 의 배수. 미검증 — 지시문 "min_edge/2"

  residual:
    min_edge: 0.04           # 미검증 — 지시문 원문 사전값
    # 탈상관: 사용자 결정 2026-09-22 — 손실 벌점이 아니라 **잔차 목표**로 구현.
    #   y - p_market 을 맞춘다. λ 벌점은 CatBoost 를 쓸 때만 재검토.
    target: residual         # residual | raw
    train_weeks: 12          # 미검증 — walk-forward 학습 창
    valid_weeks: 1           # 미검증 — 검증 창

  poisson:
    min_edge: 0.04           # 미검증 — 지시문 원문 사전값

  # 🔴 켈리는 **기록 전용**이다. 금액·비중을 제안하지 않는다(절대 규칙 R6).
  kelly:
    record_only: true
