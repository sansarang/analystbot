# 페이블 엔진 상수표 (U13 · 실행판 PART 3)
#
# 🔴 **여기가 원본이다.** 코드는 읽기만 한다 — `app/engine/rules.py`.
#    파이썬 모듈에 같은 값을 다시 적지 마라. 두 곳에 적으면 사본이 되고,
#    사본은 원본이 바뀔 때 따라가지 않는다.
# 🔴 **값 변경은 사용자가 한다.** 클로드는 지시 없이 이 파일의 숫자를
#    바꾸지 않는다(CLAUDE.md "지시받지 않은 파라미터 변경 금지").
# ⚠️ 여기 있는 값은 U13 착수 시점(2026-09-15) 코드에 있던 값 **그대로**다.
#    U13 커밋은 값을 하나도 바꾸지 않았다 — 계약 테스트가 그것을 잰다.
#
# ⚠️ 승률 상한·추천 하한·신호등 같은 **안전선은 여기 없다.** 그건
#    CLAUDE.md §한계값 과 MODEL.md §1 이 원본이고, 동결이 아니라 안전선이다.

# ── U8 가중·결정축 (app/engine/adjust.py)
adjust:
  out_mult: 1.5          # 결장 contrib = −Σ importance × 이 값
  out_cap: 6.0           # 결장 합계 상한(%p)
  return_mult: 1.5       # 복귀는 결장 가중에 이 배수를 더 곱한다
  min_contrib_pp: 2.0    # 이보다 작은 변수는 adj 에서 빼고 adj_dropped 에만
  # [THR-1 2026-09-17 사용자 승인 "해제하고 고쳐라"] **종목별 문턱.**
  # 🔴 2.0 하나가 야구 결장 한 명(1.5%p)을 구조적으로 배제했다 — 야구는 결장이
  #    대개 한 명씩 난다. 실측: 딥서치가 '서호철 1군 말소'를 찾았는데 가감 0.
  # 🔴 크기는 맞았다. WAR/162 환산 — 평균 주전 2 WAR = 1.2%p · 좋은 주전 4 = 2.5%p.
  #    1.5%p 는 '평균 주전' 자리다. 틀린 것은 문턱이었다(2.0 = WAR 3.2 컷).
  # ⚠️ 축구는 2.0 그대로다 — "라인업 변경 하나 = 승률 2~9%p"(FORKS F-1)라
  #    문턱을 넘는다. 낮출 근거가 없다.
  # 근거: docs/FORKS.md F-10 · F-1
  min_contrib_pp_by_sport:
    baseball: 1.0
  recent_starts_n: 10    # 주전 판정 창(최근 N경기 선발)

# ── U9 시장 흐름 (app/engine/odds_move.py)
odds_move:
  steam_min_books: 3     # 한 스냅샷에서 같은 방향인 북 수
  steam_min_pp: 3.0      # 그 방향 이동 폭(%p)
  disagree_sd_pp: 2.0    # 북별 확률 표준편차가 이보다 크면 book_disagree
  line_pp_per_half: 4.0  # 라인 0.5 = 이만큼(%p). 1.0 이면 두 배

# ── U10 구조 픽 (app/engine/structure.py)
structure:
  edge_min_pp: 6.0       # 채택 하한. 이 미만은 후보에서 반려
  grade_high_pp: 8.0     # 이상이면 등급 '상'
  ah_lines: [0.5, 1.0, 1.5]

# ── U5·U7 가설·확인 (app/engine/hypothesis.py)
hypothesis:
  sufficient_default: 2  # confirmed 가 이만큼이면 충족
  sufficient_bigmatch: 3 # 🔴 빅매치는 자료가 많아 우연 일치가 쉽다
  unknown_board_ratio: 0.5  # unknown 이 이 비율을 넘으면 보드

# ── 확률 (app/engine/prob.py)
prob:
  adj_shrink: 0.5        # 가감 합계에 곱하는 축소율
  adj_sum_cap: 6.0       # 가감 합계 상한(%p)

# ── U12 사례집 유사도 4축 (app/engine/cases.py)
cases:
  weights:
    league_group: 0.25
    gap_bucket: 0.30
    confirmed: 0.30
    rest_bucket: 0.15

# ── U13 리포트 구간 (app/engine/report.py)
report:
  checkpoints: [50, 150, 300]   # 위생·방향·결정 리포트를 내는 표본 수
  # [PA-28] 변수별 채점의 표본 문턱. 이 수에 닿기 전에는 **판단하지 않는다.**
  # 🔴 100 은 prob.py 결정 B(1차 결정 6)에 적힌 값이다 — 여기가 그 값의 원본이고
  #    prob.py 쪽은 산문이다. 두 곳에 숫자를 적지 않는다.
  var_min_n: 100

# ════════════════════════════════════════════════════════════════════
# [v1.4 파이프라인 ①~⑬] 지시문 §1.2 초기값 — `app/flow/` 가 읽는다.
#
# 🔴 **채점 20건이 쌓이기 전에는 바꾸지 않는다**(지시문 §1.2 원문).
# 🔴 값 변경은 사용자가 한다. 코드가 이 숫자를 고치지 않는다.
# ⚠️ 별도 `pipeline/rules.yaml` 을 만들지 않는다 — 문턱이 두 곳에 생기면
#    그것이 사본이고, 사본은 원본이 바뀔 때 따라가지 않는다(사본 금지).
# ⚠️ 위 `hypothesis`·`structure` 블록과 **이름이 겹치지 않게** `flow.` 아래
#    모아 둔다. 기존 경로(U5~U13)는 그대로 자기 키를 본다.
# ════════════════════════════════════════════════════════════════════
flow:
  # 조정 사전값 표 — 단위 %p, 우리 픽 후보 팀 기준(+는 유리)
  adjust_prior_pp:
    baseball:
      # 🔴 [2026-09-18 페이블 검토] `doubt`(출전 불투명)를 **뺐다.**
      #    실측 확인 0/30. 개념은 실재하지만(MLB Day-to-Day) statsapi 로스터에
      #    코드가 없어(12종 전수 실측) 구조화된 소스가 없다 → FORKS F-15.
      #    ⚠️ **되살릴 조건**: DTD 를 주는 2차 소스를 붙이는 날 여기 되돌린다.
      #    ⚠️ 축구는 그대로다 — 그쪽은 개념도 소스도 있다.
      starter_recent3:   {max_abs: 3.0, core: true}
      bullpen_3d:        {max_abs: 2.0, core: true}
      lineup_out:        {max_abs: 2.5, core: true}
      travel_backtoback: {max_abs: 1.0, core: false}
      park_factor:       {max_abs: 1.0, core: false}
      weather:           {max_abs: 1.0, core: false}
    soccer:
      xi_confirmed:      {max_abs: 3.0, core: true}
      form_recent5:      {max_abs: 2.0, core: false}
      rotation_risk:     {max_abs: 2.0, core: false}
      travel:            {max_abs: 1.0, core: false}
      motivation:        {max_abs: 1.5, core: false}
  gate_pp:
    agree: 4.0        # |gap| < 4 → 동의
    freeze: 12.0      # |gap| >= 12 → 보드고정 (데이터 오류 의심)
  # ── [FIX-1 2026-09-20] 증거 방향 문턱 (app/flow/direction.py 가 읽는다)
  # 🔴 **전부 미검증 사전값이다.** 채점 30건이 쌓이기 전에는 고치지 않는다 —
  #    고치면 그건 측정이 아니라 취향이다.
  # ⚠️ 리그 평균 방어율은 여기 두지 않는다. `settings.league_era`(MLB 4.20) ·
  #    `kbo_league_era` · `npb_league_era` 가 원본이고 `scoring._suppression`
  #    이 같은 값을 쓴다 — 새 상수를 만들면 사본이 된다.
  # 🔴 [EXT-2 / STEP 1-g 2026-09-20] 추출을 게이트로 가르지 않는 대신
  #    **깊이**로 묶는다. 값은 **미검증 사전값**이고 채점 30건 뒤 데이터로만
  #    고친다. depth 를 정하는 것은 v2 STEP 6 `app/flow/select.py` 이고,
  #    그 전까지는 아래 폴백을 쓴다.
  depth_fallback: normal
  depth_articles:
    shallow: 0
    normal:  2
    deep:    5

  direction:
    starter_dev_bad:   0.25   # (ERA3-기준)/기준 이 이 이상 → 그 팀 악재
    starter_dev_good: -0.25   # 이 이하 → 그 팀 호재
    starter_min_ip:    9.0    # 최근 3등판 이닝합이 이 미만이면 표본 부족(방향 0)
    starter_short_ip:  5.0    # 이 미만 등판만 이어지면 basis 에 "짧은 등판"
    bullpen_ip_heavy: 12.0    # 최근 3일 구원 이닝합이 이 이상 → 그 팀 악재
    bullpen_b2b_heavy:   3    # 2연투 투수가 이만큼이면 → 그 팀 악재
    lineup_out_heavy:    2    # 평소 주전이 이만큼 빠지면 → 그 팀 악재
    dev_full:          0.5    # |dev| 가 이 값이면 strength 1.0
  total_adjust_cap_pp: 6.0
  edge_min_pp: 2.0
  unknown_ratio_board: 0.5
  deepsearch_cap:
    slate_ratio: 0.30
    per_game: 5
  # ① 사전값 상수 — 지시문 STEP 2
  hfa_elo:            # 홈 이점(ELO 점수)
    kbo: 25
    npb: 25
    mlb: 24
  draw_prior: 0.26    # 축구 3-way 무승부 사전 질량

# 🔴 [EXT-2 / STEP 1-g 2026-09-20] LLM 일일 호출 상한. 추출 대상이 "게이트
#    대상 최대 8경기" 에서 "기사가 있는 전 경기" 로 넓어졌으므로 **일일 상한**
#    으로 묶는다. 도달하면 추출을 건너뛰고 reason="llm_cap" 을 남긴다 —
#    예외를 던지지 않는다(파이프라인은 완주한다).
#    ⚠️ **미검증 사전값**이다. 실측 2026-09-20: groq TPD 200k 가 하루에 한 번
#       소진됐다. 그 실측이 쌓이면 이 값을 고친다.
llm:
  # 🔴 [LLM0 2026-09-22 사용자 지시] **"llm 완전히 0으로 만들어라"**
  #    이 한 줄이 이 봇의 모든 LLM 문을 닫는다(원본: api_guard.llm_enabled).
  #    ⚠️ 지우는 것이 아니라 끄는 것이다 — `true` 로 바꾸면 전부 돌아온다.
  #    ⚠️ 이 값이 false 인 동안 아래 `daily_call_cap` 은 의미가 없다.
  enabled: false
  daily_call_cap: 200

# 🔴 [W1 / wiring_first 2026-09-21] 자가 점검 문턱. **표시 전용**이다 —
#    판정·확률·등급에 들어가지 않는다.
#    ⚠️ 전부 **미검증 사전값**이다. 근거는 docs/maps/W1.md §2 에 적었다.
#       실측이 쌓이면 고친다. 코드에 이 숫자를 다시 적지 마라(사본 금지).
ops:
  selfcheck:
    rest_hours_max: 200        # 이보다 긴 휴식은 계산이 틀린 것이다(09-20 포항 597h)
    ingest_stale_hours: 36     # 일일 적재 잡 기준 이틀치 여유
    source_blank_ratio: 0.5    # 기사 카드 출처 공란 비율이 이 이상이면 경보
    results_pending_hours: 6   # 끝났어야 할 경기가 이만큼 지나도 final 이 아니다
    lineup_missing_min: 30     # T-30 까지 확정 라인업이 없으면 경보
    starter_unknown_hours: 3   # T-3h 까지 예고 선발이 없으면 경보

# 🔴 [SRC-OFF / deepsearch_parallel [2]a 2026-09-21 사용자 지시] 소스 스위치.
#    **코드를 지우지 않고 여기서 끈다** — 정식 접근이 허락되면 한 줄로 되돌린다.
#    판단은 `app/collectors/source_gate.py` 한 곳이 한다(사본 금지).
#    ⚠️ 여기 없는 소스는 **켜진 것**이다.
#    ⚠️ `affects`·`defect` 는 **표시용 원본**이다 — /health·export 가 여기서
#       리그와 결함 번호를 읽는다. 코드에 박지 않는다(사본 금지).
sources:
  koreabaseball:
    # 🔴 [KBO-ON 2026-09-23 **사용자 지시**] 원문:
    #    "자동수집.크롤링 복제하는 행위를 허용한다...kbo도 해야한다.."
    #
    #    종전은 `false` 였다 — robots.txt 가 `User-agent: * / Disallow: /` 이고
    #    '사전 승인 없이 자동 수집·크롤링·복제하는 행위를 금지합니다' 고지가
    #    붙어 있어서다(실측 2026-09-21 · HTTP 200 · EUC-KR).
    #
    # ⚠️ **기록해 둔다 — 그 고지는 KBO 가 건 것이다.** 운영자가 "허용한다"고
    #    해도 그쪽의 *사전 승인*이 되지는 않는다. 위험은 운영자에게 귀속된다.
    #    이 줄을 `false` 로 되돌리면 종전 상태다.
    # 🔴 **바뀐 것은 "수집하느냐"뿐이다.** 서버를 속이는 쪽은 그대로 금지다 —
    #    UA 위장·프록시 회전·쿠키 주입·CAPTCHA 우회·429 무시. 계약이 잠근다.
    enabled: true
    affects: ["KBO"]
    defect: "D33"
    #: 같은 호스트 연속 요청 사이 최소 간격(초). 🔴 여기가 원본이다 —
    #  코드(`kbo.polite_gap`)는 이 값을 읽을 뿐 숫자를 박지 않는다.
    min_interval_sec: 1.0
    # 🔴 [D52 2026-09-22] **대체가 없다는 것을 적는다.** 모른 채 비는 것과
    #    알고 비는 것은 다르다 — 계약이 `none` 에는 사유를 요구한다.
    fallback: none
    fallback_reason: >-
      KBO 공식 자료(일정·팀기록·투수기록·엔트리·박스스코어)에 대체 출처가 없다.
      이 리그는 해당 칸이 미상으로 멈추는 것이 의도한 동작이다(D33).
      /health 의 `🔒 KBO — 자료 제한` 줄이 이것을 그대로 말한다.
  # 🔴 [2026-09-21 사용자 지시 "고 크롤러와 맞춰라"] **다시 켰다.**
  #    끈 동안에도 Go 크롤러(crawler/internal/source/source.go:137·159)는 같은
  #    API 를 10분마다 치고 있었다(D36) — 파이썬만 껐던 것이라 **모순 상태**였다.
  #    robots.txt 는 404(판단 불가)지 거부가 아니다. 켜서 맞춘다.
  #    ⚠️ koreabaseball 은 **명시 거부**(Disallow:/ + 한국어 고지)라 그대로 끈다.
  # 🔴 [DEC-2 2026-09-21 사용자 결정] 다음 검색을 **끈다.**
  #    `search.daum.net/robots.txt` 가 `Disallow: /` 다([3] 감사 · 재감사 둘 다).
  #    🔴 [D52 정정 2026-09-22] 어제 여기 "**대체가 이미 있다**"고 적었다.
  #       그 문장이 **틀렸다** — `rss_hits` 는 있었지만 부르는 곳이 축구뿐이고
  #       `gather_kbo` 는 미연결이었다. 실측 2026-09-22 10:29 KST
  #       (KT Wiz@SSG Landers): KBO 기사 **0건**.
  #       정정: "대체가 이미 있다" → **"대체 함수는 있었으나 KBO 에
  #       미연결이었다. 2026-09-22 연결."**
  #    ⚠️ 코드를 지우지 않는다 — 이 한 줄로 되돌린다.
  daum_search:
    enabled: false
    affects: ["KBO", "축구"]
    defect: "D40"
    # 🔴 대체는 **선언하고 닿아야** 한다. `test_disabled_source_has_wired_fallback`
    #    이 `fallback_consumers` → `fallback` 호출 그래프를 검사한다.
    #    "함수가 존재한다"로는 D52 를 못 잡는다 — 존재했고 축구에서 불렸다.
    fallback: app.collectors.satellite.rss_hits
    fallback_consumers: ["gather_kbo", "gather_soccer"]
  naver_apigw:
    enabled: true
    affects: ["KBO"]
    defect: "D33"

# 🔴 [NOLLM 2026-09-22 사용자 지시] **판정은 코드가 낸다. 서술은 템플릿이다.**
#    사용자 원문: "판정은 원래 코드에서 낸다… 서술도 템플릿으로 바꿔라"
#
#    실측이 이유다 — LLM 판정 호출 3곳(verdict.decide · matchup 재질의 ·
#    dbref.recheck)의 결과는 `apply_code_verdict` 가 **전부 덮어쓴다**(P0-1).
#    세 번 묻고 세 번 버리면서, 그 실패로 경기가 탈락했다
#    (2026-09-22: LLM 사슬 소진 → KBO 0/8 · NPB 0/5 판정 전멸).
#
#    ⚠️ **딥서치는 끄지 않는다** — 그건 재료를 찾는 일이고 대체가 없다.
#    ⚠️ 코드를 지우지 않았다. 이 한 줄로 되돌린다.
judge:
  llm_verdict: false
