    # 🔴 사다리의 **현지 낱말 개념**(`config/search_words.yaml`) — 언어마다
    #    같은 뜻의 낱말을 거기 한 번 적고 유형이 그것을 가리킨다(사본 금지).
    word: presser
    cell_question: 감독 교체·부임 시점·첫 경기 여부
    direction_rule: 새 감독 팀 쪽 + 무승부
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `새 감독 팀 쪽 + 무승부`
    favors: subject
    goals: none
    # 🔴 §4 방향 배정 예외 — 두 방향을 밀면 두 항목으로 나눠 저장한다
    splits_direction: true
    implemented: true

  lineup_intent:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [soccer, baseball, hockey, basketball, volleyball]
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
      - '총력전|필승\s*의지|반드시\s*이긴다|사활'
      - '\bmust[- ]win\b|\bgo all out\b|\bfull[- ]strength\b'
    watch: intent            # 감독 발언 세포
    # 🔴 사다리의 **현지 낱말 개념**(`config/search_words.yaml`) — 언어마다
    #    같은 뜻의 낱말을 거기 한 번 적고 유형이 그것을 가리킨다(사본 금지).
    word: presser
    cell_question: 감독 인용(로테이션·총력·실험·투구수 제한)
    direction_rule: 발언 내용대로
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `발언 내용대로` — 말한 팀 쪽(코드가 못 가리면 both)
    favors: subject
    # 🔴 **5백이면 득점이 내려간다**(축구 완성 지시서 §3 표: `down(5백)`)
    #    ⚠️ 포메이션을 모르면 그 변수는 `none` 이다 — IR01 이 포메이션을 보고 정한다.
    goals: down
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **구현했다** — "내용대로"를 **두 갈래로만** 읽는다
    # ══════════════════════════════════════════════════════════════
    #
    #  ⚠️ 전에 *"감독 발언의 '내용대로' 를 규칙으로 못 읽는다"* 로 비워 뒀다.
    #     그 말이 맞지만 **전부를 못 읽는 것이 아니다** — 승부에 닿는 갈래는 둘이다:
    #       `best`  총력·베스트 멤버·필승     → **그 팀 쪽**
    #       `rest`  휴식·로테이션·실험·투구수 제한 → **상대 쪽**
    #     그 둘 중 하나로 안 읽히면 **미결정**이다(지어내 고르지 않는다).
    #
    #  🔴 실측이 요구했다(2026-10-02 소프트뱅크–치바롯데): 사람이 찾은 변수 R2 가
    #     *"감독이 타선은 베스트 멤버로 가겠다고 밝혔다"* 였다. 그것이 `best` 다.
    #  🔴 갈래를 **LLM 이 정하지 않는다** — LLM 은 인용만 낸다(§17-c). 낱말 대조는
    #     코드가 하고, 그 낱말 목록은 아래 `intent_words` 가 원본이다.
    implemented: true
    intent_words:
      # 🔴 **전 종목·전 언어다**(사용자 지시 2026-10-03: *"야구뿐만 아니라 전경기"*).
      #    ⚠️ 실측 2026-10-03(KBO): 감독 인용이 **영어**로 들어왔는데
      #       (*"We can't avoid getting hit. So we have to take control and attack
      #       first."*) 영어 낱말이 `best lineup`·`full strength` 둘뿐이라 어느
      #       갈래도 안 맞아 **미결정**이 됐다. 인용은 있었고 표가 좁았다.
      best:
        - ベストメンバー
        - 総力
        - 全力
        - 勝ちにいく
        - best lineup
        - full strength
        - 베스트
        - 총력
        - 필승
        - 사활
        - 반드시 이기
        - 총동원
        - must win
        - must-win
        - go all out
        - everything we have
        - attack first
        - take control
        - do whatever it takes
        - a por todo
        - a muerte
      rest:
        - 休養
        - 温存
        - ローテーション
        - 球数制限
        - 若手を試す
        - rest
        - rotate
        - rotation
        - load management
        - 휴식
        - 체력 안배
        - 로테이션
        - 젊은 선수
        - 아낀다
        - save
        - spare
        - manage his workload
        - give him a breather
        - rotar
        - descanso
        - reservar
        - 휴식
        - 로테이션
        - 투구수 제한
    attaches_to: both

