    # ══════════════════════════════════════════════════════════════
    #
    # > R1 "밀워키 최근 3경기 3승" 은 **7일 전 정규시즌 마지막 경기들**이다.
    # > 바이로 쉰 팀의 "최근 폼" 은 표본이 낡았다 — `recent_pattern` 에
    # > **"마지막 경기가 7일 이상 전이면 weight 0.4"** 를 R7 옆에 붙여라.
    #
