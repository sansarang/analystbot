# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **유형 규칙표** — 산문의 **사건 낱말** → §4 유형 (사용자 기술 지시 2026-10-03)
# ══════════════════════════════════════════════════════════════════
#
# > ② 유형 판정 (코드 규칙표) — 사건 단어 → 변수 유형. **LLM이 아니라 표로 정한다.**
# >   TYPE_RULES = [(r"제외|결장|말소|부상|이탈|IL", "absence"), ...]
#
# ⚠️ 종전에는 유형이 **"어느 세포가 물었나"** 에서만 왔다(`classify.types_for` 가
#    질문 id 의 접미사를 본다). 🔴 그래서 **산문에서 온 사실**은 물어본 유형이
#    아니면 유형이 안 붙고 전부 **배경**으로 떨어졌다 — 사용자가 지적한 자리다:
#    *"'43전 4승', '준결승 0-2 패', '감독 반드시 이긴다'가 문장으로만 남는다."*
#
# 🔴 **표는 여기 하나다.** 유형마다 `match:` 로 적는다 — 유형 이름을 다른 파일에
#    또 적지 않는다(CLAUDE.md #1 사본 금지). 유형이 늘면 표도 함께 자란다.
# 🔴 **전 종목·전 언어다**(사용자 지시: *"야구뿐만 아니라 전경기"*). 한 유형의
#    `match:` 안에 한국어·영어·일본어·스페인어 패턴을 함께 둔다 — 종목으로
#    분기하지 않는다.
# ⚠️ **씨앗일 뿐이다.** 사용자가 준 정규식에서 출발했고, 맞는지는 **실측으로**
#    고친다(회귀 시험이 그 자리다). 넓히면 오탐이 늘고(실측 2026-10-03: 날씨
#    예보문이 감독 발언으로 들어왔다) 좁히면 0 이 된다.
# 🔴 이 표는 **질문 경로가 유형을 못 줄 때만** 쓴다 — 세포가 유형을 알고 물었으면
#    그쪽이 더 정확하다(그 세포는 자기가 뭘 묻는지 안다).
  # ══════════════════════════════════════════════════════════════════
  # 🔴 유형 여섯(사용자 지시 2026-10-06 ③) — 선언은 위 `added_by_user_instruction`
  # ══════════════════════════════════════════════════════════════════
  absence_att:
    refines: absence
    match:
      - '(공격수|윙어|스트라이커|포워드|에이스)[^.]{0,20}(결장|제외|이탈)'
      - '\b(striker|forward|winger|top scorer)\b[^.]{0,30}\b(out|miss|injur)'
    watch: absence
    word: injury
    sports: [soccer, baseball, hockey, basketball, volleyball]
    cell_question: 공격수·윙어 결장
    direction_rule: 결장 팀 반대 방향 — 🔴 득점은 **내려간다**(그 팀이 골을 못 낸다)
