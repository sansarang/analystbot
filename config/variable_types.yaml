    # 🔴 사다리의 **현지 낱말 개념**(`config/search_words.yaml`) — 언어마다
    #    같은 뜻의 낱말을 거기 한 번 적고 유형이 그것을 가리킨다(사본 금지).
    word: farewell
    cell_question: 경질 직후·난투 뒤 카드·헹가래 직전
    direction_rule: 상황별
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `상황별` — 코드가 못 가린다
    favors: both
    goals: none
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **구현했다** — "상황별"의 **한 상황만** 규칙으로 읽는다
    # ══════════════════════════════════════════════════════════════
    #
    #  ⚠️ 전에 *"'상황별'을 규칙으로 못 읽는다"* 로 비워 뒀다. 전부는 여전히 못 읽는다.
    #     🔴 그러나 **한 상황은 방향이 분명하다**: *경기 결과보다 다른 것이 앞서는
    #        기용* — 은퇴 경기·헹가래 대기·소화 경기. 그러면 **상대 쪽**이다.
    #  🔴 `event_match` 와 다르다: `event_match` 는 **대회 자체**가 행사인 경우고
    #     (승패 마켓을 접는다), 이것은 **정식 경기인데 한 팀이** 다른 것을 앞세운
    #     경우다(마켓을 접지 않는다 — 상대 쪽으로 기운다).
    #  ⚠️ 그 상황이 아니면 **배경**이다(무동기와 같은 처분).
    implemented: true
    asks: "한 팀이 경기 결과보다 은퇴식·세리머니·소화 경기를 앞세운다고 적혀 있나?"
    decides: 그 팀이 승리 극대화가 아닌 기용을 한다고 보도됐다
    templates:
      - {q: "{team} retirement ceremony lineup", lang: en}
      - {q: "{team} 은퇴식 선발", lang: ko}
      - {q: "{team} 引退セレモニー スタメン", lang: ja}
      - {q: "{team} 消化試合", lang: ja}
    attaches_to: both

  strength_gap:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [soccer, baseball, hockey, basketball, volleyball]
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
      - '전력\s*차|객관적\s*열세|압도적'
      - '\bgulf in class\b|\bfavourites?\b|\bunderdog\b'
    watch: standings            # 리그 등급 차는 순위표에서 나온다
    cell_question: FIFA 랭킹·리그 등급 차(J1 vs J3)
    direction_rule: 강팀 쪽
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `강팀 쪽`
    favors: subject
    goals: none
    implemented: false

  # ══════════════════════════════════════════════════════════════
  # 🔴 **사용자 지시 2026-10-02**: *"딥서치해서 그에 맞게 바꿔라"* — 결함 ②
  # ══════════════════════════════════════════════════════════════
  #
  # v4 §4 13유형에 **홈이 없었다.** `venue_weather`(구장 성격·표고)는 있지만 방향
  # 규칙이 *"상황별(우천→언더)"* — **총점 힌트**이고 승패 방향이 아니다.
  #
  # 🔴 **실측 2026-10-02 — 순위표의 홈/원정 쪼갠 기록으로 쟀다**:
  #
  #     MLS 동부 (홈 200경기)  홈 승 45.0% 무 26.5% 패 28.5% · 경기당 1.89득 1.45실
  #                            원정 승 28.2% 무 26.7% 패 45.0% · 경기당 1.43득 1.92실
  #                            → 🔴 승률 **+16.8%p** · 득점 **+0.46골**
  #     USL 동부 (홈 169경기)  → 🔴 승률 **+18.3%p** · 득점 **+0.50골**
  #
  # ⚠️ 처음엔 *"보드 가격에 이미 들어 있어 이중 계산"* 이라고 보류했다. **그 보류가
  #    틀렸다** — 생존 계산은 가격을 쓰지 않는다(§6-d 가격 필터는 미결정). §5-a 는
  #    **home 방향 변수 묶음**에서 시나리오 A 를 만든다. 홈 변수가 없으면 홈으로
  #    기울 변수가 없는 경기에서 **A 가 아예 생성되지 않는다** — 실제로는 45% 로
  #    일어나는 결과가 모델에서 불가능해진다. 이중 계산이 아니라 **구조적 누락**이었다.
  #
  # 🔴 hardness: 순위표는 **공시**다 → hard. `strength_gap`(FIFA 랭킹 = 공시)과 같은
  #    꼴이다. ⚠️ 리그 홈/원정 기록을 못 구하면 이 변수를 **만들지 않는다**.
  home_field:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [soccer, baseball, hockey, basketball, volleyball]
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
      - '홈\s*\d+연승|원정\s*\d+연패|홈\s*강세|원정\s*약세'
      - '\bhome (record|form|advantage)\b|\baway (record|form)\b'
    watch: standings            # 홈/원정 쪼갠 표가 순위표에 있다
    cell_question: 리그 홈/원정 쪼갠 기록(승률·경기당 득실)
    direction_rule: 홈 팀 쪽
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `홈 팀 쪽`
    favors: subject
    goals: none
    measured_2026_10_02:
      MLS: 승률 +16.8%p · 득점 +0.46골 (홈 200경기)
      USL: 승률 +18.3%p · 득점 +0.50골 (홈 169경기)
    source: 순위표의 home/away 쪼갠 표
    no_split_table: 변수를 만들지 않는다
    implemented: true
  # ── 🔴 라인업 시장가치(딥서치 2026-10-03 · 위 선언)
  lineup_value:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [soccer]
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
      - '시장\s*가치|스쿼드\s*가치'
      - '\bmarket value\b|\bsquad value\b'
    watch: lineup            # 🔴 라인업 세포가 깨면 이 수가 바뀐다
    cell_question: 오늘 선발의 시장가치 합 vs 기준 선발
    direction_rule: 가치가 떨어진 팀 반대 방향
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `가치가 떨어진 팀 반대 방향`
    favors: opponent
    goals: none
    implemented: true
    # ══════════════════════════════════════════════════════════════
    # 🔴 **몇 % 떨어지면 변수인가**
    # ══════════════════════════════════════════════════════════════
    #
    #  ⚠️ 라인업은 경기마다 조금씩 바뀐다 — 작은 차이를 변수로 세면 **모든 경기에
    #     변수가 생기고** 그것은 변수가 아니다.
    #  🔴 숫자는 실제 테스트로 정한다(사용자 지시 2026-10-02). `15`(%)로 시작한다 —
    #     주전 한 명이 빠지는 폭이 대략 그쯤이다(11명 중 하나가 평균보다 센 경우).
    #     ⚠️ 이 설명은 **근거가 아니다** — 측정하면 고친다.
    value_drop_pct: 15
    #: 🔴 가치를 **몇 명에서** 읽어야 믿나. 11명 중 일부만 읽히면 합이 작아져
    #   거짓 하락이 된다. ⚠️ 선발은 11명이다(§13-c ②).
    min_value_players: 11
    attaches_to: both

  # ── 🔴 카탈로그 5종(사용자 설계 2026-10-02 · 위 `added_by_user_instruction` 선언)
  coach_conflict:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [soccer, baseball, hockey, basketball, volleyball]
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
      - '(감독|사령탑)[^.]{0,20}(갈등|불화|충돌|결별)|캠프\s*이탈|팀\s*이탈'
      - '\brow with (the )?(coach|manager)\b|\bleaves camp\b|\bbust-up\b'
      - '不仲|確執|退団'
    watch: intent
    # 🔴 사다리의 **현지 낱말 개념**(`config/search_words.yaml`) — 언어마다
    #    같은 뜻의 낱말을 거기 한 번 적고 유형이 그것을 가리킨다(사본 금지).
    word: conflict
    cell_question: 스타와 감독의 갈등·이탈·캠프 이탈
    # 🔴 **양방향이다** — 응집이 오를 수도, 분위기가 내릴 수도 있다. 한쪽으로
    #    못 정하면 **미결정**이고 그 사실을 남긴다(지어내 방향을 고르지 않는다).
    direction_rule: 양방향 — 코드가 한쪽으로 정하지 못하면 미결정
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `양방향 — 한쪽으로 정하지 못하면 미결정`
    favors: both
    goals: none
    splits_direction: true
    implemented: false
    # 🔴🔴 **언어 꼬리표**(실측 2026-10-02). `lang` 이 없으면 아무 언어나 쓴다.
    #
    #  ⚠️ 종전에는 템플릿이 그냥 문자열이어서, 코드가 **모든 언어로** 같은 문자열을
    #     던졌다. 그래서 NPB 경기에 이런 질의가 나갔다:
    #         福岡ソフトバンクホークス 자선 경기 10月2日
    #         福岡ソフトバンクホークス 수비 결장 Oct 2
    #     🔴 일본어 기사에 "자선 경기"라는 글자는 없다 — 구조적으로 0건이다.
    #  🔴 낱말을 코드가 번역하지 않는다(유료 · 품질 못 믿는다). 언어마다 따로 적는다.
    templates:
      - {q: "{team} {player} leaves camp", lang: en}
      # 🔴 `{team}` 을 뺐다 — 자리표 셋이 다 여러 낱말이라 **구조적으로**
      #    §12-b 상한(6낱말)을 넘었다(실측 2026-10-06: `Northern Ireland
      #    Michael O Neill Conor Bradley conflict` = 8낱말).
      #    ⚠️ 감독 이름이 이미 팀을 가린다 — 팀명을 또 넣을 필요가 없다.
      - {q: "{coach} {player} conflict", lang: en}
      - {q: "{player} {coach} 갈등", lang: ko}
      - {q: "{team} 대표팀 이탈", lang: ko}
      # 🔴 일본어 — 不仲(불화) · 退団(퇴단) · 離脱(이탈)
      - {q: "{team} {player} 退団 不仲", lang: ja}
      - {q: "{team} 離脱", lang: ja}
      # 🔴 중국어
      - {q: "{team} {player} 矛盾 離隊", lang: zh}
    # 🔴 **모델에게 던지는 질문**(③ 좁은 질문). `decides` 와 다르다 —
    #    `decides` 는 **코드**가 쓰는 판정 기준이고, `asks` 는 **기사에
    #    던지는 한 문장**이다. ⚠️ 실측 2026-10-02: `decides` 를 그대로
    #    물었더니 7B 가 전부 `unknown` 을 냈다 — 기준은 질문이 아니다.
    asks: "선수가 팀을 떠났거나 감독과 갈등이 있다고 적혀 있나?"
    decides: 선수가 팀을 떠났거나 감독과 공개 갈등이 보도됐다
    attaches_to: both      # 🔴 두 방향 시나리오에 다 붙는다
  def_absence:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [soccer, baseball, hockey, basketball, volleyball]
    # 🔴 **`absence` 를 좁힌 유형이다.** 같은 글이 둘 다에 맞으면 **좁은 쪽**이
    #    이긴다 — 넓은 쪽은 좁은 쪽을 **포함**하므로 둘이 모순이 아니다.
    #    ⚠️ 실측 2026-10-03: `Jamaica defender ruled out with injury` 가 둘 다에
    #       맞아 *"두 개라 못 고른다"* 로 떨어졌다 — 그것은 모호한 것이 아니다.
    refines: absence
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
      - '(수비|포수|유격수|센터백|골키퍼|키퍼)[^.]{0,20}(결장|제외|이탈)'
      - '\b(defender|centre-back|center-back|goalkeeper|keeper)\b[^.]{0,30}\b(out|miss|injur)'
    watch: absence
    # 🔴 사다리의 **현지 낱말 개념**(`config/search_words.yaml`) — 언어마다
    #    같은 뜻의 낱말을 거기 한 번 적고 유형이 그것을 가리킨다(사본 금지).
    word: injury
    cell_question: 수비수·골키퍼 결장
    direction_rule: 결장 팀 반대 방향 — 🔴 상대 득점 상향 시나리오에 붙는다
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `결장 팀 반대 방향 — 상대 득점 상향` → 득점↑
    favors: opponent
    #: 🔴 **득점 방향**(사용자 지시 2026-10-06 ④) — 승패와 **따로** 센다.
    #    ⚠️ 종전 `goals_up` 은 승패 칸에 득점 방향을 넣은 것이라 그 변수가
    #       **어느 팀 쪽인지** 말하지 못했다(자료 얇음 판정이 그래서 1종이었다).
    goals: up
    # 🔴🔴 **구현했다**(사용자 지시 2026-10-02). ⚠️ 전에 적어 둔 사유
    #    (*"자리를 아는 길이 없다"*·*"직전 선발과 대조할 길이 없다"*·*"대표팀 일정
    #    종료일을 모른다"*)는 **오독이었다** — ③ 좁은 질문(`asks`)이 바로 그것을
    #    묻고 있었다. 자리·대조·종료일을 따로 알아낼 필요가 없었다.
    implemented: true
    # 🔴🔴 **언어 꼬리표**(실측 2026-10-02). `lang` 이 없으면 아무 언어나 쓴다.
    #
    #  ⚠️ 종전에는 템플릿이 그냥 문자열이어서, 코드가 **모든 언어로** 같은 문자열을
    #     던졌다. 그래서 NPB 경기에 이런 질의가 나갔다:
    #         福岡ソフトバンクホークス 자선 경기 10月2日
    #         福岡ソフトバンクホークス 수비 결장 Oct 2
    #     🔴 일본어 기사에 "자선 경기"라는 글자는 없다 — 구조적으로 0건이다.
    #  🔴 낱말을 코드가 번역하지 않는다(유료 · 품질 못 믿는다). 언어마다 따로 적는다.
    templates:
      - {q: "{team} injury news", lang: en}
      - {q: "{team} defender out {opp}", lang: en}
      - {q: "{team} unavailable players", lang: en}
      - {q: "{team} 수비 결장", lang: ko}
