# v4 §4 변수 유형표 — 13유형
#
# 🔴 **정본은 v4 §4 표다.** 이 파일은 그 표의 구현이고,
#    `tests/stage2/test_rules.py` 가 §4 표를 파싱해 **여기가 빠뜨린 유형을 찾아낸다.**
#    v4 에 유형이 생기면 계약이 빨개져 "따라가라"고 말한다.
#
# ⚠️ **`weight` 는 여기 없다.** hardness 가 정한다(§4 가중치) —
#    `app/types.py` 의 `WEIGHT_OF` 가 원본이고 규칙으로 집행된다.
#    두 곳에 적으면 갈린다.
#
# 🔴 **`implemented: false` 는 세포가 아직 없다는 뜻이다**(#7).
#    조용히 두면 "있는 줄" 알고 아무도 다시 안 본다. 세포 신규 구현은 단계 5 다.

#: 🔴 **사용자 지시로 v4 §4 표에 더한 유형.** 여기 적지 않으면 계약이 거부한다.
#
#  CLAUDE.md 규약: v4 가 원본이고 **사용자 지시가 v4 보다 위다.** 그러나 유형을
#  조용히 더하면 §4 표와 이 파일이 갈리고, 갈리면 어느 쪽이 맞는지 아무도 모른다.
#  ⚠️ 그래서 **더한 유형마다 지시 날짜와 근거 문서를 적는다** — 계약이 그 문서가
#     실재하는지까지 본다. 문서 없이 더하면 빨개진다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **② 재검색 루프의 각도 상한** (사용자 설계 2026-10-02)
# ══════════════════════════════════════════════════════════════════
#
# > ② 빗나가면 각도를 바꾼다 … **관련 0건이면 다음 템플릿**
# > 봇: 예산 3회, 늘리면 엔진 정지 전례 / 나: 경기당 2~4회 + 각도 전환
#
# 🔴 **맞힌 각도와 빗나간 각도를 구분한다.** 전 판 예산은 검색 **횟수**만 셌다 —
#    그래서 템플릿이 4개인 유형은 4번째를 영영 못 던졌고, 1번째에서 맞혀도 남은
#    예산이 돌아오지 않았다.
#    → `max_angles` 는 **빗나간 각도**만 센다. 맞히면 그 자리에서 멈춘다.
#
# ⚠️ **숫자는 실제 테스트로 정한다**(사용자 지시). 아래는 출발점이다:
#      사용자 실측이 "경기당 2~4회" 이므로 4 로 시작한다.
#      🔴 엔진 정지 전례는 **측정 루프가 수백 질의를 던졌을 때**지 경기당 4회 때가
#         아니다. 그래도 측정에서 `각도 소진` 비율을 보고 고친다.
catalog_policy:
  max_angles: 4
  # ══════════════════════════════════════════════════════════════
  # 🔴🔴 **지연 상한** (사용자 지시 2026-10-02 *"지연 상한 걸고"*)
  # ══════════════════════════════════════════════════════════════
  #
  # 실측 2026-10-02(소프트뱅크–치바롯데): ③ 좁은 질문 한 건에 **수 분**을 썼다.
  # 8B + 본문 2500자 + `timeout=120·retry=1` → 한 건이 최악 240초다. 세포 10개면
  # 질문 하나가 **40분**이 된다 — 사람이 기다리는 경로에서 그것은 없는 기능이다.
  #
  # 🔴 둘을 함께 건다 — 하나만 걸면 못 막는다(세포 시간 상한이 이미 그랬다):
  #    `llm_timeout_sec`  한 번 부르는 시간
  #    `llm_seconds`      세포 하나가 LLM 에 쓰는 **총 시간**
  # ⚠️ 숫자는 실제 테스트로 정한다 — 지금은 출발점이고, 넘긴 횟수가 자료가 된다.
  llm_timeout_sec: 30
  llm_seconds: 60
  llm_retry: 0   # 🔴 좁은 질문은 되시도하지 않는다 — 두 배 느려지고 답은 셋뿐이다
  measured: 미정 — 실제 테스트로 정한다(사용자 지시 2026-10-02)
  note: 빗나간 각도만 센다. 맞히면 남은 각도를 쓰지 않는다
  # 🔴 **뜻을 못 박는다**: `max_angles` 는 *빗나가도 되는 횟수*다. 첫 시도는 전환이
  #    아니므로 **던지는 각도는 max_angles + 1** 이다.
  #    ⚠️ 이 뜻이 흐려지면 "템플릿 4개인데 왜 3개만 돌았나"를 영영 못 센다.

added_by_user_instruction:
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **카탈로그 5종** — 사용자 설계 2026-10-02
  # ══════════════════════════════════════════════════════════════════
  #
  # > 핵심은 ① 카탈로그다. 내 "딥서치"의 8할은 **이 경기에서 뭘 확인해야 하는지
  # > 아는 것**이다 … 봇이 경기마다 카탈로그 전 유형을 돌린다. 그러면 "무엇을 찾을지"를
  # > 모델이 정할 필요가 없다. **8B 모델이 제일 못하는 게 바로 그 판단**이라 코드로 뺀다.
  #
  # ⚠️ 다섯 다 **v4 §4 표에 없다.** `home_field` 때와 같은 방식으로 선언한다 —
  #    날짜·지시·근거 문서를 붙이고 계약이 그 문서가 실재하는지 본다.
  # 🔴 전부 **사용자가 실제로 적중시킨 경기에서 나온 유형**이다(`why` 에 그 경기를 적는다).
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **라인업 시장가치** — 딥서치 2026-10-03 (사용자 지시)
  # ══════════════════════════════════════════════════════════════════
  #
  # > 축구 라인업 시장가치 소스를 쓰나? **딥서치해서 찾아서 넣어라.**
  #
  # ✅ 자료는 **이미 손에 있었다** — fotmob 경기 페이지의 라인업 선수마다
  #    `marketValue` 가 있다(실측: 선발 11 + 교체 15 전원). 새 소스 결정이 필요 없다.
  # 🔴 그런데 **λ 에는 넣지 않는다**: 가치를 **골 단위로 바꾸는 계수가 발표된 적이
  #    없다.** 발표된 모형(Peeters 2018 · arXiv 2411.09085)은 `(log 가치차)` 에 걸린
  #    **순서 프로빗**으로 승/무/패를 내고, 그 계수는 논문에 실려 있지 않다.
  #    → 그래서 **변수**로 넣는다(시나리오·가설·방아쇠에 닿는다).
  - type: lineup_value
    date: 2026-10-03
    instruction: 축구 라인업 시장가치 소스를 쓰나 — 딥서치해서 찾아서 넣어라
    doc: docs/fable/questions/2026-10-03_weight_deepsearch.md
    why: 오늘 선발의 시장가치 합이 **기준 선발**보다 낮으면 그 팀이 약해졌다. 🔴 결장·로테이션을 **숫자로** 잰다 — 전까지는 LLM 의 yes/no 뿐이었다.
  - type: coach_conflict
    date: 2026-10-02
    instruction: 내 동작을 봇 부품으로 — 카탈로그
    doc: docs/fable/questions/2026-10-02_catalog.md
    why: 스타와 감독의 갈등·이탈. 실례 — 호날두 이탈. 🔴 **양방향**이다(응집↑ 또는 분위기↓).
  - type: def_absence
    date: 2026-10-02
    instruction: 내 동작을 봇 부품으로 — 카탈로그
    doc: docs/fable/questions/2026-10-02_catalog.md
    why: 수비 결장. 실례 — 남아공 5-0 · 룩셈부르크 0-3. `absence` 와 달리 **상대 득점 상향 시나리오에 붙는다**.
  - type: squad_rotation
    date: 2026-10-02
    instruction: 내 동작을 봇 부품으로 — 카탈로그
    doc: docs/fable/questions/2026-10-02_catalog.md
    why: 로테이션·데뷔·2군. 실례 — 클롭 데뷔전 9명 교체. 우세팀을 **하향**시키고 무득점 시나리오를 더한다.
  - type: event_match
    date: 2026-10-02
    instruction: 내 동작을 봇 부품으로 — 카탈로그
    doc: docs/fable/questions/2026-10-02_catalog.md
    why: 행사·자선 경기. 실례 — 코니아스포르–팔레스타인. **승패 마켓을 접는다**.
  - type: national_duty_return
    date: 2026-10-02
    instruction: 내 동작을 봇 부품으로 — 카탈로그
    doc: docs/fable/questions/2026-10-02_catalog.md
    why: 대표팀 차출·복귀. 실례 — 한화 노시환·문현빈. **폼 표본을 무효화한다**(최근 N경기가 그 선수 없이 쌓였다).
  - type: home_field
    date: 2026-10-02
    instruction: 딥서치해서 그에 맞게 바꿔라
    doc: docs/fable/questions/2026-10-02_rule_defects.md
    why: §5-a 는 home 방향 변수 묶음에서 시나리오 A 를 만든다 — 홈 변수가 없으면
      홈으로 기울 변수가 없는 경기에서 A 가 아예 생성되지 않는다(실제로는 45%).

  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **유형 여섯** — 사용자 지시 2026-10-06 ③
  # ══════════════════════════════════════════════════════════════════
  #
  # > 없던 유형 다섯(`absence_att`·`coach_intent`·`individual_title`·`team_stats`·
  # > `regression`)은 카탈로그에 추가. 축구용 **피로 유형(`fatigue`)** 을 만들어
  # > `favors=상대` 쪽.
  #
  # ⚠️ 다섯은 `subtask_groups.yaml` 이 **이미 이름으로 쓰던 것**이다 — 카탈로그에
  #    없어서 방향 규칙을 못 찾고 enum 에서도 빠졌다(실측 2026-10-06: C 군 enum 이
  #    `stakes` 하나뿐이라 맞대결 기록까지 `stakes` 로 적혔다).
  # 🔴 `fatigue` 는 **그 자리를 `pitcher_state`(야구)가 먹고 있었다** — 축구 경기의
  #    피로 기사가 `favors=subject`(자기 쪽)로 붙었다. 피로는 **상대에게 유리하다.**
  - type: absence_att
    date: 2026-10-06
    instruction: 없던 유형 다섯은 카탈로그에 추가
    doc: docs/fable/decisions/2026-10-06_user_decisions.md
    why: 공격 결장. 🔴 `def_absence` 의 거울이다 — 결장 팀 반대 방향이고 **득점은 내려간다**(goals=down).
  - type: coach_intent
    date: 2026-10-06
    instruction: 없던 유형 다섯은 카탈로그에 추가
    doc: docs/fable/decisions/2026-10-06_user_decisions.md
    why: 감독이 공개로 밝힌 의도(테스트·점검·전력 숨김). 🔴 양방향이다 — 어느 쪽으로 쓸지 모른다.
  - type: individual_title
    date: 2026-10-06
    instruction: 없던 유형 다섯은 카탈로그에 추가
    doc: docs/fable/decisions/2026-10-06_user_decisions.md
    why: 개인 기록·타이틀 경쟁. 실측 2026-10-06 — 손흥민 58골 단독 기록이 `stakes` 로 섞여 들어갔다.
  - type: team_stats
    date: 2026-10-06
    instruction: 없던 유형 다섯은 카탈로그에 추가
    doc: docs/fable/decisions/2026-10-06_user_decisions.md
    why: 팀 수치(득실·연속·홈원정 차). 🔴 기사가 말하는 수치를 변수로 받는 자리다.
  - type: regression
    date: 2026-10-06
    instruction: 없던 유형 다섯은 카탈로그에 추가
    doc: docs/fable/decisions/2026-10-06_user_decisions.md
    why: 흐름이 평균으로 돌아온다. ⚠️ §6-2 ③ 필수형(회귀 반전형)이 이 유형을 이름으로 가리키는데 표에 없어 **한 번도 발동하지 않았다**.
  - type: fatigue
    date: 2026-10-06
    instruction: 축구용 피로 유형을 만들어 favors=상대 쪽
    doc: docs/fable/decisions/2026-10-06_user_decisions.md
    why: 피로·체력 저하. 🔴 **상대에게 유리하다**(favors=opponent). ⚠️ 종전엔 야구 유형 `pitcher_state`(favors=subject)가 이 자리를 먹어 방향이 뒤집혔다.

  - type: suspension
    date: 2026-10-06
    instruction: 축구 완성 지시서 §3 카탈로그 표(결장 계열에 징계를 더한다)
    doc: docs/fable/inbox/2026-10-06_v6_soccer_final.md
    why: 징계 결장. 🔴 `absence` 계열과 **같은 병합 열쇠**를 쓴다(§1-1) — 사유만 다르다(구조 사실 `Missing.reason=suspension`).
  - type: returning
    date: 2026-10-06
    instruction: 축구 완성 지시서 §3 카탈로그 표(복귀 유형)
    doc: docs/fable/inbox/2026-10-06_v6_soccer_final.md
    why: 복귀. 🔴 결장의 **거울**이다 — `favors=자기`, 득점 방향은 포지션에 따라 반대(수비 복귀 → 득점↓).

#: §4 전제 변수 표시 — 이 셋이 틀리면 시나리오가 통째로 무효다(STEP 2 재검증 대상)
premise_types: [match_type, lineup_intent, travel_schedule]

types:
# 🔴 유형마다 **어느 세포 질문이 이것을 뒤집나** (`watch`).
#
#  ══════════════════════════════════════════════════════════════════
#  사용자 지시 2026-10-02 ⑫ (방아쇠)가 이 칸을 요구했다.
#  ══════════════════════════════════════════════════════════════════
#
#  방아쇠는 *"**무엇이 보이면** → 무엇이 바뀌고 → 상한 얼마"* 다. 그 "무엇이
#  보이면"의 **언제**가 세포의 깨는 시각이고, 그것은 `cells.WAKE` 가 들고 있다.
#  → 유형이 어느 세포 질문에 걸려 있는지만 적으면 **시각은 계산된다.**
#
#  🔴 §9 단계 5 완료 조건의 *"§4 유형표 전 항목에 **세포 질문 매핑**"* 이 이것이다.
#  ⚠️ 어휘는 **`app/cells.py` 의 `Q_TYPES` 다**(계약이 대조한다) — 여기서 새 이름을
#     만들지 않는다.
# 🔴 `implemented` — **코드가 그 유형의 방향을 실제로 배정하나.**
#
#  ⚠️ 2026-10-02 배선이 이 칸이 **낡아 있던 것**을 찾았다. 아홉 유형이 이미
#     `app/classify.DIRECTION_OF` 에 있는데 여기는 전부 `false` 였다 →
#     `rules.unimplemented_types()` 가 **열네 개를 다 미구현으로** 냈고, 카드
#     블록 1 이 *"recent_pattern 은 세포가 없다"* 는 **거짓**을 적을 참이었다.
#  🔴 그래서 계약이 `classify.DIRECTION_OF`·`NOT_CLASSIFIED` 와 **대조한다**
#     (`tests/stage4/test_analyze.py`). 코드가 원본이고 이 칸은 선언이다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **카탈로그** — 유형마다 *무엇으로 찾고 · 어떻게 판정하고 · 어디에 붙나*
# ══════════════════════════════════════════════════════════════════
#
# 사용자 설계 2026-10-02: *"내 '딥서치'의 8할은 이 경기에서 뭘 확인해야 하는지 아는 것"*.
#
#   templates    🔴 **검색어 꼴.** 순서가 곧 **각도 순서**다(프리뷰 → 회견 → 현지 매체).
#                 자리표: {team} {opp} {comp} {coach} {player}
#                 ⚠️ 개수·상한은 **실제 테스트로 정한다**(사용자 지시) — 지금 값은
#                    출발점이고, 측정하면 숫자가 바뀐다. 바뀌면 여기만 고친다.
#   decides      판정 기준 — 코드가 이 조건으로 변수를 세운다(모델이 아니라)
#   attaches_to  🔴 **작동** — 어느 시나리오에 붙나(§5-c 교차 규칙 id 또는 방향)
#
# 🔴 모델은 이 표를 **읽지 않는다.** "무엇을 찾을지"는 코드가 정한다 — 8B 가 가장
#    못하는 판단이 그것이다(사용자 진단). 모델은 ③ 좁은 질문에만 쓴다.

  stakes:
    # 🔴🔴 **구체 동기의 보기**(사용자 지시 2026-10-06(7차) §3) — 추출 프롬프트가 이 줄을
    #    모델에 보여 준다. ⚠️ 이런 문장은 `stakes_vague` 로 **버리지 않는다**:
    #      강등·승격·탈락·진출 · *"이겨야 한다"* · *"비겨도 된다"* · *"n골 차 필요"*
    examples: ["이기지 못하면 강등이 확정된다", "비겨도 조 2위를 지킨다",
               "2골 차로 이겨야 순위가 올라간다", "must win to stay in contention",
               "a draw is enough to finish second"]
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [soccer, baseball, hockey, basketball, volleyball]
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
      - '매직\s*넘버|우승\s*확정|탈락\s*확정|진출\s*확정|순위\s*결정전|\d+위[^.]{0,12}\d+경기\s*차'
      - 'magic number|clinch|eliminat(ed|ion)|relegation|playoff spot|title race'
      - 'マジック|優勝決定|降格|進出'
    watch: standings            # 순위표가 바뀌면 경계까지 거리가 바뀐다
    cell_question: 순위표·잔여경기·확정/탈락·시드·타이브레이커
    direction_rule: 걸린 팀 쪽 승리 방향
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `걸린 팀 쪽 승리 방향` — ⚠️ **확정·탈락 확정이면 상대**
    favors: subject
    goals: none
    # 🔴 **사용자 지시 2026-10-02** — 결함 ①. **양쪽이 다 걸렸을 때 두 항목으로 나눈다.**
    #
    #  실측: UEFA 네이션스리그 C 2그룹 — 몬테네그로 6점 **승격 경쟁** · 라트비아 1점
    #  **강등 회피**. 양쪽이 걸렸는데 *"걸린 팀 쪽"* 이 한쪽을 못 고르니 그 사실이
    #  변수에서 통째로 빠졌고, 두 경기가 §7 R5(자료 부족)로 멈췄다.
    #    쪼갠 뒤: 라트비아–몬테네그로 변수 2→4개·방향 1→2종 ✅ · 키프로스–아르메니아 1→3개 ✅
    #
    #  🔴 새 장치가 아니다 — `coach_change` 가 이미 `splits_direction` 을 갖고 있다
    #     (*"두 방향을 밀면 두 항목으로 나눠 저장한다"*).
    #  ⚠️ **무동기는 변수를 만들지 않는다**(§4 보기: *"우간다 본선 자동 확정(=무동기)"*).
    #     한쪽만 걸린 경기는 종전처럼 한 항목이다 — 실측: 시애틀(플레이오프 경계) vs
    #     캔자스시티(최하위·탈락권)는 **시애틀만** 변수가 된다.
    splits_direction: true
    splits_only_when: 양쪽이 서로 다른 것을 걸고 있다(승격 vs 강등 회피 등)
    implemented: true

  coach_change:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [soccer, baseball, hockey, basketball, volleyball]
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
