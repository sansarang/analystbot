    favors: subject
    goals: none
    # 🔴 **사용자 지시 2026-10-02** — 결함 ⑥. **표본 수가 weight 를 정한다.**
    #
    #  §7 **R7** 이 `recent_pattern` 에만 걸려 있었다(*"n_games<3 이면 weight 0.4"*).
    #  `h2h_pattern` 에는 없어서 **3경기와 30경기가 같은 1.0** 을 받았다.
    #
    #  🔴 실측 2026-10-02 — 같은 맞대결(시애틀–캔자스시티 30경기)을 창만 바꿔 재니:
    #
    #      창      시애틀 승  무    KC 승   경기당 총골  오버2.5  양팀득점
    #      3경기    66.7%   33.3%  **0.0%**   4.67     67%    100%
    #      5경기    60.0%   20.0%  20.0%     3.80     60%     80%
    #     10경기    50.0%   10.0%  40.0%     3.40     70%     70%
    #     15경기    46.7%    6.7%  46.7%     3.67     80%     80%
    #     20경기    45.0%   10.0%  45.0%     3.35     75%     65%
    #     30경기    46.7%   16.7%  36.7%     2.73     57%     57%
    #
    #  🔴 **3경기 창은 "KC 가 한 번도 못 이겼다"고 말한다. 실제는 36.7% 다.**
    #     경기당 총골도 4.67 ↔ 2.73 로 **1.93골** 흔들린다.
    #     ⚠️ 2026-10-01 에 내가 진 방식이 정확히 이것이다 — 맞대결 3경기(총 2골)를
    #        근거로 언더 2.5 에 0.9 를 걸었고 4-1 로 낙첨했다.
    #
    #  🔴 안정 지점: 승률이 **10경기부터** ±5%p 안이다(50.0/46.7/45.0/46.7).
    #     3~5경기는 ±20%p 흔들린다. 그래서 §4 의 세 칸(1.0/0.7/0.4)에 이렇게 맞춘다.
    #  ⚠️ **창은 최근 10경기로 고정**한다 — 30경기는 옛 시대가 섞여 총골이 내려간다
    #     (2.73). §7 R7 이 *"두 창을 함께 본다"* 고 한 이유와 같다.
    sample_weight:
      window: 최근 10경기
      ">=10": 1.0
      "5~9": 0.7
      "<5": 0.4
    measured_2026_10_02: 시애틀–KC 30경기 · 창 3→30 에서 승률 폭 21.7%p · 총골 폭 1.93
    implemented: true

    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **전반 스코어** — 사용자 분석 2026-10-03
    # ══════════════════════════════════════════════════════════════
