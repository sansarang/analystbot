    #  ⚠️ **열기 예산과 바꾸는 값이다** — 경기 하나당 통신 한 번이다. 사용자가 쓴
    #     패턴이 *"4번 연속"* 이라 `4` 로 시작한다. 숫자는 실제 테스트로 고친다.
    half_time_matches: 4
