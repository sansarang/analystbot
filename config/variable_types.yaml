    #     일어난 일이 아니다. 🔴 그것을 맞대결 통계에 넣으면 평균이 거짓이 된다.
    #  🔴 표기 글자는 **여기** 적는다(코드가 짐작하지 않는다). ⚠️ 우리가 실제로
    #     만나는 표기만 적는다 — 그 밖의 것은 **못 걸러낸다고 사유에 남긴다**.
    forfeit_marks: ["몰수", "没収", "forfeit", "forfeited", "awarded"]
