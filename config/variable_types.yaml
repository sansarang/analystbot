    direction_rule: 결장 팀 반대 방향
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `결장 팀 반대 방향` — 주전이 빠지면 **상대**에 유리
    favors: opponent
