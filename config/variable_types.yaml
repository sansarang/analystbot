  pitcher_state:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
    #    ⚠️ 실측: 축구 경기에 `pitcher_state` 가 enum 에 있어 피로 기사가 그 유형으로 붙었다.
    sports: [baseball]
    # 🔴 산문 → 유형(위 머리글). ⚠️ 씨앗이고 실측으로 고친다.
    match:
      - '선발(\s*투수)?\s*예고|예고\s*선발|\d+이닝\s*무실점|노게임|불펜\s*데이'
      - 'probable pitcher|starting pitcher|\bno-hitter\b|bullpen day'
      - '先発予告|予告先発|完封|無失点'
    watch: starter_recent            # 예고 선발·투구 이력 세포
    # 🔴 사다리의 **현지 낱말 개념**(`config/search_words.yaml`) — 언어마다
    #    같은 뜻의 낱말을 거기 한 번 적고 유형이 그것을 가리킨다(사본 금지).
    word: xi
    cell_question: 예고 선발 최근 4~5등판·이닝·등록 이력·불펜 데이
    direction_rule: 좋은 쪽 승리·언더, 불펜 데이 오버
    # 🔴 **누구에게 유리한가**(지시 2026-10-05) — 위 `direction_rule` 의 글이 말하는 것을 **값으로** 옮겼다: `좋은 쪽 승리·언더, 불펜 데이 오버`
    favors: subject
    goals: none
    # 🔴 §4 예외 — 총점 방향은 스코어에서 계산하고 변수엔 붙이지 않는다.
    #    단 pitcher_state·venue_weather 는 over/under 힌트를 갖는다.
    total_hint: true
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **구현했다** (사용자 지시 2026-10-02: *"한꺼번에 전부 수정해라"*)
    # ══════════════════════════════════════════════════════════════
    #
    #  ⚠️ 왜 이제까지 못 했나: 예고 선발 **이름조차** DB 에 없었다(`starters` 14줄이
    #     전부 MLB). npb.jp 일정 페이지가 `先発：田中`·`先発：前田悠` 로 주고 있었는데
    #     파서가 끝난 경기의 `勝：`·`敗：` 와 섞어 쓰고 있었고, 수집이 9/30 에
    #     멈춰 있어 10/2 예고가 들어온 적이 없다.
    #
    #  🔴 방향은 **방어율(ERA)로만** 정한다 — 승패는 타선이 섞인다.
    #  ⚠️ 두 선발의 ERA 를 **둘 다** 알아야 한다. 하나라도 없으면 **미결정**이다
    #     (한쪽만 알고 방향을 정하면 그것은 추측이다).
    implemented: true
    #: 🔴 **얼마나 벌어져야 변수인가.** 이 밑은 '비슷하다'로 보고 배경으로 둔다.
    #   ⚠️ 숫자는 **실제 테스트로 정한다**(사용자 지시 2026-10-02). 0.75 로 시작한다 —
    #      리그 평균 ERA 가 3 전후이므로 0.75 는 25% 차이다. 측정 뒤 고친다.
    # 🔴🔴 **§5-6 이 걷었다**(2026-10-04) — 근거 없는 상수였다. 그 사실과
    #    까닭은 `config/thresholds.yaml` 의 `era_gap_min` 줄에 남아 있다.
    #    ⚠️ 방향은 이제 **산수**다(낮은 쪽) — 얼마나 차이 나면 뜻이 있나는
    #       §6 이 **무게**로 말한다.
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **표본이 모자라면 λ 를 건드리지 않는다**(실측 2026-10-03)
    # ══════════════════════════════════════════════════════════════
    #
    #  라이브: 唐川(은퇴 등판)의 2026 성적이 **1경기 5이닝 ERA 7.20** 이었고, 그
    #  수로 보정하니 상대 기대 득점이 **4.66 → 6.92**(+48%) 로 튀었다.
    #  🔴 한 경기 ERA 는 그 투수의 실력이 아니다 — `min_venue_games` 가 막는 것과
    #     **같은 병**이다(개막 직후 2~3경기 표로 λ 를 만들면 쓰레기가 나온다).
    #  ⚠️ 표본으로 **줄이는**(shrinkage) 방법도 있지만 그것은 사전 분포의 세기라는
    #     **맞출 모수**를 요구한다 — 금지다. 그래서 **문턱**으로 막는다.
    #  🔴 숫자는 실제 테스트로 고친다(사용자 지시). `20` 으로 시작한다 — ERA 가
    #     9이닝당이므로 20이닝은 **세 등판**쯤이다.
    min_innings: 20
    templates:
      - {q: "{team} probable pitcher ERA", lang: en}
      - {q: "{team} 선발 투수 평균자책", lang: ko}
      # 🔴 일본어 — 予告先発(예고 선발) · 防御率(방어율)
      - {q: "{team} 予告先発 防御率", lang: ja}
      - {q: "{team} 先発 今季成績", lang: ja}
    asks: "이 경기 선발 투수의 평균자책점이나 승패 기록이 적혀 있나?"
    decides: 두 선발의 방어율을 둘 다 알고 차이가 era_gap_min 이상이다
    attaches_to: 5c-3      # 저득점 — 좋은 선발은 상대 득점을 낮춘다

