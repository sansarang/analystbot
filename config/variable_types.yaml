    #    같다**(§4 `sample_weight` 와 같은 결) — 그래서 `hardness` 로 말한다.
    #    `h2h_pattern` 의 표본 깎기가 이미 그 꼴이다(`_hardness_cap`).
    stale_days: 7
    stale_hardness: soft

  h2h_pattern:
    # 🔴 **종목 선언**(사용자 지시 2026-10-06 ③) — 요청마다 그 종목 유형만 enum 에 들어간다.
