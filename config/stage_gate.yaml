# 단계 잠금 — v4 §13-2 · §9
#
# 🔴 **승인 서명 파일이 없으면 다음 단계 테스트가 수집조차 되지 않는다.**
#    그래서 "단계를 건너뛰고 앞 단계 코드를 쓰기"가 기계로 막힌다.
#    이 잠금을 우회하는 코드 변경은 계약 실패다(§13-2).
#
# ⚠️ 2026-09-27 전면 삭제 때 이 기계가 사라졌고, 그 뒤로는 규율만 남았다.
#    그 공백에서 실제로 다쳤다 — 단계 1 코드 커밋 `d0c6000` 이 서명 칸
#    `(대기)` 인 채로 나갔다(§11-10 위반, 리뷰 A1 이 잡았다).
#
# 🔴 **단계 목록을 여기 베끼지 않는다.** 어떤 단계가 존재하는지는 v4 §9 표가
#    원본이고, 계약이 그 표를 읽어 이 파일이 빠뜨린 단계를 찾아낸다.
#    여기 적는 것은 v4 가 말하지 않는 것뿐이다 — 어느 파일이 서명이고,
#    무엇을 잠그는가.

# 승인 서명이 사는 곳
signature_dir: docs/fable/stages

# 🔴 서명 줄 형식. `>` 인용 안에 있어도 된다.
#    `APPROVED <ISO시각> <사용자 메시지 원문>`
#    ⚠️ **사용자 메시지 원문을 그대로** 적는다 — "승인함" 으로 바꿔 적으면
#       무엇에 대한 승인이었는지가 사라진다.
signature_pattern: '^\s*>?\s*APPROVED\s+(\d{4}-\d{2}-\d{2}(?:T[\d:.+\-Z]+)?)\s+(\S.*)$'

# 단계 N 의 테스트는 **단계 N-1 의 승인 서명**이 있어야 수집된다.
#
# 🔴 **`locks` 를 적지 않는다.** 잠그는 디렉터리는 `tests/stage{N}` 으로 **규칙이
#    정한다**(`stage_gate.locks_of()`). 종전에는 여덟 줄을 손으로 적었고, 계약이
#    그것을 규칙과 대조했다 — 보장은 같았지만 **손 유지 항목이 여덟 개** 있었다.
#    규칙에서 계산하면 0 이다(리뷰 P4).
gates:
  - stage: 2
    requires: v4_1_done.md
  - stage: 3
    requires: v4_2_done.md
  - stage: 4
    requires: v4_3_done.md
  - stage: 5
    requires: v4_4_done.md
  - stage: 6
    requires: v4_5_done.md
  - stage: 7
    requires: v4_6_done.md
  - stage: 8
    requires: v4_7_done.md
  - stage: 9
    requires: v4_8_done.md

# ⚠️ 단계 0·1 의 계약은 `tests/*.py` 에 평평하게 있고 **잠그지 않는다.**
#    둘 다 이미 승인됐고, 이미 승인된 것을 잠그면 스위트가 스스로를 막는다.
#    단계 2 부터 디렉터리로 가른다.
