# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **대회 짧은 이름** — 지시서 2026-10-06 §2
# ══════════════════════════════════════════════════════════════════
#
# > 대회 짧은 이름 — `competition_short(full)` 한 함수(정본 하나, 사본 금지):
# > 조·라운드·리그 등급 꼬리 제거 … **매핑 표가 필요하면**
# > `config/competition_short.yaml`(데이터). 표에 없으면 꼬리 제거 규칙만 적용.
#
# 🔴 **왜 질의에 짧은 이름을 쓰나** — 실측 2026-10-06 카드 원문:
#
#     §12-b 위반 'Georgia squad 2 UEFA Nations League B Grp. 2'
#     §12-b 위반 'Northern Ireland national team return Oct 5'
#
#   대회 전체명(조 포함)이 들어가 낱말이 상한(10)을 넘고 문지기에 걸렸다.
#   ⚠️ 문지기는 맞게 막았다 — 고칠 곳은 **질의를 만드는 쪽**이다.
#
# 🔴 이 표는 **꼬리 제거로 안 되는 것만** 적는다. 규칙으로 되는 것을 여기 적으면
#    사본이 되고, 규칙이 바뀔 때 따라가지 않는다(#1).
short:
  # ⚠️ `리그` 꼬리는 규칙이 걷는다 — 그래도 적는 까닭: `KBO 리그` 는 한국어
  #    매체가 `KBO` 로도 `프로야구` 로도 쓰고, 질의에 쓸 글자는 **KBO** 다.
  #    🔴 규칙 결과와 같아도 **뜻이 다르다**(우연히 같은 것이 아니다).
  "KBO 리그": KBO

  # 🔴 실측에서 걸린 그 둘 — 규칙만으로도 되지만 **회귀를 못 박아 둔다**
  #    (이 두 글자가 바뀌면 그 사고가 되돌아온다는 뜻이다).
  "UEFA Nations League B Grp. 2": Nations League
  "CONCACAF Nations League A Grp. 2": CONCACAF Nations League

why: |
  🔴 질의는 **3~10낱말**이어야 한다(§12-b `too_long`). 대회 전체명은 그 혼자
  5~6낱말을 먹는다 — 팀·상대·핵심어를 넣을 자리가 남지 않는다.
  ⚠️ 그리고 조 번호·라운드는 **기사 본문에 그 글자로 안 나온다** — 넣으면
  구조적으로 0건이다(2026-10-02 에 일본어 팀명 + 한국어 낱말로 같은 병을 봤다).
source: 지시서 §2 (docs/fable/inbox/2026-10-06_workorder_nir_geo_fixes.md)
