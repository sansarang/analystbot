# 🔴🔴 **받은 자료에서 만드는 변수** — 사용자 지시 2026-10-18.
#
# > 선수 능력치, 갈래, **우리가 받은자료에서 변수 추가할것**
# > **가나다 전부 변수에 닿게**
#
# 🔴 손값은 **전부 여기** 있다(코드에 박지 않는다 · CLAUDE.md #1 · §13-7).
# 🔴 새 통신 0 — 아래는 이미 들어오는 자료만 쓴다(`core/datavars` 가 읽는다).
# ⚠️ 크기(±5%)는 λ 보정표(`variable_routing.lambda_rules`)가 든다 — 여기 없다.

# ══════════════════════════════════════════════════════════════════
# 가. 선수 능력치
# ══════════════════════════════════════════════════════════════════
ability:
  #: 🔴 A1 — 두 팀 **선발 평균 백분위** 차가 이보다 커야 변수가 선다
  #   ⚠️ 갈래 문턱(`ability.yaml branch_gap` 0.10)과 **다른 수**다 — 그것은
  #      자리 묶음(중원·측면)이고 이것은 **선발 전체**라 흔들림이 적다.
  squad_gap: 0.05
  #: 🔴 A1 — 한쪽이 이보다 적으면 평균이 몇 사람에 휘둘린다 → 안 센다
  squad_min: 8
  #: 🔴 A2 — 빠진 선수와 대체 선수의 백분위 차가 이보다 커야 선다
  absence_gap: 0.10
  #: 🔴 A3 — 자리 묶음 차가 이보다 커야 그 묶음을 "쏠렸다"고 센다
  tilt_gap: 0.08
  #: 🔴 A3 — 쏠린 묶음이 한쪽에 이만큼 더 많아야 변수가 선다
  tilt_lead: 2

# ══════════════════════════════════════════════════════════════════
# 나. 갈래 — 🔴 **LLM 주장 없이 코드가 세운다**
# ══════════════════════════════════════════════════════════════════
branches:
  #: 🔴 B1 — 가릴 갈래(이름은 `config/ability.yaml` 의 `branches:` 표가 든다)
  #   ⚠️ 여기 이름을 **다시 적지 않는다**(사본 금지) — 빈 목록이면 **표 전부**다
  use: []
  #: 🔴 B2 — 가려진 갈래가 한쪽에 이만큼 더 많아야 "묶음 변수"가 선다
  count_lead: 2

# ══════════════════════════════════════════════════════════════════
# 다. 받고 있는데 변수가 안 서던 자료
# ══════════════════════════════════════════════════════════════════
facts:
  #: 🔴 C3 선수 가치 — 두 팀 선발 가치 **합**의 비가 이보다 커야 선다(1.0 = 같다)
  value_ratio: 1.30
  #: 🔴 C3 — 가치를 가진 선발이 한쪽에 이보다 적으면 안 센다
  value_min: 6
  #: 🔴 C4 상태 배율 — `뒤짐` 칸의 득점 배율 차가 이보다 커야 선다
  #   ⚠️ 뜻 — 지고 있을 때 **되돌리는 힘**이다(그 수가 표에 있는 리그만 돈다)
  state_gap: 0.10
  #: 🔴 C6 포메이션 — 직전 다섯 경기에서 포메이션이 이만큼 바뀌면 "흔들렸다"
  form_changes: 3
  #: 🔴 C7 득실 몰림 — 한 경기 실점이 이보다 크면 "몰렸다"고 센다
  blowout_ga: 4
  #: 🔴 C7 — 몰린 경기가 한쪽에 이만큼 더 많아야 변수가 선다
  blowout_lead: 1

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **5경기로 실제 실력을 잰다** — 사용자 지시 2026-10-18
# ══════════════════════════════════════════════════════════════════
#
# > 5경기를 통하여 **두팀의 실제 실력**을 가늠하기 위함이다 .. 이거는 **과거
# > 데이타**고 이 데이타를 가지고 **오늘 경기를 예측**하는거다
#
# 🔴 왜 — 종전 `S01`(득실 평균)·`IR12`(직전 결과)·`DV7`(몰림)은 **상대를 안
#    본다**. 그러면 *"실제 실력"* 이 아니라 **일정 운**이 섞인다(꼴찌 상대 2골과
#    1위 상대 2골이 같은 한 경기로 센다).
# ⚠️ 순위는 **오늘 표**다 — 그날 순위는 자료가 없다(쌓기 시작한 날부터 생긴다).
#    그 사실을 변수 글에 **글자로** 적는다(#3 · 지어내지 않는다).
strength:
  #: 🔴 상대 평균 순위 차가 이보다 커야 "일정이 달랐다"고 센다(순위 칸 수)
  rank_gap: 2.0
  #: 🔴 순위를 찾은 상대가 한쪽에 이보다 적으면 안 센다(표에 없는 상대가 많다)
  rank_min: 3
  #: 🔴 **상위권**의 뜻 — 순위표 위에서 이 비율까지(0.33 = 상위 1/3)
  top_share: 0.33
  #: 🔴 상위권 상대에서 딴 **경기당 승점** 차가 이보다 커야 변수가 선다
  top_pts_gap: 0.50
  #: 🔴 상위권 상대 경기가 한쪽에 이보다 적으면 안 센다
  top_min: 2
  #: 🔴 **가중 폼** — 상대 순위로 가중한 득실 차가 이보다 커야 선다(골)
  weighted_gap: 0.30

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **5경기의 흐름(폼)을 상세하게** — 사용자 지시 2026-10-18
# ══════════════════════════════════════════════════════════════════
#
# > 5경기에서 더 확인해야 할거는 **흐름**이다 .. **폼**이라는 말이다 ..
# > **상세하게** .. 그냥 5경기 실득점만 확인하는게 아니다
#
# 🔴 종전 `S01` 은 **평균 하나**였다 — 5경기를 한 수로 뭉갰다. 평균은 순서를
#    버린다(0-4 뒤 3연승과 3연승 뒤 0-4 가 같은 수가 된다).
# 🔴 그래서 **순서로** 본다: ① 추세(앞/뒤 토막) ② 최신 가중 ③ 홈·원정 쪼갬
#    ④ 흔들림. ⚠️ **연승은 표현하지 않는다**(사용자 지시 2026-10-17) — 승을
#    묶어 세지 않고 **경기마다** 본다.
flow:
  #: 🔴 ① 추세 — 최신 쪽 토막에 넣을 경기 수(나머지가 앞 토막이다)
  late_games: 2
  #: 🔴 ① 두 토막의 경기당 득실 차가 이보다 커야 "오르거나 내렸다"고 센다(골)
  trend_gap: 0.80
  #: 🔴 ② 최신 가중 — 최신 경기 무게. 뒤로 갈수록 이 값씩 깎는다(0.8 → 0.64 …)
  decay: 0.80
  #: 🔴 ② 가중 득실 차가 이보다 커야 변수가 선다(골)
  decay_gap: 0.35
  #: 🔴 ③ 홈·원정 쪼갠 폼 — 오늘 홈팀은 과거 홈경기, 원정팀은 과거 원정경기.
  #   그 경기 수가 한쪽에 이보다 적으면 안 센다
  side_min: 2
  #: 🔴 ③ 쪼갠 경기당 득실 차가 이보다 커야 선다(골)
  side_gap: 0.60
  #: 🔴 ④ 흔들림 — 경기별 득실 차의 폭(최대−최소). 차가 이보다 커야 선다
  swing_gap: 2.0
