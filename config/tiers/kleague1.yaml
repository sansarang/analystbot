# K리그1 티어 표 — **사용자가 채운다.**
#
# 🔴 Claude Code 는 이 값을 추측해서 채우지 않는다(지시문 Phase 2-1).
#    골격만 만들고 대기한다. `tier: null` 인 팀은 사전값 계산에서
#    **리그 중앙(3)** 으로 처리되고, 그 사실이 로그와 `prior_src` 에 남는다.
#
# 티어 1=우승권 · 2=상위권 · 3=중위권 · 4=하위권 · 5=승격팀/강등권
# 승격팀은 5 로 둔다.
#
# ⚠️ 팀 이름은 **우리 games 표기 그대로**다. 손으로 고치면 매칭이 깨진다.
#    (목록 출처: 운영 DB 2026-09-13 · 12팀)
#
# ⚠️ 나중에 clubelo·Dixon-Coles 가 오면 이 파일을 **대체**한다
#    (모델 우선, 티어는 폴백). 그때 `prior_src` 가 "tier"→"elo"|"dc" 로 바뀐다.

# 🔴 [2026-09-14] 값은 **사용자가 준 표** 그대로다 (페이블 사전값,
#    2026-27 / 2026 시즌). Claude Code 가 티어를 만들지 않았다.
#    이름은 운영 DB 표기이고, 표의 짧은 이름과는 기계 매칭했다.
#    매칭 안 된 팀은 **null 로 남겼다** — 추측해 채우지 않는다.

