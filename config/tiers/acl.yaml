# ACL 엘리트 티어 표
#
# 🔴 [2026-09-16 사용자 지시 "서치해서 넣으면 안되니?"] 값을 **검색으로** 채웠다.
#    근거는 **AFC 가 공표한 2026-27 ACL 엘리트 포트 배정**이다. 포트는 AFC
#    클럽 랭킹으로 정해지므로 **리그를 넘어 비교되는 값**이고, 그래서 절대
#    레이팅인 `TIER_ELO` 와 자가 맞는다(J1 2위와 태국 2위를 같게 놓지 않는다).
#      포트 1 → 티어 1 · 포트 2 → 2 · 포트 3 → 3 · 포트 4 → 4
#    출처: 2026-08-18 쿠알라룸푸르 조 추첨 · AFC 클럽 랭킹 기준 포트 배정
#    ⚠️ 이것은 **내 기억이 아니라 검색 결과**다. 내 학습은 2026-05 에서 멈춰
#       있어 기억으로 적으면 넉 달 묵은 추측이 된다.
#
# ⚠️ ACL 은 `elo` CSV 가 없다 — 사전값이 티어와 시즌 성적만으로 선다.
#    티어가 비면 사전값이 아예 안 만들어진다(U3: p_prior=NULL · prior_src='none').
#
# 🔴 키는 **DB 표기 그대로**다. `games.home/away` 에서 실측한 철자를 쓴다 —
#    리즈 사례(yaml "Leeds" vs DB "Leeds United FC" → 미기입 → 게이트 오분류)가
#    이름 불일치에서 났다. `Daejeon Hana Citizen`(FotMob) 은 DB 에서
#    `Daejeon Citizen` 이라 **둘 다** 둔다.
# 🔴 키 이름은 **tiers** 다 — load_tiers 가 그것을 읽는다.
#    ACL-1 에서 teams: 로 잘못 써서 처음부터 0팀이었다.
#
# 티어 1=우승권 · 2=상위권 · 3=중위권 · 4=하위권 · 5=승격팀/약체
tiers:
  # ── 포트 1 (AFC 랭킹 최상위)
  Kashima Antlers: 1
  Jeonbuk Hyundai Motors FC: 1
  Buriram United: 1
  Shanghai Port: 1

  # ── 포트 2
  Newcastle Jets: 2
  Johor Darul Ta'zim: 2
  Vissel Kobe: 2
  Daejeon Citizen: 2          # DB 표기
  Daejeon Hana Citizen: 2     # FotMob 표기 — 같은 팀

  # ── 포트 3
  Port FC: 3
  Beijing Guoan: 3            # 공표문 표기는 "Beijing FC"
  Kashiwa Reysol: 3
  Pohang Steelers: 3

  # ── 포트 4
  Ratchaburi FC: 4
  Kyoto Sanga FC: 4
  Gamba Osaka: 4
  "Công An Hà Nội": 4

  # ── 서부지역 — 🔴 **포트 배정을 못 찾았다. 비워 둔다.**
  #    지어내지 않는다. 비어 있으면 그 경기는 사전값 없이 보드 고정으로 간다.
  Al Hilal: null
  Al Nassr FC: null
  Al-Ain: null
  Al-Gharafa: null
