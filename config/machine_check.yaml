# 🔴🔴 **대회 유형별 면제**(수정 지시 2026-10-14 2번)
# ══════════════════════════════════════════════════════════════════
#
#  > 1단 필수 칸 확인: 운영 M1 확률은 Elo 바닥 없이 서는가 — 서면 JLC 에서
#  > Elo 바닥을 필수 칸에서 뺀다(**컵 종류만**).
#
#  🔴 **확인했다**(실측 2026-10-14 · 미토–FC도쿄): 대회 총골·홈 이점을 418경기로
#     재서 채우자 M1 이 **Elo 바닥 없이** 섰다 — 홈 29% · 무 25% · 원정 47% ·
#     축 종합 **−0.442** × β 0.25 → λ 이동 홈 −0.146 · 원정 +0.146.
#     즉 운영 M1 은 Elo 바닥을 **쓰지 않는다**(`legacy-4axis` 네 축 경로다).
#  ⚠️ 그래도 **대륙 대회는 면제하지 않는다** — 거기는 리그가 섞여 축0 의 잣대가
#     리그마다 다르고, 그 잣대를 맞추는 것이 Elo 바닥 + 오프셋이다.
#  🔴 면제는 **그 칸 하나**다 — 보드·축0 같은 나머지 필수 칸은 그대로다.
hard_except:
  elo_floor:
    - domestic_cup

