# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **1단 기계 점검 표**(의심 검증 통합본 v2 · 2026-10-14i §2)
# ══════════════════════════════════════════════════════════════════
#
#  > 입력 완전성 · 버그 반영 여부 · 신선도 → 정상 / 고장 / **기계 보류**.
#  > 🔴 기계 보류면 확신·역배 **둘 다 금지**(칠 표에서 빠진다).
#
# 🔴 읽는 곳은 `app/core/machine.py` **하나**다(코드에 값을 적지 않는다).
# ⚠️ 여기 적힌 **창(시간)은 측정값이 아니라 선언값**이다 — 그래서 창을 넘은 것은
#    기본적으로 **적기만** 하고, `hold` 가 참인 칸만 판정을 멈춘다(#4 추측 금지).

# 🔴 **그 칸이 빠지면 기계 보류** — 이것이 없으면 확률 자체가 서지 않는다
hard:
  - elo_floor      # Elo 바닥 승무패(`layers["base"].probs`)
  - axis0          # 축0(Elo 대비 잔차의 첫 축) — 확률 경로의 두 축 중 하나
  - board_lines    # 보드 줄(§1-3 보드 없는 경기는 없다)

# 🔴 **버그 반영** — 거짓이면 **고장**(고쳐서 재계산 · §2)
#    ⚠️ ①②③④ 는 `config/m1v2.yaml` 플래그가 말한다(그 파일이 원본이다).
#    ⚠️ 0-0 집계·대회 이력 기간은 **판의 `verified` 칸**이 말한다(2026-10-14c ③).
bugs:
  axis3_sign: "①  축3 부호(규칙 효과 부호로 ±)"
  weight_renorm: "②  결측 축 가중 재배분"
  home_mul_a: "③  팀별 홈 배율 끄기(백필에서 해롭다)"
  axis0_scale_decided: "④  축0 척도 정규화(판정 끝 · 켜거나 끈 상태가 적혀 있다)"
  comp_record_verified: "0-0 집계·대회 이력 기간(외부 공식 결과 대조)"

# 🔴 신선도 창(시간) — **넘으면 적는다**. `hold` 가 참인 칸만 판정을 멈춘다.
fresh:
  board:
    hours: 24
    hold: true      # 🔴 어제 보드는 **이 경기의 보드가 아니다**(§1-2 수집 시각)
    why: "보드는 그날 움직인다 — 날이 바뀐 보드는 다른 판이다"
  xi:
    hours: 6
    hold: false
    why: "확정 XI 는 킥오프 1시간 전에 뜬다(T−90분 폴링) — 그 전 값은 예상이다"
  absence:
    hours: 72
    hold: false
    why: "이 저장소가 쓰는 **새 사실 창**과 같다(72시간 · InfoQ `fresh`)"
  form:
    hours: 168
    hold: false
    why: "일정이 한 주 단위다 — 한 주가 지나면 경기가 끼었다"
