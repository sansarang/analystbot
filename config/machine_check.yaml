# 🔴🔴 **1단 기계 점검 표**(의심 검증 통합본 v2 · 2026-10-14i §2)
# ══════════════════════════════════════════════════════════════════
#
#  > 입력 완전성 · 버그 반영 여부 · 신선도 → 정상 / 고장 / **기계 보류**.
#  > 🔴 기계 보류면 확신·역배 **둘 다 금지**(칠 표에서 빠진다).
#
# 🔴 읽는 곳은 `app/core/machine.py` **하나**다(코드에 값을 적지 않는다).
# ⚠️ 여기 적힌 **창(시간)은 측정값이 아니라 선언값**이다 — 그래서 창을 넘은 것은
#    기본적으로 **적기만** 하고, `hold` 가 참인 칸만 판정을 멈춘다(#4 추측 금지).

# 🔴 **그 칸이 빠지면 기계 보류** — 이것이 없으면 확률 자체가 서지 않는다
hard:
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **`elo_floor`·`axis0` 를 필수 칸에서 뺐다** — 사용자 지시 2026-10-18
  # ══════════════════════════════════════════════════════════════════
  #
  # > **m5 elo 삭제**
  #
  # ⚠️ 실측 2026-10-18(모든 경기): 1단 점검이
  #      `🔴 필수 입력 빠짐 — Elo 바닥 승무패 · 축0(Elo 대비 잔차)(⬜)`
  #    으로 **영구히 `기계 보류`** 였다 — 등급이 한 번도 안 났다.
  # 🔴 까닭 — Elo(2026-10-17 *"elo 지워라"*)와 상성 축(같은 날 *"상성 삭제"*)을
  #    **지웠는데** 이 표가 그 둘을 필수로 두었다. 없는 것을 요구하면 판정이
  #    영구히 멈춘다.
  # 🔴🔴 **대신 지금 확률이 쓰는 재료를 필수로 둔다** — 비워 두면 `기계 보류`
  #    가 **영구히 안 걸려** 안전장치 하나가 사라진다(그것도 거짓이다).
  #    · `form_n` — 폼 표본 수. 과거 5경기가 **바탕**이다(사용자 지시
  #      2026-10-18: *"지난경기를 가지고 오늘를 예측"*). 없으면 `S01`·`IR12`·
  #      `ST*`·`FL*`·`DV6`·`DV7` 가 **전부** 못 선다.
  #    · `xi` — 라인업. **오늘 변수**가 전부 여기서 나온다(`IR01`·`IR02`·
  #      `AB*`·`BR*`·`DV3`).
  #    ⚠️ 둘 중 하나라도 ⬜ 면 예측의 한 층이 통째로 비어 있다는 뜻이다.
  - form_n
  - xi
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **`board_lines` 를 필수 칸에서 뺐다** — 사용자 지시 2026-10-14
  #    *"보드없이 진행해라"*
  # ══════════════════════════════════════════════════════════════════
  #
  #  ⚠️ 이것은 지시서 §1-3(*"보드 없는 경기는 없다"*)과 **충돌한다** — 직접 지시가
  #     이긴다(CLAUDE.md 첫 줄).
  #  🔴 실측 2026-10-14: AFC·J리그컵은 ② 가 유럽 주간분만 들고 ③ 피드에 그 대회가
  #     **아예 없다**(④ 통로 미구현) → 보드가 **구조적으로** 안 온다. 그 한 칸이
  #     오늘 10경기의 1단을 전부 멈췄다(다른 칸은 14/17·12/13 로 통과했다).
  #  🔴 대신 **보드가 없으면 그 사실이 두 곳에 남는다**:
  #     · 1단 줄 — `⚠️ 빠진 칸 보드(출처·시각)`
  #     · 칠 표 — `보드 없음 — 표준 줄로 골랐다`(`core/picks`)
  #  ⚠️ 그리고 **배당 계기판이 없다**(마진 제거할 배당이 없다) · **역배를 못
  #     값 매긴다** — 그래서 역배는 그대로 표시만이다.
  # - board_lines

