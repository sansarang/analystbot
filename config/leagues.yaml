# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **리그 명부** — *"사용자가 경기를 물으면 어느 리그부터 찾나"*
# ══════════════════════════════════════════════════════════════════
#
# 사용자 지시 2026-10-03:
#
# > 우선 봇이 기사를 못 읽고 지금 대부분 오류가 **서치 문제**다. 팀을 찾지도
# > 못하고... 매번 할 때마다 이러는 **근본 원인**을 찾아라... 사용자가 경기
# > 질문을 하면 **어느 리그부터 검색을 해야 하는지 단계별로 세세하게** 봇이
# > 찾아야 한다. **러프하게 코드 작성을 하지 말아라.**
#
# ══════════════════════════════════════════════════════════════════
# 🔴 근본 원인 (측정 2026-10-03)
# ══════════════════════════════════════════════════════════════════
#
# 봇에는 *"어느 리그인가"* 를 묻는 **단계가 아예 없었다.**
#
#   aliases.find_team("감바 오사카")  →  ('soccer', 'Gamba Osaka')
#                                        ^^^^^^^^ 🔴 **종목**이다. 리그가 아니다
#
# 별칭표 195항목이 `mlb:37 · kbo:24 · soccer:151` 세 덩어리로만 갈려 있고,
# **팀 → 리그** 표는 저장소 어디에도 없었다. 그래서 질문마다 이렇게 됐다:
#
#   ① 리그를 모른다            → `리그 미상`
#   ② 그래서 언어가 **영어 고정** → 일본·한국 경기를 영어로만 검색
#   ③ 그래서 어댑터를 못 고른다  → KBO 어댑터가 있어도 `soccer` 면 못 닿는다
#   ④ 그래서 엉뚱한 호스트를 연다 → `kia.com`(자동차)·`nba.com`·`golf.com`
#   ⑤ 그래서 사실이 0~5건       → *"자료 부족"*
#
# 🔴 ①이 뿌리다. 나머지 넷은 그 결과다.
#
# ══════════════════════════════════════════════════════════════════
# 🔴 이 파일이 정하는 것
# ══════════════════════════════════════════════════════════════════
#
#   order     : **어느 리그부터** 보나 (위에서 아래로)
#   sport     : 그 리그의 종목 — 종목이 다르면 후보에서 뺀다
#   langs     : 그 리그 기사의 언어 — 🔴 원본은 여기 하나다
#   adapter   : `collect.ingest.ADAPTERS` 의 열쇠(있으면 일정을 직접 받는다)
#   teams_from: 팀 명단을 **어디서 받나**. 🔴 **여럿 적는다 — 위에서부터 쓴다.**
#               adapter:<속성>   어댑터가 스스로 선언한 상수(가장 확실하다)
#               url:<주소>|<꼴>  공식 API 를 받아 이름을 뽑는다
#               fdorg:<대회코드>  football-data.org (키 있음·카드 없음)
#               tsdb:<리그명>    ⚠️ **열 팀에서 잘린다**(아래 경고)
#   names     : 사용자가 그 리그를 부르는 말 — 질문에 들어 있으면 **그 리그로 고정**
#
# ⚠️ 팀 이름을 여기 적지 않는다 — **받아서** 채운다(`app/league_index.py`).
#    손으로 적으면 이적·승강 때마다 한 발 늦고, 그 목록이 거짓이 된다.
#
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 TheSportsDB 는 **열 개에서 자른다** — 실측 2026-10-03
# ══════════════════════════════════════════════════════════════════
#
#   search_all_teams.php?l=Japanese J1 League   → **10팀**(J1 은 20팀이다)
#   all_leagues.php                             → **10리그**
#
# 🔴 그리고 `lookup_all_teams.php?id=…` 는 **id 를 무시한다**:
#
#   id=4633(J1) · id=4830(KBO) · id=4424(MLB)  →  **셋 다 똑같은 영국 2부 24팀**
#   ['Wigan Athletic', 'Blackpool', 'Doncaster Rovers', 'Leicester City', …]
#
# ⚠️ 24팀이 **돌아온다**는 사실만 보고 썼다면 봇이 **거짓 명단**으로 리그를
#    판정했을 것이다. 상태값(200 OK·건수)은 의도한 것이 동작한다는 증거가
#    아니다(CLAUDE.md #4). 🔴 그래서 그 길은 **안 쓴다.**
#
# 받아서 확인한 **온전한** 길(실측 2026-10-03):
#   MLB   statsapi.mlb.com/api/v1/teams?sportId=1   → 30팀 · 키 없음
#   NHL   api-web.nhle.com/v1/standings/now          → 32팀 · 키 없음
#   EPL   api.football-data.org/v4/competitions/PL/teams → 20팀 · 키(카드 없음)
#   KBO   어댑터가 선언한 10팀
#   J1·K리그1  🔴 **온전한 무료 길을 못 찾았다** — tsdb 10팀으로 시작하고
#              `games` 표가 쌓이며 메운다. 그 사실을 색인이 **사유로** 적는다.
# 🔴 순서는 **이 저장소가 실제로 다루는 빈도**다. 바꾸고 싶으면 여기만 고친다.

leagues:
  - key: KBO
    tsdb: Korean KBO League
    sport: baseball
    langs: [ko, en]
    adapter: KBO
    teams_from: [adapter:TEAM_IDS]
    names: [KBO, 케이비오, 한국프로야구, 프로야구]

  - key: NPB
    tsdb: Nippon Baseball League
    sport: baseball
    langs: [ja, en]
    adapter: NPB
    # ⚠️ npb 어댑터는 팀 명단 상수를 안 들고 있다 — 받아서 쓴다
    # ⚠️ TheSportsDB 의 일본 야구 리그 이름은 `Nippon Baseball League` 다
    #    (실조회 2026-10-03 · `Japanese Baseball League` 는 0팀이었다).
    # 🔴 **§8-4 로 걷었다**(2026-10-04) — tsdb 는 명단을 열 개로 자르고
    #    거짓 명단을 준다. ⚠️ npb 어댑터가 명단 상수를 안 들고 있으므로
    #    **명단 없이 돈다** — 리그 판정은 ②(쌓인 경기)·③(이름표)가 한다.
    teams_from: []
    names: [NPB, 일본프로야구, 니혼프로야구]

  - key: MLB
    tsdb: MLB
    sport: baseball
    langs: [en]
    adapter: MLB
    # 🔴 §8-4 — tsdb 대체를 걷었다(공식 API 가 30팀을 온전히 준다)
    teams_from: ['url:https://statsapi.mlb.com/api/v1/teams?sportId=1|mlb']
    names: [MLB, 메이저리그, 메이저]

  - key: J리그
    tsdb: Japanese J1 League
    sport: soccer
    langs: [ja, en]
    # 🔴 어댑터가 **없다** — 일정은 검색(`findgame`)으로 찾는다.
    #    ⚠️ 있는 척하지 않는다. 그래도 **리그를 아는 것**만으로 언어·소스가 바뀐다.
    adapter: null
    # 🔴 **§8-4 로 걷었다** — ⚠️ J1 은 20팀인데 tsdb 가 **10팀**만 줬다.
    #    그 열 개를 믿으면 나머지 열 팀의 질문이 `리그 미상` 으로 간다.
    #    🔴 명단 없이 돈다 — ②·③이 리그를 정한다(54팀 YAML 이 이름표를 채운다).
    teams_from: []
    names: [J리그, J1, 제이리그, J李그]

  - key: K리그1
    tsdb: South Korean K League 1
    sport: soccer
    langs: [ko, en]
    adapter: K리그1
    # 🔴 **§8-4 로 걷었다**(같은 까닭 · 54팀 YAML 이 이름표를 채운다)
    teams_from: []
    names: [K리그, K리그1, 케이리그]

  - key: 해외축구
    # ⚠️ 대회가 열셋이라 **한 이름으로 못 적는다** — 팀 조회가 주는 리그명이
    #    `English Premier League`·`Spanish La Liga` … 로 갈린다. 아래 `tsdb_any` 가
    #    그 목록이다(실조회로 확인한 것만 적는다).
    tsdb_any: [English Premier League, Spanish La Liga, Italian Serie A,
               German Bundesliga, French Ligue 1, Dutch Eredivisie,
               Portuguese Primeira Liga, UEFA Champions League,
               Brazilian Serie A, English League Championship]
    sport: soccer
    langs: [en]
    adapter: 해외축구
    # 🔴 열세 대회가 한 어댑터다 — 대회마다 받아 합친다(fdorg 는 안 자른다)
    teams_from: [fdorg:PL, fdorg:PD, fdorg:SA, fdorg:BL1, fdorg:FL1,
                 fdorg:DED, fdorg:PPL, fdorg:CL, fdorg:BSA, fdorg:ELC]
    names: [EPL, 프리미어리그, 라리가, 분데스리가, 세리에, 챔피언스리그]

  - key: NHL
    tsdb: NHL
    sport: hockey
    langs: [en]
    adapter: NHL
    # 🔴 §8-4 — tsdb 대체를 걷었다(공식 API 가 32팀을 온전히 준다)
    teams_from: ['url:https://api-web.nhle.com/v1/standings/now|nhl']
    names: [NHL, 북미아이스하키]

# ══════════════════════════════════════════════════════════════════
# 🔴 사다리 — 팀 이름 하나로 **리그를 좁히는 순서**
# ══════════════════════════════════════════════════════════════════
#
# 위에서부터 본다. **먼저 맞은 단에서 멈춘다**(§19-b 와 같은 규율).
# ⚠️ 각 단은 **사유를 남긴다** — 어느 단이 정했는지 모르면 틀렸을 때 못 고친다.
ladder:
  - step: 질문에 리그 이름이 있나
    how: names
    why: 사용자가 직접 말했으면 그것이 가장 확실하다 — 추측할 것이 없다

  - step: 이미 쌓아 둔 경기에 그 팀이 있나
    how: games_table
    why: 우리가 이미 모은 것이다 — 리그가 그 행에 적혀 있다

  - step: 어댑터·명부가 아는 팀인가
    how: team_index
    why: 리그마다 팀 명단을 받아 둔다 — 이름이 맞으면 리그가 정해진다

  - step: 팀 이름으로 **직접 물어본다**
    how: ask_team
    why: |
      🔴 TheSportsDB `searchteams.php?t=<팀>` 이 그 팀의 **리그를 직접** 준다.
      ⚠️ 명단 받기(`search_all_teams`)는 **열 팀에서 잘리는데** 이 길은 안 잘린다
      — 실측 2026-10-03: `Kashiwa Reysol → Japanese J1 League`,
      `Jeonbuk Hyundai Motors → South Korean K League 1`,
      `Yomiuri Giants → Nippon Baseball League`.
      🔴 **팀마다 한 번만** 묻고 캐시한다. 그리고 그 응답의 `strTeamAlternate`
      가 현지 표기를 준다(`柏レイソル`) — 검색어가 거기서 나온다.

  - step: 별칭표의 종목으로 좁히나
    how: sport_only
    why: 종목만 알아도 후보가 줄어든다(야구 질문에 축구 리그를 안 본다)

  - step: 그래도 모르면
    how: unknown
    why: 🔴 **리그 미상이라고 적고 그대로 간다.** 하나를 고르면 그것이 추측이다

# 🔴 팀 명단을 받아 두는 자리. ⚠️ 저장소에 커밋하지 않는다(이적·승강으로 바뀐다).
cache:
  dir: var/leagues
  # 며칠 지나면 다시 받나. 🔴 0 이면 늘 받는다(느리다).
  ttl_days: 7
