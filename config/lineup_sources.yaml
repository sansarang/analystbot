# v3 §13-b 확정 라인업 1차 소스 (v4 §8 이 §13 을 유지한다)
#
# 🔴 **정본은 `docs/fable/v4_appendix_from_v3.md` 의 §13-b 표다.** 이 파일은 그
#    표의 구현이고, `tests/stage3/test_lineup_sources.py` 가 정본을 파싱해
#    **여기가 빠뜨린 팀을 찾아낸다.** 정본에 팀이 생기면 계약이 빨개진다.
#    (단계 2 가 §4·§5 에 쓴 방식과 같다 — 사본 금지.)
#
# 🔴 **검색어에 연도를 넣지 않는다**(§12-b). `{月日}` 는 `9月27日` 로 채운다.
#    `llm.query_ok` 가 연도·따옴표·site: 를 막고, 그 규칙이 원본이다.
#
# ⚠️ §13-a 는 *"스포츠나비 경기 페이지(JS)·baseball-data 스타멘 표(하루 지연)·
#    야후 뉴스 본문(robots 거부)은 라인업 소스로 쓰지 않는다"* 고 못 박았다.
#    그래서 그 셋은 여기 **없다** — 없는 것이 맞다.

# 🔴 `media_token` — §19-b-5 "매체명 추가" 축이 검색어에 붙일 **한 낱말**이다.
#    정본 `1차 소스` 칸은 산문이라(`구단 공식 X 인용 팀 블로그, 닛칸`) 첫 토큰을
#    기계로 뽑으면 `구단` 같은 쓸모없는 낱말이 나온다(실측 2026-09-30).
#    ⚠️ 계약이 *이 값이 정본 칸 안에 실제로 있는지* 대조한다 — 지어낸 매체명은
#       기계가 막는다. 🔴 정본이 구체 매체를 대지 않는 행은 **칸을 비운다**
#       (`K리그 전 구단` = "구단 SNS·K리그 공식"). 없으면 그 축을 건너뛴다.

# ══════════════════════════════════════════════════════════════════
# 🔴 라인업 소스로 **쓰지 않는** 곳 (§13-a 가 이름으로 댔다)
# ══════════════════════════════════════════════════════════════════
#
# §13-a 원문: *"확정 라인업은 09-27 실측대로 팀 전담 매체·팬블로그가 1차다 —
#   **스포츠나비 경기 페이지(JS)·baseball-data 스타멘 표(하루 지연)·야후 뉴스
#   본문(robots 거부)은 라인업 소스로 쓰지 않는다.**"*
#
# 🔴 **표에 없는 것만으로는 부족하다.** 이 셋은 검색 결과에 **1순위로 나온다**
#    (실측 2026-09-27: baseball-data 가 소프트뱅크 질의의 1위였다). 우리가 소스로
#    지목하지 않아도 세포가 그 URL 을 열면 같은 자료를 쓰는 것이다.
#    ⚠️ 실측 2026-09-30(단계 4): 세이부 라인업 세포가 `baseball-data.com/lineup/l.html`
#       을 실제로 열었고, 그 표는 **하루 지연**이라 겐다가 선발로 들어 있었다 —
#       §19-g-5 의 사실(겐다 벤치)과 반대다. §13-a 가 막으려던 함정 그대로다.
#
# 🔴 여기 적는 것은 **호스트·매체 토큰**이고, 계약이 *정본 문장 안에 실재하는지*
#    대조한다. 지어낸 금지 목록은 기계가 막는다.
# 🔴 **두 칸으로 갈라 적는다.**
#    `origin` — §13-a 문장 안의 **정본 낱말**(계약이 그 문장과 대조한다)
#    `hosts`  — 그 매체의 **실제 도메인**(세포가 URL 로 가릴 때 쓴다)
#    ⚠️ 정본은 한국어로 `스포츠나비` 라고 쓰는데 그 도메인은 `baseball.yahoo.co.jp`
#       다. 한쪽만 적으면 계약이 통과하고 세포는 못 막거나(또는 반대) 한다 —
#       실측 2026-09-30: `スポーツナビ` 를 적었더니 계약이 "지어낸 목록"이라고
#       빨개졌고(정본에 그 표기가 없다), 동시에 `baseball.yahoo.co.jp` 는 안 막혔다.
banned_for_lineup:
  - origin: baseball-data          # §13-a "baseball-data 스타멘 표(하루 지연)"
    hosts: [baseball-data.com]
  - origin: 스포츠나비              # §13-a "스포츠나비 경기 페이지(JS)"
    hosts: [baseball.yahoo.co.jp, sports.yahoo.co.jp, sportsnavi]
  - origin: 야후 뉴스               # §13-a "야후 뉴스 본문(robots 거부)"
    hosts: [news.yahoo.co.jp]

# 라인업 공개 시각. §13-b 머리글: "경기 1시간 전 공개 → 이후 5분 간격 재시도"
# ⚠️ 간격·마감은 여기 적지 않는다 — `app/cells.WAKE` 가 §19-d 의 원본이다.
opens_before_min: 60

teams:
  소프트뱅크:
    primary: 西スポ OTTO
    media_token: 西スポ
    query: "ソフトバンク スタメン {月日}"
    lang: ja
    note: 스니펫에 타순 전부
  히로시마:
    primary: 安芸の者がゆく
    media_token: 安芸の者がゆく
    query: "広島 スタメン {月日} {球場}"
    lang: ja
    note: 양 팀 타순·선발·순위 한 표
  주니치:
    primary: 中日スポーツ【スタメン速報】
    media_token: 中日スポーツ
    query: "中日 スタメン速報 {月日}"
    lang: ja
  한신:
    primary: デイリースポーツ
    media_token: デイリースポーツ
    query: "阪神 スタメン {月日}"
    lang: ja
  요미우리:
    primary: スポーツ報知
    media_token: スポーツ報知
    query: "巨人 スタメン {月日}"
    lang: ja
  DeNA:
    primary: カナロコ, 구단 공식 game/result
    media_token: カナロコ
    query: "DeNA スタメン {月日}"
    lang: ja
    note: 구단 페이지는 경기 후 확정
  # 🔴 §13-b 가 여섯 팀을 **한 행**으로 묶었다. 표의 행 하나 = 여기 한 항목이다
  #    (쪼개면 정본과 행 수가 안 맞아 대조 계약이 터진다 — 그것이 맞는 동작이다).
  야쿠르트·라쿠텐·롯데·닛폰햄·세이부·오릭스:
    # 🔴 `default_for_league` — 이 행은 **나머지 NPB 팀 전부**를 받는다(정본이
    #    여섯 팀을 묶고 "실측 후 1차 소스 확정"이라 적었다). `league:` 와 다른
    #    이름인 이유: `league:` 는 정본 첫 칸이 리그를 **이름으로 댄** 행이고
    #    계약이 그 문자열을 대조한다. 이쪽은 정본에 리그 이름이 없다.
    #    ⚠️ 실측 2026-09-30: 이 칸이 없을 때 NPB 6팀(ヤクルト·日本ハム·オリックス·
    #       楽天·西武·ロッテ)이 §13-b 행을 **하나도 못 찾았다** — 표 키는 한국어고
    #       수집기 팀명은 일본어라서다.
    default_for_league: NPB
    primary: 구단 공식 X 인용 팀 블로그, 닛칸
    media_token: 닛칸
    query: "{球団} スタメン {月日}"
    lang: ja
    note: 실측 후 1차 소스 확정
  # 🔴 아래 넷은 **리그 단위 행**이다(정본 첫 칸이 리그를 이름으로 댄다).
  #    `league:` 는 그 칸의 기계가 읽을 표기이고, 계약이 *정본 첫 칸에 이 리그
  #    이름이 실제로 들어 있는지* 대조한다 — 손으로 붙인 값이 정본과 갈리는 것을
  #    기계가 먼저 알린다.
  MLB 전 구단:
    league: MLB
    primary: MLB.com 게임데이(3~4시간 전), 비트 기사
    media_token: MLB.com
    query: "{team} lineup {date}"
    lang: en
  KBO 전 구단:
    league: KBO
    primary: 마이데일리·네이트 라인업 기사
    media_token: 마이데일리
    query: "{팀} 선발 라인업 {날짜}"
    lang: ko
    note: KBO 공식은 D33
  K리그 전 구단:
    league: K리그
    primary: 구단 SNS·K리그 공식
    query: "{팀} 선발 명단 {날짜}"
    lang: ko
    note: 1시간 전
  CPBL:
    league: CPBL
    primary: CPBL 공식 先發打序
    media_token: CPBL
    query: "{隊} 先發打序 {月日}"
    lang: zh
