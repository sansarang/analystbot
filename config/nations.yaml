# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **ISO 코드가 없는 축구협회** — 손으로 적는 것은 **이 넷뿐이다**
# ══════════════════════════════════════════════════════════════════
#
# 사용자 지시 2026-10-03:
#
# > 국가대표 이름표 — **손으로 만들지 말고 CLDR**. Python 의 Babel 은 유니코드
# > 컨소시엄의 CLDR 데이터를 내장해 국가명을 원하는 언어로 바로 준다.
# > ISO 코드가 없는 **4개 축구협회**(잉글랜드·스코틀랜드·웨일스·북아일랜드)만
# > 손으로 넣으면 된다.
#
# ⚠️ 나라 이름은 **지어내지 않는다** — `babel.Locale(lang).territories[CC]` 가
#    ko·ja·en·es·zh 를 전부 준다(네트워크·robots·키가 필요 없다).
#    실측 2026-10-03: `Locale('ko').territories['HR']` → `크로아티아`.
#
# 🔴 그런데 **잉글랜드·스코틀랜드·웨일스·북아일랜드는 ISO 국가가 아니다.**
#    축구에서는 각각 독립 협회이고, 그래서 CLDR 국가 표에 없다. 🔴 **그 넷만**
#    여기 적는다 — 적는 양이 넷이라는 것이 이 설계의 요점이다.
#
# ⚠️ CLDR 은 `GB-ENG` 같은 **하위 구역 코드**를 가지고 있지만 `territories` 표에는
#    안 들어 있다(실측). 그래서 `iso:` 가 아니라 `fa:`(football association)
#    접두를 쓴다 — 나라 코드인 척하지 않는다.

nations:
  - key: "fa:ENG"
    names:
      en: [England]
      ko: [잉글랜드]
      ja: [イングランド]
      es: [Inglaterra]
    source: 손으로 적음 — ISO 국가가 아니다(독립 축구협회). 사용자 지시 2026-10-03

  - key: "fa:SCO"
    names:
      en: [Scotland]
      ko: [스코틀랜드]
      ja: [スコットランド]
      es: [Escocia]
    source: 손으로 적음 — ISO 국가가 아니다(독립 축구협회)

  - key: "fa:WAL"
    names:
      en: [Wales]
      ko: [웨일스, 웨일즈]
      ja: [ウェールズ]
      es: [Gales]
    source: 손으로 적음 — ISO 국가가 아니다(독립 축구협회)

  - key: "fa:NIR"
    names:
      en: [Northern Ireland]
      ko: [북아일랜드]
      ja: [北アイルランド]
      es: [Irlanda del Norte]
    source: 손으로 적음 — ISO 국가가 아니다(독립 축구협회)

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **CLDR 이 행정 단위 이름을 주는 자리**(실측 2026-10-04)
# ══════════════════════════════════════════════════════════════════
#
# 첫 수확(③ 자가 성장)에서 `중국 vs 팔레스타인` 이 막혔다 — 조건 ②(*"경기
# 페이지가 양 팀을 함께 확인한 경우만"*)가 **정확히 제 일을 했다**:
#
#     China      → team:000049   (안다)
#     Palestine  → 🔴 **미상**
#
# ⚠️ 까닭은 CLDR 이 **축구 대표팀 이름이 아니라 행정 단위 이름**을 주기 때문이다:
#
#     PS  en='Palestinian Territories'  ko='팔레스타인 지구'   ← 대표팀은 `Palestine`
#     HK  en='Hong Kong SAR China'      ko='홍콩(중국 특별행정구)'
#     MO  en='Macao SAR China'          ko='마카오(중국 특별행정구)'
#
# 🔴 그 차이를 **여기 적는다** — 손으로 적는 양이 넷에서 일곱으로 늘지만, 그것이
#    *"CLDR 로 끝난다"* 의 **한계를 숨기지 않는 길**이다.
# ⚠️ 적는 것은 **축구 대표팀이 쓰는 이름**뿐이다. 행정 단위 이름은 CLDR 것을 그대로 둔다
#    (지우지 않는다 — 둘 다 그 나라를 가리킨다).
fifa_names:
  - code: PS
    names: {en: [Palestine], ko: [팔레스타인], ja: [パレスチナ]}
    source: 실측 2026-10-04 — fotmob 경기 페이지가 `Palestine` 이라 적는다
  - code: HK
    names: {en: [Hong Kong], ko: [홍콩], ja: [香港]}
    source: 손으로 적음 — CLDR 은 `Hong Kong SAR China` 다
  - code: MO
    names: {en: [Macau], ko: [마카오], ja: [マカオ]}
    source: 손으로 적음 — CLDR 은 `Macao SAR China` 다

# 🔴 **대표팀 이름표를 만들 언어.** ⚠️ 여기 적은 언어만 CLDR 에서 꺼낸다 —
#    전부 꺼내면 이름표가 수만 줄이 되고, 쓰지 않는 언어가 오탐을 늘린다.
#    (`config/leagues.yaml` 의 리그 언어와 같은 집합 + 사용자 질문 언어 `ko`)
cldr_langs: [ko, en, ja, es, zh]

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **나라 → 기사 언어** (사용자 지시 2026-10-04)
# ══════════════════════════════════════════════════════════════════
#
# > C(나라→현지 언어)는 *"일대다라 손으로"* 가 아니다. 이미 넣은 **Babel 이 그걸
# > 한다**: `Locale.parse('und_HR')` → `hr`, `'und_MK'` → `mk`. 나라 코드만 있으면
# > 가장 그럴듯한 언어를 CLDR 이 돌려준다. 다국어 나라(스위스·벨기에)만 예외 몇 줄.
#
# ✅ 실측 2026-10-04 — 사용자가 맞다. 손으로 적을 것이 거의 없다:
#
#     MK → mk   HR → hr   KR → ko   JP → ja   CO → es   RS → sr   IS → is
#     GB → en   JM → en   SV → es   MX → es   FO → fo
#
# 🔴 **그런데 구멍이 둘 있다 — 실측이 찾았다.** 아래 `press_langs` 가 그 둘뿐이다.
#
# ① **ISO 코드가 없는 넷** — Babel 이 `und_SCO` 를 모른다:
#       Locale.parse('und_SCO') → 🔴 ValueError
#       ⚠️ 그리고 `und_SC` 는 **세이셸(프랑스어)** 이다 — 두 글자로 줄이면 안 된다.
#          스코틀랜드 질의에 프랑스어가 붙는 것이 그 길이다.
#
# ② 🔴 **CLDR 의 "가장 그럴듯한 언어"가 기사 언어와 다른 나라:**
#       Locale.parse('und_PY') → `gn`(**과라니어**)
#       ⚠️ CLDR 이 틀린 게 아니다 — 파라과이는 과라니어가 공용어다. 그런데
#          **축구 기사는 스페인어로 쓴다.** 우리가 쓰는 것은 *기사* 언어다.
#
# ⚠️ 다국어 나라는 **적지 않는다**. Babel 이 하나를 고른다(`CH`→`de`·`BE`→`nl`) —
#    그것이 *"가장 그럴듯한"* 것이고, 둘 다 던지려면 측정이 먼저다. 🔴 측정 없이
#    늘리면 질의가 곱으로 늘고 예산이 또 터진다(2026-10-04 에 그래서 터졌다).
press_langs:
  # ① ISO 코드가 없다 — Babel 이 답할 수 없는 넷
  "fa:ENG": [en]
  "fa:SCO": [en]
  "fa:WAL": [en]          # ⚠️ 웨일스어(cy)도 있지만 축구 기사는 영어다
  "fa:NIR": [en]
  # ② CLDR 의 likely-subtag 이 기사 언어와 다르다
  "iso:PY": [es]          # 🔴 Babel 은 `gn`(과라니어)을 준다 — 실측 2026-10-04

# ══════════════════════════════════════════════════════════════════
# ⚠️ **남은 구멍 — ISO 코드가 없는 넷은 다른 언어 이름이 없다**(2026-10-04)
# ══════════════════════════════════════════════════════════════════
#
# 🔴 실측이 보여 준 값: 상대 이름을 **그 나라 언어로** 쓰면 현지 매체가 손에 들어온다.
#
#     `Северна Македонија состав Шкотска фудбал`
#        → sportstation.mk · sportmanija.mk · gol.mk · tvarenasport.mk · mk.tv21.tv
#     `Северна Македонија состав Scotland фудбал`
#        → 🔴 **mk.wikipedia.org 18건** (현지 스포츠 매체 1건)
#
# ⚠️ 그런데 `fa:SCO` 는 **Babel 로 못 푼다** — 실측 2026-10-04:
#       babel 2.18 에 `Locale.subdivisions` 가 **없다**(`hasattr` → False)
#       `Locale('mk').territories['GB-SCT']` → **None**
#
# 🔴 그래서 잉글랜드·스코틀랜드·웨일스·북아일랜드는 위 `nations:` 에 적힌 네 언어
#    (en·ko·ja·es)로만 불린다. 다른 언어 질의에서는 **영문명으로 떨어진다.**
#    ⚠️ 그래도 **상대 이름이 아예 없던 것보다는 낫다**(실측: 상대 추가 +25%).
#    ⚠️ 294개 나라 × 수십 언어를 손으로 적지 않는다 — 그 길로 가면 이 파일이
#       사본 수만 줄이 된다. 🔴 필요한 언어가 생기면 **그 네 줄만** 는다.
