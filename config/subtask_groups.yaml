# 하위 과제 분할 표 — **딥서치 재구축 §2**(작업 지시서 2026-10-05)
#
# ══════════════════════════════════════════════════════════════════
# 🔴 왜 이 파일이 생겼나
# ══════════════════════════════════════════════════════════════════
#
# > 경기 하나 = **하위 과제 8개**(유형군 4 × 홈/원정). `subtasks.py` 가 이 표를
# > **데이터로** 갖고, 경기 입력에서 하위 과제 목록을 만든다.
#
# ⚠️ 유형 이름·씨앗 질의를 **코드에 적지 않는다**(#1 사본 금지) — 표가 원본이고
#    코드는 그것을 읽는다. 지시서 §2 의 표가 이 이름들을 **그대로 줬다**.
# 🔴 `recent_pattern`·`h2h_pattern` 은 **여기 없다** — 구조 사실(어댑터)에서
#    오므로 하위 과제에 넣지 않는다(지시서 §2 원문).

groups:
  - key: A
    label: 결장·선발
    # 🔴 `fatigue` 를 더했다(사용자 지시 2026-10-06 ③) — 축구 피로가 야구 유형
    #    (`pitcher_state`)으로 붙던 자리다. ⚠️ 유형만 만들고 **묻는 자리에 안 넣으면**
    #    enum 에 못 들어가 영영 0건이다(#2 배선).
    kinds: [absence_def, absence_att, pitcher_state, fatigue]
    # 🔴 씨앗은 **3~6낱말**이다(§4) — 긴 질의가 결과를 죽였다(실측 10단어+ → 0건).
    seed: "{team} {opp} injury news"
    #: ⚠️ 야구는 선발 투수가 그 유형군의 핵이다(지시서 표가 괄호로 적었다)
    seed_by_sport:
      baseball: "{team} starting pitcher news"
    #: 🔴 §5 2단이 쓰는 **유형 핵심어 문장** — BM25 가 놓치는 동의어를 잡는다
    rerank_query: "players absent injured suspended will not feature out ruled out"

  - key: B
    label: 로테이션·감독
    kinds: [lineup_rotation, coach_intent, coach_conflict, coach_change]
    seed: "{team} lineup rotation"
    #: 🔴 감독명을 확보하면 2차에서 이 꼴로 좁힌다(지시서 표의 화살표)
    seed_with_coach: "{coach} press conference"
    rerank_query: "manager coach said press conference rotation rest lineup changes"

  - key: C
    label: 동기·순위·흐름
    kinds: [stakes, individual_title, regression, team_stats]
    seed: "{team} {comp} standings stakes"
    rerank_query: "qualification standings points race must win title motivation"

  - key: D
    label: 일정·경기외
    kinds: [travel_schedule, venue_weather, event_match, match_type,
            national_duty_return]
    seed: "{team} schedule travel {comp}"
    rerank_query: "travel schedule congestion weather forecast farewell retirement return"

  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **F — 새 사실(72시간)** · 사용자 지시 2026-10-10(재작성) §3-1
  # ══════════════════════════════════════════════════════════════════
  #
  # > 하위 과제 F(경기 하나에 대해서만): 팀마다, 킥오프 기준 **72시간 안**,
  # > **현지어+영어**.
  # > 추출 유형: returning, squad_boost, absence/suspension, coach_quote(감독
  # > 의도), venue_record, schedule_load, stakes.
  #
  # 🔴 **유형을 새로 만들지 않았다** — 지시서 §3-5 가 *"일반 변수와 **같은
  #    무게표**로"* 라고 적었으므로, 개념을 `variable_types.yaml` 에 **이미 있는**
  #    유형에 얹는다. ⚠️ 새 유형을 만들면 방향·무게를 **지어내야** 한다(금지).
  #
  # | 지시서가 적은 것 | 이 표가 쓰는 카탈로그 유형 | 왜 |
  # |---|---|---|
  # | returning · squad_boost | `returning` · `national_duty_return` · `lineup_value` | 복귀·명단 보강이 그 유형이다 |
  # | absence/suspension | `absence` · `suspension` | 그 이름 그대로 있다 |
  # | coach_quote | `coach_intent` | 감독 의도가 그 유형이다 |
  # | venue_record | `team_stats` | 구장·원정 기록은 **팀 수치**다(경기 목록으로 검증된다) |
  # | schedule_load | `travel_schedule` · `fatigue` | 일정 과부하가 그 둘이다 |
  # | stakes | `stakes` | 그 이름 그대로 있다 |
  #
  # ⚠️ A~D 와 **겹치는 유형이 있다** — 그것이 의도다: F 는 **창이 72시간**이고
  #    낱말이 *"복귀·합류·전역"* 처럼 **새로 나온 사실** 쪽이다. 같은 사실이 둘로
  #    오면 `s5_verify` 의 병합이 하나로 묶고 **출처 수만** 올린다(§3-3).
  - key: F
    label: 새 사실(72시간)
    kinds: [returning, national_duty_return, lineup_value, absence,
            suspension, coach_intent, team_stats, travel_schedule, fatigue,
            stakes]
    #: 🔴 씨앗은 3~6낱말이다(§4) — 긴 질의가 0건을 냈다(실측)
    seed: "{team} team news return injured"
    rerank_query: "returned from injury joined squad suspended ruled out press conference days rest away record"
    #: 🔴🔴 **창이 72시간**이다(§3-1) — s3 가 이 칸을 읽어 그 하위만 좁힌다.
    #   ⚠️ 다른 하위는 7일이다(`s5_verify.DATE_WINDOW_DAYS`) — 섞지 않는다.
    window_hours: 72
    #: 🔴 §3-1 — *"현지어+영어"*. 개념 낱말은 `search_words.yaml` 이 든다
    words: [returning, suspension, absence72, schedule_load, venue_record]

