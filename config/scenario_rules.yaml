# v4 §5 시나리오 생성 규칙표 — §5-b 템플릿 9 + §5-c 교차 규칙 6
#
# 🔴 **정본은 v4 §5 표다.** `tests/stage2/test_rules.py` 가 §5-b 표를 파싱해
#    **여기가 빠뜨린 템플릿을 찾아낸다.**
#
# ⚠️ **`direction` 을 템플릿에 적지 않는다.** v4 §4 가 *"총점 방향은 스코어
#    기반이라 STEP 5 에서 시나리오 스코어로부터 계산한다"* 고 했다. 방향은
#    `app/rules.direction_of(scores)` 가 **스코어에서 계산**한다 — 표에 또 적으면
#    두 값이 갈리고, 갈리면 어느 쪽이 맞는지 아무도 모른다.
#
# 🔴 **스코어는 `홈-원정` 순이다.** §5-b 가 그렇게 적었다 — `soccer_home_normal`
#    (홈 승)이 `2-1, 1-0` 이고 `soccer_away_normal`(원정 승)이 `0-1, 1-2` 다.

#: §5-a 기본 생성 — direction 별로 묶는다
base:
  # 🔴 축구는 C(무승부)가 비어도 최소 strength 로 생성한다 —
  #    *"무승부는 항상 살아 있는 결과"*(§5-a)
  soccer_draw_floor: 0.4

#: §5-b 스코어 집합 배정
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **종목마다 방향 템플릿** (사용자 지시 2026-10-02 *"변수 0건은 말이 안된다"*)
# ══════════════════════════════════════════════════════════════════
#
# 실측 2026-10-02(소프트뱅크–치바롯데): **야구 경기에 축구 스코어 2-1·1-0 이 나갔다.**
# `_base` 가 `soccer_home_normal` 을 **이름으로 박아** 쓰고 있었다.
#
# 🔴 §5-b 의 야구 템플릿은 전부 **조건부**다(`pitcher_state`·`venue_weather`).
#    ⚠️ 이 주석은 한때 *"둘 다 미구현"* 이라 적었고 **그것이 낡았다** — 두 유형은
#       구현돼 있다(`variable_types.yaml` `implemented: true`).
#    🔴 **사용자 결정 ⑦**(2026-10-04)으로 조건을 읽는 코드를 지었다:
#       `scenarios.bullpen_day` · `scenarios.repeat_yesterday` ·
#       `scenarios.baseball_templates`. 못 읽으면 **안 세우고 사유를 남긴다**.
#
# 🔴 `mirror` 는 **v4 자신의 방법이다.** §5-b 의 축구 쌍이 서로 거울상이다:
#       soccer_home_normal  2-1 · 1-0
#       soccer_away_normal  1-2 · 0-1      ← 같은 스코어를 뒤집은 것
#    그래서 원정 템플릿이 따로 없는 종목은 홈 템플릿을 **뒤집어** 쓴다. 지어낸 것이
#    아니라 v4 표에서 읽은 규칙이다.
direction_templates:
  soccer:
    home: soccer_home_normal
    away: soccer_away_normal
    draw: soccer_lock
    # 🔴 난타전(§5-c-1 D) 템플릿도 **종목별이다**
    open: soccer_open
  baseball:
    home: baseball_ace_low
    away: mirror      # 🔴 홈 템플릿을 뒤집는다(위 근거)
    draw: null        # ⚠️ 야구 무승부 템플릿이 §5-b 에 없다 — 만들지 않는다
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **야구에 축구 난타전 스코어가 들어가고 있었다**(실측 2026-10-02)
    # ══════════════════════════════════════════════════════════════
    #
    #  라이브 카드의 시나리오 D 가 `['2-2','2-3','3-2'] [soccer_open]` 이었다.
    #  야구 총점 기준선은 **7.5** 다 — 2-2(4점)는 난타전이 아니라 저득점이다.
    #  ⚠️ 전 판에 `_base` 의 같은 병을 고쳤는데(축구 2-1/1-0 이 야구에 들어갔다)
    #     **5c-1 이 같은 이름을 또 박아 쓰고 있었다.** 한 자리를 고치고 다른
    #     자리를 못 본 것이다.
    #  🔴 `null` 이면 **격자에서 뽑는다**(`_derived_set`) — 야구는 포아송 격자가
    #     서므로 그 분포의 고득점 꼬리가 난타전이다. 지어낸 스코어가 아니다.
    open: null
    # 🔴 결정 ⑦ 로 조건 읽기를 지었다 — 더 이상 "읽을 수 없다"가 아니다.
    #    ⚠️ 그래도 `baseball_ace_low` 는 `_base` 가 **쌍으로** 세운다(A·B).
    #       나머지 셋은 `scenarios.baseball_templates` 가 조건을 읽어 채운다.
    unread_condition: null

templates:
  soccer_home_normal:
    sport: soccer
    condition: 홈 승 + strength_gap 없음
    scores: ["2-1", "1-0"]

  soccer_home_dominant:
    sport: soccer
    condition: 홈 승 + strength_gap ≥ 2단계
    scores: ["2-0", "3-0"]

  soccer_away_normal:
    sport: soccer
    condition: 원정 승
    scores: ["0-1", "1-2"]

  soccer_lock:
    sport: soccer
    condition: draw + recent_pattern(무득점/무승부 연속) 또는 match_type(단판)
    scores: ["0-0", "1-1"]

  soccer_open:
    sport: soccer
    condition: 양 팀 absence(수비) 또는 recent_pattern(대량 실점) 동시
    scores: ["2-2", "2-3", "3-2"]

  baseball_ace_low:
    sport: baseball
    condition: pitcher_state 우위 팀 승
    scores: ["3-0", "3-1", "2-1"]

  baseball_bullpen_day:
    sport: baseball
    condition: 한쪽 pitcher_state가 불펜 데이/첫 선발/이틀 휴식
    # ⚠️ §5-b 원문은 "상대 5-2, 6-2" 다 — **불펜 데이를 쓰는 팀의 상대가 이긴다.**
    #    스코어는 홈-원정 순이므로 "그 상대"가 어느 쪽인지는 STEP 5 가 정한다.
    #    여기 적는 것은 **점수 모양**뿐이다.
    scores: ["5-2", "6-2"]
    opponent_wins: true

  baseball_slugfest:
    sport: baseball
    condition: 양 pitcher_state 약 + venue_weather 타자 구장
    scores: ["7-6", "8-6"]

  baseball_repeat_yesterday:
    sport: baseball
    condition: 전날 같은 팀이 같은 패턴으로 짐(예 세이부 타선 침묵)
    # 🔴 스코어가 **고정이 아니다** — 전날 스코어를 재사용한다(§5-b).
    #    빈 목록이 아니라 `reuse_yesterday` 로 남긴다: 조용한 0 금지.
    scores: []
    reuse_yesterday: true

#: §5-c 교차 규칙 — 🔴 **09-28~29 실패에서 나온 것. 반드시 적용한다.**
#
# 🔴 **id 에 `R` 을 쓰지 않는다.** v4 는 `R1~R12` 를 이미 **§7 규칙 12개**에 쓰고
#    있고, §9 단계 6 완료 조건이 *"교차 규칙 **R3·R6** 포함"* 이라 그 번호로
#    지목한다. 종전 판이 여기에 `R1~R6` 을 붙여 **정본의 이름 공간을 덮었다** —
#    단계 6 이 `R3` 을 찾으면 `저득점 생성`(엉뚱한 규칙)을 집었다.
#    → v4 §5-c 자체의 번호(1~6)를 쓰고 `5c-` 를 붙인다. `R` 은 §7 것이다.
# 🔴 **§7 에 짝이 있는 규칙은 `sec7_rule` 로 병기한다** — 단계 6 이 `R3`·`R6` 을
#    찾을 때 맞는 줄에 닿게. 그 대조는 계약이 한다.
cross_rules:
  - id: 5c-1
    sec7_rule: R3   # v4 §7 의 같은 규칙
    name: 난타전 생성
    when: 서로 다른 팀의 변수가 각각 수비 약화(absence 수비/대량 실점 pattern)와 공격 강화(lineup_intent 공격/스리톱)를 가리킨다
    then: 시나리오 D(soccer_open) 자동 생성
    miss: 09-28 아르메니아–몬테네그로 2-3 이 이 규칙 부재로 빠졌다
    # ══════════════════════════════════════════════════════════════
    # 🔴 **사용자 지시 2026-10-02**: *"4,5 수정해라 … 모르면 딥서치해서 수정해라"*
    # ══════════════════════════════════════════════════════════════
    #
    # 왜 고치나 — v4 원문은 `lineup_intent`(감독 인용)을 **요구**한다. 인용이 없으면
    # 발동하지 않는다. 손으로 네 경기를 돌려 보니 **세 경기 연속 미발동**이었고,
    # 자료는 전부 난타전을 가리켰다(실측 2026-10-02):
    #
    #   키프로스–아르메니아   맞대결 2경기 **9골**(평균 4.5) · 양팀득점 2/2   미발동
    #   시애틀–캔자스시티     KC 최근 5경기 **평균 4.6골**                    미발동
    #   우즈벡–시리아        시리아가 벨라루스에 1-4                        미발동
    #
    # ⚠️ §10 정답지의 **유일한 ✘ 사례**가 아르메니아–몬테네그로 2-3 이고 사유가
    #    *"난타전 D 미생성"* 이다 — 그 규칙을 만들고도 세 번 더 놓쳤다.
    #
    # 🔴 **문턱을 절대 숫자로 두지 않는다 — 딥서치가 그것을 무너뜨렸다.**
    #    처음 제안은 *"평균 총득점 ≥ 3.0"* 이었다. 실측 리그 평균:
    #
    #      MLS               경기당 **3.22**골 (동부 3.32 · 서부 3.13)
    #      USL Championship  경기당 **2.73**골
    #      UEFA NL C 2그룹   경기당 **2.50**골
    #
    #    → 3.0 은 MLS 에서 **평균 이하** 경기에도 발동한다. 리그가 0.7골 차이로
    #      갈리므로 절대 숫자는 어느 리그에서든 틀린다.
    #
    # 🔴 그래서 **리그 평균 + 여유**로 둔다. 리그 평균은 순위표에서 계산한다:
    #      Σ 팀 득점 ÷ (Σ 팀 경기수 ÷ 2)
    #    ⚠️ **리그 평균을 못 구하면 이 OR 는 발동하지 않는다**(친선·A매치처럼
    #       순위표가 없는 경기). 절대 숫자로 때우지 않는다 — 그것이 위 실수였다.
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **사용자 지시 2026-10-02 (2차)**: *"난타전(5c-1)이 안 섰고 심층서치
    #      찾아서 해결해라"* — 정답지 경기(새크라멘토 3-2 라스베이거스, 5골)에서
    #      이 규칙이 **또** 미발동했다.
    # ══════════════════════════════════════════════════════════════
    #
    # 🔴 **원인은 문턱이 아니라 입력이었다.** 아래 둘(맞대결 평균·최근 평균)은
    #    딥서치가 지목한 **가장 약한 예측자**다:
    #
    #      ① 맞대결 평균은 **8경기 미만이면 신뢰할 수 없고**, 한 경기(5-0)가
    #         평균을 통째로 왜곡한다 — 평균보다 **중앙값**을 보라고 한다.
    #      ② 두 신호 다 **홈/원정을 섞는다.** 그런데 득점 성향은 장소로 갈린다
    #         (실측 USL: 홈 1.526 · 원정 1.206 — 한 경기에 0.32골 차).
    #
    #    실측(정답지 경기): 맞대결 창 2.5 · 최근 5경기 2.2 → 문턱 3.732 미달.
    #    🔴 **그런데 그 경기는 5골이 났다.** 두 신호가 틀린 것이다.
    #
    # 🔴 **딥서치가 내놓은 표준 모형 = 포아송 공격비·수비비** (출처는 아래 `model`).
    #    같은 경기를 **홈/원정 쪼갠 표**로 다시 계산하니 신호가 거꾸로 섰다:
    #
    #      SAC 홈 12경기 20득 9실 · LV 원정 12경기 18득 21실   ← 사용자 폼 줄과 일치
    #      λ 홈 1.911 · λ 원정 0.933  →  **기대 총득점 2.844**  (리그 2.732)
    #      P(총 ≥ 4) **0.318** vs 리그 기준 0.293  →  비율 **1.085** → 발동 ✅
    #
    #    ⚠️ **평균 + 1.0 로는 이것도 못 잡는다**(2.844 < 3.732). 여유를 키우는 길이
    #       아니라 **확률로 묻는 길**이 맞았다 — "이 경기가 평균 경기보다 난타전이
    #       될 확률이 높은가".
    #
    # 🔴 발동률을 **전 조합으로 재서** 고른다(리그 25팀 → 600 조합):
    #
    #      비율 ≥ 1.0  →  273/600 (45.5%)   ← 정답지 경기가 여기 든다(1.085)
    #      비율 ≥ 1.1  →  237/600 (39.5%)   ← 정답지 경기가 **빠진다**
    #      비율 ≥ 1.2  →  211/600 (35.2%)
    #      비율 ≥ 1.5  →  130/600 (21.7%)
    #
    #    → `1.0`. **"평균 경기보다 난타전이 되기 쉬우면 그 시나리오를 띄운다."**
    #      ⚠️ 절대 확률(0.30 등)을 쓰지 않는다 — 리그 기준이 리그마다 다르다
    #         (리그 평균 2.5 면 기준 0.242 · 3.2 면 0.397).
    or_when:
      # 🔴 ①이 **1순위다** — 딥서치가 지목한 표준 모형이고, 나머지 둘은 그것이
      #    못 설 때(홈/원정 표가 없을 때)의 대타다.
      - 포아송 기대 총득점의 P(총 ≥ open_goals) ≥ 리그 기준 P × prob_ratio
      - h2h_pattern 최근 N경기 평균 총득점 ≥ 리그 평균 + league_avg_margin (표본 h2h_min_games 이상)
      - 한쪽 recent_pattern 최근 5경기 평균 총득점 ≥ 리그 평균 + league_avg_margin
    # ── ① 포아송 모형
    model:
      name: 포아송 — 공격비 × 수비비 × 장소 기준값
      formula: |
        리그 홈 평균 H = Σ(홈 표 득점) ÷ Σ(홈 표 경기)
        리그 원정 평균 A = Σ(원정 표 득점) ÷ Σ(원정 표 경기)
        λ_home = (홈팀 홈 득점/경기 ÷ H) × (원정팀 원정 실점/경기 ÷ H) × H
        λ_away = (원정팀 원정 득점/경기 ÷ A) × (홈팀 홈 실점/경기 ÷ A) × A
        P(총 ≥ n) = 1 − Σ_{k<n} e^(−λ) λ^k / k!      (λ = λ_home + λ_away)
      # 🔴 **장소를 섞지 않는다** — 딥서치가 못 박은 조건이다("same venue context").
      venue_split: 필수
      source: https://help.smarkets.com/hc/en-gb/articles/115001457989-How-to-calculate-Poisson-distribution-for-football-betting
      source_2: https://www.thepunterspage.com/poisson-distribution-betting/
      # 🔴 `soccer_open` 스코어 합이 4·5·5 다 — 그 시나리오가 사는 구간이 **4골 이상**
      open_goals: 4
      # 🔴 **리그 기준 대비 비율.** 절대 확률이 아니다(위 측정)
      prob_ratio: 1.0
      # ══════════════════════════════════════════════════════════
      # 🔴🔴 **사용자 지시 2026-10-02 (3차)**: *"① 비율 문턱 1.0 = 발동 45% 를
      #      받아들이나 … 이것도 딥서치해서 바꿔라"*
      # ══════════════════════════════════════════════════════════
      #
      # 🔴 딥서치가 **비교 대상이 틀렸다**고 말한다. `prob_ratio` 는 이 경기를
      #    *리그 평균 경기*와 견준다. 그런데 물어야 할 것은 그것이 아니다 —
      #    **"이 시나리오가 이미 내고 있는 시나리오만큼 그럴듯한가"** 다.
      #    리그 평균은 이 경기의 시나리오 집합과 아무 관계가 없다.
      #
      #    실측(정답지 경기, 경기 전 값): A 0.210 · C 0.162 · B 0.103 · D 0.318(≥4 밴드)
      #    → D 는 **이미 내고 있는 B 보다 세 배 그럴듯한데** 비율 문턱은 1.085 로
      #      간신히 통과했다. 1.1 로 올리면 **B 보다 그럴듯한 밴드를 버린다.**
      #      🔴 그 문턱은 애초에 물어볼 질문이 아니었다.
      #
      # 🔴 그리고 딥서치는 **포아송이 극단값을 낮게 본다**고 한다(과대분산). 즉 실제
      #    난타전 확률은 계산값보다 **높을 수** 있다 — 조일 이유가 아니라 열 이유다.
      #
      # 실측 발동률(USL 600 조합):
      #   비율 ≥ 1.0 (전 판)                      274  45.7%
      #   P(≥4) ≥ 이미 둔 시나리오 최소 확률         467  77.8%   ← 이것으로 바꾼다
      #
      # ⚠️ 발동률이 77.8% 로 뛰는데 **그 대가가 없다.** 아래 `scenario_weight` 로
      #    무게가 **확률**이 되었기 때문이다 — 전처럼 빌려온 0.4 를 붙이지 않으므로
      #    시나리오를 더 담아도 보드 대입이 왜곡되지 않는다. ①과 ②는 **한 답이다.**
      compare_to: 이미 둔 시나리오의 최소 확률
      compare_to_measured_2026_10_02: 정답지 P(≥4) 0.318 ≥ 최소 0.103(B) → 발동
      # 🔴 전 판의 비율 문턱은 **남겨 둔다** — 홈/원정 표가 없어 격자를 못 만들 때
      #    `compare_to` 를 셀 수 없고, 그때는 비율로 묻는다(그것이 ③보다 낫다).
      no_venue_tables: 발동하지 않는다 — ②③ 으로 내려간다
      # 🔴 **표본 최소** (사용자 지시 2026-10-02 *"제시한 오류를 먼저 처리해라"*)
      #
      #  실측 2026-10-02(NHL 개막 직후, `standings/now`):
      #    리그 전체 홈 경기 **12경기** · 디트로이트 홈 **0경기** · 레인저스 원정 **1경기**
      #  → 그 표로 공격비·수비비를 계산하면 **한 경기가 전부**다. 0 이면 `None` 이
      #    되어 저절로 막히지만, 2~3경기면 **막히지 않고 쓰레기 λ 가 나온다.**
      #
      #  🔴 값은 `h2h_min_games` 와 **같은 8** 을 쓴다 — 딥서치가 맞대결에 대해 말한
      #     까닭(*"한 경기가 평균을 통째로 왜곡한다"*)이 장소별 표에도 그대로 맞는다.
      #     ⚠️ 그래서 **시즌 초에는 이 모형이 서지 않는다.** 그것이 맞다 — 서는 척하면
      #        개막 2주 동안 전 경기에 거짓 확률을 붙인다.
      min_venue_games: 8
      measured_nhl_2026_10_02: 개막 직후라 홈 0경기·원정 1경기 → 모형이 선다고 하지 않는다
      measured_2026_10_02: 새크라멘토 vs 라스베이거스 기대 2.844 · P(≥4) 0.318 · 비율 1.085 → 발동 (실제 3-2)
      # 🔴 **리그 하나로 끝내지 않았다**(사용자: *"이 리그만 하는 게 아니야"*).
      #    MLS 표를 따로 가져와 같은 모형을 돌렸다 — 비율 문턱이 리그를 타지 않는다:
      #
      #      리그   리그평균  홈/원정      리그 기준 P(≥4)   비율≥1.0 발동률
      #      USL    2.732    1.526/1.206  0.293            45.5% (600 조합)
      #      MLS    3.223    1.831/1.392  0.403            43.7% (3480 조합)
      #
      #    🔴 **기준 P 가 0.293 ↔ 0.403 으로 갈리는데 발동률은 거의 같다.** 절대
      #       확률을 문턱으로 쓰면 MLS 에서만 쏟아진다 — 비율이 그것을 막는다.
      #    ✅ 1차 미발동 사례 중 **시애틀–캔자스시티**도 선다: 기대 3.561 · 비율 1.184.
      #       ⚠️ 그 경기는 지금 표가 **경기 후**다 — 모형이 돈다는 것만 확인했다.
      measured_mls_2026_10_02: 시애틀(홈) vs 캔자스시티(원정) 기대 3.561 · 비율 1.184 → 발동
    # ── ②③ 대타(평균 기반). 🔴 딥서치가 **약한 예측자**라고 한 것들이다
    league_avg_margin: 1.0
    # 🔴 딥서치: 맞대결 평균은 **8경기 미만이면 쓰지 말라**(한 경기가 평균을 왜곡).
    #    실측 정답지: 맞대결에 5-0 이 끼어 있다 — 바로 그 왜곡의 예다.
    h2h_min_games: 8
    # 🔴 여유 1.0 의 근거: `soccer_open` 의 스코어 합은 4·5·5(평균 4.67)다. 난타전
    #    시나리오를 만들 값어치가 있으려면 그 수준에 다가가야 한다.
    #      MLS  3.22 + 1.0 = 4.22  → KC 최근 5경기 4.6 **발동** · 시애틀 맞대결 3.4 미발동
    #      NL   2.50 + 1.0 = 3.50  → 키프로스 맞대결 4.5 **발동**
    #    ⚠️ 여유 값은 사용자가 바꿀 수 있다 — 한 곳이다.
    league_avg_source: 순위표(Σ 득점 ÷ (Σ 경기 ÷ 2))
    # 🔴 **대회 전체로 센다 — 콘퍼런스·조로 쪼개지 않는다.** 총득점 성향은 리그
    #    규칙·심판 운영이 정하고 콘퍼런스가 정하지 않는다. 실측 차이도 작다:
    #      MLS 전체 3.22 · 동부 3.32 · 서부 3.13 (쪼개면 ±0.1)
    #    ⚠️ 쪼개면 같은 리그 두 경기가 다른 문턱을 받는다.
    league_avg_scope: 대회 전체
    no_league_avg: 발동하지 않는다

  - id: 5c-2
    name: 대량 득점 생성
    when: strength_gap ≥ 2단계이고 강팀이 주력 기용(lineup_intent 총력 또는 travel_schedule 중9일)
    then: 시나리오 D(0-3, 1-4) 생성
    miss: 09-29 르방컵 J1 로테이션 오류가 이 규칙 부재였다

  - id: 5c-3
    name: 저득점 생성
    when: 한쪽이 recent_pattern 무득점 2경기 이상이거나 match_type이 단판/결승 걸림
    then: 시나리오 E(0-0, 1-0) 생성
    # 🔴 스코어를 **여기** 둔다 — 코드에 박으면 사본이 된다(v4 §5-c-3 원문의 값).
    scores: ["0-0", "1-0"]
    floor_strength: 0.3
    miss: 09-29 레온–아메리카 오버 3.5 철회가 이 규칙 부재였다

  - id: 5c-4
    name: 전날 재현
    when: 같은 팀이 어제 진 패턴(선발 호투·타선 침묵)이 pitcher_state·recent_pattern에 있다
    then: baseball_repeat_yesterday 반드시 생성
    miss: 09-28 세이부가 실제로 그렇게 졌다

  - id: 5c-5
    sec7_rule: R6   # v4 §7 의 같은 규칙
    name: 2골 차 패 시나리오
    when: 핸디 +1.5가 후보 마켓이다
    then: 상대가 2골 차로 이기는 시나리오(0-2)를 반드시 하나 만든다
    # 🔴 스코어를 **여기** 둔다(v4 §5-c-5 원문의 값). `홈-원정` 순이다.
    #
    # ══════════════════════════════════════════════════════════════
    # 🔴🔴 **사용자 지시 2026-10-02 ⑪ 이 이 규칙의 결함을 드러냈다.**
    # ══════════════════════════════════════════════════════════════
    #
    #  §6 생존을 실제로 돌려 보니 **한 방향만 만들고 있었다.** 보드가 없는 경기는
    #  §6-c-3 대로 핸디 **±1.5 가 양 팀 다** 후보다 — 그러면 2골 차 승 시나리오도
    #  **양쪽** 이 필요하다. 하나만 만들면 다른 쪽 핸디가 **깨질 시나리오가 없어서**
    #  생존 1.0 을 받는다.
    #
    #  실측 2026-10-02 (정답지 경기, 보드 없음):
    #    `2-0` 만 있었다 → `Sacramento +1.5` survival **1.0 (name)**
    #    그런데 격자 전체 확률은 0.9322 다 — 1.0 이 될 수 없는 자리다.
    #    🔴 즉 v4 §7 R6 이 막으려던 바로 그 실수(돗토리·후쿠시마)를 **이 규칙 자신이**
    #       반대 방향에서 저지르고 있었다.
    #
    #  ⚠️ **그리고 건너뛰기 조건도 틀렸다.** 전 판은 *"2골 차 스코어를 가진 시나리오가
    #     하나라도 있으면 건너뛴다"* 였다 — 방향을 보지 않으므로 `3-0` 이 있으면
    #     `0-2` 를 영영 안 만든다. **방향마다** 따로 본다.
    two_goal_scores:
      home: ["2-0"]        # 홈이 2골 차로 이긴다 → **원정 +1.5 가 죽는 모양**
      away: ["0-2"]        # 원정이 2골 차로 이긴다 → **홈 +1.5 가 죽는 모양**
    # ⚠️ 시나리오 자리는 **A~E 다섯뿐**이다(§3 `ScenarioId`). A·B·C 가 셋을 쓰고
    #    난타전이 하나를 쓰면 **한 방향만 들어간다.** 그때 못 넣은 방향은 이름으로
    #    남기고, §6 이 그 핸디를 **등급 없이** 둔다(§7 R6 — 계산이 실패한다).
    slots: 5
    # 🔴 근거 변수가 없어도 **없애지 않는다** — strength 0.3 으로 둔다(§5-c-5)
    floor_strength: 0.3
    miss: 09-29 돗토리·후쿠시마 +1.5 가 이 시나리오를 빠뜨렸다가 1.0→0.85 로 내려갔다

  - id: 5c-6
    sec7_rule: R5   # v4 §7 의 같은 규칙
    name: 단일 방향 금지
    when: 모든 시나리오가 한 방향이다
    then: STEP 3으로 되돌려 반대 변수를 다시 찾는다. 그래도 없으면 자료 부족
    miss: §3 STEP 5 계약 — 모든 시나리오가 같은 direction 이면 실패

#: §5-d strength 계산 — 🔴 전제가 replaced 면 그 시나리오 strength 를 0 으로
strength:
  sum_of: variable_weight
  premise_replaced_to_zero: true

#: §5-e narrative — LLM L6 이 쓴다
narrative:
  llm_slot: L6
  sentences: [2, 3]
  # 🔴 스코어·strength 는 **코드 값을 그대로 인용**. 새 사실 추가 금지(§5-e).
  may_add_facts: false


#: 🔴 §6-c-3 **보드 없는 경기의 총점 기준선** — 사용자 지시 2026-10-02 로 고쳤다
#
#  v4 원문: *"총점 기준선은 **시나리오 스코어 최대합 + 0.5**"*
#
#  ⚠️ **그것은 순환이다.** 기준선을 우리 시나리오에서 뽑으면 어떤 시나리오도 그
#     기준선을 넘을 수 없고, **언더가 정의상 1.00** 이 된다. 실측 2026-10-02
#     (시애틀–캔자스시티): 시나리오 최대합 3 → 기준선 3.5 → 언더 3.5 **1.00**.
#     같은 시나리오를 실제 보드 줄에 대면 언더 2.5 **0.55** · 언더 3.0 **0.55** 였다.
#     즉 §6-b 의 "낸다" 등급을 **공짜로** 받았다.
#
#  🔴 고친 규칙: 기준선은 **자료에서** 뽑는다 — 리그 평균 총득점을 가장 가까운
#     `X.5` 로 맞춘다(무승부 밀어내기를 피하려고 .5 만 쓴다).
#       MLS 3.22 → **3.5** · USL 2.73 → **2.5** · NL C2 2.50 → **2.5**
#  ⚠️ **리그 평균을 못 구하면 총점 마켓을 이름으로 적지 않는다** — §6-f 의
#     기준선별 표만 낸다. 지어낸 기준선으로 등급을 주지 않는다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **확정 XI 가 없으면 상한을 건다** (사용자 규칙 2026-10-03)
# ══════════════════════════════════════════════════════════════════
#
# 사용자가 손으로 쓴 분석의 첫 줄이 이것이다:
#
#   > 확정 XI는 킥오프 1시간 전(KST 08:00) 발표라 아직 없다 → **상한 0.85**
#
# 🔴 v4 에 이 규칙이 **없다.** 그런데 사용자 분석의 결론 두 줄이 전부 `0.85` 였고,
#    그 수가 *"아직 모르는 것이 있다"* 는 뜻이었다. 봇에는 그 개념이 없어
#    `0.9545` 를 그대로 등급으로 썼다.
#
# ⚠️ 이것은 **확률을 깎는 것이 아니다** — 생존 수는 그대로 두고 **등급만** 거둔다.
#    0.85 는 `SMALL_AT`(0.8)과 `NAME_AT`(1.0) 사이라, 상한이 걸리면
#    *"이름(1.0)은 못 적고 소액까지"* 가 된다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **0.85 는 정답이 아니다** — 사용자 지시 2026-10-03
# ══════════════════════════════════════════════════════════════════
#
# > 나는 **예시를 준거다**...이렇게 분석을 하라고...**0.85는 누가맞는지는 모른다**...
# > 인지만 하고 있어라..
#
# ⚠️ 전 판에 여기 *"사용자가 쓴 수다 … 측정으로 고칠 값도 아니다"* 라고 적었다.
#    🔴 **그것이 틀렸다.** 사용자가 보여 준 분석은 **방법의 예시**이고 정답지가
#    아니다. 이 저장소는 정답지를 지웠다(사용자 지시 2026-10-02 · CLAUDE.md).
#
# 🔴 그래서 `0.85` 는 **임시 출발점**이다. 고치는 기준은 하나뿐이다 — **경기 결과**
#    (`ledger`). ⚠️ 그런데 원장은 *"우리 로직이 맞냐 틀렸냐"* 검증에만 쓴다(계수를
#    맞추지 않는다) → 즉 이 수는 **사용자가 지시할 때만** 바뀐다.
# ⚠️ 쓰는 쪽(`survive`)은 이 수를 **상한**으로만 쓴다 — 확률을 깎지 않는다. 그래서
#    이 값이 틀려도 생존 수는 거짓이 되지 않는다(등급만 보수적이 된다).
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **상관 추천 중 하나만 고른다** (사용자 규칙 2026-10-03)
# ══════════════════════════════════════════════════════════════════
#
# 사용자가 손으로 쓴 결론의 마지막 줄이 이것이다:
#
#   > 콜롬비아 무패 0.85 … 언더 3.5 0.85 — **둘은 다른 갈래에서 죽으니 하나만
#   > 고른다 → 무패 우선**
#
# 🔴 봇은 둘을 **다 적었다.** 같은 경기에 추천을 여럿 적으면 그만큼 돈이 쪼개지고,
#    두 추천이 **다른 시나리오에서 죽으면** 둘 중 하나는 거의 반드시 틀린다.
# ⚠️ 서로를 **상쇄**하는 쌍(같은 마켓의 두 쪽)은 `_mirror_guard` 가 이미 막는다.
#    이것은 다른 문제다 — 둘 다 맞을 수 **있지만** 같이 걸 이유가 없는 쌍이다.
#
# 🔴 고르는 기준은 **사용자가 적은 순서**다: 승패·무패(방향) > 총점 > 그 밖.
#    ⚠️ 생존이 같을 때 어느 쪽인지를 코드가 임의로 고르면 그것이 승자를 고르는
#       것이 된다 — 그래서 **순서를 선언**한다.
pick_one_when_disjoint:
  # 🔴 **`on:` 을 쓰지 않는다** — YAML 1.1 이 그것을 **불리언 키 `True`** 로 읽는다
  #    (실측 2026-10-03: `cfg.get("on")` 이 `None` 이라 이 규칙이 **조용히 꺼져**
  #    있었다. 계약이 그 자리에서 잡았다). `yes`·`off`·`no` 도 같은 함정이다.
  enabled: true
  why: 두 추천이 다른 시나리오에서 죽으면 둘 중 하나는 거의 반드시 틀린다
  # 🔴 **예시에서 온 순서다 — 정답이 아니다**(사용자 지시 2026-10-03).
  #    사용자가 *"무패 우선"* 이라고 적은 것을 그대로 선언으로 옮겼다. ⚠️ 어느
  #    순서가 맞는지는 **아직 모른다** — 경기 결과가 쌓여야 말할 수 있다.
  source: 사용자 분석 2026-10-03 (콜롬비아 vs 파라과이) — **방법의 예시**이고 정답지가 아니다
  prefer: [win, btts, total, handicap]

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **분석 과정 5단계 — 라인업 상태 → 상한** (사용자 지시 2026-10-03)
# ══════════════════════════════════════════════════════════════════
#
#  사용자가 분석 과정 10단계를 그림으로 줬다. 그 5단계가 **규칙 적용 단계**이고
#  이렇게 적혀 있다:
#
#      5. 라인업 상태 → 상한
#         확정 1.0 / 예상 0.85 / 없음 0.8
#
#  ⚠️ 종전은 **두 칸**이었다(확정이면 상한 없음 · 아니면 0.85). 그래서 라인업을
#     **아예 못 잡은 경기**와 **예상 XI 를 잡은 경기**가 같은 대접을 받았다 —
#     모르는 양이 다른데 상한이 같았다.
#  🔴 세 칸으로 바꾼다. 어느 칸인지는 `app/analyze.xi_state` 가 정한다.
#
#  🔴 우리 자료의 세 상태를 그림의 세 칸에 이렇게 맞췄다:
#     확정 — 공식 발표 라인업(`lineup` 세포가 받은 것)이 **양 팀 다** 있다
#     예상 — XI 가 **양 팀 다** 있는데 하나라도 기준(직전 경기·예상)이다
#     없음 — 한 팀이라도 XI 가 **없다**
#  ⚠️ 이 맞춤이 당신 뜻과 다르면 여기를 고치면 된다 — 코드에 숫자도 이름도 없다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v5 §6-5 — 상한(라인업 상태)**. 종전 **세 칸**에서 **네 칸**으로.
# ══════════════════════════════════════════════════════════════════
#
# 지시문 §6-5 원문:
#
# > **양쪽 확정 1.0 / 한쪽 확정 0.9 / 양쪽 예상 0.85 / 한쪽이라도 없음 0.8.**
# > 야구는 선발 확정·타순 미공개 0.9, 선발 폼 자료 공백 0.85. … 발표됐으나
# > **미검증인 XI 는 "미공개"가 아니라 "미검증"으로 적고 한 단계 아래.**
# > 등급 = min(생존 등급, 상한).
#
# ⚠️ 종전에 `한쪽만 확정` 이 `예상`(0.85)으로 떨어졌다 — **한쪽을 확실히 아는
#    것**과 **양쪽 다 추측인 것**은 모르는 양이 다르다. 그 칸이 생겼다.
# 🔴 그리고 종전 `sports: [soccer]` 가 **야구를 통째로 빼놨다.** §6-5 가 야구
#    두 칸을 이름으로 댔으므로 야구도 넣는다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **90분 무승부 스코어** — 인도네시아–태국 지시서 §3-3 (2026-10-05)
# ══════════════════════════════════════════════════════════════════
#
# > `final_single`·`knockout_single`·`knockout_two_leg_1st` 이면 **90분
# > 무승부(0-0·1-1) 시나리오 필수.** 시나리오 전개 문장에 *"연장·승부차기로
# > 간다"* 를 적고, 마켓 대입은 **90분 기준**임을 카드에 표시한다.
#
# ⚠️ 스코어를 **코드에 박지 않는다**(계약이 그것을 센다) — 표가 원본이다.
draw_90:
  scores: ["0-0", "1-1"]
  formats: [final_single, knockout_single, knockout_two_leg_1st]
  why: |
    단판 결승·단판 토너먼트·2차전 1차전은 90분 무승부가 **갈래**다 —
    연장·승부차기로 간다. 그 갈래가 없으면 `언더`·`무승부` 마켓이 공짜로
    산다(난타전 §6-7 과 같은 결의 구멍이다).

xi_state_cap:
  caps:
    # ── 축구·일반
    양쪽확정: 1.0
    한쪽확정: 0.9
    양쪽예상: 0.85
    없음: 0.8
    # ── 🔴 야구 (§6-5 가 이름으로 댄 두 칸)
    선발확정_타순미공개: 0.9
    선발폼공백: 0.85
  # 🔴🔴 **한 단계 아래**가 뜻하는 사다리. ⚠️ `0.9 - 0.05` 같은 **산수로 짓지
  #    않는다** — 간격이 고르지 않다(1.0→0.9 는 0.1, 0.9→0.85 는 0.05).
  #    🔴 그래서 **다음 칸**으로 내린다. 그 순서를 여기 적는다.
  ladder: [1.0, 0.9, 0.85, 0.8]
  when: 라인업을 얼마나 아는가가 등급 상한을 정한다
  why: 모르는 것이 많을수록 우리 수가 틀릴 여지가 크다 — 상한은 그 여지의 크기다
  source: |
    v5 지시문 §6-5 (사용자 문서 2026-10-04) · 네 칸과 야구 두 칸을 그 문단이
    이름으로 댔다. 종전 세 칸은 사용자 분석 과정 10단계 그림 2026-10-03 이었다.
  # 🔴 §5-6 — **칸마다 왜 그 수인가**. 근거 없는 상수는 계약 실패다.
  basis:
    양쪽확정: |
      🔴 §6-5 원문이 정한 수다(내가 고른 것이 아니다). 양 팀 XI 를 둘 다 확정으로
      받았으면 **라인업에서 더 알 것이 없다** — 상한이 없는 것과 같다.
    한쪽확정: |
      🔴 §6-5 원문. ⚠️ 종전에 이 경기가 `예상`(0.85)으로 떨어졌다 — 한쪽을
      확실히 아는 것과 양쪽 다 추측인 것을 **같이 대접한** 자리였다.
    양쪽예상: |
      🔴 §6-5 원문. 둘 다 추측이면 우리 수가 틀릴 여지가 양쪽에 있다.
    없음: |
      🔴 §6-5 원문 *"한쪽이라도 없음 0.8"*. ⚠️ 한 팀 XI 가 없으면 그 팀 쪽
      시나리오 전부가 추측이다 — 가장 센 상한이다.
    선발확정_타순미공개: |
      🔴 §6-5 원문 *"야구는 선발 확정·타순 미공개 0.9"*. 야구에서 **선발이
      라인업보다 크다**(M18 이 그래서 pitcher_state 를 요구한다) — 선발을 알면
      대부분을 아는 것이고, 타순은 남은 작은 모름이다.
    선발폼공백: |
      🔴 §6-5 원문 *"선발 폼 자료 공백 0.85"*. ⚠️ 실측 2026-10-04: `pit_c.html`
      에 **규정 투구 미달 투수가 없다**(CLAUDE.md) — 선발 이름은 알아도 그 폼을
      못 재는 경기가 실제로 나온다.
  # 🔴 야구를 넣는다 — §6-5 가 야구 칸을 이름으로 댔다.
  #  ⚠️ 하키는 §6-5 가 말하지 않았다 — **지어내지 않는다**(그 종목은 안 건다).
  sports: [soccer, baseball]

total_baseline_no_board:
  source: 리그 평균 총득점(순위표에서 계산)
  round_to: 0.5
  only_half_lines: true
  # 🔴 대회 전체로 센다(위 `league_avg_scope` 와 같은 이유)
  scope: 대회 전체
  # 🔴 **동점일 때 어느 쪽인가** — 평균이 딱 `3.00` 이면 2.5 와 3.5 가 등거리다.
  #    ⚠️ 파이썬 `round(2.5)` 는 `2` 다(짝수 반올림) — 그 선택이 코드에 숨으면
  #       안 된다. 여기서 정한다.
  #    🔴 `아래` 로 둔다: 결함 5 가 *"언더가 공짜로 1.00 을 받는다"* 였으므로
  #       동점이면 언더가 **더 어려운** 쪽(낮은 줄)으로 간다.
  tie_goes: 아래
  # 🔴🔴 **기준선을 몇 줄 내나**(사용자 지적 2026-10-03). 가운데(리그 평균 줄)에서
  #    양쪽으로 이만큼 펼친다. ⚠️ 사용자는 **2.5 와 3.5 를 둘 다** 썼다 —
  #    `1` 이면 세 줄(가운데 ±1)이 나온다. 🔴 숫자는 실제 테스트로 고친다.
  extra_lines: 1
  no_league_avg: 총점 마켓을 이름으로 적지 않는다 · §6-f 표만 낸다
  # ══════════════════════════════════════════════════════════════════
  # 🔴🔴 **분석 과정 9단계 — "보드 줄만, 없으면 일반 마켓"**(사용자 지시 2026-10-03)
  # ══════════════════════════════════════════════════════════════════
  #
  #  실측 2026-10-03(엘살바도르 vs 자메이카 · CONCACAF 네이션스리그): 순위표
  #  어댑터가 없어 리그 평균이 **없다** → 총점 줄이 **0개**였다. 🔴 그런데 사용자
  #  분석의 결론은 **통째로 언더**였다(`언더 2.5` · `언더 3.5`).
  #
  #  ⚠️ 리그 평균이 없다고 **총점을 통째로 포기하면** 대표팀 경기에서 봇이 할 말이
  #     없어진다 — 친선·네이션스리그는 순위표가 애초에 없다.
  #  🔴 그래서 **일반 마켓 줄**을 쓴다. 이것은 리그 평균 대신 쓰는 **관례**이고,
  #     우리 시나리오에서 나온 수가 **아니다** — 그래서 `forbidden` 의 순환에
  #     해당하지 않는다(그 금지는 "우리 수로 줄을 만들지 마라"다).
  #  ⚠️ 카드에 **어느 쪽을 썼는지 적는다** — 리그 평균 줄과 관례 줄은 뜻이 다르다.
  # ══════════════════════════════════════════════════════════════
  # 🔴🔴 **v5 §6-3 — 종목별 기준선 후보** (2026-10-04) [#19 M8 M19 M32]
  # ══════════════════════════════════════════════════════════════
  #
  # > 보드가 없으면 **종목별 기준선 후보에 복수 대입**한다(축구 1.5/2.5/3.5 ·
  # > 유스 토너먼트 1.5 · **야구 7.5/8.5/9.5** · **하키 5.5/6.5**)하고 전부
  # > "보드 오면 무효" 꼬리표.
  #
  # ⚠️ 종전에는 **축구만** 있었다(`soccer: [2.5, 3.5]`). 🔴 그래서 야구 카드에
  #    총점 마켓이 **한 줄도 없었다**(실측 2026-10-04: *"§6-c-3 총점 기준선을 못
  #    구했다"*) — §6-4 가 그것을 *"§6-c-3 **폐지**"* 로 닫았다.
  # 🔴 이 수들은 **지시문이 이름 댄 것**이고 내가 고른 것이 아니다.
  common_lines:
    soccer: [1.5, 2.5, 3.5]
    baseball: [7.5, 8.5, 9.5]
    hockey: [5.5, 6.5]
  common_lines_source: v5 §6-3 (2026-10-04) — 종목별 후보를 문서가 이름 댔다
  # ⚠️ 유스 토너먼트는 **대회**로 갈리므로 종목 표에 안 넣는다(§6-3 이 따로 적었다)
  common_lines_youth: 1.5

  # ══════════════════════════════════════════════════════════════
  # 🔴 **v5 §6-4 — 무승부가 가능한 리그** [#29]
  # ══════════════════════════════════════════════════════════════
  #
  # > 야구 무승부는 **KBO·NPB 만**(연장 상한 리그), **MLB 는 무승부 시나리오 없음.**
  #
  # ⚠️ MLB 는 연장을 무제한으로 돈다 — 최종 결과에 무승부가 없다.
  draw_leagues:
    baseball: [KBO, NPB]
    # 🔴 하키 승무패는 **정규시간 3-way** 다(§6-4) — 정규시간에는 무승부가 있다
    hockey: [NHL]
    soccer: []          # ⚠️ 비면 **리그를 가리지 않는다**(축구는 늘 무승부가 있다)
  draw_leagues_source: v5 §6-4 (2026-10-04)

  # ══════════════════════════════════════════════════════════════
  # 🔴🔴 **v5 §6-6 — 주장의 강도** [#26]
  # ══════════════════════════════════════════════════════════════
  #
  # > 같은 경기에서 등급이 선 줄이 여럿이면 **생존율 높은 순**, 동률이면 **더
  # > 강한 주장**(승 > 무패 > 핸디 > 총점). **선언 순서로 고르지 않는다.**
  #
  # ⚠️ 종전 `pick_one_when_disjoint.prefer` 는 `[win, btts, total, handicap]`
  #    이고 주석이 *"사용자가 **무패 우선**이라고 적은 것"* 이었다. 🔴 §6-6 이
  #    그것을 뒤집었다 — **더 강한 주장이 먼저**다.
  # 🔴 실측 2026-10-04: `btts 예`(**0.8**)가 `오버 2.5`(**1.0**)를 이겼다.
  claim_strength: [win, dc, handicap, btts, total]
  claim_strength_source: v5 §6-6 (2026-10-04) — 승 > 무패 > 핸디 > 총점
  # 🔴 금지 — v4 원문의 순환 식
  forbidden: 시나리오 스코어 최대합 + 0.5

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **분석 과정 10단계 — "같은 방향 3개까지"** (사용자 지시 2026-10-03)
# ══════════════════════════════════════════════════════════════════
#
#  10. 상한·상관 → 결론·방아쇠 — **같은 방향 3개까지**, 확인 항목 첨부
#
#  🔴 같은 방향으로 네 줄 이상을 내면 그것은 **네 개의 추천이 아니라 한 추천을 네 번
#     적은 것**이다(상관이 1 에 가깝다) — 틀리면 넷이 같이 틀린다.
#  ⚠️ 거두는 줄도 **표에는 남긴다**(§6-f) — 지우는 것이 아니라 등급만 거둔다.
conclusion:
  max_same_direction: 3
  why: 같은 방향 네 줄은 추천 넷이 아니라 한 추천을 네 번 적은 것이다 — 상관이 1 에 가깝다
  source: 사용자 분석 과정 10단계 그림 2026-10-03 (10단계)

#: 🔴 **발견한 결함 — `5c-1` 이 만든 시나리오의 strength 를 규칙이 정하지 않는다**
#
#  §5-d 는 *"시나리오 strength = 소속 변수 weight 합"* 이다. 그런데 `5c-1` 난타전을
#  띄우는 근거(맞대결/최근 평균 총득점)는 **총점 패턴이라 방향이 없다** → §1 대로
#  **배경**이고 배경에는 weight 가 없다. 그래서 합할 것이 없다.
#
#  ⚠️ 문서에 있는 **유일한 선례**가 §5-c-5 의 `floor_strength: 0.3`(근거 변수가
#     없어도 없애지 않는다)이다. 그것을 따르되 **지어낸 값임을 밝힌다.**
#  🔴 사용자 결정 필요 → `docs/fable/questions/2026-10-02_rule_defects.md`
cross_rule_strength:
  5c-1:
    # 🔴 **사용자 지시 2026-10-02**: *"딥서치해서 그에 맞게 바꿔라"*
    #
    #  처음엔 §5-c-5 의 `floor_strength: 0.3` 을 빌려 썼다. **그것은 지어낸 값이었다.**
    #  §5-d 가 이미 답을 갖고 있다 — *"시나리오 strength = **소속 변수 weight 합**"*.
    #
    #  🔴 난타전을 띄우는 사실(맞대결/최근 평균 총득점)은 방향이 없어 **배경**이지만
    #     **hardness 는 있다.** 그 배경의 weight 를 합하면 된다 — 값을 고르지 않고
    #     규칙에서 나온다. §5-c-5 처럼 바닥값을 둘 필요가 없다.
    #
    #  실측 (시애틀–캔자스시티):
    #    발동 근거 = KC 최근 5경기 평균 4.60골 (순위표·fotmob 폼 = 공시 → hard 1.0)
    #    → D strength **1.0**
    #    두 근거(h2h + recent)가 다 발동하면 2.0 이 된다 — 신호가 두 겹이면 더 무겁다
    #
    #  ⚠️ 바닥값은 **남겨 둔다.** 근거의 hardness 를 못 읽는 경우가 있을 수 있고,
    #     그때 0 이면 시나리오가 사라진다(§5-c-5 가 *"없애지 않는다"* 고 한 이유).
    strength: 발동 근거가 된 배경 사실들의 weight 합(§5-d)
    floor_strength: 0.3
    floor_when: 근거의 hardness 를 못 읽을 때만
    measured_2026_10_02: 시애틀–KC — 근거 1건(hard) → D strength 1.0


# ══════════════════════════════════════════════════════════════════
# 🔴🔴 시나리오의 **무게** — 사용자 지시 2026-10-02 (3차)
# ══════════════════════════════════════════════════════════════════
#
# 지시 원문: *"② D 의 strength 를 확률(0.318)로 바꾸나 … 이것도 딥서치해서 바꿔라"*
#
# 🔴 **딥서치의 답: 근거 개수는 확률이 아니다.**
#    적정 채점 규칙(Brier·log score)은 *예측 분포가 참 분포와 같을 때* 최적이 된다.
#    그 성질이 "무게"에 뜻을 준다 — §6-b 가 생존 `1.0 / 0.8` 로 **돈을 걸라 말라**를
#    정하는데, 그 수가 확률이 아니면 0.8 이라는 선이 아무것도 뜻하지 않는다.
#
# 🔴 **D 만 바꾸면 더 나쁘다.** 생존은 Σ(사는 무게) ÷ Σ(전체 무게)인데, 분자·분모에
#    확률과 근거 개수가 섞이면 그 비는 어떤 뜻도 갖지 않는다. 그래서 **전부** 바꾼다.
#
# 실측 2026-10-02 (정답지 경기, 경기 전 값) — **두 셈의 순서가 다르다**:
#
#   시나리오  스코어                 포아송 확률   §5-d strength  정규화
#     A      2-1 · 1-0              0.210        4.6           0.582
#     C      0-0 · 1-1              **0.162**    0.4           **0.051**
#     E      2-0                    0.106        0.3           0.038
#     B      0-1 · 1-2              0.103        2.2           0.278
#     D      2-2 · 2-3 · 3-2        0.090        0.4           0.051
#
#   🔴 **무승부 C 가 두 번째로 그럴듯한 결과(16.2%)인데 strength 로는 5.1% 다.**
#      §5-a 가 무승부 하한을 0.4 로 둔 까닭이 바로 이 과소평가이고, 확률로 재면
#      하한이 필요 없다 — 숫자가 제자리를 찾는다.
#
# 🔴🔴 **그리고 덮이지 않은 확률이 0.329 다.**
#
#   어느 시나리오에도 없는 스코어 상위: 3-0 (0.068) · 3-1 (0.063) · 4-0 (0.032)
#   ⚠️ 3-0 하나가 **D 전체(0.090)에 가깝다.** 전 판의 생존은 덮은 67% 안에서만
#      정규화돼 "전부 따졌다"로 읽혔다 — 그것이 가장 큰 조용한 0 이다.
#   🔴 `soccer_home_dominant`(2-0·3-0)가 §5-b 에 **있는데 생성되지 않는다.**
#      3-1 은 §5-b 에 **아무 템플릿도 없다** — 템플릿을 지어내지 않고 이름으로 남긴다.
#
# ⚠️ **§5-d(= strength 는 변수 weight 합)를 지우지 않는다.** 그것은 여전히
#    *"어느 방향에 근거가 몇 개 쌓였나"* 를 뜻하고 가설·방향 판정이 그것을 쓴다.
#    확률은 **새 칸**으로 들어간다 — 두 수가 다른 것을 뜻하므로 한 칸에 담지 않는다.
# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **역할을 가른다** — 사용자 결정 2026-10-04
# ══════════════════════════════════════════════════════════════════
#
# 봇이 스스로 카드에 적은 줄:
#
# > 🔴🔴 변수 3개가 **근거는 바꾸는데 등급은 하나도 안 바꾼다** — 무게가 확률
# > (포아송 격자)이고 그 격자는 순위표에서 나와 변수와 무관하기 때문이다.
# > v4 §0 은 *'변수 개수·정확도 = 시나리오 품질'* 을 전제하는데 지금 구조에서는
# > 변수가 생존에 닿지 않는다 — 사용자 결정이 필요하다
#
# 사용자 답 2026-10-04:
#
# > *"변수가 생존에 닿지 않는다"* 는 지적이 맞고, 이건 **결정이 아니라 v4대로
# > 돌리는 문제**다. v4 §5-a 는 **시나리오 strength = 변수 weight 합**이라고 적혀
# > 있다. 포아송 격자는 **v4 에 없는 봇의 추가물**이고, 순위표에서 나오니 변수와
# > 무관할 수밖에 없다. 역할을 가른다:
# >
# >   · 변수 → 시나리오 strength (v4 §5-a 그대로). **이게 생존율을 정한다.**
# >   · 포아송 격자 → 시나리오 안의 **스코어 집합을 고르는 도구로만.** "홈 우세
# >     시나리오"의 스코어가 2-0인지 3-1인지 고를 때 쓰고, 그 시나리오가 얼마나
# >     무거운지는 격자가 정하지 않는다.
# >   · 변수가 0개인 경기는 격자가 strength 를 **대신하지 않는다** — 자료 부족이다.
# >
# > 이렇게 하면 §0 의 "변수 개수·정확도 = 시나리오 품질" 이 코드에서 참이 된다.
# > **지금은 변수가 장식이다.**
#
# 🔴 그래서 전 판(`weight: 포아송 격자의 확률 합`)을 **되돌렸다.** 격자는 남지만
#    생존의 분자·분모가 아니다.
# ⚠️ 격자가 하는 일은 **그대로 셋**이다(지우지 않았다):
#      ① 시나리오의 스코어 집합을 고른다(§5-b 템플릿이 없는 종목·5c-1 ②)
#      ② `p_market` — *"실제로 맞을 확률"* 을 **따로** 보여 준다(생존과 다른 수다)
#      ③ `_coverage_warning` 이 그 둘이 벌어질 때 말한다
scenario_weight:
  weight: §5-d 변수 weight 합 (v4 §5-a · 사용자 결정 2026-10-04)
  fallback: 없다 — 변수가 0개면 **자료 부족**이다(격자가 대신하지 않는다)
  # ⚠️ 종전 선언을 **남겨 둔다** — 되돌린 것을 숨기면 다음 세션이 또 판다
  was_until_2026_10_04: 포아송 스코어 격자의 확률 합 (v4 에 없는 추가물이었다)
  grid_role: 스코어 집합을 고르는 도구 · p_market 보고 · 커버리지 경고
  keep_strength: true          # 🔴 §5-d 는 남는다. 가설·방향이 그것을 쓴다
  # 🔴 **덮이지 않은 확률을 반드시 낸다.** 생존의 분모가 1.0 인지 0.671 인지가
  #    결론을 바꾼다 — 그 수를 숨기면 과신이 된다.
  report_uncovered: true
  uncovered_measured_2026_10_02: 0.329 (상위 누락 3-0 0.068 · 3-1 0.063)
  source: https://en.wikipedia.org/wiki/Brier_score
  source_2: https://www.sciencedirect.com/science/article/abs/pii/S0169207024000104
  # ⚠️ 포아송의 알려진 편향 둘은 `app/league.py` 가 적어 둔다(낮은 스코어 상관 ·
  #    과대분산). 🔴 Dixon–Coles τ 는 **쓰지 않는다** — ρ 를 맞출 자료가 없다.

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v5 §7-1 — T-60 재실행 창**
# ══════════════════════════════════════════════════════════════════
#
# > 킥오프 **60분 전(야구는 70분 전)** 코드가 확정 XI 를 가져온다. … 못 가져오면
# > 카드에 **XI 미확정 — 발표 전/미검증**을 적고 **상한 0.85 를 강제**한다.
rerun_window:
  minutes:
    soccer: 60
    baseball: 70
  # ⚠️ 지시문이 **두 종목만** 이름 댔다. 🔴 나머지는 기본값이고 **그 사실이
  #    글자로 남는다**(지어내 종목별로 적지 않는다 · #4).
  default: 60
  # 🔴 못 가져왔을 때 **강제 상한**. ⚠️ §6-5 의 `없음`(0.8)보다 **느슨하다** —
  #    예상 XI 는 있고 확정만 못 받은 상태다.
  cap_without_xi: 0.85
  basis: |
    🔴 v5 지시문 §7-1 원문이 정한 수다(내가 고른 것이 아니다).
    ⚠️ v4 §19-d 는 라인업 세포를 **T-70분**부터 보라고 했다(`cells.WAKE`) —
    v5 는 축구를 60분으로 좁혔다. 🔴 두 수가 다른 것이 맞다: 세포가 **보기
    시작하는** 때(70)와 재실행이 **확정을 요구하는** 때(60)는 다른 일이다.
    `cap_without_xi: 0.85` 는 §7-1 원문 *"상한 0.85 를 강제한다"* 다.
  source: v5 지시문 §7-1 (사용자 문서 2026-10-04 · PDF 12쪽)

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **v5 §7-3 — 라이브 재판정.** 일곱 규칙이 전부 *거절*에 관한 것이다.
# ══════════════════════════════════════════════════════════════════
#
# > 입력은 스코어·경과 분·지표 캡처. 규칙: **스코어·경과 분 없이 재판정 금지** /
# > **스코어로는 시나리오를 제거, 지표로는 약화만** / **지표 2개 이상이 같은
# > 메커니즘을 가리킬 때만 인정** / **"GK 선방 0"은 상대 유효슈팅 부재가
# > 아니다** / **라이브로 새 마켓을 만들지 않는다** / **15분 간격**. 라이브
# > 판정은 **등급 승격 없이** 생존 여부만 갱신한다. [M29]
live_rules:
  interval_min: 15
  # 🔴 입력 종류마다 **무엇을 할 수 있나**. ⚠️ 코드에 박지 않는다.
  effects:
    score: 제거       # 🔴 일어난 일이다 — 시나리오를 지울 수 있다
    metric: 약화      # ⚠️ 경향이다 — 무게만 내린다
  # 🔴 지표를 인정하는 조건(§7-3)
  metrics_min: 2
  metrics_same_mechanism: true
  # 🔴 **등급 승격 금지**(M29). ⚠️ 내려가는 것은 된다.
  promote: false
  basis: |
    🔴 v5 지시문 §7-3 원문이 정한 수다(`15분`·`2개`). 내가 고른 것이 아니다.
    ⚠️ 왜 승격이 금지인가 — 경기 중에 등급을 올리면 *"예측"* 이 아니라
    *"따라가기"* 가 된다. 🔴 §3 불변: *"맞았나를 예측이 끝난 뒤에 고치지
    않는다."* 라이브가 할 수 있는 일은 **죽은 시나리오를 죽었다고 적는 것**뿐이다.
  source: v5 지시문 §7-3 (사용자 문서 2026-10-04 · PDF 12쪽)
