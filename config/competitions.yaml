# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **대회 식별 표** — 사용자 지시 2026-10-09(4차) §1
# ══════════════════════════════════════════════════════════════════
#
# > 매핑 표 `config/competitions.yaml`: 키마다 **출처별 표기 목록**, 리그 형식
# > (분할·플레이오프 컷), 기준 모델(Elo 출처·적합 이름), 동률 규칙.
#
# 🔴 읽는 곳은 `app/core/competition.py` **하나**다. 코드에 표기를 적지 않는다.
# 🔴 `espn_slugs`·`fotmob_ids`·`football_data` 는 **받아서 이름으로 대조한 값**이다
#    (`checked_at` 가 그 날짜다). ⚠️ 대조에 실패한 후보는 **적지 않았다** — 적으면
#    그것이 추측이 되고, 추측은 다음 출처에서 조용히 틀린다(CLAUDE.md #4).
# ⚠️ 표에 없는 표기를 만나면 봇은 **크게 실패**한다(§2) — 카드 머리에 받은 표기를
#    찍고 등급을 전부 보류하며 운영자 알림으로 그 글자를 보낸다. 그때 여기 넣는다.
#
# 🔴 **왜 이 표가 생겼나** — 실사고 2026-10-09(가시마–감바): ESPN 이 대회명을
#    `jpn.1` 로 줬고 이름표가 그 글자를 몰라 `league:jpn.1` 로 떨어졌다. 그러자
#    자체 Elo·기준 모델·홈 이점 표·리그 평균이 **한꺼번에** 비어 카드가 변수 1개로
#    나갔다. 별칭 하나를 더하는 것으로는 다음 출처에서 또 터진다.

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **`football_data_hist` — 백필 보드 원천**(의심 검증 v2 §1-4)
# ══════════════════════════════════════════════════════════════════
#
#  과거 **마감 배당**(그 경기의 "보드 한 줄")을 어디서 받나. 꼴 둘:
#    `{kind: mmz4281, code: E1}` → `mmz4281/<시즌2자리>/<code>.csv`
#        승무패(`B365CH/CD/CA`) · 아시안 핸디(`AHCh`·`B365CAHH/AHA`) ·
#        O/U 2.5(`B365C>2.5`·`B365C<2.5`) — 🔴 `C` 는 **마감**이다.
#    `{kind: extra, file: JPN, league: "J1 League"}` → `new/<file>.csv`
#        ⚠️ **승무패뿐이다**(`PSCH/CD/CA`) — 핸디·언오버는 **근사 보드**가 된다.
#  🔴 코드는 **받아서 확인했다**(2026-10-14 · `Div` 열과 첫 경기 이름을 봤다).
#  ⚠️ `football_data`(위) 와 **다른 값이다** — 그쪽은 Elo 기준 모델의 코드다
#     (`league:ELC` 는 거기선 `ELC`, 여기선 `E1`).
#  ⚠️ 칸이 **없으면** 그 리그는 `근사 보드`로 간다(판정표에서 따로 집계된다).
#  🔴 `new/KOR.csv` 는 **쓰지 않는다** — 받아 보니 내용이 `Eliteserien`
#     (노르웨이)이다(실측 2026-10-14). K리그1 은 근사로 간다.

#: 🔴 표기를 받아서 확인한 날 — `tools/check_competitions.py` 가 적는다
checked_at: "2026-10-09"

# ══════════════════════════════════════════════════════════════════
# 🔴 **받아서 확인한 표** (2026-10-09) — `tools/check_competitions.py` 가 다시 잰다
# ══════════════════════════════════════════════════════════════════
#
#  대조 방법: 그 출처의 페이지/응답을 **받아** 리그 이름이 맞는지 본다.
#  · espn   `www.espn.com/soccer/scoreboard/_/league/{슬러그}` 본문의 리그 이름
#  · fotmob `www.fotmob.com/leagues/{id}/table/x` 의 `leagueName`(+`ccode`)
#  · fd     `api.football-data.org/v4/competitions/{코드}` 의 `name`
#
#  🔴 `baseline.fit` 은 `config/base_model.yaml` 의 **모형 이름**이다 — 그 이름이
#     없으면 기준이 안 선다(카드가 "기준 없음"으로 적는다).
#  🔴 `baseline.elo` 는 등급을 **어디서 받나**다: `football_data`(과거 결과로 우리가
#     굴린다) · `fotmob`(같은 방식 · football-data 가 안 주는 리그) · `eloratings`
#     (대표팀). ⚠️ 표는 `config/league_elo.yaml` 이 든다(여기 숫자를 안 적는다).

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **출처 우선순위** — 같은 경기가 두 출처로 들어왔을 때 **무엇을 남기나**
# ══════════════════════════════════════════════════════════════════
#
#  ⚠️ 실사고 2026-10-09(가시마–감바): `games` 표에 같은 경기가 **두 줄**이었다
#     (`fotmob:5803602` · `espn:401877610`). 유일 제약이 `(sport, ext_id)` 라
#     출처가 다르면 막지 못한다 → 후보 2건 → `ambiguous` 로 카드가 안 나왔다.
#  🔴 `fotmob` 이 먼저인 까닭은 **경기 페이지가 가장 많은 칸을 준다**는 실측이다
#     (라인업·맞대결·폼·순위표 주소를 한 장에서 받는다). ESPN 은 그 다음이다.
#  🔴 글자는 `ext_id` 의 **접두사**다(`fotmob:…`·`espn:…`).
source_priority: [fotmob, espn, fdorg, kbo, npb, nhl, mlb, kleague]

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **경우의 수는 시즌 막판에만** — 사용자 지시 2026-10-09(5차) ①
# ══════════════════════════════════════════════════════════════════
#
# > 리그는 **"남은 경기 ≤ 5"** 또는 **"분할·플레이오프 컷까지 남은 경기 ≤ 3"** 일
# > 때만 상태를 판정한다. 그 전에는 상태 = `nothing`(시즌 초), 블록 3b 는
# > *"시즌 초 — 경우의 수 해당 없음"* 한 줄. **조별 리그는 마지막 2라운드만.**
#
# 🔴 왜 — 실사고 2026-10-09(가시마–감바 **8라운드**): 남은 라운드가 30경기인데
#    `must_win` 이 찍혔고 그 글자가 이유 문단과 `our_prob` 이동까지 흔들었다.
#    ⚠️ 시즌 초의 순위 변동은 **아무것도 확정하지 않는다** — 그 글자는 거짓이다.
outlook_gate:
  league_rounds_left_at: 5
  split_rounds_left_at: 3
  group_rounds_left_at: 2
  why: 시즌 막판·단계 마지막에서만 경우의 수를 판정한다(그 전에는 확정이 없다)

