# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **연맹 징계 공지** — 결장 사다리 칸 3(사용자 지시 2026-10-11 ①)
# ══════════════════════════════════════════════════════════════════
#
# > 결장 사다리: fotmob 결장 → (없으면) 명단 대조 → **연맹 징계 공지** → 국내 기사 2매체.
# > 징계(경고 누적·퇴장)는 **hard**.
#
# 🔴 **주소를 추측해 붙이지 않는다**(CLAUDE.md #4 — 받아서 확인한 것만).
#    아래 표가 비어 있으면 사다리의 칸 3 은 *"⬜ 통로 없음"* 으로 적힌다 — 그것이
#    *"0건"* 과 다르다는 것이 요점이다(#3 조용한 0 금지).
# ⚠️ 받아서 확인한 뒤에는 `leagues:` 밑에 리그별로 적는다:
#
#     league:KL1:
#       url: "…"            # 🔴 robots 허용을 확인한 주소
#       checked_at: "날짜"   # 🔴 받아서 확인한 날
#       parse: "…"          # 🔴 어디서 이름·사유를 읽나(칸 이름)
#
# ⚠️ **등급은 여기서 정하지 않는다** — 징계 결장의 hard 는 변수 단계가
#    `Missing.source == "discipline"` 을 보고 정한다(사본 금지).

source: "사용자 지시 2026-10-11(연쇄를 앞에서부터 고친다) ①"
checked_at: "2026-10-11"

#: 🔴 받아서 확인한 리그만 적는다 — 지금은 **없다**
leagues:
  # 🔴🔴 **받아서 확인했다**(2026-10-13) — `data.j-league.or.jp/SFIN03/` 는
  #    `選手 | チーム | 前回の停止 | 今回の停止 | 出場停止試合` 표다(실측: 표
  #    20줄에서 선수 12명). ⚠️ **현재 값**이므로 재생에서는 쓰지 않는다(L2).
  "league:J1":
    url: "https://data.j-league.or.jp/SFIN03/"
    kind: suspension
    lang: ja
    checked_at: "2026-10-13"
    parser: "app.collect.jl_official.suspensions"
    note: "출장정지 선수 공지 — 대상 경기(라운드·날짜)까지 적혀 있다"
  "league:J2":
    url: "https://data.j-league.or.jp/SFIN03/"
    kind: suspension
    lang: ja
    checked_at: "2026-10-13"
    parser: "app.collect.jl_official.suspensions"
    note: "같은 공지에 J2 도 함께 실린다(실측: `U-21` 줄도 있다)" 

# ══════════════════════════════════════════════════════════════════
# 🔴🔴 **라인업 사다리 — J리그 공식**(사용자 지시 2026-10-11 ⑦)
# ══════════════════════════════════════════════════════════════════
#
# > 7. 라인업 사다리: J리그(J1·J2)는 리그 공식 경기 페이지 선발을 fotmob 과 같은
# >    주기로 확인 — 먼저 확정된 쪽을 쓰고 출처·시각을 적는다.
#
# 🔴 실측 2026-10-11 — **통로를 못 만들었다.** 받아서 확인한 것만 적는다:
#   · `https://www.jleague.jp/robots.txt` → **200** · `Disallow: /match/*/201*`
#     뿐이므로 **2026 경기 페이지는 허용**이다(`/match/j1/2026/101108/` → 200 ·
#     637,391자).
#   · 그 HTML 에 `スターティングメンバー`·`GK`·팀 이름(`川崎`·`名古屋`)은 있는데
#     🔴 **선수 이름이 한 명도 없다**(`脇坂`·`ブローダーセン`·`シュミット` 전부
#     0건). 페이지에 박힌 JSON 은 **i18n 라벨**이고 명단은 자바스크립트가 따로
#     받는다. ⚠️ 그 통로는 `/api/*` 꼴이고 robots 에 `api` 줄이 **없다** —
#     즉 허용 여부를 **읽어 확인할 수 없다**(§4-7 의 같은 규칙을 쓸 근거가 없다).
#   · `https://data.j-league.or.jp/robots.txt` → **404**.
# 🔴 그래서 ⑦ 은 **안 만들었다** — 주소를 추측해 붙이지 않는다(#4). fotmob 하나로
#   둔다. ⚠️ 사람 캡처가 들어오면 그쪽이 `user_capture` 로 이긴다(이미 그렇다).
