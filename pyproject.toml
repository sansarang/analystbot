[project]
name = "analystbot"
version = "0.1.0"
description = "AnalystBot - sports analysis Telegram chatbot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiogram>=3.13",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "asyncpg>=0.29",
    "redis>=5.0",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "pybaseball>=2.2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
