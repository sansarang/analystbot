services:
  postgres:
    image: postgres:16
    container_name: analystbot-postgres
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: analystbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analystbot"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    container_name: analystbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── SearXNG — 검색 수단 (§19-i 1순위). 🔴 **루프백에만 바인딩한다.**
  #    인증이 없으므로 외부에 열면 남이 우리 이름으로 검색한다(§17-g-8).
  searxng:
    image: searxng/searxng:latest
    container_name: analystbot-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config/searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    restart: unless-stopped
    healthcheck:
      # ══════════════════════════════════════════════════════════════
      # 🔴🔴 **실사고 2026-10-10 — 헬스체크가 검색 엔진을 죽이고 있었다**
      # ══════════════════════════════════════════════════════════════
      #
      # 종전 헬스체크는 **10초마다 실제 검색**을 던졌다:
      #   `wget 'localhost:8080/search?q=test&format=json'` · interval 10s
      # 🔴 하루 **8,640회**다. 그것이 `brave`·`startpage`·`google cse` 의
      #    *"Suspended: **too many requests**"* 를 **우리가 만든 것**이었다.
      # 🔴 그리고 `duckduckgo` 가 타임아웃(engine 6s)으로 응답을 끌어 검색이
      #    1.76초가 됐고, 어떤 때는 5초 timeout 을 넘겨 컨테이너가 **35회 연속
      #    실패 → `unhealthy`** 였다(5일째).
      #
      # 🔴 그래서 **`/healthz` 로 바꿨다** — 실측 2026-10-10: **7밀리초**
      #    (검색은 1.76초). ⚠️ *"JSON 출력이 켜졌나"* 는 헬스체크가 볼 일이
      #    아니다 — 그것은 **설정**이고 `app/search.py` 가 못 읽으면 바로
      #    사유로 남는다(조용히 틀리지 않는다).
      # ⚠️ 간격도 10초 → **30초**로 늘렸다(그 자체가 비용이다).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  redisdata:
